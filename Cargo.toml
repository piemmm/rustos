[workspace]
resolver = "2"
members = [
    # Kernel — architecture-neutral subsystems
    "kernel/core",
    "kernel/mem",
    "kernel/sched/api",
    "kernel/sched/mlfq",
    "kernel/sched/eevdf",
    "kernel/ipc",
    "kernel/irq",
    "kernel/sec",
    "kernel/syscall",
    "kernel/virtio",

    # Kernel — architecture HAL (the §17.2 trait surface every port
    # implements; the §17.4 boundary between arch-neutral kernel and ports)
    "kernel/arch/api",

    # Kernel — architecture ports
    "kernel/arch/x86_64",
    "kernel/arch/aarch64",
    "kernel/arch/riscv64",
    "kernel/arch/wasm32",

    # Kernel — production binary (Stage 3a (c7-bin)). Hybrid `[lib]` +
    # `[[bin]]`: the library half ships the architecture-neutral boot
    # pipeline reused by both the production binary and the QEMU
    # integration test (`tests/integration/kernel_arch_boot`).
    "kernel/rustos-kernel",

    # Shared libraries
    "lib/abi",
    "lib/abi-sys",
    "lib/abi-trap",
    "lib/bumpalloc",
    "lib/caps",
    "lib/collections",
    "lib/compress",
    "lib/crt0",
    "lib/crypto",
    "lib/curses",
    "lib/cursor",
    "lib/fdt",
    "lib/font",
    "lib/geometry",
    "lib/icon",
    "lib/input",
    "lib/log",
    "lib/procinfo",
    "lib/raster",
    "lib/rng",
    "lib/rt",
    "lib/svg",
    "lib/sync",
    "lib/termcap",
    "lib/theme",
    "lib/util",
    "lib/virtio",
    "lib/vt",

    # Drivers — display
    "drivers/display/vesa",
    "drivers/display/framebuffer",
    "drivers/display/gpu_virtio",
    "drivers/display/rpi_hvs",

    # Drivers — filesystem
    "drivers/filesystem/ext4",
    "drivers/filesystem/fat32",
    "drivers/filesystem/rustfs",

    # Drivers — input
    "drivers/input/ps2",
    "drivers/input/virtio_input",

    # Drivers — bus
    "drivers/bus/pci",
    "drivers/bus/usb",
    "drivers/bus/virtio",
    "drivers/bus/mmio",

    # Drivers — storage
    "drivers/storage/virtio_blk",

    # Drivers — network
    "drivers/network/virtio_net",

    # Userland — grouped by class (system, session, shell, gui, apps),
    # mirroring the `drivers/<class>/<name>` layout documented in
    # AGENTS.md §3.
    "userland/system/drvhost",
    "userland/system/sysinfod",
    "userland/system/init",
    "userland/system/appmgr",
    "userland/system/installer",
    "userland/session/login",
    "userland/shell/shell",
    "userland/shell/sysinfo",
    "userland/apps/cat",
    "userland/apps/chmod",
    "userland/apps/chown",
    "userland/apps/cp",
    "userland/apps/files",
    "userland/apps/getcap",
    "userland/apps/groupadd",
    "userland/apps/ls",
    "userland/apps/mount",
    "userland/apps/mv",
    "userland/apps/ps",
    "userland/apps/rm",
    "userland/apps/setcap",
    "userland/apps/terminal",
    "userland/apps/top",
    "userland/apps/useradd",
    "userland/gui/wm",
    "userland/gui/taskbar",
    "userland/gui/session",
    "userland/net/icmp",

    # Tooling
    "tools/xtask",
    "tools/qemu",
    "tools/cc",

    # Shared host test-support: the per-run PRNG seed / start-of-test seed
    # logging / smoke-iteration + soak-budget seam used by the fuzz (§19.6),
    # proptest (§19.7), and filesystem-soak harnesses (AGENTS.md §2.2). A
    # dev-dependency of those harness crates only; never in a RustOS build.
    "tests/fuzzseed",

