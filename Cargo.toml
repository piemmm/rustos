# Settings that apply to every crate in the workspace.
[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.75"
license = "GPL-2.0-or-later"
repository = "https://github.com/tairix-project/tairix"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Acceptable noise from `pedantic` for placeholder crates.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
panic = "abort"
overflow-checks = true

[profile.dev]
opt-level = 1
overflow-checks = true
panic = "abort"

# `panic = "abort"` collides with the test harness on host targets. Cargo
# always uses `panic = "unwind"` for the `test` and `bench` profiles
# regardless of the dev/release settings, so no override is required here.
