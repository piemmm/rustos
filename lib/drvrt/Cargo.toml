[package]
name = "rustos-drvrt"
description = "RustOS user-space driver runtime host (§6, §2.2 — plans/PI.md P10 chunk 5d): the rt-backed `DriverHost` a first-party driver process links. It turns kernel-issued device-resource grant handles into the `MmioMapper` (register windows via the `mmio_map` syscall) and DMA host (coherent buffers via the `dma_alloc` syscall) a bus driver's `register()` consumes — every check stays kernel-side (§5.4). no_std, allocation-free, fail-closed (§2.9)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The `DriverHost` / `MmioMapper` / `RegisterWindow` / `VirtioHost` / `DmaSlab`
# trait + type surface this host implements, the `HwResource` grant descriptor
# it resolves a requested window against, and the `CapabilityId` / `DriverError`
# / `Errno` vocabulary it fails closed with — all the one ABI definition (§2.2).
rustos-abi = { path = "../abi", version = "=0.0.0" }
# The capability set the host reports through `DriverHost::has_capability`; the
# load-time grants the kernel already enforced (§5.2).
rustos-caps = { path = "../caps", version = "=0.0.0" }
# The pure-Rust userland runtime whose `mmio_map` / `dma_alloc` syscall wrappers
# the production `GrantSyscalls` impl forwards to (§2.2 — one syscall trap). The
# crate is generic over the seam so its logic is host-tested without a kernel.
rustos-rt = { path = "../rt", version = "=0.0.0" }

[lints]
workspace = true
