[package]
name = "tairix-wallpaper"
description = "TAIRiX desktop pinboard wallpaper engine: the closed registry over the per-user pinboard settings document (wallpaper choice, fit, backdrop colour, icon flow, sort order) the desktop session keeps in its published app-data scope, the shipped default wallpaper catalog and its bounded fail-closed listing model, and the one pure wallpaper-placement geometry the desktop renderer and every preview draws through."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The four closed value sets the desktop's appearance keys carry
# (`Appearance`, `Contrast`, `Density`, `Motion`). They live in the ABI
# because the session publishes them to every application over the window
# channel, so the value this document stores and the byte on that wire are
# one definition.
tairix-abi = { path = "../abi", version = "=0.0.0" }
# Integer screen geometry (`Rect`), so the wallpaper placement geometry and
# the compositor agree on one rectangle type rather than a second one, and
# `Scale` — the one validator of a UI scale, so a percentage this document
# accepts is always one the desktop can actually be drawn at.
tairix-geometry = { path = "../geometry", version = "=0.0.0" }
# The shared path-spelling parser: the settings document's wallpaper path is
# validated as an absolute path through the one first-party parser, and the
# catalog's file names are validated as plain leaf names, exactly as the
# icon catalog already does — never a second ad-hoc spelling check.
tairix-path = { path = "../path", version = "=0.0.0" }
# The one `key = value` document engine: the pinboard settings are a plain
# `lib/appconf` document in the desktop session's published app-data scope,
# so this crate defines the closed *registry* over that format and no
# grammar of its own (plans/APPDATA.md §1.3, §3.11).
tairix-appconf = { path = "../appconf", version = "=0.0.0" }

# Only the apply client's own round trip: a surface asking the session to
# adopt a document makes one `ipc_call`, and the rest of the crate stays the
# pure, I/O-free registry a host test drives directly.
tairix-rt = { path = "../rt", version = "=0.0.0", optional = true }

[features]
# The apply client's transport. Off by default, so the registry, the catalog
# and the fit geometry stay linkable by a host test and by the session's own
# engine with no runtime behind them.
rt = ["dep:tairix-rt"]

[dev-dependencies]
# The store's own key grammar and document bound, so the registry's tests
# and fuzz harness check against the one definition rather than restating it.
tairix-appconf = { path = "../appconf", version = "=0.0.0" }
# The in-tree fuzz harness draws its inputs through the shared seed/budget
# seam: one place picks the per-run seed, logs it, and bounds the smoke/soak
# loop. Test scaffolding only; never in a TAIRiX build.
tairix-fuzzseed = { path = "../../tests/fuzzseed", version = "=0.0.0" }
