[package]
name = "tairix-crypto"
description = "Audited cryptographic primitives for TAIRiX — thin wrappers around vetted upstream crates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The charter forbids hand-rolled cryptography. The only crates pulled in
# here are the vetted RustCrypto SHA-2 and dalek-cryptography Ed25519
# implementations. Versions are pinned; bumping a pin requires an audit pass.
sha2 = { version = "=0.10.9", default-features = false }
# RustCrypto's audited HMAC. It is the keyed metadata authenticator ARXFS
# seals every metadata block with (`docs/src/filesystem/arxfs-spec.md` §5,
# §8): a stale, misdirected, torn, or bit-rotted metadata block fails the
# keyed check and is repaired from its redundant copy. `default-features =
# false` keeps it `no_std`; it reuses the same vetted `digest`/`sha2` stack
# already pulled in above, so the audit footprint grows by one crate.
hmac = { version = "=0.12.1", default-features = false }
# RustCrypto's audited ChaCha20-Poly1305 AEAD. It backs the encrypted-swap
# layer: the kernel pages secrets out only through an
# authenticated cipher. `default-features = false` keeps this `no_std` and
# pulls in neither `alloc`, `getrandom`, nor `rand_core` — the wrapper uses
# only the in-place detached `AeadInPlace` trait, so nonces and keys are
# supplied by the caller and never sourced inside this crate.
chacha20poly1305 = { version = "=0.10.1", default-features = false }
# RustCrypto's audited ChaCha stream cipher, already in the tree beneath
# `chacha20poly1305` above and already source-pinned, so naming it directly
# adds no crate to the audit surface. It backs `stream`'s ChaCha12 keystream,
# which the kernel random subsystem's fast generator expands its output from.
# `default-features = false` keeps this `no_std`; `zeroize` wires the cipher's
# own key/state to a volatile wipe on drop, the same wipe the AEAD above
# already relies on.
chacha20 = { version = "=0.9.1", default-features = false, features = ["zeroize"] }
# The `zeroize` feature wires `ed25519-dalek`'s own internal key material
# into `zeroize::Zeroize` on drop. `lib/crypto` itself never names the
# `zeroize` crate (we expose verification only, no private-key handling),
# so it is *not* a direct dependency here — adding one would violate
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["zeroize"] }
# The generic self-optimising dispatch framework: the capability gate,
# mandatory self-verify, and fail-closed baseline selection are written once
# there and reused for the crypto backend-availability decision, never
# re-implemented here.
# `default-features = false` drops the framework's optional heap-backed
# `OpsTables`, which the crypto backend decision does not use — so this
# foundational crate stays allocation-free and never forces a global allocator
# onto an allocator-free consumer that links it.
tairix-cpuops = { path = "../cpuops", version = "=0.0.0", default-features = false }
# The arch-neutral capability vocabulary (`CpuFeature`/`CpuFeatureSet`) the
# crypto backend-availability candidate's required-feature gate is expressed in.
tairix-abi = { path = "../abi", version = "=0.0.0" }

[dev-dependencies]
# `hex` is intentionally not depended on: doc/unit tests construct fixtures
# from byte literals so the audit surface stays minimal.
