[package]
name = "tairix-crypto"
description = "Audited cryptographic primitives for TAIRiX — thin wrappers around vetted upstream crates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The charter forbids hand-rolled cryptography, and this is the only crate in
# the workspace permitted to name a cryptographic dependency. Every pin below
# is exact; bumping one requires an audit pass. They are deliberately all on
# one generation of the RustCrypto and dalek-cryptography stacks, so the tree
# holds a single copy of `digest`, `crypto-common`, `cipher`, and the curve
# arithmetic rather than two of each.

# --- Hashes and keyed authenticators -------------------------------------
# SHA-2, the `abi-v1` manifest hash and the SSH exchange hash for every key
# exchange but the SHA-1 ones this tree refuses.
sha2 = { version = "=0.11.0", default-features = false }
# HMAC over the above. It is the keyed metadata authenticator ARXFS seals
# every metadata block with (`docs/src/filesystem/arxfs-spec.md` §5, §8) and
# the SSH transport's `hmac-sha2-{256,512}`.
hmac = { version = "=0.13.0", default-features = false }
# SHA-1, for exactly one caller: the hashed `known_hosts` index, a fixed
# OpenSSH format. It is an obfuscation over a hostname, never a signature.
# Rolling it would be hand-rolling a primitive; it reuses the `digest` stack
# above, so it adds one crate.
sha1 = { version = "=0.11.0", default-features = false }
# Poly1305 standalone, for `chacha20-poly1305@openssh.com`, which keys the
# authenticator from a separate ChaCha20 block and authenticates a length
# field encrypted under a second key — a composition the packaged AEAD below
# cannot express. Already in the tree beneath `chacha20poly1305`, so naming
# it directly adds no crate.
poly1305 = { version = "=0.9.1", default-features = false }

# --- Ciphers --------------------------------------------------------------
# ChaCha20-Poly1305 (RFC 8439). The kernel's encrypted-swap layer pages
# secrets out only through an authenticated cipher. `default-features =
# false` keeps this `no_std` and pulls in neither `alloc`, `getrandom`, nor
# `rand_core`: the wrapper uses only the detached in-out trait, so nonces and
# keys are supplied by the caller and never sourced here.
chacha20poly1305 = { version = "=0.11.0", default-features = false }
# The ChaCha stream cipher, already beneath `chacha20poly1305` above.
# `legacy` exposes djb's original 64-bit-nonce construction, which
# `chacha20-poly1305@openssh.com` uses and RFC 8439's layout cannot express;
# the twelve-round reduction backs `lib/rng`'s fast generator. `zeroize`
# wires the cipher's key and state to a volatile wipe on drop.
chacha20 = { version = "=0.10.2", default-features = false, features = ["zeroize", "legacy"] }
# AES and counter mode, backing the SSH transport's `aes{128,192,256}-ctr`.
# `zeroize` wipes the expanded key schedule on drop.
aes = { version = "=0.9.3", default-features = false, features = ["zeroize"] }
ctr = { version = "=0.10.1", default-features = false, features = ["zeroize"] }
# AES-GCM, backing `aes{128,256}-gcm@openssh.com`. Pinned at or above
# 0.10.3, the release that fixed RUSTSEC-2023-0096 — plaintext exposed from
# the detached decrypt on tag-verification failure.
aes-gcm = { version = "=0.11.1", default-features = false, features = ["aes", "zeroize"] }

# --- Signatures and key agreement -----------------------------------------
# Ed25519 signing and verification: `abi-v1` manifest authentication,
# capability-token issuance, and SSH's `ssh-ed25519` keys. `zeroize` wires
# the crate's own key material into a volatile wipe on drop. `lib/crypto`
# never names `zeroize` itself — every secret it holds is wiped by the
# upstream type that owns it, so a direct dependency would widen the audit
# surface while wiping nothing this feature does not already.
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["zeroize"] }
# The dalek X25519 agreement, the sibling of the signature above, and the
# classical half of SSH's `mlkem768x25519-sha256`. `static_secrets` is what
# lets a caller supply the scalar (this crate sources no randomness).
x25519-dalek = { version = "=3.0.0", default-features = false, features = ["static_secrets", "zeroize"] }
# The RustCrypto NIST prime-curve stack: ECDH and ECDSA over P-256/384/521,
# SSH's `ecdh-sha2-nistp*` and `ecdsa-sha2-nistp*`. One vetted implementation
# per curve over one shared `elliptic-curve` core, so three curve families
# cost one audit surface. `default-features = false` drops `std` and the
# PKCS#8 encoders; signing uses RFC 6979 deterministic nonces, so no
# randomness is drawn here and a repeated nonce — the usual way ECDSA is
# broken — cannot happen.
p256 = { version = "=0.14.0", default-features = false, features = ["arithmetic", "ecdh", "ecdsa"] }
p384 = { version = "=0.14.0", default-features = false, features = ["arithmetic", "ecdh", "ecdsa"] }
p521 = { version = "=0.14.0", default-features = false, features = ["arithmetic", "ecdh", "ecdsa"] }
# The constant-time big-integer arithmetic the curve stack above already
# pulls in, named directly for the RFC 3526 finite-field groups. No vetted
# pure-Rust FFDH crate exists; the group operation is one Montgomery modular
# exponentiation over this audited bignum, the same shape as PBKDF2 over the
# audited HMAC.
crypto-bigint = { version = "=0.7.5", default-features = false, features = ["zeroize"] }
# FIPS 203 ML-KEM, the post-quantum half of `mlkem768x25519-sha256` —
# OpenSSH's current default key exchange. Key generation and encapsulation
# are reached through their deterministic FIPS 203 forms, which take the
# caller's random bytes, so this crate still sources no randomness.
ml-kem = { version = "=0.3.2", default-features = false, features = ["zeroize"] }

# --- Key derivation --------------------------------------------------------
# OpenBSD's bcrypt-pbkdf, the KDF the OpenSSH v1 private-key container wraps
# a passphrase-encrypted key with. Reading an existing user key requires it
# exactly as specified. The heapless entry point is the one used, so this
# crate stays allocator-free.
bcrypt-pbkdf = { version = "=0.11.0", default-features = false, features = ["zeroize"] }

# --- First-party -----------------------------------------------------------
# The generic self-optimising dispatch framework: the capability gate,
# mandatory self-verify, and fail-closed baseline selection are written once
# there and reused for the crypto backend-availability decision, never
# re-implemented here.
# `default-features = false` drops the framework's optional heap-backed
# `OpsTables`, which the crypto backend decision does not use — so this
# foundational crate stays allocation-free and never forces a global allocator
# onto an allocator-free consumer that links it.
tairix-cpuops = { path = "../cpuops", version = "=0.0.0", default-features = false }
# The arch-neutral capability vocabulary (`CpuFeature`/`CpuFeatureSet`) the
# crypto backend-availability candidate's required-feature gate is expressed in.
tairix-abi = { path = "../abi", version = "=0.0.0" }

[dev-dependencies]
# `hex` is intentionally not depended on: doc/unit tests construct fixtures
# from byte literals so the audit surface stays minimal.
