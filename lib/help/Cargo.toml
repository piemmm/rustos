[package]
name = "tairix-help"
description = "TAIRiX shared command-help engine (plans/APPS.md): the one implementation that locates a bundle's internationalised Help/ tree through an injected, capability-scoped read seam, applies the deterministic locale fallback chain (exact tag -> same language -> default en-US), parses one structured-Markdown help document into the fixed section model under hard fail-closed security bounds, and renders both the short `-h`/`-?` view and the full `man` page as `lib/vt` operations — so `man`, every command's short help, and any graphical viewer share one engine. no_std + alloc, forbids unsafe, never panics."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The production own-bundle `HelpSource` (`BundleHelp`): locates the running
# program's own bundle through the one shared resolution policy and reads its
# `Help/` tree through the `tairix-rt` file wrappers, so every `Run` binary
# shares one syscall-backed source instead of each carrying a private copy
# (the charter forbids that duplication). Enabled only by a freestanding `Run`
# binary's target-gated dependency; the engine itself stays seam-injected and
# performs no ambient I/O.
rt = ["dep:tairix-abi", "dep:tairix-cmdres", "dep:tairix-rt"]

# The one help-tree lint (plans/APPS.md §8.1): completeness, required-locale
# coverage, cross-locale OPTIONS switch-key drift, structural bounds, and the
# content-policy screen over a set of discovered Help/ trees. Enabled only by
# host-side consumers (`cargo xtask help-lint`, the `tools/syshelp` aggregator
# tests); never linked into a TAIRiX program.
lint = []

[dependencies]
tairix-vt = { path = "../vt", version = "=0.0.0" }
tairix-curses = { path = "../curses", version = "=0.0.0" }

# For the `rt` feature's `BundleHelp` only: the bundle-entry and
# `Errno`/`DirEntry` vocabulary (`tairix-abi`), the one shared bundle
# candidate policy that locates the running program's own bundle
# (`tairix-cmdres`, the same order `man` walks), and the kernel-authorised
# `fs_*` file wrappers (`tairix-rt`).
tairix-abi = { path = "../abi", version = "=0.0.0", optional = true }
tairix-cmdres = { path = "../cmdres", version = "=0.0.0", optional = true }
tairix-rt = { path = "../rt", version = "=0.0.0", optional = true }

[lints]
workspace = true

[dev-dependencies]
# The fuzz harness draws its inputs through the shared seed/budget
# seam (`tairix_fuzzseed`): one place picks the per-run seed, logs it at
# the start of the test, and bounds the smoke/soak loop. Test scaffolding only;
# never in a TAIRiX build.
tairix-fuzzseed = { path = "../../tests/fuzzseed", version = "=0.0.0" }
