[package]
name = "tairix-fwcfg"
description = "TAIRiX shared QEMU fw_cfg DMA client and ramfb programming helper: the one fw_cfg protocol definition the aarch64 framebuffer boot console and the display-class QEMU verticals build on."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# `MmioDma::from_dtb` discovers the `virt`-board `qemu,fw-cfg-mmio` node
# through the one shared device-tree parser.
tairix-fdt = { path = "../fdt", version = "=0.0.0" }
