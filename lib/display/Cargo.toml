[package]
name = "rustos-display"
description = "RustOS display-service protocol engine: the one definition of the zero-copy, lease-gated frame-presentation semantics — the server engine a display driver's Run binary hosts and the RemoteDisplay client a desktop session presents through (plans/DISPLAY.md D7b)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
rustos-abi = { path = "../abi", version = "=0.0.0" }
rustos-rt = { path = "../rt", version = "=0.0.0", optional = true }

[features]
# The production, syscall-backed `ShmMapper` (`rt` module): pulled in only
# by consumers that run on the RustOS runtime (the framebuffer display
# service, the desktop session's window server).
rt = ["dep:rustos-rt"]

[lints]
workspace = true
