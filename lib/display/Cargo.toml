[package]
name = "tairix-display"
description = "TAIRiX display-service protocol engine: the one definition of the zero-copy, lease-gated frame-presentation semantics — the server engine a display driver's Run binary hosts and the RemoteDisplay client a desktop session presents through (plans/DISPLAY.md D7b)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
tairix-abi = { path = "../abi", version = "=0.0.0" }
# The scan-out encode names the geometry and pixel types its two consumers
# (the compositor and the graphical login screen) already speak.
tairix-geometry = { path = "../geometry", version = "=0.0.0" }
tairix-raster = { path = "../raster", version = "=0.0.0" }
tairix-rt = { path = "../rt", version = "=0.0.0", optional = true }

[features]
# The production, syscall-backed `ShmMapper` (`rt` module): pulled in only
# by consumers that run on the TAIRiX runtime (the framebuffer display
# service, the desktop session's window server).
rt = ["dep:tairix-rt"]

[lints]
workspace = true
