[package]
name = "rustos-net"
description = "RustOS network protocol engine (`lib/net`): the one pure, no_std, host-testable definition of the wire protocols the user-space network stack speaks. This increment carries the dual-stack address vocabulary (IPv4 + IPv6 as equals, scope/zone handling for link-local), the single RFC 1071 Internet-checksum implementation (with the IPv4 and IPv6 pseudo-header variants), Ethernet II framing, the ARP / IPv4 / ICMP-echo wire codecs, and the provider-agnostic RFC 4861 neighbour-cache state machine that ARP and Neighbour Discovery both drive. No I/O, no syscalls, no capability checks: the engine transforms bytes and explicit time values, so the same code is exercised by unit tests, property tests, the fuzz harnesses, and the live netstack service. Every decoder is total, bounded, and fail-closed against attacker-controlled input."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
rustos-abi = { path = "../abi", version = "=0.0.0" }

[lints]
workspace = true

[dev-dependencies]
# The in-tree fuzz harnesses draw their inputs through the shared
# seed/budget seam: one place picks the per-run seed, logs it at the start
# of the test, and bounds the smoke/soak loop. Test scaffolding only;
# never in a RustOS build.
rustos-fuzzseed = { path = "../../tests/fuzzseed", version = "=0.0.0" }
