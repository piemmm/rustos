[package]
name = "rustos-cmdres"
description = "RustOS shared command-word resolution policy (plans/APPS.md §8–§9): the one pure definition of which application-bundle paths a typed command word may name, in the fixed, deterministic search order — the read-only system app store first (so a user's PATH can never shadow a system command), then the user's PATH with its alias-aware `:` split. The shell's launch path and the `man` command's bundle lookup both import this instead of embedding a second resolution policy (AGENTS.md §2.2). Spelling only: it performs no I/O, checks no permission, and grants nothing — the kernel authorises every launch. no_std + alloc, never panics."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The store spellings the policy is computed from: `SYSTEM_APP_STORE`,
# `BUNDLE_SUFFIX`, and the bundle `Run` entry-point name are the `lib/abi`
# definitions the kernel's program registry is drift-tested against, so the
# candidates this crate spells and the paths the kernel registers can never
# diverge (§2.2).
rustos-abi = { path = "../abi", version = "=0.0.0" }

[lints]
workspace = true
