[package]
name = "tairix-fontface"
description = "TAIRiX shared TrueType glyph-outline engine: the one parser + anti-aliased non-zero-winding rasteriser that turns a committed TrueType face into 4-bit coverage bitmaps at any requested pixel size, plus the merged-family codepoint resolution the atlas generator and the runtime font both build on."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The wire `FamilyKey`/`FamilyKind` types a `FontFamily` manifest names a
# family and its layout by, shared with the font-service protocol so a
# family key means the same thing on disk and on the wire.
tairix-abi = { path = "../abi", version = "=0.0.0" }

[dev-dependencies]
# The shared non-cryptographic hash the static-face rasterisation golden is
# fingerprinted with, so the test carries no private copy of a hash function.
tairix-hash = { path = "../hash", version = "=0.0.0" }
# The shared per-run PRNG seed + wall-clock budget seam for the deterministic
# `fuzz_face` face-parser/rasteriser fuzz harness.
tairix-fuzzseed = { path = "../../tests/fuzzseed", version = "=0.0.0" }
