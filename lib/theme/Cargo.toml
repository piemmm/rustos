[package]
name = "tairix-theme"
description = "TAIRiX shared desktop theme definition: the runtime-switchable dark/light palettes, corner-radius metrics, fonts, and cursors that drive the window manager, taskbar, and default apps from one place (§6, §10 — PLAN.md Stage 7)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The two vocabularies a theme shares with an ABI surface, imported rather
# than restated so the value a theme carries and the value on the wire cannot
# drift apart: the font weight the font service rasterises at
# (`tairix_abi::font_ipc::FontWeight`), which a theme names for each text
# role, and the light/dark `Appearance` (`tairix_abi::desktop::Appearance`),
# which the window channel reports to every application.
# This is the crate's only dependency: everything else here is pure theme
# *data*, the compositing colour algebra lives in `lib/raster`, and the crate
# stays at the bottom of the layering — depended on, never depending on a
# kernel, driver, or userland crate.
tairix-abi = { path = "../abi", version = "=0.0.0" }
