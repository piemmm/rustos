[package]
name = "tairix-raidmeta"
description = "TAIRiX RAID on-disk metadata: the one no_std definition of the array-member superblock (identity, level, geometry, slot, generation) and the fail-closed logic that reassembles an array from a set of discovered members (plans/FIX-IO.md IO6). Shared by the RAID composition driver (assembly) and the storage-discovery probe (lib/fsprobe/volmgr, member recognition), so the format and reassembly can never diverge between them (AGENTS.md §2.2) without a drivers/*->drivers/* edge (§17.4)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# BlockGeometry and Time64 the on-disk superblock records (`tairix_abi`), so a
# decoded record names exactly the geometry and timestamps the block seam and
# the 64-bit-native time ABI use.
tairix-abi = { path = "../abi", version = "=0.0.0" }
# CRC-32C block-integrity checksum sealing the on-disk superblock (the one
# first-party checksum definition, never a second; `AGENTS.md` §2.2). It is an
# error-detecting checksum, not a security control: an array's authenticity
# rests on the signed driver bundle and the members' own capability-gated
# endpoints, not on this value.
tairix-crc32c = { path = "../crc32c", version = "=0.0.0" }

[dev-dependencies]
# Shared fuzz-harness seam: one place picks the per-run PRNG seed, logs it, and
# bounds the smoke/soak budget, so the superblock decoder's fuzz harness shares
# the project's single definition (`AGENTS.md` §2.2, §19.6). Test scaffolding
# only.
tairix-fuzzseed = { path = "../../tests/fuzzseed", version = "=0.0.0" }
