[package]
name = "tairix-font"
description = "TAIRiX shared text rasterisation primitives: a built-in monospace bitmap font and a glyph blitter that draws onto a lib/raster surface, used by the taskbar and the default apps without depending on the window manager (§6, §16.4, §17.4 — PLAN.md Stage 7)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The pixel buffer and premultiplied-alpha colour algebra glyphs are blitted
# into and blended with. Text rendering owns no colour arithmetic of its own
# (§2.2); it composites through `lib/raster`'s single `Pixel::over` path.
# Optional: the `glyphs` atlas alone is `const` data, and atlas-only
# consumers (the aarch64 framebuffer boot console) must stay `alloc`-free.
tairix-raster = { path = "../raster", version = "=0.0.0", optional = true }
# The one Unicode terminal-column width definition. The bitmap blitter uses it
# to advance wide CJK scalars by the same two cells every terminal grid reserves.
tairix-vt = { path = "../vt", version = "=0.0.0", optional = true }
# The spinlock guarding the process-global font-service client and its glyph
# cache. Only the `render` blitter has a client; the atlas-only view stays
# lock-free.
tairix-sync = { path = "../sync", version = "=0.0.0", optional = true }
# The font-service wire protocol shared by this client and the `fontd` service
# (§2.2): the render path parses TrueType nowhere, it asks `fontd` for glyph
# coverage over `FONT_ENDPOINT`. Only the `render` blitter needs it.
tairix-abi = { path = "../abi", version = "=0.0.0", optional = true }
# The runtime `ipc_call` transport the render path uses to reach `fontd` in a
# real program. Off by default so host tests (which inject a mock transport)
# and the atlas-only console view never pull the runtime in; a program links
# it by enabling `tairix-font/rt`.
tairix-rt = { path = "../rt", version = "=0.0.0", optional = true }
# The authored design tokens a text role resolves to (size in logical pixels
# and weight) and the one logical->physical scale that converts that size to a
# cell height. Resolving a themed role to a drawable font lives here, once, so
# no screen repeats the conversion (§2.2). Only the `render` blitter needs
# them; the atlas-only console view links neither.
tairix-theme = { path = "../theme", version = "=0.0.0", optional = true }
tairix-geometry = { path = "../geometry", version = "=0.0.0", optional = true }
# The shared reclaimable-memory model: the one cached-glyph classification
# and byte-budgeted cache implementation this crate's own client cache and
# the `fontd` service both build from, so a glyph cache is declared once
# rather than twice on opposite sides of the font-service endpoint.
tairix-reclaim = { path = "../reclaim", version = "=0.0.0", optional = true }
# The System Information client helper the client cache reads the machine's
# total RAM through, to derive its byte budget from the machine rather than a
# hand-picked constant. Only the `rt` feature needs it (a host test never
# derives a live budget); `default-features = false` keeps the pure library
# dependency free of the runtime the `program` feature would otherwise pull.
tairix-procinfo = { path = "../procinfo", version = "=0.0.0", optional = true, default-features = false, features = [
    "program",
] }
# The workspace's one non-cryptographic byte checksum, which the measurement
# memo fingerprints a measured string with so a lookup builds its key without
# allocating. A second hash written here would be the duplication the charter
# forbids; a clash is caught by comparing the retained bytes, so the checksum
# decides only what is *looked up*, never what is answered.
tairix-crc32c = { path = "../crc32c", version = "=0.0.0", optional = true }

[dev-dependencies]
# The audit-sink trait a host test's glyph cache is built with. A test has
# genuinely nowhere to send a reclaim audit record, so it passes the discard
# sink rather than pretending to have a live one.
tairix-log = { path = "../log", version = "=0.0.0" }

[features]
default = ["render"]
# The `lib/raster`-backed glyph blitter (`font::BitmapFont`). Disable
# default features for the atlas-only, allocator-free view.
render = [
    "dep:tairix-raster",
    "dep:tairix-vt",
    "dep:tairix-sync",
    "dep:tairix-abi",
    "dep:tairix-theme",
    "dep:tairix-geometry",
    "dep:tairix-crc32c",
    "glyph-cache",
]
# The shared cached-glyph declaration (`glyph_cache`) alone, with none of
# `render`'s drawing dependencies. `fontd` enables just this, since it
# rasterises glyphs itself and never draws through this crate's blitter.
glyph-cache = ["dep:tairix-reclaim"]
# The production, `ipc_call`-backed font-service transport. A program that
# runs on the TAIRiX runtime enables this so `draw_text` reaches `fontd`
# without any explicit setup; host tests leave it off and inject a mock. It
# also defaults the client's glyph cache lazily, sized from the machine's
# total RAM through `tairix-procinfo`.
rt = ["render", "dep:tairix-rt", "dep:tairix-procinfo"]
# A deterministic solid-coverage test transport (`SolidTestTransport`),
# installed lazily on first draw. A text-drawing consumer enables this as a
# dev-dependency feature so its host tests render without a running `fontd`;
# it is never part of a production build.
test-util = ["render"]

[lints]
workspace = true
