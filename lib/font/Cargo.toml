[package]
name = "rustos-font"
description = "RustOS shared text rasterisation primitives: a built-in monospace bitmap font and a glyph blitter that draws onto a lib/raster surface, used by the taskbar and the default apps without depending on the window manager (§6, §16.4, §17.4 — PLAN.md Stage 7)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The pixel buffer and premultiplied-alpha colour algebra glyphs are blitted
# into and blended with. Text rendering owns no colour arithmetic of its own
# (§2.2); it composites through `lib/raster`'s single `Pixel::over` path.
# Optional: the `glyphs` atlas alone is `const` data, and atlas-only
# consumers (the aarch64 framebuffer boot console) must stay `alloc`-free.
rustos-raster = { path = "../raster", version = "=0.0.0", optional = true }

[features]
default = ["render"]
# The `lib/raster`-backed glyph blitter (`font::BitmapFont`). Disable
# default features for the atlas-only, allocator-free view.
render = ["dep:rustos-raster"]

[lints]
workspace = true
