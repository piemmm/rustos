[package]
name = "tairix-taskpins"
description = "TAIRiX desktop pinned-shortcut store engine: the ordered pin list, its on-disk grammar, fail-closed bounded parse, canonical render, and the pin/unpin/reorder operations every producer and consumer shares."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Reuses the validated `EntryId`/`BundlePath` newtypes so a pin's reference
# can never diverge from the catalog's own validation.
tairix-proglib = { path = "../proglib", version = "=0.0.0" }
# The one `#`-comment grammar every line-oriented configuration store in
# the tree shares, so a comment is recognised here exactly as it is in
# the boot-time and network stores.
tairix-util = { path = "../util", version = "=0.0.0" }

[dev-dependencies]
# The in-tree fuzz harness draws its inputs through the shared seed/budget
# seam: one place picks the per-run seed, logs it, and bounds the smoke/soak
# loop. Test scaffolding only; never in a TAIRiX build.
tairix-fuzzseed = { path = "../../tests/fuzzseed", version = "=0.0.0" }
