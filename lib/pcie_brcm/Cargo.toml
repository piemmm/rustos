[package]
name = "rustos-pcie-brcm"
description = "RustOS Broadcom BCM2711 (Raspberry Pi 4) PCIe root-complex bring-up library: the discovered-window-driven reset/SerDes/link-train state machine + BIND_KEYS, shared by the kernel boot scaffold and (next) a user-space bus-driver bin without a drivers/*->drivers/* edge (AGENTS.md §2.20 device-support carve-out / §17.4)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
rustos-abi = { path = "../abi", version = "=0.0.0" }
# The PCI/PCIe configuration-access mechanism + shared bus-driver locate/BAR
# primitives (`mechanism_brcm`, `find_function_by_class`, `assign_and_map_bar`,
# `bus_to_cpu_phys`, `USB_CONTROLLER_CLASS`) the `emit_vl805_node` composition
# drives once the link trains. `lib/* → lib/*`, no cycle (`lib/pci` does not
# depend on this crate).
rustos-pci = { path = "../pci", version = "=0.0.0" }
# The xHCI-protocol facts the published node's grants are sized by:
# `XHCI_BAR_INDEX` (the controller's register BAR) and `XHCI_DMA_BYTES` (the
# downstream driver's DMA working set), one definition shared with the xHCI
# driver (`AGENTS.md` §2.2).
rustos-usb = { path = "../usb", version = "=0.0.0" }

[lints]
workspace = true
