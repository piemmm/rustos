[package]
name = "tairix-sysconfig"
description = "TAIRiX boot-time system-configuration store engine: the one definition of the `/System/Settings/Configuration/system.conf` grammar, its closed key registry, and the fail-closed parse + canonical render every producer and consumer shares (§3 `lib/`)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The one `#`-comment line grammar every line-oriented configuration store
# in the tree shares, so a comment is recognised identically here, in
# `lib/netconfig`, and in init's service registry and startup list.
tairix-util = { path = "../util", version = "=0.0.0" }
