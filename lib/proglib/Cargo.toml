[package]
name = "tairix-proglib"
description = "TAIRiX program-library catalog engine: the one definition of the `/System/Settings/ProgramLibrary/library.conf` document — its closed folder taxonomy, `<id>.<key>` grammar, validated entry model, bounded fail-closed parser, canonical render, and the machine-catalog/user-overlay merge every producer and consumer shares (`lib/`)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The bundle-store layout, the `.app` suffix, and the identifier/name
# bounds an `AppInfo` manifest already fixes: a catalog entry names a
# bundle, so it keys its own bounds to those rather than mint a second set
# that could drift.
tairix-abi = { path = "../abi", version = "=0.0.0" }
# The one path-spelling parser: a catalog entry's bundle path is validated
# and canonicalised through it, so the store can never hold a spelling the
# rest of the system would resolve differently.
tairix-path = { path = "../path", version = "=0.0.0" }
# The one `key = value` document engine: a catalog is a plain `lib/appconf`
# document — the format the app-data store speaks, where the per-user
# overlay lives — so this crate defines the closed `<id>.<field>` registry
# over it and no grammar, no comment rule, and no length bounds of its own
# (plans/APPDATA.md §1.3, AD10).
tairix-appconf = { path = "../appconf", version = "=0.0.0" }

[dev-dependencies]
# The one document engine the registry's tests and fuzz harness read and
# render through, so both walk the same accept/reject boundary the store
# does rather than a restatement of it.
tairix-appconf = { path = "../appconf", version = "=0.0.0" }
# The one definition of the `/Users/<name>` home layout, so the entry
# model's own test that a home program store is an admitted bundle root
# checks against the account-authoring policy rather than a restatement of
# it. A test-only dependency: nothing this crate ships needs a home path.
tairix-users = { path = "../users", version = "=0.0.0" }
# The in-tree fuzz harness draws its inputs through the shared seed/budget
# seam: one place picks the per-run seed, logs it, and bounds the smoke/soak
# loop. Test scaffolding only; never in a TAIRiX build.
tairix-fuzzseed = { path = "../../tests/fuzzseed", version = "=0.0.0" }
