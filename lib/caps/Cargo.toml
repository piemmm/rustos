[package]
name = "rustos-caps"
description = "RustOS capability primitives: `Capability`, `CapabilitySet`, delegation, and signed tokens."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
rustos-abi = { path = "../abi", version = "=0.0.0" }
rustos-collections = { path = "../collections", version = "=0.0.0" }
rustos-crypto = { path = "../crypto", version = "=0.0.0" }

[dev-dependencies]
# Tests need a signing key to produce real Ed25519 tokens; production callers
# never sign — they only verify via `rustos-crypto`. The dev-only dependency
# keeps the signing surface out of the audited build.
ed25519-dalek = { version = "=2.1.1", default-features = false }
# The §19.7 Bronze stateful model (`tests/proptest_model.rs`) drives the
# capability-critical paths under randomised command sequences. Same pinned,
# already-audited version `kernel/sec` uses; dev-only, so it never reaches
# the production capability surface.
proptest = { version = "=1.5.0", default-features = false, features = ["std"] }
