[package]
name = "tairix-caps"
description = "TAIRiX capability primitives: `Capability`, `CapabilitySet`, delegation, and signed tokens."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
tairix-abi = { path = "../abi", version = "=0.0.0" }
tairix-inline = { path = "../inline", version = "=0.0.0" }
tairix-crypto = { path = "../crypto", version = "=0.0.0" }

[dev-dependencies]
# Tests need a signing key to produce real Ed25519 tokens; production callers
# never sign — they only verify via `tairix-crypto`. The dev-only dependency
# keeps the signing surface out of the audited build.
ed25519-dalek = { version = "=2.1.1", default-features = false }
# The Bronze stateful model (`tests/proptest_model.rs`) drives the
# capability-critical paths under randomised command sequences. Same pinned,
# already-audited version `kernel/sec` uses; dev-only, so it never reaches
# the production capability surface.
proptest = { version = "=1.5.0", default-features = false, features = ["std"] }
# The model drives its programs through the shared seed/budget runner
# (`tairix_fuzzseed::prop::drive`), so the seed selection, start-of-test seed
# log, and smoke/soak loop live in one place. Test
# scaffolding only; never in a TAIRiX build.
tairix-fuzzseed = { path = "../../tests/fuzzseed", version = "=0.0.0", features = ["proptest"] }
