[package]
name = "rustos-svg"
description = "RustOS shared SVG image-decoding library (§16.4): a fail-closed, first-party no_std decoder for the WM/desktop SVG-first asset subset, producing the shared filled-polygon vector form the cursors and icons rasterise through lib/raster's single polygon path (§2.2, §2.12, §10 — PLAN.md Stage 7)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The straight-alpha colour type SVG fills decode into. The SVG decoder owns
# no colour arithmetic of its own (§2.2); it hands `Color`s straight to the
# vector forms in `lib/cursor` / `lib/icon`, which rasterise through
# `lib/raster`'s single supersampled polygon path.
rustos-raster = { path = "../raster", version = "=0.0.0" }

[lints]
workspace = true
