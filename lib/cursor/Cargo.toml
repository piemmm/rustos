[package]
name = "rustos-cursor"
description = "RustOS shared pointer-cursor library: scalable, colourful, vectorised cursor shapes rasterised onto a lib/raster surface, plus replaceable cursor sets keyed by the theme's CursorKind, used by the window manager without it owning a cursor format (§6, §10 — PLAN.md Stage 7)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The pixel buffer and premultiplied-alpha colour algebra cursor shapes are
# rasterised into and blended with. The cursor library owns no colour
# arithmetic of its own (§2.2); it composites through `lib/raster`'s single
# `Pixel::over` path.
rustos-raster = { path = "../raster", version = "=0.0.0" }
# The shared integer coordinate types (`Point`) used for hotspots and the
# rasterised footprint (§6 / §17.4).
rustos-geometry = { path = "../geometry", version = "=0.0.0" }
# The `CursorKind` vocabulary a theme names cursors by; a `CursorTheme`
# binds one vector cursor per kind so the WM resolves a kind to a shape.
rustos-theme = { path = "../theme", version = "=0.0.0" }
# The shared SVG decoder (§16.4 image-decoding class). Cursor assets are
# authored as SVG (the SVG-first asset rule, §10); a decoded `SvgImage` is the
# same filled-polygon stack a `VectorCursor` holds, plus the hotspot, so the
# cursor library converts one straight onto its vector form without a second
# rasterisation path (§2.2).
rustos-svg = { path = "../svg", version = "=0.0.0" }

[lints]
workspace = true
