[package]
name = "tairix-cursor"
description = "TAIRiX shared pointer-cursor library: scalable, colourful, vectorised cursor shapes rasterised onto a lib/raster surface, plus replaceable cursor sets keyed by the theme's CursorKind, used by the window manager without it owning a cursor format (PLAN.md Stage 7)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The bound a cursor-set listing is held to, imported rather than restated
# because the set names travel the window channel to a chooser, so the count
# this crate caps a listing at and the count that frame carries are one
# definition.
tairix-abi = { path = "../abi", version = "=0.0.0" }
# The one leaf-name spelling check: an asset id comes from the active theme
# and is spliced into a store path, so it is judged by the same parser that
# judges every other file name rather than by a second ad-hoc rule.
tairix-path = { path = "../path", version = "=0.0.0" }
# The pixel buffer and premultiplied-alpha colour algebra cursor shapes are
# rasterised into and blended with. The cursor library owns no colour
# arithmetic of its own; it composites through `lib/raster`'s single
# `Pixel::over` path.
tairix-raster = { path = "../raster", version = "=0.0.0" }
# The `CachedBytes` trait `CursorImage` implements, delegating straight to
# its `Surface`'s own impl, so the window manager's cursor cache
# (`plans/SMARTRAM.md` section 6.4) can bound and reclaim it.
tairix-reclaim = { path = "../reclaim", version = "=0.0.0" }
# The shared integer coordinate types (`Point`) used for hotspots and the
# rasterised footprint.
tairix-geometry = { path = "../geometry", version = "=0.0.0" }
# The `CursorKind` vocabulary a theme names cursors by; a `CursorTheme`
# binds one vector cursor per kind so the WM resolves a kind to a shape.
tairix-theme = { path = "../theme", version = "=0.0.0" }
# The shared SVG decoder (image-decoding class). Cursor assets are
# authored as SVG (the SVG-first asset rule); a decoded `SvgImage` is the
# same filled-polygon stack a `VectorCursor` holds, plus the hotspot, so the
# cursor library converts one straight onto its vector form without a second
# rasterisation path.
tairix-svg = { path = "../svg", version = "=0.0.0" }

[lints]
workspace = true
