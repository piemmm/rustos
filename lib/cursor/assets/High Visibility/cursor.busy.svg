<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" data-hotspot-x="16" data-hotspot-y="16">
  <title>Busy</title>
  <!-- A haloed disc rather than an outline: the white ring keeps it
       legible and the two fills keep it a colour cursor. -->
  <circle cx="16" cy="16" r="13" fill="none" stroke="#ffffff" stroke-width="4"/>
  <circle cx="16" cy="16" r="13" fill="#f0a500"/>
  <circle cx="16" cy="16" r="6" fill="#111114"/>
</svg>
