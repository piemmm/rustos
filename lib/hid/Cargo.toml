[package]
name = "tairix-hid"
description = "TAIRiX HID boot-protocol decode + console producer (plans/USB.md): the arch-neutral, transport-agnostic HID boot-report decode the USB-HID class drivers compose, so a class driver does not re-implement it. Controller bring-up lives in the host-controller driver, not here. no_std, fail-closed."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The platform-neutral input-event/`ReportSource`/`DriverHost` surface the
# decoders and orchestration are written against, and the `DriverError` /
# `CapabilityId` / `HwResource` vocabulary they fail closed with — one ABI
# definition.
tairix-abi = { path = "../abi", version = "=0.0.0" }
# The decoded keyboard `Key` vocabulary the console producer resolves HID
# usages into (a `lib/*` crate).
tairix-input = { path = "../input", version = "=0.0.0" }
# The shared terminal key map that turns each resolved key press into the
# `KeyInput` record a driver injects through `key_inject` — the one definition
# of the `Key`→record map.
tairix-keymap = { path = "../keymap", version = "=0.0.0" }

[lints]
workspace = true
