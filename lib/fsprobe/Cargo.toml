[package]
name = "rustos-fsprobe"
description = "RustOS filesystem signature, label, and identity probe: the one no_std definition of how the head of a block extent is recognised as a supported filesystem (ARXFS / ext4 / FAT32), which stable identity it carries, and how that identity renders as a short display fingerprint (plans/DEVICES.md D3c, plans/ALIAS.md §3.8)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The closed set of attachable filesystem types (`rustos_abi::volume`), so a
# probe result names exactly what a `volume_attach` request can carry.
rustos-abi = { path = "../abi", version = "=0.0.0" }

[dev-dependencies]
# Per-run PRNG seeding + wall-clock budget for the fuzz harness
# (`tests/fuzz_fsprobe.rs`).
rustos-fuzzseed = { path = "../../tests/fuzzseed", version = "=0.0.0" }
