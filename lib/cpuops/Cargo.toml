[package]
name = "tairix-cpuops"
description = "TAIRiX self-optimising CPU-dispatch framework: the one generic, platform-neutral registry that selects, per boot per distinct core type, the fastest *correct* feature-legal implementation of an accelerated operation (CRC32, checksums, memcpy/zero, blit, XOR, and the crypto-backend availability decision) from a set of candidates — via a deterministic capability gate over `tairix_abi::cpufeatures`, a mandatory self-verify against a portable reference, and either declared priority or a bounded microbenchmark, always falling closed to a portable baseline. no_std + alloc, no `cfg`, no board/SoC name (plans/FIX-HARDWARE-FEATURES.md)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# `alloc` gates the heap-backed `OpsTables` (the per-core-type resolved-ops
# table) — the crate's only allocation. The selection algorithm allocates
# nothing, so an allocator-free consumer that only *selects* a routine
# (`lib/crc32c`, `lib/crypto`) depends on this crate with
# `default-features = false` and needs no global allocator, while a consumer
# that builds an `OpsTables` (the `kernel/core` per-core-type bring-up) keeps
# the default. On by default so the crate's own tests and doc build cover it.
default = ["alloc"]
alloc = []

[dependencies]
# The arch-neutral capability vocabulary (`CpuFeature`/`CpuFeatureSet`) is
# defined once in the dependency-free ABI crate and shared with the Arch HAL,
# so the framework gates candidates on the *same* bits the ports produce
# without acquiring a forbidden edge to `kernel/*`.
tairix-abi = { path = "../abi", version = "=0.0.0" }
