[package]
name = "rustos-raster"
description = "RustOS shared software rasterisation primitives: premultiplied-alpha colours, the Porter–Duff over operator, and a pixel surface, used by the window manager and the taskbar without either depending on the other (§6, §17.4 — PLAN.md Stage 7)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The single shared theme definition (§10): a theme `Rgba` token meets the
# compositing arithmetic at exactly one edge — `From<Rgba> for Color` — so the
# window manager and the taskbar turn a theme colour into a renderable colour
# the same way, with no duplicated conversion (§2.2).
rustos-theme = { path = "../theme", version = "=0.0.0" }

[lints]
workspace = true
