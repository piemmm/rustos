[package]
name = "tairix-abi-sys"
description = "C-callable abi-v1 syscall stub runtime (the tairix_sys_* trap stubs)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
tairix-abi = { path = "../abi", version = "=0.0.0" }

# The single per-architecture syscall trap: this crate
# marshals each `tairix_sys_*` call into register form and hands it to the shared
# `raw_syscall` primitive, so the trap assembly is not duplicated here.
tairix-abi-trap = { path = "../abi-trap", version = "=0.0.0" }

# The host trap seam used to assert the marshalling of every stub without a
# kernel. Enabled only for this crate's own tests, so the
# `std`-pulling seam never reaches a shipping build.
[dev-dependencies]
tairix-abi-trap = { path = "../abi-trap", version = "=0.0.0", features = ["host-seam"] }
