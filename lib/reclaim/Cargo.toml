[package]
name = "tairix-reclaim"
description = "TAIRiX shared reclaimable-memory model: the cache classification/budget/accounting taxonomy, the five-band memory-pressure vocabulary and its reclaim ordering, and the bounded pressure-governed cache core the kernel and the desktop session both build their caches on (plans/SMARTRAM.md)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The one bounded recency map every cache here is built on: a hit is a hash
# probe and a splice, and eviction takes the cold end without a search.
tairix-collections = { path = "../collections", version = "=0.0.0" }
# The two hashers a consumer names when it builds a cache: the fast unkeyed
# one for keys this system assigns, the keyed one for anything a caller picks.
tairix-hash = { path = "../hash", version = "=0.0.0" }
# The one structured-logging surface. A classification refusal or a
# detected ledger defect is a security-relevant decision, so it emits a
# stable audit event rather than a bare failure — the same event contract
# for a kernel cache and a desktop one.
tairix-log = { path = "../log", version = "=0.0.0" }

# The System Information wire record a cache's ledger is sampled into
# (`src/ledger.rs`). The kernel's statistics registry and the userland
# runtime's reporter both publish that record and neither may depend on
# the other, so the one conversion lives beside the model that defines a
# class and an owner. No new edge in the graph: `tairix-log` above already
# depends on the ABI vocabulary, and the ABI crate itself depends on
# nothing.
tairix-abi = { path = "../abi", version = "=0.0.0" }

[lints]
workspace = true

# Nothing else, on purpose. The reclaimable-memory model is the shared
# vocabulary the kernel memory manager *and* the userland desktop session
# both classify their caches against, so it sits near the bottom of the
# layering: the only crates it names are the two that sit below it, the
# structured-logging surface and the ABI vocabulary. Anything platform-specific
# (the physical frame allocator behind the kernel's live gauge, the
# `ramzip` handoff ordering) stays with its owner and plugs in through the
# seams defined here.
