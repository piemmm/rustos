[package]
name = "tairix-kalloc"
description = "TAIRiX shared no_std freeing (segregated-fit, O(1)) kernel heap allocator for freestanding images."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The one system page granule (`PAGE_SIZE`/`PAGE_SHIFT`): the slab tier's
# largest size class *is* the page, so a page-sized allocation occupies exactly
# one frame. The granule is user-visible through `mem_map`, so it is defined
# once in the ABI and imported here rather than re-stated. `tairix-abi` has no
# dependencies of its own and allocates nothing, so the allocator crate stays a
# leaf over `core`.
tairix-abi = { path = "../abi", version = "=0.0.0" }

# The one IRQ-masking spinlock. The heap lock must mask interrupts (an ISR
# that allocates would otherwise self-deadlock on its own mainline's hold), and
# that primitive already exists here rather than being hand-rolled a second
# time. It also carries the lockup watchdog's lock-site instrumentation, so a
# core wedged inside the global heap lock is named rather than reported against
# whatever outer lock it happened to hold. `tairix-sync` has no dependencies of
# its own and allocates nothing, so the allocator crate stays a leaf.
tairix-sync = { path = "../sync", version = "=0.0.0" }

[features]
# Forwards the lock-site observation the lockup watchdog needs onto the heap
# lock. Off by default, exactly as in `tairix-sync`: a shippable build compiles
# the facility out and the heap lock stays a bare CAS.
lock-diagnostics = ["tairix-sync/lock-diagnostics"]

[lints]
workspace = true

[lib]
path = "src/lib.rs"
