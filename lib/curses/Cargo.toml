[package]
name = "tairix-curses"
description = "TAIRiX first-party curses / TUI screen-model library (CURSES.md Stage C4): a no_std + alloc, I/O-injected client screen model (windows, sub-windows, pads), a minimal-diff renderer that emits the smallest `lib/vt` sequence set the active `tairix_termcap::TermType` supports (degrading truecolour -> 256 -> 16 -> mono by colour depth), and an input decoder that turns `lib/vt`-parsed escape sequences into typed key/mouse/paste events. One shared vocabulary (AGENTS.md §2.2); statically linked by apps (§16.4); fail-closed, never panics (§2.9)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The `program` feature adds the production standard-streams [`Tty`]
# (`StreamTty`) that a full-screen tool's `Run` binary links: writes to
# standard output and blocking/timed reads from standard input through the
# freestanding userland runtime `tairix-rt`. It is enabled only when a
# bare-metal program binary is built — the pure screen-model library and the
# host tests never pull the runtime. Mirrors `tairix-procinfo`'s split.
[features]
program = ["dep:tairix-rt", "dep:tairix-abi"]

[dependencies]
tairix-vt = { path = "../vt", version = "=0.0.0" }
tairix-termcap = { path = "../termcap", version = "=0.0.0" }

# The `program`-feature `StreamTty` links the freestanding userland runtime
# for the standard-stream reads/writes, and the frozen `Errno` set to tell a
# timed read's elapsed deadline apart from a real terminal failure. Pulled
# only for the bare-metal targets a `Run` binary is actually built for; on
# the host neither is compiled.
[target.'cfg(target_os = "none")'.dependencies]
tairix-rt = { path = "../rt", version = "=0.0.0", optional = true }
tairix-abi = { path = "../abi", version = "=0.0.0", optional = true }

[lints]
workspace = true

[dev-dependencies]
# The §19.6 fuzz harness draws its inputs through the shared seed/budget
# seam (`tairix_fuzzseed`): one place picks the per-run seed, logs it at
# the start of the test, and bounds the smoke/soak loop (`AGENTS.md`
# §2.2). Test scaffolding only; never in a TAIRiX build.
tairix-fuzzseed = { path = "../../tests/fuzzseed", version = "=0.0.0" }
