<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>Folder with contents</title>
  <!-- The same folder as the shipped folder class artwork, with three papers
       stacked between its back plate and its front body. Rounded corners are
       cut as integer line segments, each paper's edge is a slightly larger
       filled ring behind its white fill rather than a stroke, and the left and
       right papers' tilt is baked into their coordinates: the desktop's SVG
       subset has no curves, no strokes and no transforms. -->

  <!-- Back plate and tab -->
  <polygon fill="#3A86E8" points="28,64 29,57 34,51 40,46 47,45 100,45 109,47 116,53 128,70 209,70 216,71 222,76 227,82 228,89 228,101 28,101"/>

  <!-- Left paper, tilted anticlockwise -->
  <polygon fill="#CFE2FF" points="55,69 55,66 56,64 58,63 60,62 96,60 99,60 101,61 102,63 103,65 107,131 107,134 106,136 104,137 102,138 66,140 63,140 61,139 60,137 59,135"/>
  <polygon fill="#FFFFFF" points="57,69 57,67 58,66 59,65 60,64 96,62 98,62 99,63 100,64 101,66 105,131 105,133 104,134 103,135 102,136 66,138 64,138 63,137 62,136 61,134"/>
  <polygon fill="#CFE2FF" points="88,61 103,74 102,60"/>
  <polygon fill="#EAF3FF" points="89,61 102,72 101,60"/>

  <!-- Centre paper -->
  <polygon fill="#CFE2FF" points="103,55 103,53 105,51 107,49 109,49 149,49 151,49 153,51 155,53 155,55 155,129 155,131 153,133 151,135 149,135 109,135 107,135 105,133 103,131 103,129"/>
  <polygon fill="#FFFFFF" points="105,55 105,53 106,52 107,51 109,51 149,51 151,51 152,52 153,53 153,55 153,129 153,131 152,132 151,133 149,133 109,133 107,133 106,132 105,131 105,129"/>
  <polygon fill="#CFE2FF" points="139,49 155,65 155,49"/>
  <polygon fill="#EAF3FF" points="141,50 154,63 154,50"/>

  <!-- Right paper, tilted clockwise -->
  <polygon fill="#CFE2FF" points="153,65 154,63 155,61 157,60 160,60 196,62 198,63 200,64 201,66 201,69 197,135 196,137 195,139 193,140 190,140 154,138 152,137 150,136 149,134 149,131"/>
  <polygon fill="#FFFFFF" points="155,66 156,64 157,63 158,62 160,62 196,64 197,65 198,66 199,67 199,69 195,134 194,136 193,137 192,138 190,138 154,136 153,135 152,134 151,133 151,131"/>
  <polygon fill="#CFE2FF" points="187,62 200,77 201,63"/>
  <polygon fill="#EAF3FF" points="189,63 200,76 201,64"/>

  <!-- Front body -->
  <polygon fill="#4C9AF0" points="28,91 29,84 34,78 40,73 47,72 209,72 216,73 222,78 227,84 228,91 228,192 227,199 222,205 216,210 209,211 47,211 40,210 34,205 29,199 28,192"/>

  <!-- Flat top accent -->
  <polygon fill="#65AAF5" points="28,91 29,84 34,78 40,73 47,72 209,72 216,73 222,78 227,84 228,91 228,99 28,99"/>
</svg>
