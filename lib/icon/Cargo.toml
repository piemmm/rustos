[package]
name = "tairix-icon"
description = "TAIRiX shared desktop-icon library: scalable, themeable vector icon glyphs (notification/status icons) rasterised onto a lib/raster surface through the single exact-area fill_polygon path, used by the taskbar without owning a scan converter (PLAN.md Stage 7)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The storage-medium vocabulary a mounted volume reports (`BlkDeviceClass`).
# The icon library maps a medium onto its drive glyph in one place rather
# than every desktop consumer restating the mapping.
tairix-abi = { path = "../abi", version = "=0.0.0" }
# The pixel buffer, the single anti-aliased polygon-fill path icons rasterise
# through, and the one layered composition that resolves the seams between
# their layers. The icon library owns no scan converter or colour arithmetic
# of its own; it draws through `lib/raster`.
tairix-raster = { path = "../raster", version = "=0.0.0" }
# The shared SVG decoder (image-decoding class). Icon assets are
# authored as SVG (the SVG-first asset rule); decoding one yields the
# same filled-polygon layers a `VectorIcon` already holds, so the icon library
# converts an `SvgImage` straight onto its vector form without a second
# rasterisation path.
tairix-svg = { path = "../svg", version = "=0.0.0" }
# The reclaimable-memory model the shared artwork decode cache is built on:
# both the desktop session and the file manager retain rasterised icon
# artwork through one pressure-governed, budgeted cache rather than each
# process inventing its own (plans/SMARTRAM.md).
tairix-reclaim = { path = "../reclaim", version = "=0.0.0" }
# The audit sink the reclaimable-memory cache logs classification and
# eviction through — supplied by the process that builds the cache.
tairix-log = { path = "../log", version = "=0.0.0" }
# The shared file-name validator. An application bundle names its own icon in
# its manifest, and that name is untrusted input: it is accepted only as a
# plain file name, checked by the one path parser the tree already has rather
# than a second spelling of the same rule.
tairix-path = { path = "../path", version = "=0.0.0" }

[lints]
workspace = true
