[package]
name = "rustos-icon"
description = "RustOS shared desktop-icon library: scalable, themeable vector icon glyphs (notification/status icons) rasterised onto a lib/raster surface through the single supersampled fill_polygon path, used by the taskbar without owning a scan converter (§6, §10 — PLAN.md Stage 7)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The pixel buffer and the single supersampled anti-aliased polygon-fill path
# icons rasterise through. The icon library owns no scan converter or colour
# arithmetic of its own (§2.2); it draws through `lib/raster`.
rustos-raster = { path = "../raster", version = "=0.0.0" }

[lints]
workspace = true
