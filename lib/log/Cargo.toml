[package]
name = "tairix-log"
description = "TAIRiX placeholder: structured logging."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# hash-chained audit log. SHA-256 comes from the audited wrapper in
# `lib/crypto` (no hand-rolled cryptography);
# this crate never names an upstream crypto crate directly.
tairix-crypto = { path = "../crypto", version = "=0.0.0" }
# The typed-field value model reuses the canonical ABI scalar types
# (`Time64`/`Duration64`, the kernel error code, and the capability id) so a
# logged value and its ABI form cannot drift apart (no duplication).
tairix-abi = { path = "../abi", version = "=0.0.0" }
# The log-attestation key is a secret: it is scrubbed from memory on drop with
# the audited `zeroize` crate (zero-on-free; no hand-rolled
# wiping, and `zeroize`'s volatile writes are not elided by the optimiser).
zeroize = { version = "1.8.1", default-features = false }

[dev-dependencies]
# The fuzz harness for the value decoder draws its inputs through the
# shared seed/budget seam (`tairix_fuzzseed`): one place picks the per-run
# seed, logs it, and bounds the smoke/soak loop. Test
# scaffolding only; never in a TAIRiX build.
tairix-fuzzseed = { path = "../../tests/fuzzseed", version = "=0.0.0" }
