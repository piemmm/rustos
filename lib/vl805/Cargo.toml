[package]
name = "rustos-vl805"
description = "RustOS Raspberry Pi 4 (BCM2711) VL805 xHCI USB host-controller device-support library: VideoCore-mailbox firmware reload policy + the bind table and driver-host wiring that publishes the controller as an xHCI hardware-tree node (AGENTS.md §2.20 device-support carve-out; plans/PI.md P10 D5c)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The frozen `abi-v1` surface: the `DriverHost` / `MailboxChannel` seams the
# firmware policy runs over, the `HwNode` / `HwResource` / `HwMatchKey`
# vocabulary the controller node is published with, and the `CapabilityId` /
# `DriverError` types it fails closed with — one ABI definition (§2.2).
rustos-abi = { path = "../abi", version = "=0.0.0" }
# The BCM2711 VideoCore property-channel client (`AGENTS.md` §2.20 device
# carve-out): the VL805 firmware-reload (`NOTIFY_XHCI_RESET`) and
# firmware-revision property-message layout live here once; this crate
# encodes/decodes those messages and runs them over the board-neutral
# `lib/abi` `MailboxChannel` seam, never re-deriving the layout (§2.2).
rustos-vcmailbox = { path = "../vcmailbox", version = "=0.0.0" }
# The bus-agnostic xHCI controller crate: the single definition of the
# controller's `compatible` identity (`XHCI_COMPATIBLE`) the published node
# carries and its DMA working-set size (`XHCI_DMA_BYTES`), shared with the
# controller driver that binds the node (§2.2).
rustos-usb = { path = "../usb", version = "=0.0.0" }

[dev-dependencies]
# Protocol-faithful mock firmware (`mock-firmware` feature) backing the
# host-test `MailboxChannel`, so the firmware policy is proven against the
# real property semantics rather than a hand-faked response (§2.1 / §2.2).
# QEMU models no VideoCore, so the live doorbell is the on-metal acceptance
# item (`plans/PI.md` Increment C).
rustos-vcmailbox = { path = "../vcmailbox", version = "=0.0.0", features = ["mock-firmware"] }

[lints]
workspace = true
