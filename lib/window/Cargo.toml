[package]
name = "tairix-window"
description = "TAIRiX window-channel protocol engine: the one definition of the zero-copy, owner-keyed app-window semantics — the server engine the desktop session composes and the client an application's Run binary links (plans/APPWIN.md AW2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
tairix-abi = { path = "../abi", version = "=0.0.0" }
tairix-display = { path = "../display", version = "=0.0.0" }
# Integer screen geometry: the window-local point a delivered pointer event
# carries.
tairix-geometry = { path = "../geometry", version = "=0.0.0" }
# The shared pointer input-event vocabulary every control consumes, so the
# one wire-to-control translation every windowed app needs lives here rather
# than as a private copy per app.
tairix-input = { path = "../input", version = "=0.0.0" }
# The syscalls an application's own half needs: one `shm_create`d, granted
# frame region per window. Optional so the server engine the session composes
# stays free of the runtime.
tairix-rt = { path = "../rt", version = "=0.0.0", optional = true }
# The memory-pressure band the shared app shell puts on every app's wait-set,
# so a cache is trimmed as memory tightens rather than held until something
# else is starved. Optional with the rest of the app-side half.
tairix-procinfo = { path = "../procinfo", version = "=0.0.0", optional = true, features = [
    "program",
] }
# The retained window surface the shell draws each frame into, and the theme
# registry it primes from the session's reported appearance. Optional with the
# rest of the app-side half.
tairix-raster = { path = "../raster", version = "=0.0.0", optional = true }
tairix-theme = { path = "../theme", version = "=0.0.0", optional = true }

[features]
default = ["rt"]
# The application's own half: the frame region (`WindowFrames`) and the shared
# app shell (`app`), which call the runtime's syscalls. Disable for the
# engine-only, syscall-free view a host test or the server side takes.
rt = [
    "dep:tairix-rt",
    "dep:tairix-procinfo",
    "dep:tairix-raster",
    "dep:tairix-theme",
]

[lints]
workspace = true
