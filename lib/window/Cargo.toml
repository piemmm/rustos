[package]
name = "tairix-window"
description = "TAIRiX window-channel protocol engine: the one definition of the zero-copy, owner-keyed app-window semantics — the server engine the desktop session composes and the client an application's Run binary links (plans/APPWIN.md AW2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
tairix-abi = { path = "../abi", version = "=0.0.0" }
tairix-display = { path = "../display", version = "=0.0.0" }
# Integer screen geometry: the window-local point a delivered pointer event
# carries.
tairix-geometry = { path = "../geometry", version = "=0.0.0" }
# The shared pointer input-event vocabulary every control consumes, so the
# one wire-to-control translation every windowed app needs lives here rather
# than as a private copy per app.
tairix-input = { path = "../input", version = "=0.0.0" }
# The syscalls an application's own half needs: one `shm_create`d, granted
# frame region per window. Optional so the server engine the session composes
# stays free of the runtime.
tairix-rt = { path = "../rt", version = "=0.0.0", optional = true }

[features]
default = ["rt"]
# The client-side frame region (`WindowFrames`), which calls the runtime's
# shared-memory syscalls. Disable for the engine-only, syscall-free view a
# host test or the server side takes.
rt = ["dep:tairix-rt"]

[lints]
workspace = true
