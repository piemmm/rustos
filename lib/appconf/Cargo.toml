[package]
name = "tairix-appconf"
description = "TAIRiX per-app configuration document engine: the one definition of the `key = value` settings format the app-data store serves — its key grammar, quoted/escaped values, typed accessors, fixed fail-closed bounds, and a rewrite that preserves comments, blank lines, key order, and lines it did not understand (`plans/APPDATA.md`, §3 `lib/`)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The two bounds a key and a value cross the app-data channel under
# (`APPDATA_KEY_MAX`, `APPDATA_VALUE_MAX`). They are `abi-v1` wire field
# widths *and* this grammar's own bounds; `lib/abi` may have no dependencies,
# so the one definition lives there and this engine reads it rather than
# keeping a second opinion about how long a key or value may be.
tairix-abi = { path = "../abi", version = "=0.0.0" }

[dev-dependencies]
# The in-tree fuzz harness draws its inputs through the shared seed/budget
# seam: one place picks the per-run seed, logs it, and bounds the smoke/soak
# loop. Test scaffolding only; never in a TAIRiX build.
tairix-fuzzseed = { path = "../../tests/fuzzseed", version = "=0.0.0" }
