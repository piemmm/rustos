[package]
name = "tairix-controls"
description = "TAIRiX shared Reactive Alloy GUI control behaviour: the one orientation-independent scroll geometry engine shared by the window manager's root viewport and application content (§2.2, §6, §17.4 — plans/GUI-CONTROLS-DESIGN.md §11.28)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Shared logical geometry (`Rect`/`Scale`): a drawn control lays its anatomy
# out in logical pixels and converts to physical through the one shared scale.
tairix-geometry = { path = "../geometry", version = "=0.0.0" }
# The shared design tokens (palette roles, control/furniture metrics, motion):
# a control resolves every visible property from the active theme, never a
# hard-coded colour, radius, or timing.
tairix-theme = { path = "../theme", version = "=0.0.0" }
# The single premultiplied-alpha rasteriser: control plates round through the
# shared `Surface::fill_round_rect`, so there is no second rounding path.
tairix-raster = { path = "../raster", version = "=0.0.0" }
# The shared text rasteriser for control labels.
tairix-font = { path = "../font", version = "=0.0.0" }
# The shared vector-icon library for icon-button glyphs and signal marks.
tairix-icon = { path = "../icon", version = "=0.0.0" }
# The shared pointer/keyboard input vocabulary a control's interaction
# consumes; the same events the window manager routes.
tairix-input = { path = "../input", version = "=0.0.0" }
# The one definition of "the secret is gone": a masked field erases its
# buffer through the shared volatile wipe, because a plain `fill(0)` before
# the bytes are freed is a dead store an optimiser may delete outright.
tairix-util = { path = "../util", version = "=0.0.0" }

# The controls' host tests draw text, so they inject the shared solid test
# transport via the `test-util` feature (never a running `fontd`).
[dev-dependencies]
tairix-font = { path = "../font", version = "=0.0.0", features = ["test-util"] }

[features]
# Exposes `testkit`'s shared theme fixtures (e.g. the heavy-contrast theme
# every control's own test suite uses) to another crate's own tests, so a
# host application composing these controls tests against the identical
# fixtures rather than a private copy of its own.
test-support = []

[lints]
workspace = true
