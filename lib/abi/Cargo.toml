[package]
name = "tairix-abi"
description = "Stable TAIRiX user/kernel ABI types (abi-v1)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# A neutral, well-formed `AppInfoHeader` fixture builder for a *consumer's*
# tests (`manifest_header`), so no crate that reads manifests carries its own
# copy of the header's two dozen fields. Test scaffolding; no TAIRiX build
# enables it.
test-util = []

[lints]
workspace = true

[dependencies]

# The interleaving oracle for the PCM ring's release/acquire pair, pulled in
# only when a consumer opts in with `RUSTFLAGS="--cfg loom"` (which is what
# `cargo xtask loom` does). Never a runtime dependency, and never present in
# a TAIRiX build: the shipped crate has none.
[target.'cfg(loom)'.dependencies]
loom = "0.7"

[dev-dependencies]
# The fuzz harness draws its inputs through the shared seed/budget
# seam (`tairix_fuzzseed`): one place picks the per-run seed, logs it at
# the start of the test, and bounds the smoke/soak loop. Test scaffolding only;
# never in a TAIRiX build.
tairix-fuzzseed = { path = "../../tests/fuzzseed", version = "=0.0.0" }
