[package]
name = "rustos-input"
description = "RustOS shared pointer input-event vocabulary (buttons and device events) for the window manager and taskbar (§6, §17.4 — PLAN.md Stage 7)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Shared integer screen geometry (`Point`): a pointer-motion event names an
# absolute screen position, so this crate speaks the same coordinate
# vocabulary the window manager and taskbar already share, lifted to `lib/*`
# so neither GUI crate depends on the other (§17.4, §2.2).
rustos-geometry = { path = "../geometry", version = "=0.0.0" }

[lints]
workspace = true
