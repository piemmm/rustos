[package]
name = "tairix-input"
description = "TAIRiX shared pointer input-event vocabulary (buttons and device events) for the window manager and taskbar (PLAN.md Stage 7)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Shared integer screen geometry (`Point`): a pointer-motion event names an
# absolute screen position, so this crate speaks the same coordinate
# vocabulary the window manager and taskbar already share, lifted to `lib/*`
# so neither GUI crate depends on the other.
tairix-geometry = { path = "../geometry", version = "=0.0.0" }
# `Duration64`, the one in-memory form of a span: the double-click interval a
# press is paired under is the one the desktop publishes in that form.
tairix-abi = { path = "../abi", version = "=0.0.0" }

[lints]
workspace = true
