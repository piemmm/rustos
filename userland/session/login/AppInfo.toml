# Signed-AppInfo manifest source for the `login` service (a service is an
# app; plans/APPS.md deliverable 8). Discovered by the
# build's app-bundle composer and planted under /System/Services/. The
# capability list is the bundle's request: the console pair for the
# prompt, CAP_PROC_SPAWN + CAP_SPAWN_AS_USER for the privileged identity
# transitions (starting the authenticated account's shell under that
# account's kernel-resolved credential, and the graphical login screen
# under the unprivileged greeter account), CAP_USERS_READ to verify
# offered credentials, CAP_IPC_BIND_PRIVILEGED for the two reserved
# rendezvous it serves — elevation and session-v1 — CAP_LOG_EMIT for its
# audit records, CAP_SYSINFO_KERNEL so the full-screen view's status bar
# can show the memory figures (a refusal degrades that one figure to a
# placeholder, never the login), and CAP_FS_ACCESS for read-only
# existence probes: whether the desktop-session and greeter bundles
# exist, which decides if a graphical login is possible at all
# (plans/DISPLAY.md D7d; plans/NEW-DESKTOP-LOGIN.md). Credentials still
# flow only through the gated users_db_read syscall, never the
# filesystem.
id = "os.tairix.login"
name = "login"
version = "0.1.0"
kind = "service"
capabilities = ["CAP_CONSOLE_WRITE", "CAP_CONSOLE_READ", "CAP_PROC_SPAWN", "CAP_USERS_READ", "CAP_SPAWN_AS_USER", "CAP_IPC_BIND_PRIVILEGED", "CAP_LOG_EMIT", "CAP_SYSINFO_KERNEL", "CAP_FS_ACCESS"]
