# Signed-AppInfo manifest source for the `login` service (a service is an
# app, AGENTS.md §16.2; plans/APPS.md deliverable 8). Discovered by the
# build's app-bundle composer and planted under /System/Services/. The
# capability list is the bundle's request: the console pair for the
# prompt, CAP_PROC_SPAWN + CAP_SPAWN_AS_USER for the one privileged
# identity transition (starting the authenticated account's shell under
# that account's kernel-resolved credential), CAP_USERS_READ to verify
# offered credentials, CAP_IPC_BIND_PRIVILEGED for the reserved elevation
# rendezvous, and CAP_LOG_EMIT for its audit records. No CAP_FS_ACCESS.
id = "os.rustos.login"
name = "login"
version = "0.1.0"
kind = "service"
capabilities = ["CAP_CONSOLE_WRITE", "CAP_CONSOLE_READ", "CAP_PROC_SPAWN", "CAP_USERS_READ", "CAP_SPAWN_AS_USER", "CAP_IPC_BIND_PRIVILEGED", "CAP_LOG_EMIT"]
