[package]
name = "rustos-login"
description = "RustOS text login: authenticates against kernel/sec and launches a text or graphical session (Stage 6 — `PLAN.md`)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# The package is both the `rustos-login` policy library (above) and the `Run`
# entry-point binary of the login service installed at
# `/System/Services/login.app/Run` (`AGENTS.md` §16.2, `plans/PI.md` P11) — the
# program PID 1 `init` launches as the per-console session supervisor. The
# binary is a freestanding pure-Rust program on the native Tier-1 targets and
# an inert host stub elsewhere (see `src/run.rs` / `build.rs`).
[[bin]]
name = "rustos-login-run"
path = "src/run.rs"

[dependencies]
# The frozen `abi-v1` surface: login reports terminal and authentication
# failures as the stable `Errno`, so it invents no parallel error set (§2.2).
rustos-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# Capability primitives: an authenticated user carries the capability ceiling
# kernel/sec granted it, handed to the session at launch (§5.2).
rustos-caps = { path = "../../../lib/caps", version = "=0.0.0" }
# Structured audit logging for every security-relevant login decision (§19.4).
rustos-log = { path = "../../../lib/log", version = "=0.0.0" }
# The user-account database: the `/System/Security/Users` format, the
# account identity types, and the timing-equalised password verification
# the `UsersAuthenticator` seam is built on (§5.1).
rustos-users = { path = "../../../lib/users", version = "=0.0.0" }
# The single ANSI/VT terminal-control vocabulary (`AGENTS.md` §2.2): the
# read line discipline's buffer half (`rustos_vt::line`) recognises the same
# erase (rub-out) control the kernel console echo does, from one shared
# definition.
rustos-vt = { path = "../../../lib/vt", version = "=0.0.0" }

# The pure-Rust userland runtime (`AGENTS.md` §1): `rustos-rt` provides the
# `Run` binary's `_start`, stack canary, panic handler, allocator, and
# syscall wrappers (including `users_db_read`). RustOS is Rust-only, so
# login links this runtime, never the C ABI (`AGENTS.md` §16.4). Pulled in
# only for the bare-metal targets the program is actually built for; on the
# host the binary is an inert stub.
[target.'cfg(target_os = "none")'.dependencies]
rustos-rt = { path = "../../../lib/rt", version = "=0.0.0" }
