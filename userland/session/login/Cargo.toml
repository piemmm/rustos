[package]
name = "tairix-login"
description = "TAIRiX text login: authenticates against kernel/sec and launches a text or graphical session (Stage 6 — `PLAN.md`)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# The package is both the `tairix-login` policy library (above) and the `Run`
# entry-point binary of the login service installed at
# `/System/Services/login.app/Run` (`AGENTS.md` §16.2, `plans/PI.md` P11) — the
# program PID 1 `init` launches as the per-console session supervisor. The
# binary is a freestanding pure-Rust program on the native Tier-1 targets and
# an inert host stub elsewhere (see `src/run.rs` / `build.rs`).
[[bin]]
name = "tairix-login-run"
path = "src/run.rs"

[dependencies]
# The frozen `abi-v1` surface: login reports terminal and authentication
# failures as the stable `Errno`, so it invents no parallel error set (§2.2).
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# Capability primitives: an authenticated user carries the capability ceiling
# kernel/sec granted it, handed to the session at launch (§5.2).
tairix-caps = { path = "../../../lib/caps", version = "=0.0.0" }
# Structured audit logging for every security-relevant login decision (§19.4).
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }
# The user-account database: the `/System/Security/Users` format, the
# account identity types, and the timing-equalised password verification
# the `UsersAuthenticator` seam is built on (§5.1).
tairix-users = { path = "../../../lib/users", version = "=0.0.0" }
# The single ANSI/VT terminal-control vocabulary (`AGENTS.md` §2.2): the
# read line discipline's buffer half (`tairix_vt::line`) recognises the same
# erase (rub-out) control the kernel console echo does, from one shared
# definition.
tairix-vt = { path = "../../../lib/vt", version = "=0.0.0" }
# The first-party curses screen model: the full-screen login view draws
# through one Window/Screen definition, never hand-rolled escape sequences.
tairix-curses = { path = "../../../lib/curses", version = "=0.0.0" }
# The compiled-in terminal-capability database: the view builds its Screen
# for the console's terminal type.
tairix-termcap = { path = "../../../lib/termcap", version = "=0.0.0" }
# The one civil-calendar definition: the view's header clock converts the
# wall-clock Time64 through the shared day/date arithmetic.
tairix-fsmeta = { path = "../../../lib/fsmeta", version = "=0.0.0" }
# The one volatile secret erase (`AGENTS.md` §2.2, §4): the offered password,
# the elevation request that carries it, and the user-database image are
# wiped through it. A plain `fill(0)` on a buffer nothing reads again is a
# dead store an optimiser may delete, which would leave the credential in
# memory exactly where the code claims it is gone.
tairix-util = { path = "../../../lib/util", version = "=0.0.0" }

# The pure-Rust userland runtime (`AGENTS.md` §1): `tairix-rt` provides the
# `Run` binary's `_start`, stack canary, panic handler, allocator, and
# syscall wrappers (including `users_db_read`). TAIRiX is Rust-only, so
# login links this runtime, never the C ABI (`AGENTS.md` §16.4). Pulled in
# only for the bare-metal targets the program is actually built for; on the
# host the binary is an inert stub.
[target.'cfg(target_os = "none")'.dependencies]
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0" }
# The one system-configuration store engine (`lib/sysconfig`): the `Run`
# binary re-reads the administrator's `os.loginType` boot default through
# it each round — the same engine the `configure` command writes with, so
# producer and consumer can never diverge. Freestanding-only: the pure
# login library takes the parsed default through `LoginConfig`.
tairix-sysconfig = { path = "../../../lib/sysconfig", version = "=0.0.0" }
# The production System Information transport (`IpcTransport`), enabled
# through `tairix-procinfo`'s own `program` feature: the full-screen view's
# status bars query `sysinfod` for the machine identity, memory figures,
# and the load/task/user censuses.
tairix-procinfo = { path = "../../../lib/procinfo", version = "=0.0.0", features = [
    "program",
] }
# The freestanding `Run` binary also enables the curses library's shared
# standard-streams `Tty` (`StreamTty`), the one channel definition every
# full-screen program links instead of a per-app copy.
tairix-curses = { path = "../../../lib/curses", version = "=0.0.0", features = [
    "program",
] }
