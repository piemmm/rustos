# Signed-AppInfo manifest source for the `fontd` font service (a service is an
# app; plans/FONT-SERVICE.md FS-3). Discovered by the build's app-bundle
# composer and planted under /System/Services/. The capability list is the
# bundle's request and is deliberately minimal, so a compromised parser holds
# almost nothing: CAP_IPC_BIND_PRIVILEGED (to bind the reserved well-known
# FONT_ENDPOINT, so a squatter cannot feed forged glyph coverage to the
# compositor), CAP_FS_ACCESS (the startup scan of the /System/Fonts family
# manifests and the first-use read of each face through the secured VFS —
# which still authorises every path per-inode under the service's attested
# identity, and /System is mounted read-only so this reach can never write),
# and CAP_LOG_EMIT (its audit records). The service requests no spawn and no
# network authority, and the untrusted TrueType parse runs in its own isolated
# address space, so a malformed face can fault only this sandbox.
id = "os.tairix.fontd"
name = "fontd"
version = "0.1.0"
kind = "service"
capabilities = ["CAP_IPC_BIND_PRIVILEGED", "CAP_FS_ACCESS", "CAP_LOG_EMIT"]
