# Signed-AppInfo manifest source for the `fontd` font service (a service is an
# app, AGENTS.md §16.2; plans/FONT-SERVICE.md FS-3). Discovered by the build's
# app-bundle composer and planted under /System/Services/. The capability list
# is the bundle's request and is deliberately minimal (§19.5, §5.2): only
# CAP_IPC_BIND_PRIVILEGED (to bind the reserved well-known FONT_ENDPOINT, so a
# squatter cannot feed forged glyph coverage to the compositor) and
# CAP_LOG_EMIT (its audit records). Reading the world-readable /System/Fonts
# faces at startup is mode-gated (§5.3), not a held capability; the service
# requests no spawn, no network, and no filesystem *write* authority, so a
# malformed face can fault only this sandbox.
id = "os.tairix.fontd"
name = "fontd"
version = "0.1.0"
kind = "service"
capabilities = ["CAP_IPC_BIND_PRIVILEGED", "CAP_LOG_EMIT"]
