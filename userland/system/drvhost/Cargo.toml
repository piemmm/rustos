[package]
name = "rustos-drvhost"
description = "RustOS userland driver host: loads, verifies, and lifecycles signed `.rxe` driver modules with capability enforcement (Stage 4 — `AGENTS.md` §8)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
rustos-abi = { path = "../../../lib/abi", version = "=0.0.0" }
rustos-caps = { path = "../../../lib/caps", version = "=0.0.0" }
rustos-crypto = { path = "../../../lib/crypto", version = "=0.0.0" }
rustos-log = { path = "../../../lib/log", version = "=0.0.0" }

[dev-dependencies]
# Pinned to match the version `lib/crypto` audits. The dev-dependency
# is used **only** by the integration-test fixtures under `tests/` to
# sign synthetic `.rxe` manifests with a known keypair; production
# code in this crate never names `ed25519-dalek` directly.
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["zeroize"] }
# The Stage 4.D Item 0-tail integration tests cover the new
# `VirtioHostFactory` seam in `HostConfig`. The bus-agnostic
# `MockHost` (from `lib/virtio`) mints a concrete `dyn VirtioHost`
# *without* pulling in `kernel/mem` or `kernel/sec` or any driver
# crate; production builds wire a `KernelVirtioHost`-backed factory of
# their own. Depending on `lib/virtio` keeps this crate's test deps on
# `lib/*` only (`AGENTS.md` §17.4).
rustos-virtio = { path = "../../../lib/virtio", version = "=0.0.0" }
