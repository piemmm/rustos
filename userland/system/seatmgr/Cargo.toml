[package]
name = "rustos-seatmgr"
description = "RustOS seat-manager service: the sole CAP_SEAT_ADMIN holder, serving capability-gated seat switch/revoke requests (`plans/DISPLAY.md` D3)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# The `Run` binary's freestanding userland runtime (`rustos-rt`) is an
# optional, on-by-default build feature, mirroring `rustos-sysinfod`. `cargo
# build -p rustos-seatmgr` builds the service program with it; host tooling
# builds only the dispatcher *library* (`serve` + `SeatAdmin`), so the host
# test build never pulls the userland runtime's `_start` /
# `#[global_allocator]` / `panic_impl`.
[features]
default = ["program"]
program = ["dep:rustos-rt"]

# The package is both the `rustos-seatmgr` dispatcher library (above) and the
# `Run` entry-point binary of the seat-manager service installed at
# /System/Services/seatmgr.app/Run (`AGENTS.md` §16.2; `plans/DISPLAY.md` D3)
# — the long-running user-space service PID 1 `init` launches to hold the
# seat-multiplexing authority. The binary is a freestanding pure-Rust program
# on the native Tier-1 targets and an inert host stub elsewhere (see
# `src/run.rs`).
[[bin]]
name = "rustos-seatmgr-run"
path = "src/run.rs"

[dependencies]
# The seat-manager wire surface (`SeatAdminRequest`, the reserved
# `SEATMGR_ENDPOINT`), the `Errno` table, the `CapabilityId` registry, and
# the attested `Origin` the dispatcher gates on.
rustos-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# §19.4 structured audit log: every applied operation, every refusal, and
# every malformed request is recorded through a `rustos_log::Sink`.
rustos-log = { path = "../../../lib/log", version = "=0.0.0" }

# The `Run` binary's freestanding userland runtime (`AGENTS.md` §1):
# `rustos-rt` provides `_start`, the stack canary, the panic handler, the
# `#[global_allocator]`, and the syscall wrappers (`call_create`/`call_recv`/
# `call_reply`/`call_peer_origin`/`seat_switch`/`seat_revoke`), plus the
# `CapabilitySet` primitive the endpoint bind names. Both are pulled in only
# for the bare-metal targets the program is actually built for; on the host
# the binary is an inert stub and neither is linked.
[target.'cfg(target_os = "none")'.dependencies]
rustos-rt = { path = "../../../lib/rt", version = "=0.0.0", optional = true }
rustos-caps = { path = "../../../lib/caps", version = "=0.0.0" }
