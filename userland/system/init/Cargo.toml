[package]
name = "tairix-init"
description = "TAIRiX PID 1: the service manager that brings up the system in dependency order, grants each service the intersection of its manifest request and the system authority, and reaps exited children (Stage 6 — `AGENTS.md` §5.2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# The package is both the `tairix-init` orchestrator library (above) and the
# `Run` entry-point binary of the `init` application bundle (`AGENTS.md` §16.5).
# The binary is a freestanding C-ABI program on the native Tier-1 targets and
# an inert host stub elsewhere (see `src/run.rs` / `build.rs`, `plans/PI.md` P6b).
[[bin]]
name = "tairix-init-run"
path = "src/run.rs"

[dependencies]
# The frozen `abi-v1` surface: the `ManifestHeader` + `decode_capability_ids`
# pair init uses to turn a service's signed manifest into a requested
# capability set, the `CapabilityId` registry, and the `Errno` table.
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# `CapabilitySet` and its intersection/subset algebra — the one place the
# delegation invariant lives, so init never re-implements it (§2.2, §5.2).
tairix-caps = { path = "../../../lib/caps", version = "=0.0.0" }
# §19.4 structured audit log: every start, denial, skip, exit, and reaped
# orphan is recorded through a `tairix_log::Sink`.
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }
# The compiled-in system identity (`plans/USERS.md`): the startup-config
# parser resolves each `service`/`session` directive's account name onto
# its uid through `tairix_users::system_account_uid` at parse time, so
# every boot service is spawned as its own service account.
tairix-users = { path = "../../../lib/users", version = "=0.0.0" }
# The one `#`-comment line grammar every line-oriented configuration store
# in the tree shares: the service registry and the startup list tokenise
# their documents exactly as `lib/sysconfig` and `lib/netconfig` do.
tairix-util = { path = "../../../lib/util", version = "=0.0.0" }

# The pure-Rust userland runtime (`AGENTS.md` §1): `tairix-rt` provides the
# `Run` binary's `_start`, stack canary, panic handler, and syscall wrappers.
# TAIRiX is Rust-only, so `init` links this runtime, never the C ABI
# (`crt0` + `abi-sys`), which exists solely for non-Rust programs
# (`AGENTS.md` §16.4). Pulled in only for the bare-metal targets the program
# is actually built for; on the host the binary is an inert stub.
[target.'cfg(target_os = "none")'.dependencies]
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0" }
