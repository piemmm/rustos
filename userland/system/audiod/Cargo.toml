[package]
name = "tairix-audiod"
description = "TAIRiX audio service (plans/SOUND.md SND4): the one mixer and router, sole holder of CAP_AUDIO_DEVICE, serving `audio-v1` to programs and driving every audio driver over `audiochan-v1`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# The `Run` binary's freestanding userland runtime (`tairix-rt`) is an
# optional, on-by-default build feature, mirroring `tairix-timed`. Host
# tooling builds only the engine *library*, so the host test build never
# pulls the userland runtime's `_start` / `#[global_allocator]` /
# `panic_impl`.
[features]
default = ["program"]
program = ["dep:tairix-rt", "dep:tairix-caps"]

# The package is both the `tairix-audiod` engine library (the host-testable
# mixer/router over injected region, channel, clock and audit seams) and the
# `Run` entry-point binary of the audio service installed at
# `/System/Services/audiod.app/Run`.
[[bin]]
name = "tairix-audiod-run"
path = "src/run.rs"

[dependencies]
# `audio-v1`, `audiochan-v1`, the PCM ring and vocabulary, and the `Errno`
# table every refusal fails closed with.
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The engine: conversion, the mixer, the one resampler, channel matrices, the
# device clock model, routing policy and the volume model. This service is
# its driver; it owns no sample arithmetic of its own.
tairix-audio = { path = "../../../lib/audio", version = "=0.0.0" }
# The seat vocabulary the routing policy arbitrates a sink's lease over.
tairix-seat = { path = "../../../lib/seat", version = "=0.0.0" }
# The structured audit records every capture grant and refusal, device bind
# and loss, and default-device change is written through.
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }
# Fallible allocation: every buffer this service reserves is sized at
# stream-open or device-configure and must fail as a value, never abort.
tairix-util = { path = "../../../lib/util", version = "=0.0.0" }

# Everything the freestanding `Run` program links is pulled in only for the
# bare-metal targets the binary is actually built for; on the host the binary
# is an inert stub and only the engine library compiles.
# The driver side of the same device-channel contract, used only by the host
# tests: they drive the real `AudioChannelServer` over an in-process device so
# the service is exercised against the production driver half rather than a
# second, agreeing mock.
[dev-dependencies]
tairix-audiochan = { path = "../../../lib/audiochan", version = "=0.0.0" }

[target.'cfg(target_os = "none")'.dependencies]
# The pure-Rust userland runtime: `_start`, the panic handler, the allocator,
# and the `shm_*` / `ipc_*` / `waitset_*` / `port_bind` surface the service's
# region host and transports are built over.
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0", optional = true }
# The capability-set type the reserved-endpoint bind is spelled over.
tairix-caps = { path = "../../../lib/caps", version = "=0.0.0", optional = true }
