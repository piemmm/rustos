[package]
name = "tairix-wintersun-figure"
description = "WinterSun's figure engine (plans/FIGURE.md FG2-FG6): the rig and its skinned meshes, the one body frame that serves every heading, clips and the motion layers over them, the measurements the art is gated on, and the validated record a character is built from - species, build, features and palette. no_std, no allocator, forbids unsafe."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The six outline primitives a part is drawn as, the one colour vocabulary,
# and the `Placed` the scan converter fills. A rig places shapes; it does not
# own a second outline or blend path.
tairix-raster = { path = "../../../../lib/raster", version = "=0.0.0" }
# `Facing` is the heading the simulation already speaks. A figure deriving its
# own sense of which way round the world is would be a defect no single crate
# could see.
tairix-wintersun-net = { path = "../net", version = "=0.0.0" }
# The `no_std` transcendentals the basis composition and the screen turn need,
# shared so a rig rotates identically to everything else that rotates.
tairix-util = { path = "../../../../lib/util", version = "=0.0.0" }
# Bounded storage for joints, parts and placed output, so the whole figure
# path touches no allocator.
tairix-inline = { path = "../../../../lib/inline", version = "=0.0.0" }
# The one non-cryptographic hasher the cross-target digests fold through, so
# the figure's claim is made the same way the world's and the simulation's
# are rather than through a second mixer.
tairix-hash = { path = "../../../../lib/hash", version = "=0.0.0" }

[dev-dependencies]
# The record decoder's fuzz harness draws its inputs through the shared
# seed/budget seam: one place picks the per-run seed, logs it at the start of
# the test, and bounds the smoke/soak loop. Test scaffolding only; never in a
# TAIRiX build.
tairix-fuzzseed = { path = "../../../../tests/fuzzseed", version = "=0.0.0" }
