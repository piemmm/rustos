# Signed-AppInfo manifest source for `discoveryd`, the link-local service
# discovery service (plans/ZEROCONF.md). Discovered by the build's app-bundle
# composer and planted under /System/Services/; nothing enrols it yet, so it is
# installed but never started until a client of it exists.
#
# The capability list is the bundle's request and is deliberately minimal:
# CAP_NET (the two multicast DNS datagram sockets and their group
# memberships), CAP_SANDBOX_SPAWN (every datagram is parsed in a
# capability-empty worker, never in the process holding the sockets), and
# CAP_LOG_EMIT (its audit records).
#
# It binds no endpoint, holds no filesystem authority, no general spawn, no
# CAP_NET_RAW and no CAP_NET_ADMIN. Compromising it yields two ordinary
# datagram sockets — and the parsing that could compromise it is not in it.
id = "os.tairix.discoveryd"
name = "discoveryd"
title = "Discovery"
version = "0.1.0"
kind = "service"
capabilities = ["CAP_NET", "CAP_SANDBOX_SPAWN", "CAP_LOG_EMIT"]
