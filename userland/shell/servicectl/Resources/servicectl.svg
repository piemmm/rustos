<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>Service control</title>
  <!-- A cog for "service", a power symbol for "start and stop it". The cog is
       a solid silhouette and the power symbol an annular *sector* traced
       outer-arc-forward then inner-arc-back, so no shape needs a hole: the
       desktop's SVG subset fills one flat ring per element. -->

  <!-- Cog body -->
  <polygon fill="#4A5A72" points="107.9,17.8 148.1,17.8 145.7,45.9 173.6,57.4 191.7,35.9 220.1,64.3 198.6,82.4 210.1,110.3 238.2,107.9 238.2,148.1 210.1,145.7 198.6,173.6 220.1,191.7 191.7,220.1 173.6,198.6 145.7,210.1 148.1,238.2 107.9,238.2 110.3,210.1 82.4,198.6 64.3,220.1 35.9,191.7 57.4,173.6 45.9,145.7 17.8,148.1 17.8,107.9 45.9,110.3 57.4,82.4 35.9,64.3 64.3,35.9 82.4,57.4 110.3,45.9"/>

  <!-- Inner face the power symbol sits on, lighter so the glyph reads at a
       taskbar's pixel size rather than merging into the teeth. -->
  <circle cx="128" cy="128" r="74" fill="#5C6E8A"/>

  <!-- Power symbol -->
  <polygon fill="#7FC4FF" points="154.0,83.0 158.7,86.1 163.1,89.7 167.1,93.7 170.6,98.2 173.6,103.0 176.0,108.1 177.9,113.4 179.2,119.0 179.9,124.6 180.0,130.3 179.4,135.9 178.2,141.5 176.5,146.8 174.1,152.0 171.2,156.9 167.8,161.4 164.0,165.6 159.7,169.3 155.0,172.5 150.0,175.1 144.7,177.2 139.3,178.8 133.7,179.7 128.0,180.0 122.3,179.7 116.7,178.8 111.3,177.2 106.0,175.1 101.0,172.5 96.3,169.3 92.0,165.6 88.2,161.4 84.8,156.9 81.9,152.0 79.5,146.8 77.8,141.5 76.6,135.9 76.0,130.3 76.1,124.6 76.8,119.0 78.1,113.4 80.0,108.1 82.4,103.0 85.4,98.2 88.9,93.7 92.9,89.7 97.3,86.1 102.0,83.0 111.0,98.6 107.9,100.6 105.0,102.9 102.4,105.6 100.1,108.5 98.2,111.6 96.6,115.0 95.4,118.5 94.5,122.1 94.1,125.8 94.0,129.5 94.4,133.2 95.2,136.8 96.3,140.3 97.8,143.7 99.7,146.9 102.0,149.9 104.5,152.6 107.3,155.0 110.4,157.1 113.6,158.8 117.1,160.2 120.6,161.2 124.3,161.8 128.0,162.0 131.7,161.8 135.4,161.2 138.9,160.2 142.4,158.8 145.6,157.1 148.7,155.0 151.5,152.6 154.0,149.9 156.3,146.9 158.2,143.7 159.7,140.3 160.8,136.8 161.6,133.2 162.0,129.5 161.9,125.8 161.5,122.1 160.6,118.5 159.4,115.0 157.8,111.6 155.9,108.5 153.6,105.6 151.0,102.9 148.1,100.6 145.0,98.6"/>
