# Signed-AppInfo manifest source for the `sysinfo` command app
# (plans/APPS.md deliverable 8). Discovered by the build's app-bundle
# composer; the capability list is the bundle's request, intersected with
# the launching user's grants. CAP_CONSOLE_WRITE for the rendered results
# on fd 1; per-query authority stays with sysinfod and the caller's
# attested origin. CAP_FS_ACCESS because the short-help switches read the
# bundle's own Help/ tree through the secured VFS, which still authorises
# every path per-inode under the caller's attested identity.
id = "os.rustos.sysinfo"
name = "sysinfo"
version = "0.1.0"
kind = "command"
capabilities = ["CAP_CONSOLE_WRITE", "CAP_FS_ACCESS"]
