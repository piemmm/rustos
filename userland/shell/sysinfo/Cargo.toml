[package]
name = "rustos-sysinfo"
description = "RustOS `sysinfo` CLI: the terminal client of the System Information API (§16.6 — `PLAN.md` Stage 6)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# The `Run` binary's freestanding userland runtime (`rustos-rt`) is an
# optional, on-by-default build feature, mirroring `rustos-sysinfod`. `cargo
# build -p rustos-sysinfo` builds the tool program with it; host tooling builds
# only the request/render *library*, so the host test build never pulls the
# userland runtime's `_start` / `#[global_allocator]` / panic handler.
[features]
default = ["program"]
program = ["dep:rustos-rt"]

# The package is both the `rustos-sysinfo` request/render library (below) and
# the `Run` entry-point binary of the `sysinfo` tool. The binary is a
# freestanding pure-Rust program on the native Tier-1 targets and an inert host
# stub elsewhere (see `src/run.rs`).
[[bin]]
name = "rustos-sysinfo-run"
path = "src/run.rs"

[dependencies]
# The frozen `sysinfo-v1` wire surface plus the stable `Errno`: the CLI
# builds the typed request and decodes the typed response through these
# ABI types and invents no parallel format or error set (§2.2, §16.6).
rustos-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The shared System Information API client helpers: the request/response
# seams, the capability-aware call mapping, and the process-list paging +
# render shared with `ps`. The CLI consumes these rather than duplicating
# them (§2.2, §16.6).
rustos-procinfo = { path = "../../../lib/procinfo", version = "=0.0.0" }
# The one help engine: locale fallback, the bounded structured-Markdown
# parser, and the shared own-bundle short-help render the `-h`/`-?`
# switches use (plans/APPS.md §4, §6).
rustos-help = { path = "../../../lib/help", version = "=0.0.0" }

# For the freestanding `Run` binary only: the userland runtime `rustos-rt`
# (`_start`, canary, panic handler, `mem_map` allocator, syscall/`ipc_call`
# wrappers) and the production client seams in `lib/procinfo` (`IpcTransport`,
# `RtOutput`, `args`, `write_stderr_line`), enabled through `rustos-procinfo`'s
# own `program` feature. Both are pulled in only for the bare-metal targets the
# program is actually built for; on the host neither is linked.
[target.'cfg(target_os = "none")'.dependencies]
rustos-rt = { path = "../../../lib/rt", version = "=0.0.0", optional = true }
rustos-procinfo = { path = "../../../lib/procinfo", version = "=0.0.0", features = ["program"] }
# The freestanding `Run` binary also enables the help engine's syscall-backed
# own-bundle `HelpSource` (`BundleHelp`), shared by every command app.
rustos-help = { path = "../../../lib/help", version = "=0.0.0", features = ["rt"] }
