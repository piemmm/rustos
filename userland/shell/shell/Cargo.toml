[package]
name = "rustos-shell"
description = "RustOS default shell: a POSIX-ish command interpreter with quoting, variable expansion, pipelines, redirections, sequencing, and job control (Stage 6 — `PLAN.md`)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# The package is both the `rustos-shell` interpreter library (above) and the
# `Run` entry-point binary of the `Shell` application bundle (`AGENTS.md`
# §16.5) — the program PID 1 `init` launches as the user's session
# (`plans/SPAWN.md` SP3b / `plans/PI.md` P6e). The binary is a freestanding
# pure-Rust program on the native Tier-1 targets and an inert host stub
# elsewhere (see `src/run.rs` / `build.rs`); wiring the interpreter library
# into it (a real REPL over the console) is `plans/PI.md` P6e.
[[bin]]
name = "rustos-shell-run"
path = "src/run.rs"

[dependencies]
# The frozen `abi-v1` surface. The shell's process-host seam reports failures
# as the stable `Errno`, so the same error vocabulary the kernel returns
# flows back to the user verbatim — the shell invents no parallel error set
# (§2.2).
rustos-abi = { path = "../../../lib/abi", version = "=0.0.0" }

# The pure-Rust userland runtime (`AGENTS.md` §1): `rustos-rt` provides the
# `Run` binary's `_start`, stack canary, panic handler, and syscall wrappers.
# RustOS is Rust-only, so the shell links this runtime, never the C ABI
# (`AGENTS.md` §16.4). Pulled in only for the bare-metal targets the program
# is actually built for; on the host the binary is an inert stub.
[target.'cfg(target_os = "none")'.dependencies]
rustos-rt = { path = "../../../lib/rt", version = "=0.0.0" }
