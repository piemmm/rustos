[package]
name = "rustos-users-cli"
description = "RustOS `users` CLI: the interactive account-administration tool over the `users_admin` syscall (`plans/CAPABILITY_USE.md` CU4)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# The `Run` binary's freestanding userland runtime (`rustos-rt`) is an
# optional, on-by-default build feature, mirroring `rustos-sysinfo`. `cargo
# build -p rustos-users-cli` builds the tool program with it; host tooling
# builds only the interactive-session *library*, so the host test build never
# pulls the userland runtime's `_start` / `#[global_allocator]` / panic
# handler.
[features]
default = ["program"]
program = ["dep:rustos-rt"]

# The package is both the `rustos-users-cli` session library (below) and the
# `Run` entry-point binary of the `users` tool. The binary is a freestanding
# pure-Rust program on the native Tier-1 targets and an inert host stub
# elsewhere (see `src/run.rs`).
[[bin]]
name = "rustos-users-cli-run"
path = "src/run.rs"

[dependencies]
# The typed `users_admin` request/response wire surface plus the stable
# `Errno` and capability vocabulary: the CLI encodes every operation through
# these ABI types and invents no parallel format or error set.
rustos-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The account-record policy the CLI shares with the kernel and the image
# builder: the session-baseline grant set a created account starts from, the
# PBKDF2 password-record builder (so plaintext never crosses the syscall),
# and the field bounds it pre-validates against.
rustos-users = { path = "../../../lib/users", version = "=0.0.0" }

# For the freestanding `Run` binary only: the userland runtime `rustos-rt`
# (`_start`, canary, panic handler, `mem_map` allocator, syscall wrappers).
# Pulled in only for the bare-metal targets the program is actually built
# for; on the host it is never linked.
[target.'cfg(target_os = "none")'.dependencies]
rustos-rt = { path = "../../../lib/rt", version = "=0.0.0", optional = true }
