[package]
name = "tairix-mdadm"
description = "TAIRiX `mdadm` CLI: inspect and administer RAID arrays (`plans/FIX-IO.md` IO6)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# The `Run` binary's freestanding userland runtime (`tairix-rt`) is an
# optional, on-by-default build feature, mirroring `tairix-lspci`. `cargo build
# -p tairix-mdadm` builds the tool program with it; host tooling builds only
# the pure *library*, so the host test build never pulls the userland
# runtime's `_start` / `#[global_allocator]` / panic handler.
[features]
default = ["program"]
program = ["dep:tairix-rt"]

# The package is both the `tairix-mdadm` library (the pure parse + resolve +
# render engine below) and the `Run` entry-point binary of the `mdadm` tool.
# The binary is a freestanding pure-Rust program on the native Tier-1 targets
# and an inert host stub elsewhere (see `src/run.rs`).
[[bin]]
name = "tairix-mdadm-run"
path = "src/run.rs"

[dependencies]
# The audited ABI vocabulary: the RAID array/member records and the
# array-control protocol (`raid_admin`), the shared level/health types
# (`raid`), the status/create reply decoders (`reply`), the capability ids,
# and `Errno`.
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The one help engine: locale fallback, the bounded structured-Markdown
# parser, and the shared own-bundle short-help render the `-h`/`-?`/`--help`
# switches use (plans/APPS.md).
tairix-help = { path = "../../../lib/help", version = "=0.0.0" }

# For the freestanding `Run` binary only: the userland runtime `tairix-rt`
# (`_start`, canary, panic handler, `mem_map` allocator, the standard-stream
# I/O, and the `ipc_call` array-control transport). Pulled in only for the
# bare-metal targets the program is actually built for; on the host it is not
# linked.
[target.'cfg(target_os = "none")'.dependencies]
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0", optional = true }
# The freestanding `Run` binary also enables the help engine's syscall-backed
# own-bundle `HelpSource` (`BundleHelp`) and the shared System Information
# client (`raid_arrays` / `raid_members`), enabled through its `program`
# feature exactly as `lspci` does.
tairix-help = { path = "../../../lib/help", version = "=0.0.0", features = ["rt"] }
tairix-procinfo = { path = "../../../lib/procinfo", version = "=0.0.0", features = ["program"] }
