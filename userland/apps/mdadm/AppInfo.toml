# Signed-AppInfo manifest source for the `mdadm` command app
# (plans/FIX-IO.md IO6). Discovered by the build's app-bundle composer; the
# capability list is the bundle's request, intersected with the launching
# user's grants. CAP_CONSOLE_WRITE covers the inherited standard
# output/error streams; CAP_FS_ACCESS reads the tool's own bundle payload
# (its Help/ documents) through the secured VFS; CAP_SYSINFO_HW gates the
# array/member reads (the composer enforces the same bar the hardware tree
# is read under); CAP_STORAGE_ADMIN gates the create/add/remove/stop
# mutations, which overwrite disks and change what a mounted filesystem is
# made of. The composer attests the caller kernel-side and refuses without
# the capability; the tool never checks authority for it, it reports the
# refusal. It reads no standard input.
id = "os.tairix.mdadm"
name = "mdadm"
version = "0.1.0"
kind = "command"
capabilities = ["CAP_CONSOLE_WRITE", "CAP_FS_ACCESS", "CAP_SYSINFO_HW", "CAP_STORAGE_ADMIN"]
# This bundle's own 256x256 icon master in its Resources/ (plans/ICONS.md).
library-icon = "mdadm.png"
