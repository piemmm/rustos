# Signed-AppInfo manifest source for the `stat` command app
# (plans/APPS.md §12.1 Stage F). Discovered by the build's app-bundle
# composer; the capability list is the bundle's request, intersected with
# the launching user's grants. CAP_CONSOLE_WRITE covers the report (and the
# short help) written to the inherited standard output; CAP_FS_ACCESS covers
# the `fs_stat`/`fs_readlink`/`fs_realpath` reads of each operand and the
# short-help read of the bundle's own Help/ documents, both through the
# secured VFS. The mount snapshot and the user directory are the ungated
# System Information queries `df` and `whoami` read, so neither adds a
# capability. It reads no input, so it requests no CAP_CONSOLE_READ.
id = "os.tairix.stat"
name = "stat"
version = "0.1.0"
kind = "command"
capabilities = ["CAP_CONSOLE_WRITE", "CAP_FS_ACCESS"]
# This bundle's own icon master in its Resources/ (plans/ICONS.md).
library-icon = "stat.svg"
