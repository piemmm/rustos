# Signed-AppInfo manifest source for the `ps` command app
# (plans/APPS.md deliverable 8). Discovered by the build's app-bundle
# composer; the capability list is the bundle's request, intersected with
# the launching user's grants. CAP_CONSOLE_WRITE for the listing on fd 1
# (diagnostics fd 2); per-query authority is enforced by sysinfod against
# this process's kernel-attested origin. CAP_FS_ACCESS because the
# short-help switches read the bundle's own Help/ tree through the secured
# VFS, which still authorises every path per-inode under the caller's
# attested identity.
id = "os.rustos.ps"
name = "ps"
version = "0.1.0"
kind = "command"
capabilities = ["CAP_CONSOLE_WRITE", "CAP_FS_ACCESS"]
