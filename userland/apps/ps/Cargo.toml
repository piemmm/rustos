[package]
name = "tairix-ps"
description = "TAIRiX `ps` CLI: list processes via the System Information API (§3 `userland/apps/` — `PLAN.md` Stage 6)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# The `Run` binary's freestanding userland runtime (`tairix-rt`) is an
# optional, on-by-default build feature, mirroring `tairix-sysinfod`. `cargo
# build -p tairix-ps` builds the tool program with it; host tooling builds only
# the request/render *library*, so the host test build never pulls the userland
# runtime's `_start` / `#[global_allocator]` / panic handler.
[features]
default = ["program"]
program = ["dep:tairix-rt"]

# The package is both the `tairix-ps` request/render library (below) and the
# `Run` entry-point binary of the `ps` tool. The binary is a freestanding
# pure-Rust program on the native Tier-1 targets and an inert host stub
# elsewhere (see `src/run.rs`).
[[bin]]
name = "tairix-ps-run"
path = "src/run.rs"

[dependencies]
# The frozen `Errno` plus the `sysinfo-v1` query ids the tool issues; `ps`
# invents no parallel error set (§2.2) and never links a kernel or driver
# crate (§17.4).
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The shared System Information API client helpers: the request/response
# seams, the capability-aware call mapping, and the process-list paging +
# render shared with the `sysinfo` CLI. `ps` consumes these rather than
# duplicating them (§2.2, §16.6).
tairix-procinfo = { path = "../../../lib/procinfo", version = "=0.0.0" }
# The one help engine: locale fallback, the bounded structured-Markdown
# parser, and the shared own-bundle short-help render the `-h`/`-?`
# switches use (plans/APPS.md §4, §6).
tairix-help = { path = "../../../lib/help", version = "=0.0.0" }

# For the freestanding `Run` binary only: the userland runtime `tairix-rt`
# (`_start`, canary, panic handler, `mem_map` allocator, syscall/`ipc_call`
# wrappers) and the production client seams in `lib/procinfo` (`IpcTransport`,
# `RtOutput`, `args`, `write_stderr_line`), enabled through `tairix-procinfo`'s
# own `program` feature. Both are pulled in only for the bare-metal targets the
# program is actually built for; on the host neither is linked.
[target.'cfg(target_os = "none")'.dependencies]
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0", optional = true }
tairix-procinfo = { path = "../../../lib/procinfo", version = "=0.0.0", features = ["program"] }
# The freestanding `Run` binary also enables the help engine's syscall-backed
# own-bundle `HelpSource` (`BundleHelp`), shared by every command app.
tairix-help = { path = "../../../lib/help", version = "=0.0.0", features = ["rt"] }
