[package]
name = "tairix-wallpaper-chooser"
description = "TAIRiX wallpaper chooser (wallpaper.app): the graphical application that edits the desktop pinboard settings and asks the desktop session to adopt them (plans/PINBOARD.md P9)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The frozen `Errno`, the `NamedKeyCode`/`KeyValue` keyboard vocabulary, and
# the pinboard-apply IPC types the chooser encodes its request with.
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The single shared theme definition: the chooser takes its colours from
# the active theme so it stays consistent with the desktop.
tairix-theme = { path = "../../../lib/theme", version = "=0.0.0" }
# Shared software rasteriser (`Surface`) — the same premultiplied-alpha
# primitives the window manager paints with.
tairix-raster = { path = "../../../lib/raster", version = "=0.0.0" }
# Shared text rasterisation: the built-in monospace face and glyph blitter
# every label and status line is drawn with.
tairix-font = { path = "../../../lib/font", version = "=0.0.0" }
# Integer screen geometry (`Rect`, `Scale`): the one shared coordinate type
# every layout and hit-test in the desktop agrees on.
tairix-geometry = { path = "../../../lib/geometry", version = "=0.0.0" }
# The Reactive Alloy control family the chooser is built from: `ComboBox`
# for the four settings fields, `Button` for Apply/Close, `ScrollBar` for
# the gallery, and `IconTile` for its tiles — no new control family is
# defined here.
tairix-controls = { path = "../../../lib/controls", version = "=0.0.0" }
# The shared pointer input-event vocabulary every control consumes; the
# `Run` binary translates the window channel's wire events into it through
# the one shared translation `lib/window` owns.
tairix-input = { path = "../../../lib/input", version = "=0.0.0" }
# The desktop's icon vocabulary: the kind a gallery tile falls back to when
# a candidate has no artwork to draw.
tairix-icon = { path = "../../../lib/icon", version = "=0.0.0" }
# The one icon-grid geometry every icon view in the desktop shares — the
# gallery's wrapping, spread, hit-test and scroll range — and the one
# directory-listing decode the `Run` binary reads the wallpaper store with.
tairix-browse = { path = "../../../lib/browse", version = "=0.0.0" }
# The single definition of the pinboard settings document, the shipped
# wallpaper catalog's bounded listing model, and the wallpaper-placement
# fit geometry — the chooser never carries a second copy of any of it.
tairix-wallpaper = { path = "../../../lib/wallpaper", version = "=0.0.0" }

# The package is both the chooser's host-tested engine (above — the
# candidate model, the layout, and the themed renderers) and the `Run`
# entry-point binary of the on-disk `wallpaper.app` bundle. The binary is
# a freestanding pure-Rust program on the native Tier-1 targets and an
# inert host stub elsewhere (see `src/run.rs` / `build.rs`).
[[bin]]
name = "tairix-wallpaper-chooser-run"
path = "src/run.rs"

# Everything only the freestanding `Run` binary links is pulled in for the
# bare-metal targets it is actually built for; on the host the binary is an
# inert stub with no extra dependencies.
[target.'cfg(target_os = "none")'.dependencies]
# The app half of the window channel: `WindowClient` (create / present /
# close) and `WindowEvents` (the typed, parked event wait).
tairix-window = { path = "../../../lib/window", version = "=0.0.0" }
# The pure-Rust userland runtime: `_start`, the stack canary, the panic
# handler, the allocator, and the syscall wrappers (`shm_create` /
# `shm_grant`, `port_bind` / `ipc_recv`, `ipc_call`, `waitset_*`,
# `fs_read`/`fs_close`, `proc_spawn`).
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0" }
# The chooser's own parser-sandbox worker: it decodes no wallpaper bytes in
# its own address space, so every thumbnail is rendered by a restricted
# spawn of this same binary in its worker role, mirroring how the file
# manager sandboxes its icon rasterisation.
tairix-sandbox = { path = "../../../lib/sandbox", version = "=0.0.0", features = [
    "program",
] }
# On the real target the `Run` binary composites glyphs through the
# sandboxed font service over the runtime `ipc_call` transport (the base
# dependency stays host-neutral so host tests inject the mock transport
# instead).
tairix-font = { path = "../../../lib/font", version = "=0.0.0", features = ["rt"] }

# The engine's host tests draw text, so they inject the shared solid test
# transport via the `test-util` feature (never a running `fontd`).
[dev-dependencies]
tairix-font = { path = "../../../lib/font", version = "=0.0.0", features = ["test-util"] }

[lints]
workspace = true
