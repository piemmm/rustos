[package]
name = "tairix-getcap"
description = "TAIRiX `getcap` CLI: report a file's required-capability gate (§3 `userland/apps/` — `PLAN.md` Stage 6)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# `getcap` reads the §5.3 per-inode capability gate through an injected
# filesystem seam that speaks the frozen `Errno` and `CapabilityId`, so it
# invents no parallel error set (§2.2) and never links a kernel or driver
# crate (§17.4).
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The one path-spelling grammar: `join` places a child inside a directory,
# so this tool carries no second path parser.
tairix-path = { path = "../../../lib/path", version = "=0.0.0" }
