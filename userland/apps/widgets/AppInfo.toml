# Signed-AppInfo manifest source for the `widgets` desktop widget gallery
# (plans/GUI-CONTROLS-DESIGN.md). Discovered by the build's app-bundle
# composer, which cross-compiles Run, signs the manifest, and plants the
# bundle on the read-only /System/Applications store; the desktop session's
# start menu spawns it (and the shell resolves it by name, like any program
# in either system store).
#
# The capability list is the bundle's request, kept to the minimum the demo
# needs: CAP_CONSOLE_WRITE for its fail-loud stderr diagnostics, and CAP_SHM
# to create and grant the zero-copy window frame region the desktop session
# maps. The gallery reads no filesystem, spawns nothing, and needs no
# ambient authority — every widget it shows commits its typed action back
# into the demo itself, never a privileged service. The launched process
# receives this set intersected with the launching user's grants, never
# more.
id = "os.tairix.widgets"
name = "widgets"
version = "0.1.0"
kind = "application"
capabilities = ["CAP_CONSOLE_WRITE", "CAP_SHM"]
# The Reactive Alloy control gallery is a windowed development aid: list
# it in the desktop's program library under the development folder
# (plans/NEW-TASKBAR.md T3).
library = "Programming"
# This bundle's own 256x256 icon master in its Resources/ (plans/ICONS.md).
library-icon = "widgets.png"
