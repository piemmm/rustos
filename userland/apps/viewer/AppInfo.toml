# Signed-AppInfo manifest source for the `viewer` windowed file viewer
# (plans/APPWIN.md AW5). Discovered by the build's app-bundle composer,
# which cross-compiles Run, signs the manifest, and plants the bundle on
# the read-only /System/Apps store; the desktop session's start menu
# spawns it (and the shell resolves it by name like any command app).
# The capability list is the bundle's request — deliberately WITHOUT any
# filesystem capability: the viewer's only reach into the filesystem is
# the one file the user chooses in the desktop session's trusted picker,
# delegated one-shot over fd_grant and redeemed with fd_redeem (the CU6
# user-mediated file capability, plans/CAPABILITY_USE.md). It requests
# CAP_CONSOLE_WRITE for its fail-loud stderr diagnostics and CAP_SHM to
# create and grant the zero-copy window frame region the desktop session
# maps. The launched process receives this set intersected with the
# launching user's grants, never more.
id = "os.tairix.viewer"
name = "viewer"
version = "0.1.0"
kind = "command"
capabilities = ["CAP_CONSOLE_WRITE", "CAP_SHM"]
