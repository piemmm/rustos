[package]
name = "rustos-vim"
description = "RustOS `vim`: the modal text editor, drawn with the OS curses library (`plans/VIM.md`)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# The `Run` binary's freestanding userland runtime (`rustos-rt`) is an
# optional, on-by-default build feature, mirroring `rustos-top`. `cargo build
# -p rustos-vim` builds the tool program with it; host tooling builds only the
# editor *library*, so the host test build never pulls the userland runtime's
# `_start` / `#[global_allocator]` / panic handler.
[features]
default = ["program"]
program = ["dep:rustos-rt"]

# The package is both the `rustos-vim` editor library (below) and the `Run`
# entry-point binary of the `vim` tool. The binary is a freestanding pure-Rust
# program on the native Tier-1 targets and an inert host stub elsewhere (see
# `src/run.rs`).
[[bin]]
name = "rustos-vim-run"
path = "src/run.rs"

[dependencies]
# The frozen `Errno` the editor's file seam reports; `vim` invents no
# parallel error set and never links a kernel or driver crate.
rustos-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The OS-provided Terminal/TUI library: the curses screen model,
# minimal-diff renderer, and typed input (including the Escape and
# control-chorded key events a modal editor lives on). `vim` draws through
# it instead of emitting escape sequences by hand.
rustos-curses = { path = "../../../lib/curses", version = "=0.0.0" }
# The closed `TermType` set the screen driver is configured with (the honest
# terminal the session advertises).
rustos-termcap = { path = "../../../lib/termcap", version = "=0.0.0" }
# The shared escape/attribute vocabulary: `vim` styles cells with
# `rustos_vt::Attributes`, the one vocabulary the renderer emits.
rustos-vt = { path = "../../../lib/vt", version = "=0.0.0" }
# The one help engine: locale fallback, the bounded structured-Markdown
# parser, and the shared own-bundle short-help render the `-h`/`-?`
# switches use (plans/APPS.md).
rustos-help = { path = "../../../lib/help", version = "=0.0.0" }

# For the freestanding `Run` binary only: the userland runtime `rustos-rt`
# (`_start`, canary, panic handler, `mem_map` allocator, the syscall
# wrappers, `terminal_size`, `stdin`/`stdout`/`set_input_mode`, and the
# kernel-authorised `fs_*` `File` view the editor's file seam is built on).
# Pulled in only for the bare-metal targets the program is actually built
# for; on the host it is not linked.
[target.'cfg(target_os = "none")'.dependencies]
rustos-rt = { path = "../../../lib/rt", version = "=0.0.0", optional = true }
# The freestanding `Run` binary also enables the help engine's
# syscall-backed own-bundle `HelpSource` (`BundleHelp`), shared by every
# command app.
rustos-help = { path = "../../../lib/help", version = "=0.0.0", features = ["rt"] }
