[package]
name = "tairix-stress"
description = "TAIRiX `stress`: a load-generation command app in the spirit of the established `stress`/`stress-ng` surface — an unswappable controller spawning swappable CPU/memory/I-O/disk/cache workers, with overcommit, timeout, signal teardown, and a `sysmon` monitor option (`userland/apps/` — `plans/STRESSTEST.md` ST5)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# The `Run` binary's freestanding userland runtime (`tairix-rt`) is an
# optional, on-by-default build feature, mirroring `tairix-sysmon`. `cargo
# build -p tairix-stress` builds the tool program with it; host tooling
# builds only the parse/plan/control *library*, so the host test build never
# pulls the userland runtime's `_start` / `#[global_allocator]` / panic
# handler.
[features]
default = ["program"]
program = ["dep:tairix-rt"]

# The package is both the `tairix-stress` load-generation library (below) and
# the `Run` entry-point binary of the `stress` tool. The binary is a
# freestanding pure-Rust program on the native Tier-1 targets and an inert
# host stub elsewhere (see `src/run.rs`).
[[bin]]
name = "tairix-stress-run"
path = "src/run.rs"

[dependencies]
# The frozen `Errno`, the `Signal` set and its termination statuses, the
# spawn/wait/waitset vocabulary, and the fd-3 `StdInfoRecord` this tool
# emits; `stress` invents no parallel error set and never links a
# kernel or driver crate.
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The shared System Information API client helpers: the mount-table walk the
# disk-worker sizing reads its free-space figure from — never a
# second data channel.
tairix-procinfo = { path = "../../../lib/procinfo", version = "=0.0.0" }
# The one help engine: locale fallback, the bounded structured-Markdown
# parser, and the shared own-bundle short-help render the `-h`/`-?`/`--help`
# switches use (plans/APPS.md §4, §6).
tairix-help = { path = "../../../lib/help", version = "=0.0.0" }

# For the freestanding `Run` binary only: the userland runtime `tairix-rt`
# (`_start`, canary, panic handler, `mem_map` allocator, and the
# spawn/wait/waitset/signal/fs syscall wrappers) plus the production
# `sysinfo` transport seam in `lib/procinfo` (`IpcTransport`) and the help
# engine's syscall-backed own-bundle `HelpSource` (`BundleHelp`). All are
# pulled in only for the bare-metal targets the program is actually built
# for; on the host none is linked.
[target.'cfg(target_os = "none")'.dependencies]
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0", optional = true }
tairix-procinfo = { path = "../../../lib/procinfo", version = "=0.0.0", features = [
    "program",
] }
tairix-help = { path = "../../../lib/help", version = "=0.0.0", features = ["rt"] }
