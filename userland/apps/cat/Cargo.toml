[package]
name = "tairix-cat"
description = "TAIRiX `cat` CLI: concatenate files (and standard input) to the terminal (§3 `userland/apps/` — `PLAN.md` Stage 6)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# The `Run` binary's freestanding userland runtime (`tairix-rt`) is an
# optional, on-by-default build feature, mirroring `tairix-ls` and
# `tairix-man`. `cargo build -p tairix-cat` builds the tool program with it;
# host tooling builds only the streaming *library*, so the host test build
# never pulls the userland runtime's `_start` / `#[global_allocator]` / panic
# handler.
[features]
default = ["program"]
program = ["dep:tairix-rt"]

# The package is both the `tairix-cat` streaming library (below) and the `Run`
# entry-point binary of the `cat` tool. The binary is a freestanding pure-Rust
# program on the native Tier-1 targets and an inert host stub elsewhere (see
# `src/run.rs`).
[[bin]]
name = "tairix-cat-run"
path = "src/run.rs"

[dependencies]
# The stable `Errno` is the only ABI vocabulary `cat` needs: the tool reads
# its sources and writes the terminal through injected seams that speak the
# frozen `Errno`, so it invents no parallel error set (§2.2) and never links
# a kernel or driver crate (§17.4).
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The one help engine: locale fallback, the bounded structured-Markdown
# parser, and the shared own-bundle short-help render the `-h`/`-?`
# switches use (plans/APPS.md §4, §6).
tairix-help = { path = "../../../lib/help", version = "=0.0.0" }

# For the freestanding `Run` binary only: the userland runtime `tairix-rt`
# (`_start`, canary, panic handler, `mem_map` allocator, the `fs_*` file
# wrappers, and the standard-stream I/O). Pulled in only for the bare-metal
# targets the program is actually built for; on the host it is not linked.
[target.'cfg(target_os = "none")'.dependencies]
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0", optional = true }
# The freestanding `Run` binary also enables the help engine's syscall-backed
# own-bundle `HelpSource` (`BundleHelp`), shared by every command app.
tairix-help = { path = "../../../lib/help", version = "=0.0.0", features = ["rt"] }
