[package]
name = "rustos-cat"
description = "RustOS `cat` CLI: concatenate files (and standard input) to the terminal (§3 `userland/apps/` — `PLAN.md` Stage 6)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The stable `Errno` is the only thing `cat` needs from the workspace: the
# tool reads its sources and writes the terminal through injected seams that
# speak the frozen `Errno`, so it invents no parallel error set (§2.2) and
# never links a kernel or driver crate (§17.4).
rustos-abi = { path = "../../../lib/abi", version = "=0.0.0" }
