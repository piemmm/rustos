[package]
name = "tairix-useradd"
description = "TAIRiX `useradd` CLI: create a user account (`userland/apps/` — a plans/APPS.md command app)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# The `Run` binary's freestanding userland runtime (`tairix-rt`) is an
# optional, on-by-default build feature, mirroring `tairix-rm` and
# `tairix-users-cli`. `cargo build -p tairix-useradd` builds the tool program
# with it; host tooling builds only the account-creation *library*, so the
# host test build never pulls the userland runtime's `_start` /
# `#[global_allocator]` / panic handler.
[features]
default = ["program"]
program = ["dep:tairix-rt"]

# The package is both the `tairix-useradd` account-creation library (below)
# and the `Run` entry-point binary of the `useradd` tool. The binary is a
# freestanding pure-Rust program on the native Tier-1 targets and an inert
# host stub elsewhere (see `src/run.rs`).
[[bin]]
name = "tairix-useradd-run"
path = "src/run.rs"

[dependencies]
# The stable `Errno` and the `users_admin` request/response vocabulary: the
# tool writes a record to the user database through an injected seam that
# speaks the frozen `Errno`, so it invents no parallel error set and
# never links a kernel or driver crate.
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The one help engine: locale fallback, the bounded structured-Markdown
# parser, and the shared own-bundle short-help render the `-h`/`-?`
# switches use (plans/APPS.md §4, §6).
tairix-help = { path = "../../../lib/help", version = "=0.0.0" }
# The shared account policy (`DEFAULT_SHELL`, `default_home`, `next_id`,
# `SESSION_BASELINE`) and the password-record builder the production
# database client composes the new record from — one definition, never a
# private copy.
tairix-users = { path = "../../../lib/users", version = "=0.0.0" }

# For the freestanding `Run` binary only: the userland runtime `tairix-rt`
# (`_start`, canary, panic handler, `mem_map` allocator, the syscall
# wrappers, and the standard-stream I/O). Pulled in only for the bare-metal
# targets the program is actually built for; on the host it is not linked.
[target.'cfg(target_os = "none")'.dependencies]
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0", optional = true }
# The freestanding `Run` binary also enables the help engine's syscall-backed
# own-bundle `HelpSource` (`BundleHelp`), shared by every command app.
tairix-help = { path = "../../../lib/help", version = "=0.0.0", features = ["rt"] }
