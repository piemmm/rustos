# Signed-AppInfo manifest source for the `useradd` command app
# (plans/APPS.md deliverable 8). Discovered by the build's app-bundle
# composer, which cross-compiles Run, signs the manifest, and plants the
# bundle on the read-only /System/Apps store. The capability list is the
# bundle's request: the launched process receives this set intersected
# with the launching user's grants, never more. `CAP_USER_ADMIN` sits
# above the session baseline, so the tool works only for an administrator
# account and is inert for everyone else; `CAP_FS_ACCESS` covers the
# short-help read of the bundle's own Help/ tree. No console-read: the
# tool never prompts.
id = "os.tairix.useradd"
name = "useradd"
version = "0.1.0"
kind = "command"
capabilities = ["CAP_CONSOLE_WRITE", "CAP_USER_ADMIN", "CAP_FS_ACCESS"]
# This bundle's own 256x256 icon master in its Resources/ (plans/ICONS.md).
library-icon = "useradd.png"
