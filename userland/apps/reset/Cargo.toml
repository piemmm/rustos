[package]
name = "tairix-reset"
description = "TAIRiX `reset` CLI: restore the terminal to a sane state (`plans/APPS.md`)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# The `Run` binary's freestanding userland runtime (`tairix-rt`) is an
# optional, on-by-default build feature, mirroring `tairix-clear`.
# `cargo build -p tairix-reset` builds the tool program with it; host
# tooling builds only the pure *library*, so the host test build never
# pulls the userland runtime's `_start` / `#[global_allocator]` / panic
# handler.
[features]
default = ["program"]
program = ["dep:tairix-rt"]

# The package is both the `tairix-reset` library (the pure parse + op
# selection below) and the `Run` entry-point binary of the `reset` tool.
# The binary is a freestanding pure-Rust program on the native Tier-1
# targets and an inert host stub elsewhere (see `src/run.rs`).
[[bin]]
name = "tairix-reset-run"
path = "src/run.rs"

[dependencies]
# The compiled-in terminal-capability database: the inherited `TERM` names
# what the terminal can do, and `reset` emits only what that profile
# accepts (fail-closed: an unknown `TERM` degrades to the dumb baseline).
tairix-termcap = { path = "../../../lib/termcap", version = "=0.0.0" }
# The one shared escape vocabulary: every restoration operation is a
# `tairix_vt::Op` encoded through the shared emitter, never a hand-rolled
# escape string.
tairix-vt = { path = "../../../lib/vt", version = "=0.0.0" }
# The one help engine: locale fallback, the bounded structured-Markdown
# parser, and the shared own-bundle short-help render the `-h`/`-?`
# switches use (plans/APPS.md).
tairix-help = { path = "../../../lib/help", version = "=0.0.0" }

# For the freestanding `Run` binary only: the userland runtime `tairix-rt`
# (`_start`, canary, panic handler, `mem_map` allocator, the input-mode
# wrapper, and the standard-stream I/O). Pulled in only for the bare-metal
# targets the program is actually built for; on the host it is not linked.
[target.'cfg(target_os = "none")'.dependencies]
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0", optional = true }
# The input-mode discriminant the freestanding binary hands the runtime's
# `set_input_mode` wrapper when it restores the cooked discipline.
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The freestanding `Run` binary also enables the help engine's
# syscall-backed own-bundle `HelpSource` (`BundleHelp`), shared by every
# command app.
tairix-help = { path = "../../../lib/help", version = "=0.0.0", features = ["rt"] }
