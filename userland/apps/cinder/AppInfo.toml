# Signed-AppInfo manifest source for `cinder`, the desktop companion.
# Discovered by the build's app-bundle composer, which cross-compiles Run, signs
# the manifest, and plants the bundle on the read-only /System/Applications
# store; the desktop session's program library spawns it (and the shell resolves
# it by name, like any program in either system store).
#
# The capability list is the minimum the companion needs: CAP_CONSOLE_WRITE for
# its fail-loud stderr diagnostics, CAP_SHM to create and grant the zero-copy
# frame regions the desktop session maps, and CAP_DESKTOP_LAYER to be present on
# the desktop outside a window of its own — the one capability that separates a
# companion from an ordinary windowed app, and the one the session gates every
# layer request on. Being refused it is not fatal: the pen keeps working and
# "let Cinder out" states why it could not.
#
# It reads no filesystem and spawns no process. Cinder's mood lives in the
# app-data store, which is reached through the settings service over an ordinary
# unprivileged call and gated on this bundle's kernel-attested identity rather
# than on any authority the bundle asks for. The app ships no DefaultSettings/,
# so it opens its store without that layer and needs no CAP_FS_ACCESS for it.
# The launched process receives this set intersected with the launching user's
# grants, never more.
id = "os.tairix.cinder"
name = "cinder"
title = "Cinder"
version = "0.1.0"
kind = "application"
# The identity the desktop's icon-bar information panel states, drawn from this
# *signed* manifest rather than from anything the running process says about
# itself.
purpose = "A desktop companion who lives in a playpen and roams the desktop"
author = "The TAIRiX Project"
capabilities = ["CAP_CONSOLE_WRITE", "CAP_SHM", "CAP_DESKTOP_LAYER"]
library = "Games"
# This bundle's own icon in its Resources/, authored as a vector so one file
# serves every slot and every UI scale exactly.
library-icon = "cinder.svg"
