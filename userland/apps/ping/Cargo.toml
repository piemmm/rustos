[package]
name = "tairix-ping"
description = "TAIRiX `ping` CLI: send ICMP/ICMPv6 echo requests (`plans/NETWORK.md` N8b-2b)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# The `Run` binary's freestanding userland runtime (`tairix-rt`) and the
# socket-backed name resolver (`tairix-resolver`'s `program` feature) are an
# optional, on-by-default build feature, mirroring the other command apps.
# `cargo build -p tairix-ping` builds the tool program with them; host tooling
# builds only the pure *library*, so the host test build never pulls the
# userland runtime's `_start` / `#[global_allocator]` / panic handler.
[features]
default = ["program"]
program = ["dep:tairix-rt", "tairix-resolver/program"]

# The package is both the `tairix-ping` library (the pure ping-loop engine
# below) and the `Run` entry-point binary of the `ping` tool. The binary is a
# freestanding pure-Rust program on the native Tier-1 targets and an inert
# host stub elsewhere (see `src/run.rs`).
[[bin]]
name = "tairix-ping-run"
path = "src/run.rs"

[dependencies]
# The audited ABI vocabulary: `Errno`, `NetAddrFamily`, and (via `lib/rt`)
# the socket wire contract the tool speaks.
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The one help engine: locale fallback, the bounded structured-Markdown
# parser, and the shared own-bundle short-help render the `-?`/`--help`
# switches use (plans/APPS.md).
tairix-help = { path = "../../../lib/help", version = "=0.0.0" }
# The shared userland stub resolver: the one literal-first, family-preference
# host-operand policy (`resolve_host`) and the `address_parts` split every
# connecting tool uses — never a second copy of "what does this operand mean".
# The socket-backed transport is behind its `program` feature.
tairix-resolver = { path = "../../../lib/resolver", version = "=0.0.0" }

# For the freestanding `Run` binary only: the userland runtime `tairix-rt`
# (`_start`, canary, panic handler, `mem_map` allocator, the standard-stream
# I/O, and the `net` ICMP-echo socket wrappers). Pulled in only for the
# bare-metal targets the program is actually built for; on the host it is
# not linked.
[target.'cfg(target_os = "none")'.dependencies]
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0", optional = true }
# The one RNG crate: `FastRng` (xoshiro256++) generates the high-entropy
# payload bytes, seeded from the kernel CSPRNG. Bulk uncompressible data is
# not a security surface, so the fast generator is the right layer — and
# rolling a private PRNG is forbidden.
tairix-rng = { path = "../../../lib/rng", version = "=0.0.0" }
# The freestanding `Run` binary also enables the help engine's syscall-backed
# own-bundle `HelpSource` (`BundleHelp`).
tairix-help = { path = "../../../lib/help", version = "=0.0.0", features = ["rt"] }
