# Signed-AppInfo manifest source for the `man` command app
# (plans/APPS.md deliverable 8). Discovered by the build's app-bundle
# composer; the capability list is the bundle's request, intersected with
# the launching user's grants. The console pair drives the pager (echo
# suppression included); CAP_FS_ACCESS is the tool's job — reading a
# bundle's Help/ documents through the secured VFS. CAP_PROC_SPAWN
# re-spawns this same binary as the parser-sandbox render worker
# (docs/src/security/sandbox.md): the untrusted help document is parsed
# there, never in this process.
id = "os.tairix.man"
name = "man"
version = "0.1.0"
kind = "command"
capabilities = ["CAP_CONSOLE_WRITE", "CAP_CONSOLE_READ", "CAP_FS_ACCESS", "CAP_PROC_SPAWN"]
# This bundle's own 256x256 icon master in its Resources/ (plans/ICONS.md).
library-icon = "man.png"
