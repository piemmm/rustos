[package]
name = "rustos-man"
description = "RustOS `man` CLI: render a command app's bundled Help/ tree in the active locale through the shared lib/help engine (plans/APPS.md §7)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# The `Run` binary's freestanding userland runtime (`rustos-rt`) is an
# optional, on-by-default build feature, mirroring `rustos-ps`. `cargo build
# -p rustos-man` builds the tool program with it; host tooling builds only the
# resolve/render *library*, so the host test build never pulls the userland
# runtime's `_start` / `#[global_allocator]` / panic handler.
[features]
default = ["program"]
program = ["dep:rustos-rt"]

# The package is both the `rustos-man` resolve/render library (below) and the
# `Run` entry-point binary of the `man` tool. The binary is a freestanding
# pure-Rust program on the native Tier-1 targets and an inert host stub
# elsewhere (see `src/run.rs`).
[[bin]]
name = "rustos-man-run"
path = "src/run.rs"

[dependencies]
# The frozen `Errno` and the `stdinfo` record types for the locale-fallback
# advisory; `man` invents no parallel error set and never links a kernel or
# driver crate.
rustos-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The one command-word resolution policy: `man` walks the same
# store-then-`PATH` bundle order the shell launches by, so the page shown
# always documents the program the shell would run (plans/APPS.md §8).
rustos-cmdres = { path = "../../../lib/cmdres", version = "=0.0.0" }
# The one help engine: locale fallback, the bounded structured-Markdown
# parser, and the short/full renderers (plans/APPS.md §6).
rustos-help = { path = "../../../lib/help", version = "=0.0.0" }
# The one escape-sequence vocabulary the rendered page is encoded with.
rustos-vt = { path = "../../../lib/vt", version = "=0.0.0" }

# For the freestanding `Run` binary only: the userland runtime `rustos-rt`
# (`_start`, canary, panic handler, `mem_map` allocator, the `fs_*` file
# wrappers, and the standard-stream I/O). Pulled in only for the bare-metal
# targets the program is actually built for; on the host it is not linked.
[target.'cfg(target_os = "none")'.dependencies]
rustos-rt = { path = "../../../lib/rt", version = "=0.0.0", optional = true }
