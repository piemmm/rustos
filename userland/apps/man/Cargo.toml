[package]
name = "tairix-man"
description = "TAIRiX `man` CLI: render a command app's bundled Help/ tree in the active locale through the shared lib/help engine (plans/APPS.md §7)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# The `Run` binary's freestanding userland runtime (`tairix-rt`) is an
# optional, on-by-default build feature, mirroring `tairix-ps`. `cargo build
# -p tairix-man` builds the tool program with it; host tooling builds only the
# resolve/render *library*, so the host test build never pulls the userland
# runtime's `_start` / `#[global_allocator]` / panic handler.
[features]
default = ["program"]
program = ["dep:tairix-rt", "tairix-sandbox/program"]

# The package is both the `tairix-man` resolve/render library (below) and the
# `Run` entry-point binary of the `man` tool. The binary is a freestanding
# pure-Rust program on the native Tier-1 targets and an inert host stub
# elsewhere (see `src/run.rs`).
[[bin]]
name = "tairix-man-run"
path = "src/run.rs"

[dependencies]
# The frozen `Errno` and the `stdinfo` record types for the locale-fallback
# advisory; `man` invents no parallel error set and never links a kernel or
# driver crate.
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The one command-word resolution policy: `man` walks the same
# store-then-`PATH` bundle order the shell launches by, so the page shown
# always documents the program the shell would run (plans/APPS.md §8).
tairix-cmdres = { path = "../../../lib/cmdres", version = "=0.0.0" }
# The one help engine: locale fallback, the bounded structured-Markdown
# parser, and the short/full renderers (plans/APPS.md §6).
tairix-help = { path = "../../../lib/help", version = "=0.0.0" }
# The parser-sandbox seam: the foreign help document is parsed and
# rendered in a minimum-capability worker process, never in-process, and
# only the whitelist-validated render comes back.
tairix-sandbox = { path = "../../../lib/sandbox", version = "=0.0.0" }
# The structured-event vocabulary the sandbox containment events are
# logged through.
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }

# For the freestanding `Run` binary only: the userland runtime `tairix-rt`
# (`_start`, canary, panic handler, `mem_map` allocator, the `fs_*` file
# wrappers, and the standard-stream I/O). Pulled in only for the bare-metal
# targets the program is actually built for; on the host it is not linked.
[target.'cfg(target_os = "none")'.dependencies]
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0", optional = true }
