[package]
name = "rustos-lspci"
description = "RustOS `lspci` CLI: list discovered PCI/PCIe devices (`plans/DEVICES.md` DEVICE1 V2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# The `Run` binary's freestanding userland runtime (`rustos-rt`) is an
# optional, on-by-default build feature, mirroring `rustos-df`. `cargo build
# -p rustos-lspci` builds the tool program with it; host tooling builds only
# the pure *library*, so the host test build never pulls the userland
# runtime's `_start` / `#[global_allocator]` / panic handler.
[features]
default = ["program"]
program = ["dep:rustos-rt"]

# The package is both the `rustos-lspci` library (the pure decode + render
# engine below) and the `Run` entry-point binary of the `lspci` tool. The
# binary is a freestanding pure-Rust program on the native Tier-1 targets
# and an inert host stub elsewhere (see `src/run.rs`).
[[bin]]
name = "rustos-lspci-run"
path = "src/run.rs"

[dependencies]
# The audited ABI vocabulary: `Errno`, the hardware-tree `HwNode` /
# `HwMatchKey` / `HwResource` wire records, and the fd-3 advisory record.
rustos-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The one PCI/USB ID-database engine: the alloc-free `DevIds` decoder over
# the compiled table this bundle ships as `Resources/pci.ids.bin`. The
# `textdb` import/vetting half is generator-side only and stays off here.
rustos-devids = { path = "../../../lib/devids", version = "=0.0.0", default-features = false }
# The one help engine: locale fallback, the bounded structured-Markdown
# parser, and the shared own-bundle short-help render the `-?`/`--help`
# switches use (plans/APPS.md).
rustos-help = { path = "../../../lib/help", version = "=0.0.0" }
# The shared System Information API client: the `HARDWARE_TREE` query goes
# through the one `call` helper and `Transport` seam every sysinfo consumer
# uses — never a second query client.
rustos-procinfo = { path = "../../../lib/procinfo", version = "=0.0.0" }

[dev-dependencies]
# Host tests compile a tiny fixture database from `pci.ids`-grammar text
# through the same `lib/devids` import pipeline the generator uses, so the
# engine is proven against real encoded tables, never a hand-rolled mock
# format. Features are additive: the shipped library still builds without
# the import half.
rustos-devids = { path = "../../../lib/devids", version = "=0.0.0", features = ["textdb"] }

# For the freestanding `Run` binary only: the userland runtime `rustos-rt`
# (`_start`, canary, panic handler, `mem_map` allocator, and the
# standard-stream I/O). Pulled in only for the bare-metal targets the
# program is actually built for; on the host it is not linked.
[target.'cfg(target_os = "none")'.dependencies]
rustos-rt = { path = "../../../lib/rt", version = "=0.0.0", optional = true }
# The freestanding `Run` binary also enables the help engine's
# syscall-backed own-bundle `HelpSource` (`BundleHelp`) and the shared
# production client seams in `lib/procinfo` (`IpcTransport`), enabled
# through its `program` feature exactly as `df` does.
rustos-help = { path = "../../../lib/help", version = "=0.0.0", features = ["rt"] }
rustos-procinfo = { path = "../../../lib/procinfo", version = "=0.0.0", features = ["program"] }
