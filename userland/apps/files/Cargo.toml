[package]
name = "rustos-files"
description = "RustOS filesystem browser: navigate the §16 filesystem layout over a capability-checked directory source and render the listing with the shared theme (§10/§16 — PLAN.md Stage 7)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The frozen `Errno` the directory source reports failures with; the browser
# invents no parallel error set for the kernel boundary (§2.2) and never links
# a kernel or driver crate (§17.4).
rustos-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# Shared integer screen geometry (`Point`/`Rect`) — the same vocabulary the
# window manager and taskbar use, lifted to `lib/*` so the app reuses it
# without depending on the window manager (§17.4, §2.2).
rustos-geometry = { path = "../../../lib/geometry", version = "=0.0.0" }
# The single shared theme definition (§10): the browser takes its colours from
# the active theme so it stays consistent with the window manager and taskbar.
rustos-theme = { path = "../../../lib/theme", version = "=0.0.0" }
# Shared software rasteriser (`Color`/`Surface`) — the same premultiplied-alpha
# primitives the window manager paints with, lifted to `lib/*` so the app
# renders its listing into a `Surface` without duplicating the colour algebra
# (§17.4, §2.2).
rustos-raster = { path = "../../../lib/raster", version = "=0.0.0" }
# Shared text rasteriser (`BitmapFont`) — the built-in bitmap face and glyph
# blitter, lifted to `lib/*` (§16.4) so the app draws the path bar and entry
# names without depending on the window manager (§17.4).
rustos-font = { path = "../../../lib/font", version = "=0.0.0" }

[lints]
workspace = true
