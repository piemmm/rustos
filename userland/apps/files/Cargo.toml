[package]
name = "tairix-files"
description = "TAIRiX filesystem browser app: the `Run` entry-point binary of the on-disk files.app bundle, composing the shared lib/browse engine over the live capability-checked directory source (PLAN.md Stage 7, plans/APPWIN.md AW3/AW5)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The package is only the `Run` entry-point binary of the on-disk
# `files.app` bundle (plans/APPWIN.md AW3): the windowed file browser the
# desktop session autostarts as a core component. Its engine — the navigation model,
# the themed renderer, and the validated path spelling — is the shared
# `lib/browse` crate (the same engine the desktop session's trusted file
# picker composes), so this package carries no library of its
# own. The binary is a freestanding pure-Rust program on the native
# Tier-1 targets and an inert host stub elsewhere (see `src/run.rs` /
# `build.rs`).
[[bin]]
name = "tairix-files-run"
path = "src/run.rs"

# What the host-visible places-rail routing (`src/sidebar.rs`) and command-line
# decision (`src/command.rs`) link. The rest of the program is freestanding,
# but those decisions are pure and host-tested, so the crates they are
# expressed in must build for the host too. The bare-metal section below adds
# only what the *program* needs on top.
[dependencies]
# The frozen `Errno`, the input/display vocabulary, and the window-channel
# wire types the binary speaks.
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The one shared directory-browser engine: `Browser`, the themed
# `render`, the `VfsDirectorySource` composition, and the canonical
# browser-view geometry.
tairix-browse = { path = "../../../lib/browse", version = "=0.0.0" }
# Shared integer screen geometry (`Point`/`Rect`/`Scale`/`Region`) for the
# render viewport, the rail's hit-test, the inline rename editor's overlay, and
# the damage a round reports.
tairix-geometry = { path = "../../../lib/geometry", version = "=0.0.0" }
# The premultiplied-alpha rasteriser: the window-lifetime `Surface` every frame
# is drawn into, clipped to what the round reported.
tairix-raster = { path = "../../../lib/raster", version = "=0.0.0" }
# The single shared theme definition every desktop surface resolves from.
tairix-theme = { path = "../../../lib/theme", version = "=0.0.0" }
# The shared text rasteriser: the rail's width and every label are measured in
# the theme's font. The production font-service transport is a bare-metal-only
# feature, added in the target section below, so the host view is the built-in
# face and its metrics alone.
tairix-font = { path = "../../../lib/font", version = "=0.0.0" }
# The one shared path grammar: the starting-location argument is diagnosed
# against the same filename rule the browser spells every component with, so
# this app carries no second path parser.
tairix-path = { path = "../../../lib/path", version = "=0.0.0" }
# The app half of the window channel: `WindowClient` (create / present / close
# over the `WindowTransport` seam) and `WindowEvents` (the typed, parked event
# wait over the `EventSource` seam) for the `Run` binary — and, on the host
# too, the session↔component launch contract (`DESKTOP_ROLE_SWITCH`) and the
# icon-bar menu convention `src/command.rs` and `src/appbar.rs` are written
# against. Those two are host-tested, so this is a plain dependency.
tairix-window = { path = "../../../lib/window", version = "=0.0.0" }
# The shared Reactive Alloy GUI controls: the in-place rename editor is the one
# shared `TextField` (its caret/selection editor and validation-message
# surface), never a browser-private text box — and the one damage sink every
# reporting round writes into, which the host-tested rail routing needs.
tairix-controls = { path = "../../../lib/controls", version = "=0.0.0" }
# The shared icon vocabulary's draw-site artwork seam: the `ArtworkCache` the
# grid resolves each tile through, and the empty lookup the host tests paint a
# listing with.
tairix-icon = { path = "../../../lib/icon", version = "=0.0.0" }

[dev-dependencies]
# The shared reclaimable-memory model: the icon pipeline's host tests build its
# decode cache through the one shipping constructor, so they need the test
# pressure gauge the real cache is governed by rather than a budget of their
# own.
tairix-reclaim = { path = "../../../lib/reclaim", version = "=0.0.0" }
# The audit sink that constructor takes. The pipeline's own behaviour is what
# is under test, so the records are discarded.
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }

# Everything else the freestanding `Run` binary links is pulled in for the
# bare-metal targets it is actually built for; on the host those parts of the
# binary are not compiled at all.
[target.'cfg(target_os = "none")'.dependencies]
# The browser engine's production symbolic-link reader (`RtLinkReader`): the
# `fs_readlink` + resolving `fs_stat` pair a listed link needs, written once in
# `lib/browse` so no surface carries its own copy of those two calls.
tairix-browse = { path = "../../../lib/browse", version = "=0.0.0", features = ["rt"] }
# The window-frame pixel codec (`tairix_display::winframe`): the one
# definition of the straight-alpha conversion between this program's own
# surface and the shared frame the desktop session reads, so no app carries a
# private copy of the channel-order decision.
tairix-display = { path = "../../../lib/display", version = "=0.0.0" }
# The parser sandbox: the icon artwork the grid draws is untrusted input, so it
# is decoded in a minimum-capability worker this binary re-enters itself as,
# never in this process.
tairix-sandbox = { path = "../../../lib/sandbox", version = "=0.0.0", features = ["program"] }
# The System Information client's shared memory-pressure wake/prime helper,
# so the artwork cache obeys the same band every other cache on the machine
# does.
tairix-procinfo = { path = "../../../lib/procinfo", version = "=0.0.0", features = ["program"] }
# The desktop input vocabulary (`Key`/`NamedKey`/`Modifiers`) the shared
# controls consume; the binary maps the window channel's wire `KeyInput`
# onto it to drive the rename editor.
tairix-input = { path = "../../../lib/input", version = "=0.0.0" }
# The production font-service transport, added to the shared dependency
# above: the `Run` binary reaches the sandboxed font service over the runtime
# `ipc_call` transport, which only exists on the bare-metal targets, so no
# host build is affected.
tairix-font = { path = "../../../lib/font", version = "=0.0.0", features = ["rt"] }
# The one shared command-help engine: the reserved `-h`/`-?` switches render
# this bundle's own `Help/` tree through the same engine as every other
# command's short help, never a second copy of the text.
tairix-help = { path = "../../../lib/help", version = "=0.0.0", features = ["rt"] }
# The pure-Rust userland runtime: `_start`, the stack canary, the panic
# handler, the allocator, and the syscall wrappers (`shm_create` /
# `shm_grant`, `port_bind` / `ipc_recv`, `ipc_call`, `waitset_*`,
# `read_dir_all`).
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0" }

[lints]
workspace = true
