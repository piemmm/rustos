# Signed-AppInfo manifest source for the `files` desktop file browser
# (plans/APPWIN.md AW3). Discovered by the build's app-bundle composer,
# which cross-compiles Run, signs the manifest, and plants the bundle on
# the read-only /System/Applications store; the desktop session autostarts
# it at bring-up in its core role and launches it again to open a folder the
# user activated (and the shell resolves it by name, like any program in
# either system store).
# The capability list is the bundle's request: CAP_CONSOLE_WRITE for its
# fail-loud stderr diagnostics, CAP_FS_ACCESS for the directory listings
# it browses (every read is still permission-checked per inode under the
# launching user's identity), CAP_SHM to create and grant the zero-copy
# window frame region the desktop session maps, and CAP_PROC_SPAWN for
# the app's two spawns: launching an activated <Name>.app bundle through
# the ordinary signed app-load gate (double-click / Enter on a bundle
# spawns its own Run — never a private path; plans/NEW-FILEMANAGER.md
# FM6b), and hosting the icon-rasterisation sandbox worker the grid's
# artwork is decoded in — a restricted spawn of this same binary in its
# worker role, which the kernel brands capability-empty, so the untrusted
# decode never runs in the file manager and needs no capability of its
# own. The launched process receives this set intersected with the
# launching user's grants, never more.
id = "os.tairix.files"
name = "files"
version = "0.1.0"
kind = "application"
# The identity the desktop's icon-bar information panel states, drawn from
# this *signed* manifest rather than from anything the running process says
# about itself (plans/NEW-TASKBAR.md).
purpose = "Browse, open, and organise your files"
author = "The TAIRiX Project"
capabilities = ["CAP_CONSOLE_WRITE", "CAP_FS_ACCESS", "CAP_SHM", "CAP_PROC_SPAWN"]
# Deliberately absent from the program library. The file manager is a
# component of the desktop rather than an application the user starts: the
# session autostarts it in its core role at bring-up and it holds a permanent
# icon-bar slot from then on, so a library row could only ever spawn a second,
# ordinary copy alongside it. It is reached from that slot — the same reasoning
# that keeps System Settings out of the library (plans/NEW-TASKBAR.md §3).
# This bundle's own vector icon master in its Resources/, authored in the
# desktop's SVG subset over a 256x256 design box (plans/ICONS.md). Still
# declared with no `library` folder above: the key names the *bundle's* icon,
# which is what the icon-bar slot draws, not a library row's alone.
library-icon = "files.svg"
