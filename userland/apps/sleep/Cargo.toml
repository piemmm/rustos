[package]
name = "tairix-sleep"
description = "TAIRiX `sleep` CLI: pause for a sum of time intervals (`plans/APPS.md` §12.1 Stage C)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# The `Run` binary's freestanding userland runtime (`tairix-rt`) is an
# optional, on-by-default build feature, mirroring `tairix-seq` and
# `tairix-whoami`. `cargo build -p tairix-sleep` builds the tool program
# with it; host tooling builds only the pure *library*, so the host test
# build never pulls the userland runtime's `_start` / `#[global_allocator]`
# / panic handler.
[features]
default = ["program"]
program = ["dep:tairix-rt"]

# The package is both the `tairix-sleep` library (the pure interval-parse +
# pause engine below) and the `Run` entry-point binary of the `sleep` tool.
# The binary is a freestanding pure-Rust program on the native Tier-1
# targets and an inert host stub elsewhere (see `src/run.rs`).
[[bin]]
name = "tairix-sleep-run"
path = "src/run.rs"

[dependencies]
# The frozen `Errno` the tool reports through; `sleep` invents no parallel
# error set and never links a kernel or driver crate.
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The shared C-locale `strtod` scanner (`scan_double`) behind the operand
# grammar, also consumed by `seq` and `printf`; `sleep` reuses it rather
# than a second number parser.
tairix-util = { path = "../../../lib/util", version = "=0.0.0" }
# The one help engine: locale fallback, the bounded structured-Markdown
# parser, and the shared own-bundle short-help render the `-h`/`-?`
# switches use (plans/APPS.md §4, §6).
tairix-help = { path = "../../../lib/help", version = "=0.0.0" }

# For the freestanding `Run` binary only: the userland runtime `tairix-rt`
# (`_start`, canary, panic handler, `mem_map` allocator, the standard-stream
# I/O, and the clock-backed `ClockDelay` timed park). Pulled in only for the
# bare-metal targets the program is actually built for; on the host it is
# not linked.
[target.'cfg(target_os = "none")'.dependencies]
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0", optional = true }
# The freestanding `Run` binary also enables the help engine's
# syscall-backed own-bundle `HelpSource` (`BundleHelp`), shared by every
# command app.
tairix-help = { path = "../../../lib/help", version = "=0.0.0", features = ["rt"] }
