# Signed-AppInfo manifest source for the `sleep` command app
# (plans/APPS.md §12.1 Stage C). Discovered by the build's app-bundle
# composer; the capability list is the bundle's request, intersected with
# the launching user's grants. CAP_CONSOLE_WRITE covers the short-help (and
# diagnostic) text written to the inherited standard output/error;
# CAP_FS_ACCESS covers the short-help read of the bundle's own Help/
# documents through the secured VFS. The tool reads no input, so it requests
# no CAP_CONSOLE_READ.
id = "os.tairix.sleep"
name = "sleep"
version = "0.1.0"
kind = "command"
capabilities = ["CAP_CONSOLE_WRITE", "CAP_FS_ACCESS"]
# This bundle's own 256x256 icon master in its Resources/ (plans/ICONS.md).
library-icon = "sleep.png"
