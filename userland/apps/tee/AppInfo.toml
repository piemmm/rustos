# Signed-AppInfo manifest source for the `tee` command app
# (plans/APPS.md deliverable 8). Discovered by the build's app-bundle
# composer; the capability list is the bundle's request, intersected with
# the launching user's grants. The console pair covers the inherited
# standard streams (the copied standard input and the standard-output
# copy); CAP_FS_ACCESS is the tool's job — creating and writing its file
# operands (and reading its own bundle's Help/ documents) through the
# secured VFS.
id = "os.tairix.tee"
name = "tee"
version = "0.1.0"
kind = "command"
capabilities = ["CAP_CONSOLE_WRITE", "CAP_CONSOLE_READ", "CAP_FS_ACCESS"]
