# Signed-AppInfo manifest source for the `chmod` command app
# (plans/APPS.md Stage B). Discovered by the build's app-bundle
# composer, which cross-compiles Run, signs the manifest, and plants the
# bundle on the read-only /System/Apps store. The capability list is the
# bundle's request: the launched process receives this set intersected
# with the launching user's grants, never more. `chmod` writes reports and
# changes modes through the owner-checked `fs_set_mode` syscall; it never
# reads standard input, so no read capability is requested.
id = "os.tairix.chmod"
name = "chmod"
version = "0.1.0"
kind = "command"
capabilities = ["CAP_CONSOLE_WRITE", "CAP_FS_ACCESS"]
