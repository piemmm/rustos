[package]
name = "rustos-clear"
description = "RustOS `clear` CLI: clear the terminal screen (`plans/APPS.md`)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# The `Run` binary's freestanding userland runtime (`rustos-rt`) is an
# optional, on-by-default build feature, mirroring `rustos-cat` and
# `rustos-top`. `cargo build -p rustos-clear` builds the tool program with
# it; host tooling builds only the pure *library*, so the host test build
# never pulls the userland runtime's `_start` / `#[global_allocator]` /
# panic handler.
[features]
default = ["program"]
program = ["dep:rustos-rt"]

# The package is both the `rustos-clear` library (the pure parse + op
# selection below) and the `Run` entry-point binary of the `clear` tool.
# The binary is a freestanding pure-Rust program on the native Tier-1
# targets and an inert host stub elsewhere (see `src/run.rs`).
[[bin]]
name = "rustos-clear-run"
path = "src/run.rs"

[dependencies]
# The compiled-in terminal-capability database: the inherited `TERM` names
# what the terminal can do, and `clear` emits only what that profile
# accepts (fail-closed: an unknown `TERM` degrades to the dumb baseline,
# which cannot clear).
rustos-termcap = { path = "../../../lib/termcap", version = "=0.0.0" }
# The one shared escape vocabulary: the home + erase-display operations are
# `rustos_vt::Op`s encoded through the shared emitter, never hand-rolled
# escape bytes.
rustos-vt = { path = "../../../lib/vt", version = "=0.0.0" }
# The one help engine: locale fallback, the bounded structured-Markdown
# parser, and the shared own-bundle short-help render the `-h`/`-?`
# switches use (plans/APPS.md).
rustos-help = { path = "../../../lib/help", version = "=0.0.0" }

# For the freestanding `Run` binary only: the userland runtime `rustos-rt`
# (`_start`, canary, panic handler, `mem_map` allocator, and the
# standard-stream I/O). Pulled in only for the bare-metal targets the
# program is actually built for; on the host it is not linked.
[target.'cfg(target_os = "none")'.dependencies]
rustos-rt = { path = "../../../lib/rt", version = "=0.0.0", optional = true }
# The freestanding `Run` binary also enables the help engine's
# syscall-backed own-bundle `HelpSource` (`BundleHelp`), shared by every
# command app.
rustos-help = { path = "../../../lib/help", version = "=0.0.0", features = ["rt"] }
