[package]
name = "tairix-host"
description = "TAIRiX `host` CLI: look up a name over DNS via the stub resolver (`plans/DNS.md` DNS3)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# The `Run` binary's freestanding userland runtime (`tairix-rt`) and the
# socket-backed resolver client (`tairix-resolver`'s `program` feature) are an
# optional, on-by-default build feature, mirroring the other command apps.
# `cargo build -p tairix-host` builds the tool program with them; host tooling
# builds only the pure *library* (the parse + render engine), so the host test
# build never pulls the userland runtime's `_start` / `#[global_allocator]` /
# panic handler.
[features]
default = ["program"]
program = ["dep:tairix-rt", "tairix-resolver/program"]

# The package is both the `tairix-host` library (the pure parse + render
# engine below) and the `Run` entry-point binary of the `host` tool. The
# binary is a freestanding pure-Rust program on the native Tier-1 targets and
# an inert host stub elsewhere (see `src/run.rs`).
[[bin]]
name = "tairix-host-run"
path = "src/run.rs"

[dependencies]
# The audited ABI vocabulary: `Errno`.
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The one help engine: locale fallback, the bounded structured-Markdown
# parser, and the shared own-bundle short-help render the `-?`/`--help`
# switches use (plans/APPS.md).
tairix-help = { path = "../../../lib/help", version = "=0.0.0" }
# The pure DNS engine vocabulary the render logic matches on (`RecordType`,
# `Resolution`, `ResolveStatus`, `IpAddr`) — never a second DNS type set.
tairix-net = { path = "../../../lib/net", version = "=0.0.0" }
# The userland DNS stub-resolver client: the `Resolver` seam and its
# `ResolveError` the engine renders. The socket-backed transport is behind its
# `program` feature (freestanding only).
tairix-resolver = { path = "../../../lib/resolver", version = "=0.0.0" }

# For the freestanding `Run` binary only: the userland runtime `tairix-rt`
# (`_start`, canary, panic handler, `mem_map` allocator, and the
# standard-stream I/O). Pulled in only for the bare-metal targets the program
# is actually built for; on the host it is not linked.
[target.'cfg(target_os = "none")'.dependencies]
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0", optional = true }
# The freestanding `Run` binary also enables the help engine's syscall-backed
# own-bundle `HelpSource` (`BundleHelp`).
tairix-help = { path = "../../../lib/help", version = "=0.0.0", features = ["rt"] }
