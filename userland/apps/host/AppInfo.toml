# Signed-AppInfo manifest source for the `host` command app
# (plans/DNS.md DNS3). Discovered by the build's app-bundle composer; the
# capability list is the bundle's request, intersected with the launching
# user's grants. CAP_CONSOLE_WRITE covers the inherited standard output/error
# streams; CAP_FS_ACCESS reads the tool's own bundle payload (its Help/
# documents) through the secured VFS; CAP_NET opens the ordinary UDP socket
# the stub resolver queries the recursive DNS servers with (the stack
# re-checks it and audits the open, fail-closed). The active-server set is
# read through the ungated NET_RESOLVER_SERVERS System Information query, so
# no CAP_SYSINFO_* is requested. It reads no standard input.
id = "os.tairix.host"
name = "host"
version = "0.1.0"
kind = "command"
capabilities = ["CAP_CONSOLE_WRITE", "CAP_FS_ACCESS", "CAP_NET"]
