[package]
name = "rustos-whoami"
description = "RustOS `whoami` CLI: print the current user's account name (`plans/APPS.md` §12.1 Stage C)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# The `Run` binary's freestanding userland runtime (`rustos-rt`) is an
# optional, on-by-default build feature, mirroring `rustos-ps` and
# `rustos-yes`. `cargo build -p rustos-whoami` builds the tool program with
# it; host tooling builds only the pure *library*, so the host test build
# never pulls the userland runtime's `_start` / `#[global_allocator]` /
# panic handler.
[features]
default = ["program"]
program = ["dep:rustos-rt"]

# The package is both the `rustos-whoami` library (the pure parse + lookup
# engine below) and the `Run` entry-point binary of the `whoami` tool. The
# binary is a freestanding pure-Rust program on the native Tier-1 targets
# and an inert host stub elsewhere (see `src/run.rs`).
[[bin]]
name = "rustos-whoami-run"
path = "src/run.rs"

[dependencies]
# The frozen `Errno` plus the `sysinfo-v1` account-directory types the tool
# consumes; `whoami` invents no parallel error set and never links a kernel
# or driver crate.
rustos-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The shared System Information API client helpers: the request/response
# seams and the account-directory walk shared with `top`'s USER column.
# `whoami` consumes these rather than duplicating them.
rustos-procinfo = { path = "../../../lib/procinfo", version = "=0.0.0" }
# The one help engine: locale fallback, the bounded structured-Markdown
# parser, and the shared own-bundle short-help render the `-h`/`-?`
# switches use (plans/APPS.md §4, §6).
rustos-help = { path = "../../../lib/help", version = "=0.0.0" }

# For the freestanding `Run` binary only: the userland runtime `rustos-rt`
# (`_start`, canary, panic handler, `mem_map` allocator, syscall/`ipc_call`
# wrappers) and the production client seams in `lib/procinfo` (`IpcTransport`,
# `RtOutput`), enabled through `rustos-procinfo`'s own `program` feature. Both
# are pulled in only for the bare-metal targets the program is actually built
# for; on the host neither is linked.
[target.'cfg(target_os = "none")'.dependencies]
rustos-rt = { path = "../../../lib/rt", version = "=0.0.0", optional = true }
rustos-procinfo = { path = "../../../lib/procinfo", version = "=0.0.0", features = ["program"] }
# The freestanding `Run` binary also enables the help engine's syscall-backed
# own-bundle `HelpSource` (`BundleHelp`), shared by every command app.
rustos-help = { path = "../../../lib/help", version = "=0.0.0", features = ["rt"] }
