[package]
name = "tairix-ls"
description = "TAIRiX `ls` CLI: list directory contents (§3 `userland/apps/` — a plans/APPS.md command app)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# The `Run` binary's freestanding userland runtime (`tairix-rt`) is an
# optional, on-by-default build feature, mirroring `tairix-ps` and
# `tairix-man`. `cargo build -p tairix-ls` builds the tool program with it;
# host tooling builds only the listing *library*, so the host test build never
# pulls the userland runtime's `_start` / `#[global_allocator]` / panic
# handler.
[features]
default = ["program"]
program = ["dep:tairix-rt"]

# The package is both the `tairix-ls` listing library (below) and the `Run`
# entry-point binary of the `ls` tool. The binary is a freestanding pure-Rust
# program on the native Tier-1 targets and an inert host stub elsewhere (see
# `src/run.rs`).
[[bin]]
name = "tairix-ls-run"
path = "src/run.rs"

[dependencies]
# The frozen `Errno`, the VFS `FileKind` vocabulary, and the `stdinfo` record
# types for the hidden-entries advisory; `ls` invents no parallel error or
# kind set (§2.2) and never links a kernel or driver crate (§17.4).
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The one path-spelling grammar: `join` places a child inside a directory,
# so this tool carries no second path parser.
tairix-path = { path = "../../../lib/path", version = "=0.0.0" }
# The one help engine: locale fallback, the bounded structured-Markdown
# parser, and the shared own-bundle short-help render the `-h`/`-?`
# switches use (plans/APPS.md §4, §6).
tairix-help = { path = "../../../lib/help", version = "=0.0.0" }
# The one character display-width table (`str_width`), so the multi-column
# layout measures glyph widths through the shared definition every cell grid
# uses — never a second width table (§2.2).
tairix-vt = { path = "../../../lib/vt", version = "=0.0.0" }
# The one terminal-capability judgement: `TERM` → colour depth, and the
# shared `--color[=WHEN]` (`ColorChoice`/`resolve_color`) decision every
# colour-capable tool uses — never a per-tool colour probe (§2.2).
tairix-termcap = { path = "../../../lib/termcap", version = "=0.0.0" }
# The one colour-depth downgrade (`downgrade`): a scheme colour the terminal
# cannot render is reduced through the single shared path (truecolour → 256 →
# 16 → mono), never a second quantiser (§2.2).
tairix-curses = { path = "../../../lib/curses", version = "=0.0.0" }
# The one civil-date calendar (`CivilTime`): the long-format date column and
# `-t` time sort decompose a `Time64` through the shared breakdown every
# date-rendering consumer uses (login clock, fstree stamp), never a second
# copy of the day/time arithmetic (§2.2).
tairix-fsmeta = { path = "../../../lib/fsmeta", version = "=0.0.0" }
# The one filename-glob matcher: the `-I`/`--ignore` and `--hide` patterns
# compile through the shared, bounded, fail-closed matcher the shell's
# filename generation uses — never a second glob engine (§2.2).
tairix-glob = { path = "../../../lib/glob", version = "=0.0.0" }

# For the freestanding `Run` binary only: the userland runtime `tairix-rt`
# (`_start`, canary, panic handler, `mem_map` allocator, the `fs_*` file
# wrappers, and the standard-stream I/O). Pulled in only for the bare-metal
# targets the program is actually built for; on the host it is not linked.
[target.'cfg(target_os = "none")'.dependencies]
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0", optional = true }
# The freestanding `Run` binary also enables the help engine's syscall-backed
# own-bundle `HelpSource` (`BundleHelp`), shared by every command app.
tairix-help = { path = "../../../lib/help", version = "=0.0.0", features = ["rt"] }
