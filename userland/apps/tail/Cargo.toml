[package]
name = "tairix-tail"
description = "TAIRiX `tail` CLI: output the last part of files (`plans/APPS.md` §12.1 Stage C)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# The `Run` binary's freestanding userland runtime (`tairix-rt`) is an
# optional, on-by-default build feature, mirroring `tairix-head` and
# `tairix-cat`. `cargo build -p tairix-tail` builds the tool program with it;
# host tooling builds only the pure *library*, so the host test build never
# pulls the userland runtime's `_start` / `#[global_allocator]` / panic
# handler.
[features]
default = ["program"]
program = ["dep:tairix-rt"]

# The package is both the `tairix-tail` library (the pure parse + streaming
# engine below) and the `Run` entry-point binary of the `tail` tool. The
# binary is a freestanding pure-Rust program on the native Tier-1 targets and
# an inert host stub elsewhere (see `src/run.rs`).
[[bin]]
name = "tairix-tail-run"
path = "src/run.rs"

[dependencies]
# The audited ABI vocabulary: `Errno` for the seam error channel and the
# `stdinfo` record types for the fd-3 advisory.
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The one help engine: locale fallback, the bounded structured-Markdown
# parser, and the shared own-bundle short-help render the `-h`/`-?` switches
# use (plans/APPS.md).
tairix-help = { path = "../../../lib/help", version = "=0.0.0" }
# The shared GNU count-suffix parser and the rolling last-N windows
# (`ByteWindow`/`LineWindow`): the last-N modes retain the requested window,
# the one mechanism the `head` tool also builds on (plans/APPS.md §12.1).
tairix-util = { path = "../../../lib/util", version = "=0.0.0" }

# For the freestanding `Run` binary only: the userland runtime `tairix-rt`
# (`_start`, canary, panic handler, `mem_map` allocator, and the
# standard-stream I/O). Pulled in only for the bare-metal targets the program
# is actually built for; on the host it is not linked.
[target.'cfg(target_os = "none")'.dependencies]
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0", optional = true }
# The freestanding `Run` binary also enables the help engine's syscall-backed
# own-bundle `HelpSource` (`BundleHelp`), shared by every command app.
tairix-help = { path = "../../../lib/help", version = "=0.0.0", features = ["rt"] }
# The `--pid` follow option ends the follow when a process dies; the shared
# System Information process-list client (the one `ps`/`top` use) supplies
# the liveness check over the `sysinfod` IPC transport.
tairix-procinfo = { path = "../../../lib/procinfo", version = "=0.0.0", features = [
    "program",
] }
