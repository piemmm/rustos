[package]
name = "rustos-chown"
description = "RustOS `chown` CLI: change file owner and group (§3 `userland/apps/` — `PLAN.md` Stage 6)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The stable `Errno` is the only thing `chown` needs from the workspace: the
# tool changes a path's owner through an injected filesystem seam that speaks
# the frozen `Errno`, so it invents no parallel error set (§2.2) and never
# links a kernel or driver crate (§17.4).
rustos-abi = { path = "../../../lib/abi", version = "=0.0.0" }
