[package]
name = "tairix-terminal"
description = "TAIRiX terminal emulator: a character-cell screen model fed by an injected shell byte stream and rendered with the shared theme (§10 — PLAN.md Stage 7)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The frozen `Errno` the shell I/O seam reports failures with; the terminal
# invents no parallel error set for the kernel boundary (§2.2) and never links
# a kernel or driver crate (§17.4).
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The single shared ANSI/VT/xterm escape + attribute vocabulary (`plans/CURSES.md`
# C1/C2): the terminal is a *consumer* of `lib/vt`'s `Parser`/`Op`/`Cell`, so
# there is exactly one escape-sequence definition in the tree — never a second,
# divergent parser in this app (`AGENTS.md` §2.2).
tairix-vt = { path = "../../../lib/vt", version = "=0.0.0" }
# Shared integer screen geometry (`Rect`) — the same vocabulary the window
# manager and taskbar use, lifted to `lib/*` so the app reuses it without
# depending on the window manager (§17.4, §2.2).
tairix-geometry = { path = "../../../lib/geometry", version = "=0.0.0" }
# The single shared theme definition (§10): the terminal takes its colours from
# the active theme so it stays consistent with the window manager and taskbar.
tairix-theme = { path = "../../../lib/theme", version = "=0.0.0" }
# Shared software rasteriser (`Color`/`Surface`) — the same premultiplied-alpha
# primitives the window manager paints with, lifted to `lib/*` so the app
# renders its screen into a `Surface` without duplicating the colour algebra
# (§17.4, §2.2).
tairix-raster = { path = "../../../lib/raster", version = "=0.0.0" }
# Shared text rasteriser (`BitmapFont`) — the built-in monospace face and glyph
# blitter, lifted to `lib/*` (§16.4) so the app draws its cells without
# depending on the window manager (§17.4).
tairix-font = { path = "../../../lib/font", version = "=0.0.0" }
# The shared Reactive Alloy control family: the context menu and its anchoring
# rule, the settings sheet's panel/tabs/sliders/selectors/buttons, and the one
# window-furniture inset definition the app sizes its window against — never a
# second copy of a control or of the frame arithmetic.
tairix-controls = { path = "../../../lib/controls", version = "=0.0.0" }
# The shared pointer and keyboard vocabulary the control family is driven with,
# so the app routes input through one definition rather than its own.
tairix-input = { path = "../../../lib/input", version = "=0.0.0" }
# The one `#`-comment configuration grammar every line-oriented TAIRiX store
# shares, so the profile document's comments are recognised exactly as the
# desktop's own settings documents are.
tairix-util = { path = "../../../lib/util", version = "=0.0.0" }

# The package is both the terminal-emulator engine library (above) and the
# `Run` entry-point binary of the on-disk `terminal.app` bundle
# (plans/APPWIN.md AW4): the windowed terminal the desktop session's start
# menu spawns. The binary is a freestanding pure-Rust program on the native
# Tier-1 targets and an inert host stub elsewhere (see `src/run.rs` /
# `build.rs`).
[[bin]]
name = "tairix-terminal-run"
path = "src/run.rs"

# Everything only the freestanding `Run` binary links is pulled in for
# the bare-metal targets it is actually built for; on the host the
# binary is an inert stub with no extra dependencies.
[target.'cfg(target_os = "none")'.dependencies]
# The window-frame pixel codec (`tairix_display::winframe`): the one
# definition of the straight-alpha conversion between this program's own
# surface and the shared frame the desktop session reads, so no app carries a
# private copy of the channel-order decision.
tairix-display = { path = "../../../lib/display", version = "=0.0.0" }
# The app half of the window channel: `WindowClient` (create / present /
# close over the `WindowTransport` seam) and the shared app event-mailbox
# naming rule (`event_endpoint_for`).
tairix-window = { path = "../../../lib/window", version = "=0.0.0" }
# The pure-Rust userland runtime: `_start`, the stack canary, the panic
# handler, the allocator, and the syscall wrappers (`pipe_create` /
# `spawn_attached`, `fs_read` / `fs_write` / `fs_close`, `shm_create` /
# `shm_grant`, `port_bind` / `ipc_recv`, `ipc_call`, `waitset_*`,
# `try_wait`).
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0" }
# The one shared Key+Modifiers → console-byte encoder: the terminal's key
# presses become shell input through the same rule the kernel text sink
# uses, never a second layout table (§2.2).
tairix-keymap = { path = "../../../lib/keymap", version = "=0.0.0" }
# The shared account-authoring policy: `DEFAULT_SHELL`, the one definition
# of the login shell's bundle path, imported rather than respelled (§2.2).
tairix-users = { path = "../../../lib/users", version = "=0.0.0" }
# On the real target the `Run` binary reaches the sandboxed font service over
# the runtime `ipc_call` transport; this augments the host-neutral base
# dependency with the `rt` transport for the bare-metal build only, so host
# tests still inject the mock transport instead.
tairix-font = { path = "../../../lib/font", version = "=0.0.0", features = ["rt"] }
# The System Information client the memory-pressure band is read through, so
# the font client's glyph cache obeys the same band every other cache on the
# machine does.
tairix-procinfo = { path = "../../../lib/procinfo", version = "=0.0.0", features = ["program"] }

# The engine library's host tests draw text, so they inject the shared solid
# test transport (never a running `fontd`) via the `test-util` feature.
[dev-dependencies]
tairix-font = { path = "../../../lib/font", version = "=0.0.0", features = ["test-util"] }
# The control family's own theme fixtures, so a test that varies the desktop's
# typography uses the one shared fixture rather than a private copy.
tairix-controls = { path = "../../../lib/controls", version = "=0.0.0", features = [
    "test-support",
] }

[lints]
workspace = true
