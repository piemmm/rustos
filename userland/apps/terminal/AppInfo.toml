# Signed-AppInfo manifest source for the `terminal` desktop terminal
# emulator (plans/APPWIN.md AW4). Discovered by the build's app-bundle
# composer, which cross-compiles Run, signs the manifest, and plants the
# bundle on the read-only /System/Applications store; the desktop session's
# start menu spawns it (and the shell resolves it by name, like any program
# in either system store).
# The capability list is the bundle's request: CAP_CONSOLE_WRITE for its
# fail-loud stderr diagnostics, CAP_PROC_SPAWN to host the user's shell as
# its own child over pipes (the child receives only the shell's own
# manifest ∩ user-grant authority, never the terminal's), CAP_SHM to
# create and grant the zero-copy window frame region the desktop session
# maps, and CAP_FS_ACCESS to read and rewrite the launching user's own
# terminal profile under their home. The launched process receives this set
# intersected with the launching user's grants, never more, so the profile
# read and write happen under that user's own identity and reach nothing
# they could not already reach.
id = "os.tairix.terminal"
name = "terminal"
version = "0.1.0"
kind = "application"
capabilities = ["CAP_CONSOLE_WRITE", "CAP_FS_ACCESS", "CAP_PROC_SPAWN", "CAP_SHM"]
# A windowed, user-facing application: list it in the desktop's program
# library under the task-shell folder (plans/NEW-TASKBAR.md T3), drawn with
# the bundle's own icon asset (Resources/terminal.png).
library = "SystemTools"
library-icon = "terminal.png"
