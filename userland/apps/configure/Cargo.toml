[package]
name = "rustos-configure"
description = "RustOS `configure` CLI: read and set the boot-time system-configuration store (§3 `userland/apps/` — a plans/APPS.md command app)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# The `Run` binary's freestanding userland runtime (`rustos-rt`) is an
# optional, on-by-default build feature, mirroring `rustos-chmod` and
# `rustos-tee`. `cargo build -p rustos-configure` builds the tool program
# with it; host tooling builds only the configuration *library*, so the host
# test build never pulls the userland runtime's `_start` /
# `#[global_allocator]` / panic handler.
[features]
default = ["program"]
program = ["dep:rustos-rt"]

# The package is both the `rustos-configure` engine library (below) and the
# `Run` entry-point binary of the `configure` tool. The binary is a
# freestanding pure-Rust program on the native Tier-1 targets and an inert
# host stub elsewhere (see `src/run.rs`).
[[bin]]
name = "rustos-configure-run"
path = "src/run.rs"

[dependencies]
# The stable `Errno`: the tool reads and writes the store through an
# injected filesystem seam that speaks the frozen `Errno`, so it invents no
# parallel error set (§2.2) and never links a kernel or driver crate (§17.4).
rustos-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The one help engine: locale fallback, the bounded structured-Markdown
# parser, and the shared own-bundle short-help render the `-h`/`-?`
# switches use (plans/APPS.md §4, §6).
rustos-help = { path = "../../../lib/help", version = "=0.0.0" }
# The one configuration-store engine: the store grammar, the closed key
# registry, the fail-closed parse, and the canonical render this tool
# writes with — shared with every boot-time consumer so producer and
# consumer can never diverge (§2.2).
rustos-sysconfig = { path = "../../../lib/sysconfig", version = "=0.0.0" }

# For the freestanding `Run` binary only: the userland runtime `rustos-rt`
# (`_start`, canary, panic handler, `mem_map` allocator, the `fs_*` file
# wrappers, and the standard-stream I/O). Pulled in only for the bare-metal
# targets the program is actually built for; on the host it is not linked.
[target.'cfg(target_os = "none")'.dependencies]
rustos-rt = { path = "../../../lib/rt", version = "=0.0.0", optional = true }
# The freestanding `Run` binary also enables the help engine's syscall-backed
# own-bundle `HelpSource` (`BundleHelp`), shared by every command app.
rustos-help = { path = "../../../lib/help", version = "=0.0.0", features = ["rt"] }
