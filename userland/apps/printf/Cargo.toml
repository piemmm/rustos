[package]
name = "tairix-printf"
description = "TAIRiX `printf` CLI: format and print data (`plans/APPS.md` §12.1 Stage C)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# The `Run` binary's freestanding userland runtime (`tairix-rt`) is an
# optional, on-by-default build feature, mirroring `tairix-seq` and
# `tairix-head`. `cargo build -p tairix-printf` builds the tool program
# with it; host tooling builds only the pure *library*, so the host test
# build never pulls the userland runtime's `_start` /
# `#[global_allocator]` / panic handler.
[features]
default = ["program"]
program = ["dep:tairix-rt"]

# The package is both the `tairix-printf` library (the pure template +
# argument-conversion engine below) and the `Run` entry-point binary of
# the `printf` tool. The binary is a freestanding pure-Rust program on the
# native Tier-1 targets and an inert host stub elsewhere (see
# `src/run.rs`).
[[bin]]
name = "tairix-printf-run"
path = "src/run.rs"

[dependencies]
# The one help engine: locale fallback, the bounded structured-Markdown
# parser, and the shared own-bundle short-help render the `-h`/`-?`
# switches use (plans/APPS.md).
tairix-help = { path = "../../../lib/help", version = "=0.0.0" }

# The shared C-locale engines: printf floating-point rendering
# (`tairix_util::cfloat`) and `strtod` argument scanning
# (`tairix_util::cnum`), both also consumed by `seq`.
tairix-util = { path = "../../../lib/util", version = "=0.0.0" }

# For the freestanding `Run` binary only: the userland runtime `tairix-rt`
# (`_start`, canary, panic handler, `mem_map` allocator, and the
# standard-stream I/O). Pulled in only for the bare-metal targets the
# program is actually built for; on the host it is not linked.
[target.'cfg(target_os = "none")'.dependencies]
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0", optional = true }
# The freestanding `Run` binary also enables the help engine's
# syscall-backed own-bundle `HelpSource` (`BundleHelp`), shared by every
# command app.
tairix-help = { path = "../../../lib/help", version = "=0.0.0", features = ["rt"] }
