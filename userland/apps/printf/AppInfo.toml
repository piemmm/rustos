# Signed-AppInfo manifest source for the `printf` command app
# (plans/APPS.md deliverable 8). Discovered by the build's app-bundle
# composer; the capability list is the bundle's request, intersected with
# the launching user's grants. Console write covers the inherited
# standard streams (the tool writes formatted data and diagnostics and
# never prompts); CAP_FS_ACCESS covers reading its own bundle's Help/
# documents through the secured VFS.
id = "os.tairix.printf"
name = "printf"
version = "0.1.0"
kind = "command"
capabilities = ["CAP_CONSOLE_WRITE", "CAP_FS_ACCESS"]
