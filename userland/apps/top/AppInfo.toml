# Signed-AppInfo manifest source for the `top` command app
# (plans/APPS.md deliverable 8). Discovered by the build's app-bundle
# composer; the capability list is the bundle's request, intersected with
# the launching user's grants. CAP_CONSOLE_WRITE drives the full-screen
# display on fd 1; CAP_CONSOLE_READ the raw-mode keystrokes on fd 0 (it
# also authorises the tool's stream_echo suppression).
id = "os.rustos.top"
name = "top"
version = "0.1.0"
kind = "command"
capabilities = ["CAP_CONSOLE_WRITE", "CAP_CONSOLE_READ"]
