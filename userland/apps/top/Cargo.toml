[package]
name = "tairix-top"
description = "TAIRiX `top`: a live process-overview TUI over the System Information API, drawn with the OS curses library (§3 `userland/apps/` — `plans/CURSES.md` Stage C5)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# The `Run` binary's freestanding userland runtime (`tairix-rt`) is an
# optional, on-by-default build feature, mirroring `tairix-ps`. `cargo build -p
# tairix-top` builds the tool program with it; host tooling builds only the
# request/render *library*, so the host test build never pulls the userland
# runtime's `_start` / `#[global_allocator]` / panic handler.
[features]
default = ["program"]
program = ["dep:tairix-rt"]

# The package is both the `tairix-top` viewer library (below) and the `Run`
# entry-point binary of the `top` tool. The binary is a freestanding pure-Rust
# program on the native Tier-1 targets and an inert host stub elsewhere (see
# `src/run.rs`).
[[bin]]
name = "tairix-top-run"
path = "src/run.rs"

[dependencies]
# The frozen `Errno` plus the `sysinfo-v1` `ProcessRecord` the viewer renders;
# `top` invents no parallel error set (§2.2) and never links a kernel or
# driver crate (§17.4).
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The shared System Information API client helpers: the request/response
# seams, the capability-aware call mapping, and the process-list paging +
# columnar row rendering shared with the `sysinfo` and `ps` tools. `top`
# consumes these rather than duplicating them (§2.2, §16.6).
tairix-procinfo = { path = "../../../lib/procinfo", version = "=0.0.0" }
# The OS-provided Terminal/TUI library (§16.4): the curses screen model,
# minimal-diff renderer, and typed input. `top` draws through it instead of
# emitting escape sequences by hand (§2.2).
tairix-curses = { path = "../../../lib/curses", version = "=0.0.0" }
# The closed `TermType` set the screen driver is configured with (the honest
# terminal the session advertises).
tairix-termcap = { path = "../../../lib/termcap", version = "=0.0.0" }
# The shared escape/attribute vocabulary: `top` styles cells with
# `tairix_vt::Attributes`/`Color`, the one vocabulary the renderer emits
# (§2.2).
tairix-vt = { path = "../../../lib/vt", version = "=0.0.0" }
# The one help engine: locale fallback, the bounded structured-Markdown
# parser, and the shared own-bundle short-help render the `-h`/`-?`
# switches use (plans/APPS.md §4, §6).
tairix-help = { path = "../../../lib/help", version = "=0.0.0" }

# For the freestanding `Run` binary only: the userland runtime `tairix-rt`
# (`_start`, canary, panic handler, `mem_map` allocator, syscall/`ipc_call`
# wrappers, the `terminal_size` observer, `stdin`/`stdout`/`set_echo`) and the
# production `sysinfo` transport seam in `lib/procinfo` (`IpcTransport`),
# enabled through `tairix-procinfo`'s own `program` feature. Both are pulled in
# only for the bare-metal targets the program is actually built for; on the
# host neither is linked.
[target.'cfg(target_os = "none")'.dependencies]
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0", optional = true }
tairix-procinfo = { path = "../../../lib/procinfo", version = "=0.0.0", features = [
    "program",
] }
# The freestanding `Run` binary also enables the curses library's shared
# standard-streams `Tty` (`StreamTty`), the one channel definition every
# full-screen tool links instead of a per-app copy.
tairix-curses = { path = "../../../lib/curses", version = "=0.0.0", features = [
    "program",
] }
# The freestanding `Run` binary also enables the help engine's syscall-backed
# own-bundle `HelpSource` (`BundleHelp`), shared by every command app.
tairix-help = { path = "../../../lib/help", version = "=0.0.0", features = ["rt"] }
