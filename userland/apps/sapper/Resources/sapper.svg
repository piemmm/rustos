<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>Sapper</title>
  <!-- A red pennant planted on a minefield, with one mine uncovered beside it.
       Every shape is a filled polygon or circle and every curve is cut as
       integer line segments, because the desktop's SVG subset draws fills
       rather than strokes — an outline is a slightly larger fill behind the
       shape it edges.

       The palette is weighted to read against the dark theme's raised
       surface, which the icon bar draws it on: the tile is the mid-bright
       blue the folder artwork uses, the gutters a clear step darker than the
       tile rather than near-black, and the mine dark against a light
       uncovered cell. -->

  <!-- Tile: rounded square, corners cut as integer line segments -->
  <polygon fill="#648BD8" points="20,60 22,44 30,31 43,22 60,20 196,20 213,22 226,31 234,44 236,60 236,196 234,213 226,226 213,234 196,236 60,236 43,234 30,226 22,213 20,196"/>
  <polygon fill="#82A2E3" points="20,60 22,44 30,31 43,22 60,20 196,20 213,22 226,31 234,44 236,60 236,84 20,84"/>

  <!-- The field, as the grid a covered board reads by: four gutters cut in the
       darker colour beneath -->
  <polygon fill="#385494" points="20,124 236,124 236,132 20,132"/>
  <polygon fill="#385494" points="124,84 132,84 132,236 124,236"/>

  <!-- One cell already uncovered, drawn lighter exactly as the game draws an
       opened cell, so the mine on it has something to read against -->
  <polygon fill="#96B8E3" points="20,132 124,132 124,236 60,236 43,234 30,226 22,213 20,196"/>

  <!-- The mine: eight thin spikes, then a lit rim the dark disc sits inside,
       so it reads as a sphere rather than a cog -->
  <polygon fill="#121B30" points="67,138 77,138 77,222 67,222"/>
  <polygon fill="#121B30" points="30,175 114,175 114,185 30,185"/>
  <polygon fill="#121B30" points="38,154 46,146 106,206 98,214"/>
  <polygon fill="#121B30" points="98,146 106,154 46,214 38,206"/>
  <circle cx="72" cy="180" r="30" fill="#D2E7F9"/>
  <circle cx="72" cy="180" r="26" fill="#121B30"/>
  <circle cx="63" cy="171" r="7" fill="#F3F8FC"/>

  <!-- The pennant, planted across the two right-hand cells. The flag carries a
       dark edge because the red and the tile are close in weight. -->
  <polygon fill="#121B30" points="134,208 210,208 202,226 142,226"/>
  <polygon fill="#121B30" points="164,32 178,32 178,214 164,214"/>
  <polygon fill="#121B30" points="164,34 56,78 164,122"/>
  <polygon fill="#E5484D" points="164,42 72,78 164,114"/>
</svg>
