# Signed-AppInfo manifest source for the `ss` command app
# (plans/NETWORK.md N8b-2). Discovered by the build's app-bundle composer;
# the capability list is the bundle's request, intersected with the
# launching user's grants. CAP_CONSOLE_WRITE covers the inherited standard
# output/error streams; CAP_FS_ACCESS reads the tool's own bundle payload
# (its Help/ documents) through the secured VFS; CAP_SYSINFO_GLOBAL gates the
# NET_SOCKETS query the listing is rendered from — the socket table names
# every principal's sockets and every connection's peer address, so it is a
# privileged system-wide diagnostic (never open by default), and a refusal is
# reported on stderr and the tool exits rather than fabricating an empty
# list. It reads no standard input.
id = "os.tairix.ss"
name = "ss"
version = "0.1.0"
kind = "command"
capabilities = ["CAP_CONSOLE_WRITE", "CAP_FS_ACCESS", "CAP_SYSINFO_GLOBAL"]
