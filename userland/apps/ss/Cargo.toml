[package]
name = "tairix-ss"
description = "TAIRiX `ss` CLI: list open sockets, iproute2-style (`plans/NETWORK.md` N8b-2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# The `Run` binary's freestanding userland runtime (`tairix-rt`) is an
# optional, on-by-default build feature, mirroring `tairix-df`. `cargo build
# -p tairix-ss` builds the tool program with it; host tooling builds only the
# pure *library*, so the host test build never pulls the userland runtime's
# `_start` / `#[global_allocator]` / panic handler.
[features]
default = ["program"]
program = ["dep:tairix-rt"]

# The package is both the `tairix-ss` library (the pure select + render
# engine below) and the `Run` entry-point binary of the `ss` tool. The binary
# is a freestanding pure-Rust program on the native Tier-1 targets and an
# inert host stub elsewhere (see `src/run.rs`).
[[bin]]
name = "tairix-ss-run"
path = "src/run.rs"

[dependencies]
# The audited ABI vocabulary: `Errno`, the `NetSocketRecord` socket row, its
# `NetSockProto`/`NetSockState`/`NetAddrFamily` enums, and the fd-3 advisory
# record.
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The one help engine: locale fallback, the bounded structured-Markdown
# parser, and the shared own-bundle short-help render the `-?`/`--help`
# switches use (plans/APPS.md).
tairix-help = { path = "../../../lib/help", version = "=0.0.0" }
# The shared System Information API client: the `NET_SOCKETS` paging walk
# (`for_each_net_socket`) — never a second query client.
tairix-procinfo = { path = "../../../lib/procinfo", version = "=0.0.0" }

# For the freestanding `Run` binary only: the userland runtime `tairix-rt`
# (`_start`, canary, panic handler, `mem_map` allocator, and the
# standard-stream I/O). Pulled in only for the bare-metal targets the program
# is actually built for; on the host it is not linked.
[target.'cfg(target_os = "none")'.dependencies]
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0", optional = true }
# The freestanding `Run` binary also enables the help engine's syscall-backed
# own-bundle `HelpSource` (`BundleHelp`) and the shared production client
# seams in `lib/procinfo` (`IpcTransport`), enabled through its `program`
# feature exactly as `df` does.
tairix-help = { path = "../../../lib/help", version = "=0.0.0", features = ["rt"] }
tairix-procinfo = { path = "../../../lib/procinfo", version = "=0.0.0", features = ["program"] }
