# Signed-AppInfo manifest source for the `head` command app
# (plans/APPS.md deliverable 8). Discovered by the build's app-bundle
# composer; the capability list is the bundle's request, intersected with
# the launching user's grants. The console pair covers the inherited
# standard streams (`-` and the no-operand default read standard input);
# CAP_FS_ACCESS is the tool's job — reading its file operands (and its own
# bundle's Help/ documents) through the secured VFS.
id = "os.tairix.head"
name = "head"
version = "0.1.0"
kind = "command"
capabilities = ["CAP_CONSOLE_WRITE", "CAP_CONSOLE_READ", "CAP_FS_ACCESS"]
# This bundle's own 256x256 icon master in its Resources/ (plans/ICONS.md).
library-icon = "head.png"
