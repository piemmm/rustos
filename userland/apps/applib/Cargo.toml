[package]
name = "tairix-applib"
description = "TAIRiX `applib` CLI: administer the desktop's program-library catalog (§3 `userland/apps/` — a plans/NEW-TASKBAR.md command app)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# The `Run` binary's freestanding userland runtime (`tairix-rt`) is an
# optional, on-by-default build feature, mirroring `tairix-configure`.
# `cargo build -p tairix-applib` builds the tool program with it; host
# tooling builds only the catalog-admin *library*, so the host test build
# never pulls the userland runtime's `_start` / `#[global_allocator]` /
# panic handler.
[features]
default = ["program"]
program = ["dep:tairix-rt"]

# The package is both the `tairix-applib` engine library (below) and the
# `Run` entry-point binary of the `applib` tool. The binary is a
# freestanding pure-Rust program on the native Tier-1 targets and an inert
# host stub elsewhere (see `src/run.rs`).
[[bin]]
name = "tairix-applib-run"
path = "src/run.rs"

[dependencies]
# The stable ABI: the frozen `Errno` the injected seams speak, the signed
# `AppInfo` manifest decoder the `add`/`rescan` bundle reads go through
# (`AppInfoHeader`, `LibraryCategory`), the app-store path spellings, and
# the `stdinfo` record type for the fd-3 advisory records. Never a kernel
# or driver crate (§17.4).
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The one help engine: locale fallback, the bounded structured-Markdown
# parser, and the shared own-bundle short-help render the `-h`/`-?`
# switches use (plans/APPS.md §4, §6).
tairix-help = { path = "../../../lib/help", version = "=0.0.0" }
# The one program-library catalog engine: the folder taxonomy, the entry
# model, the store grammar, the fail-closed parse, the canonical render,
# the machine ∪ overlay merge, and the discovery reconcile this tool
# administers — shared with the image builder and the desktop session so a
# writer and its readers can never diverge (§2.2).
tairix-proglib = { path = "../../../lib/proglib", version = "=0.0.0" }

# For the freestanding `Run` binary only: the userland runtime `tairix-rt`
# (`_start`, canary, panic handler, `mem_map` allocator, the `fs_*` file
# wrappers, and the standard-stream I/O). Pulled in only for the bare-metal
# targets the program is actually built for; on the host it is not linked.
[target.'cfg(target_os = "none")'.dependencies]
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0", optional = true }
# The freestanding `Run` binary also enables the help engine's syscall-backed
# own-bundle `HelpSource` (`BundleHelp`), shared by every command app.
tairix-help = { path = "../../../lib/help", version = "=0.0.0", features = ["rt"] }
