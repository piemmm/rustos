[package]
name = "tairix-fstree"
description = "TAIRiX `fstree`: the full-screen, XTree Gold-style tree file manager, drawn with the OS curses library."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# The `Run` binary's freestanding userland runtime (`tairix-rt`) is an
# optional, on-by-default build feature, mirroring `tairix-vim`. `cargo build
# -p tairix-fstree` builds the tool program with it; host tooling builds only
# the file-manager *library*, so the host test build never pulls the userland
# runtime's `_start` / `#[global_allocator]` / panic handler.
[features]
default = ["program"]
program = ["dep:tairix-rt", "tairix-sandbox/program"]

# The package is both the `tairix-fstree` library (below) and the `Run`
# entry-point binary of the `fstree` tool. The binary is a freestanding pure-
# Rust program on the native Tier-1 targets and an inert host stub elsewhere
# (see `src/run.rs`).
[[bin]]
name = "tairix-fstree-run"
path = "src/run.rs"

[dependencies]
# The frozen `Errno`, `FileKind`, and `Time64` vocabulary the file seam
# reports; `fstree` invents no parallel error or time set and never links a
# kernel or driver crate.
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The OS-provided Terminal/TUI library: the curses screen model,
# minimal-diff renderer, and typed input. `fstree` draws through it instead
# of emitting escape sequences by hand.
tairix-curses = { path = "../../../lib/curses", version = "=0.0.0" }
# The closed `TermType` set the screen driver is configured with (the honest
# terminal the session advertises).
tairix-termcap = { path = "../../../lib/termcap", version = "=0.0.0" }
# The shared escape/attribute vocabulary: `fstree` styles cells with
# `tairix_vt::Attributes`, the one vocabulary the renderer emits.
tairix-vt = { path = "../../../lib/vt", version = "=0.0.0" }
# The one help engine: locale fallback, the bounded structured-Markdown
# parser, and the shared own-bundle short-help render the `-h`/`-?`
# switches and the in-app `?` overlay use (plans/APPS.md).
tairix-help = { path = "../../../lib/help", version = "=0.0.0" }
# The one path grammar: the destination the copy/move prompt takes is
# parsed and normalised through it (relative spellings joined onto the
# listed directory), never by a second in-app path parser.
tairix-path = { path = "../../../lib/path", version = "=0.0.0" }
# The one filename-glob matcher: tag-by-pattern (`T`) compiles and matches
# through it, never a second in-app wildcard matcher.
tairix-glob = { path = "../../../lib/glob", version = "=0.0.0" }
# The one filename-completion engine: the destination prompts' Tab
# completion applies its path-candidate policy and common-prefix
# discipline, never a second in-app engine.
tairix-complete = { path = "../../../lib/complete", version = "=0.0.0" }
# The one civil-date calendar: the mtime column's date render and the
# date-range tag bounds both convert through it, never an in-app copy.
tairix-fsmeta = { path = "../../../lib/fsmeta", version = "=0.0.0" }
# The parser-sandbox seam: the disassembly viewer's container summaries,
# manifest summaries, and instruction windows are decoded only by the
# sandboxed decode service, never in this process.
tairix-sandbox = { path = "../../../lib/sandbox", version = "=0.0.0" }
# The structured-event vocabulary the sandbox containment events are
# logged through (the `Sink` the decode seam is generic over).
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }
# Magic-prefix recognition only (`detect`): which files route to the
# disassembly viewer. Every actual container decode runs in the sandbox.
tairix-binfmt = { path = "../../../lib/binfmt", version = "=0.0.0" }
# The app-data client: the one way this application reaches its own
# preferences. The store is gated on the kernel-attested bundle identity, so
# the confirmation settings are private to `fstree` and no other app the user
# launches can read or rewrite them — and no path, user, or bundle identifier
# is spelled here.
tairix-appdata = { path = "../../../lib/appdata", version = "=0.0.0" }

# For the freestanding `Run` binary only: the userland runtime `tairix-rt`
# (`_start`, canary, panic handler, `mem_map` allocator, the syscall
# wrappers, `terminal_size`, `stdin`/`stdout`/`set_input_mode`, and the
# kernel-authorised `fs_*` view the file seam is built on). Pulled in only
# for the bare-metal targets the program is actually built for; on the host
# it is not linked.
[target.'cfg(target_os = "none")'.dependencies]
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0", optional = true }
# The shared System Information API client: the one mount-list walk the
# status line's volume free-space figure rides (best-effort, `MOUNT_LIST`).
tairix-procinfo = { path = "../../../lib/procinfo", version = "=0.0.0", features = ["program"] }
# The freestanding `Run` binary also enables the help engine's
# syscall-backed own-bundle `HelpSource` (`BundleHelp`), shared by every
# command app.
tairix-help = { path = "../../../lib/help", version = "=0.0.0", features = ["rt"] }
# The freestanding `Run` binary also enables the curses library's shared
# standard-streams `Tty` (`StreamTty`), the one channel definition every
# full-screen tool links instead of a per-app copy.
tairix-curses = { path = "../../../lib/curses", version = "=0.0.0", features = [
    "program",
] }
# On the real target the `Run` binary reaches the app-data service and its own
# bundle's shipped defaults over the runtime syscalls; this augments the
# host-neutral base dependency with that host for the bare-metal build only, so
# host tests still drive the client over their own fake.
tairix-appdata = { path = "../../../lib/appdata", version = "=0.0.0", features = ["rt"] }

# The shared fake app-data service the preference registry's host tests drive
# the client over: it speaks the real `appdata-v1` codec, so a test exercises
# the wire the service actually answers rather than a mock of it.
[dev-dependencies]
tairix-appdata = { path = "../../../lib/appdata", version = "=0.0.0", features = [
    "test-util",
] }
# The store's own key grammar, so the preference registry is checked against
# the one definition rather than a restatement of it.
tairix-appconf = { path = "../../../lib/appconf", version = "=0.0.0" }
