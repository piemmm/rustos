# Signed-AppInfo manifest source for the `fstree` command app
# (plans/APPS.md deliverable 8, plans/APPS.md). Discovered by
# the build's app-bundle composer; the capability list is the bundle's
# request, intersected with the launching user's grants. CAP_CONSOLE_WRITE
# drives the full-screen display on fd 1; CAP_CONSOLE_READ the raw-mode
# keystrokes on fd 0 (it also authorises the tool's stream_echo
# suppression). CAP_FS_ACCESS is the file manager's job — listing
# directories and reading file metadata (and reading its own bundle's
# Help/ documents) through the secured VFS, which still authorises every
# path per-inode under the caller's attested identity. CAP_PROC_SPAWN
# re-spawns this same binary as the parser-sandbox decode worker
# (docs/src/security/sandbox.md): the disassembly viewer's container and
# instruction decoding runs there, never in this process.
id = "os.tairix.fstree"
name = "fstree"
version = "0.1.0"
kind = "command"
capabilities = ["CAP_CONSOLE_WRITE", "CAP_CONSOLE_READ", "CAP_FS_ACCESS", "CAP_PROC_SPAWN"]
# This bundle's own 256x256 icon master in its Resources/ (plans/ICONS.md).
library-icon = "fstree.png"
