[package]
name = "tairix-desktop-session"
description = "TAIRiX desktop session glue: owns the shared theme registry and the taskbar model, loads and merges the program-library catalog, and resolves taskbar responses (launch, files, tasks) with the capabilities the bar cannot hold (§10 — PLAN.md Stage 7)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The single shared theme definition (§10): the session owns the runtime
# `ThemeRegistry`, performs the light/dark switch on it, and hands the active
# theme out to the rest of the desktop. `lib/theme` is the one definition the
# window manager, taskbar, and apps all read (§6, §17.4).
tairix-theme = { path = "../../../lib/theme", version = "=0.0.0" }
# The taskbar model (§10): the session owns it so it can re-theme the bar in
# place on a runtime switch and hand its program-library popup the resolved
# catalog the bar cannot read itself. Composing two GUI crates is the
# permitted `userland/gui/*` edge (§17.4).
tairix-taskbar = { path = "../taskbar", version = "=0.0.0" }
# The compositing window manager (§10): the session presents the taskbar bar
# and its program-library popup as compositor windows, placed and rounded
# through the window manager's single anti-aliased rounded-corner path (§2.2).
# Composing two GUI crates is the permitted `userland/gui/*` edge (§17.4).
tairix-wm = { path = "../wm", version = "=0.0.0" }
# The window-frame pixel codec (`winframe`): the one definition of the
# straight-alpha conversion between an app's presented frame and the
# compositor's own window surface, beside the channel-order decision the
# scan-out path already owns. The session drives the decode direction across
# the compositor's own participants. (The `rt` feature — the syscall-backed
# `ShmMapper` and the display client — is added for the freestanding build
# below; the library half needs only the codec.)
tairix-display = { path = "../../../lib/display", version = "=0.0.0" }
# The program-library catalog engine (plans/NEW-TASKBAR.md): the session
# reads the machine store and the user's overlay under its own identity,
# merges them through the one shared `merge`, and resolves a popup launch's
# `EntryId` back to its bundle path. The bar itself never touches the VFS.
tairix-proglib = { path = "../../../lib/proglib", version = "=0.0.0" }
# The shared reclaimable-memory model (plans/SMARTRAM.md SMART5): the
# session is the party that knows the output's frame size, the seat, and the
# process pressure gauge, so it builds the window manager's cursor cache and
# the taskbar's glyph cache from the one classified, budgeted, band-governed
# desktop policy and hands each crate its ready-made cache (§2.2, §24.1).
tairix-reclaim = { path = "../../../lib/reclaim", version = "=0.0.0" }
# The one structured-logging surface (§5.4): the caches audit a
# classification refusal or a detected ledger defect through it.
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }
# The shared System Information client (§16.6): the session reads the
# ungated memory-pressure band through it when the kernel wakes the loop on
# a band change, rather than opening a second query path of its own (§2.2).
tairix-procinfo = { path = "../../../lib/procinfo", version = "=0.0.0" }
# The compositing worker pool the session sizes from the discovered online CPU
# count and hands to the compositor. The default `pool` feature is what makes
# this the one place in the desktop that creates a thread.
tairix-parallel = { path = "../../../lib/parallel", version = "=0.0.0" }
# The shared pixel surface: an application's sandbox-rasterised icon artwork
# is rebuilt into the premultiplied surface the taskbar's shared control blits
# (one colour-algebra home).
tairix-raster = { path = "../../../lib/raster", version = "=0.0.0" }
# The one logical->physical UI scale (§10): the picker resolves the theme's
# authored text sizes to physical cell heights through `Scale`, the same shared
# conversion the window manager and taskbar use.
tairix-geometry = { path = "../../../lib/geometry", version = "=0.0.0" }
# The cursor and icon set builders (§10): the session reads the desktop's
# on-disk SVG assets from `/System/Graphics` and builds a `CursorTheme` /
# `IconSet` for the window manager and taskbar. The decode/fallback logic
# lives in these `lib/*` crates; the session only owns the filesystem
# capability to read the bytes (§17.4 / §19.5).
tairix-cursor = { path = "../../../lib/cursor", version = "=0.0.0" }
tairix-icon = { path = "../../../lib/icon", version = "=0.0.0" }
# The kernel-boundary `Errno` returned by the filesystem-read seam (§5.4).
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The window-channel protocol engine (plans/APPWIN.md AW2/AW3): the session
# composes `WindowServer` over the `WindowHost` bridge in `src/windows.rs`,
# serving app windows from the reserved WINDOW_ENDPOINT into the compositor.
tairix-window = { path = "../../../lib/window", version = "=0.0.0" }
# The one shared directory-browser engine (plans/APPWIN.md AW5): the trusted
# file picker in `src/picker.rs` composes the same `Browser`/`render` the
# files app drives, so the picker and the file manager can never diverge in
# navigation semantics, listing policy, or look (§2.2, §6).
tairix-browse = { path = "../../../lib/browse", version = "=0.0.0" }
# The one civil-date calendar (`CivilTime`): the taskbar clock breaks a
# wall-clock instant into UTC calendar fields through the same decomposition
# `ls`'s date column and the login clock read, never a second copy of the
# day/minute arithmetic (§2.2).
tairix-fsmeta = { path = "../../../lib/fsmeta", version = "=0.0.0" }
# The one shared filesystem name rule (plans/SYMLINKS.md S5): the desktop
# validates a shortcut's name through `validate_file_name`, the same rule a
# typed folder or rename name obeys, rather than carrying a second opinion
# about what a name may be (§2.2).
tairix-path = { path = "../../../lib/path", version = "=0.0.0" }
# The shared text rasteriser: the trusted file picker renders (and hit-tests)
# its listing at the theme's font size, so it resolves the `BitmapFont` it
# hands to `tairix_browse::render` (§2.2).
tairix-font = { path = "../../../lib/font", version = "=0.0.0" }
# The one authentication surface (plans/NEW-DESKTOP-LOGIN.md G2): the screen
# lock is that surface with the account fixed to this session's own, so the
# panel, masked field, wording, and geometry are the engine's and this crate
# owns only the window, the event routing, and the elevation broker behind
# the verdict seam.
tairix-greeter = { path = "../../../lib/greeter", version = "=0.0.0" }
# The shared control vocabulary (plans/NEW-TASKBAR.md T11): the Switchboard
# command-channel glue relays the `Section` the taskbar's own capsule
# gesture already chose onto the wire, rather than re-deciding which panel
# section a press opens on a second time.
tairix-controls = { path = "../../../lib/controls", version = "=0.0.0" }
# The pinboard settings engine (plans/PINBOARD.md): the desktop model owns the
# user's `PinboardSettings` — the wallpaper, its fit, the backdrop colour, and
# the icon arrangement/sort — so the session has one owner of them and the
# shell reads them from the desktop rather than keeping a second copy.
tairix-wallpaper = { path = "../../../lib/wallpaper", version = "=0.0.0" }

[dev-dependencies]
# The shared help engine's required-locale registry: the `cli` module's
# pin test verifies every locale's `OPTIONS` section documents exactly the
# switches the parser accepts (plans/APPS.md).
tairix-help = { path = "../../../lib/help", version = "=0.0.0" }
# The trusted picker's host tests draw text, so they inject the shared solid
# test transport via the `test-util` feature (never a running `fontd`).
tairix-font = { path = "../../../lib/font", version = "=0.0.0", features = ["test-util"] }

# The package is both the desktop-session glue library (above) and the `Run`
# entry-point binary of the desktop session service (`plans/DISPLAY.md` D7c):
# the live graphical session that acquires the boot seat, brings the display
# client up over the reserved DISPLAY_ENDPOINT (query → shm double buffer →
# grant → configure), parks on its SeatInput wait-set, drains the seat's
# pointer/keyboard channels into the DesktopShell pump, and presents the
# composited damage zero-copy. The binary is a freestanding pure-Rust program
# on the native Tier-1 targets and an inert host stub elsewhere
# (see `src/run.rs` / `build.rs`).
[[bin]]
name = "tairix-desktop-session-run"
path = "src/run.rs"

# Everything only the freestanding `Run` binary links is pulled in for the
# bare-metal targets it is actually built for; on the host the binary is an
# inert stub with no extra dependencies.
[target.'cfg(target_os = "none")'.dependencies]
# The browser engine's production symbolic-link reader (`RtLinkReader`): the
# `fs_readlink` + resolving `fs_stat` pair a listed link needs, written once in
# `lib/browse` so no surface carries its own copy of those two calls.
tairix-browse = { path = "../../../lib/browse", version = "=0.0.0", features = ["rt"] }
# The display-client half of the zero-copy present protocol: `DisplayClient`
# (query/configure/present over the `DisplayTransport` seam) and
# `RemoteDisplay` (the `Display` trait over the client's own frame mapping,
# with the per-frame stale-damage double-buffer bookkeeping).
tairix-display = { path = "../../../lib/display", version = "=0.0.0", features = ["rt"] }
# The `CapabilitySet` wire images the reserved window-endpoint bind
# marshals (empty sender/receiver sets: the engine attests every caller).
tairix-caps = { path = "../../../lib/caps", version = "=0.0.0" }
# The pure-Rust userland runtime (`AGENTS.md` §1): `_start`, the stack
# canary, the panic handler, the allocator, and the syscall wrappers
# (`display_acquire`, `pointer_read`/`keyboard_read`, `shm_create`/
# `shm_grant`, `ipc_call`, `waitset_*`). TAIRiX is Rust-only, so the session
# links this runtime, never the C ABI (`AGENTS.md` §16.4).
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0" }
# The one help engine: the syscall-backed own-bundle `HelpSource`
# (`BundleHelp`) and the shared short-help render the `-h`/`-?` switches
# use, exactly as every other command app (plans/APPS.md).
tairix-help = { path = "../../../lib/help", version = "=0.0.0", features = ["rt"] }
# On the real target the session reaches the sandboxed font service over the
# runtime `ipc_call` transport; the base dependency stays host-neutral so host
# tests inject the mock transport instead.
tairix-font = { path = "../../../lib/font", version = "=0.0.0", features = ["rt"] }
# The parser-sandbox seam: untrusted bundle icon bytes (SVG or PNG) are
# decoded and rasterised in a capability-empty worker process (the session's
# own binary re-entered in worker mode via the `program` feature), never in
# the session's address space. Host tests fake the `IconRasteriser` seam
# instead.
tairix-sandbox = { path = "../../../lib/sandbox", version = "=0.0.0", features = ["program"] }
# On the real target the session reads the ungated memory-pressure band over
# the shared System Information client's production `ipc_call` transport
# (`IpcTransport`, behind its `program` feature, exactly as `lspci` does);
# the base dependency stays host-neutral so host tests need no transport.
tairix-procinfo = { path = "../../../lib/procinfo", version = "=0.0.0", features = ["program"] }

[lints]
workspace = true
