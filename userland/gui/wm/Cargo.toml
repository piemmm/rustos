[package]
name = "rustos-wm"
description = "RustOS compositing window manager."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
rustos-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The shared integer screen geometry (§6, §17.4): `Point`/`Rect` are defined
# once in `lib/geometry` and re-exported here, so the taskbar and apps — which
# may not depend on the window manager — reuse the same vocabulary (§2.2).
rustos-geometry = { path = "../../../lib/geometry", version = "=0.0.0" }
# The shared desktop theme definition (§10): the compositor sources its
# root background colour, and windows their corner radii, from the active
# theme. `lib/theme` is the single source the taskbar and apps read too, so
# the colours stay consistent without any sibling-crate dependency (§17.4).
rustos-theme = { path = "../../../lib/theme", version = "=0.0.0" }

[lints]
workspace = true
