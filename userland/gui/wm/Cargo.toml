[package]
name = "tairix-wm"
description = "TAIRiX compositing window manager."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The shared software rasteriser (§6, §17.4): the premultiplied-alpha
# `Color`/`Pixel` algebra and the `Surface` pixel buffer are defined once in
# `lib/raster` and re-exported here, so the taskbar — which may not depend on
# the window manager — paints into the same surface type without duplicating
# the colour algebra (§2.2).
tairix-raster = { path = "../../../lib/raster", version = "=0.0.0" }
# The shared integer screen geometry (§6, §17.4): `Point`/`Rect` are defined
# once in `lib/geometry` and re-exported here, so the taskbar and apps — which
# may not depend on the window manager — reuse the same vocabulary (§2.2).
tairix-geometry = { path = "../../../lib/geometry", version = "=0.0.0" }
# The shared desktop theme definition (§10): the compositor sources its
# root background colour, and windows their corner radii, from the active
# theme. `lib/theme` is the single source the taskbar and apps read too, so
# the colours stay consistent without any sibling-crate dependency (§17.4).
tairix-theme = { path = "../../../lib/theme", version = "=0.0.0" }
# The shared pointer-cursor library (§10, §17.4): the compositor resolves a
# `CursorKind` to a scalable, colourful vector cursor and composites the
# rasterised `CursorImage` as a top overlay. The cursor format lives in
# `lib/cursor`, not the window manager, so a different cursor set is data
# (§2.2 / §2.4).
tairix-cursor = { path = "../../../lib/cursor", version = "=0.0.0" }
# The shared pointer input-event vocabulary (§6, §17.4): `PointerButton` and
# `InputEvent` are defined once in `lib/input` and re-exported here, so the
# taskbar — which may not depend on the window manager — routes the same
# device events without duplicating the vocabulary (§2.2).
tairix-input = { path = "../../../lib/input", version = "=0.0.0" }

[lints]
workspace = true
