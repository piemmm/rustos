[package]
name = "rustos-taskbar"
description = "RustOS traditional desktop taskbar: edge-pinned layout, start menu with session controls, running-task list, and notification area + clock (§10 — PLAN.md Stage 7)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Shared integer screen geometry (`Point`/`Rect`) — the same vocabulary the
# window manager uses, lifted to `lib/*` so the taskbar reuses it without
# depending on the window manager (§17.4, §2.2).
rustos-geometry = { path = "../../../lib/geometry", version = "=0.0.0" }
# Shared pointer input-event vocabulary (`PointerButton`/`InputEvent`) — the
# same device events the window manager routes, lifted to `lib/*` so the
# taskbar routes them to its regions without depending on the window manager
# (§17.4, §2.2).
rustos-input = { path = "../../../lib/input", version = "=0.0.0" }
# Shared software rasteriser (`Color`/`Surface`) — the same premultiplied-alpha
# primitives the window manager paints with, lifted to `lib/*` so the taskbar
# renders its regions into a `Surface` without depending on the window manager
# and without duplicating the colour algebra (§17.4, §2.2).
rustos-raster = { path = "../../../lib/raster", version = "=0.0.0" }
# Shared text rasteriser (`BitmapFont`) — the built-in bitmap face and glyph
# blitter, lifted to `lib/*` (§16.4) so the taskbar draws the clock and task
# titles without depending on the window manager (§17.4).
rustos-font = { path = "../../../lib/font", version = "=0.0.0" }
# The single shared theme definition (§10): the taskbar takes its corner
# radius (and, in later increments, colours/fonts) from the active theme so
# it stays consistent with the window manager and apps.
rustos-theme = { path = "../../../lib/theme", version = "=0.0.0" }

[lints]
workspace = true
