# `cargo deny` policy for RustOS.
#
# This file is consumed by `cargo deny check` (invoked by `cargo xtask ci`).
# It enforces the project's license, advisory, source, and ban policy.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# Only OSI-approved licences compatible with the RustOS dual licence.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.92
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
# Crates explicitly forbidden by `AGENTS.md` §1: hand-rolled crypto and
# unaudited globals. Extend this list when a problem dependency is found.
deny = []
skip = []
skip-tree = []

# Stage 2.7 follow-up (f6): the production `rustos-kernel` crate must
# **never** grow a `test-hooks` (or similarly-named) Cargo feature.
# Test affordances live in sibling integration-test crates under
# `tests/integration/*` — see
# `tests/integration/syscall_dispatch_qemu/Cargo.toml` for the
# canonical example — so that `cargo build --workspace`'s feature
# unification cannot leak QEMU-exit behaviour or any other test-only
# branch into the shipping kernel image. This rule is the
# cargo-deny half of the compile-time `compile_error!` guard the
# test bin carries (`AGENTS.md` §1 — no hacks; §5.4.5 — fail
# closed; §15 — test affordances stay in test crates).
[[bans.features]]
crate = "rustos-kernel"
deny = ["test-hooks"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
