# `cargo deny` policy for TAIRiX.
#
# This file is consumed by `cargo deny check` (invoked by `cargo xtask ci`).
# It enforces the project's license, advisory, source, and ban policy.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# TAIRiX itself is licensed GPL-2.0-or-later with an additional
# syscall/ABI exception (`TAIRiX-syscall-note`; see `LICENSE`).
# Dependencies may carry any OSI-approved permissive licence that is
# compatible with distribution as part of a GPL-2.0-or-later combined work.
allow = [
    "GPL-2.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.92
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# First-party `path` dependencies legitimately omit a version (a crate
# depending on itself with extra features for its own test fixtures, e.g.
# `lib/fdt`'s `test-fixtures` dev-dependency). Those are not the
# supply-chain risk the wildcard ban targets — that risk is
# unpinned *registry* crates — so exempt path deps while still denying
# wildcard versions on anything fetched from a registry.
allow-wildcard-paths = true
highlight = "all"
# Crates the charter forbids outright: hand-rolled crypto and
# unaudited globals. Extend this list when a problem dependency is found.
deny = []
skip = []
skip-tree = []

# Stage 2.7 follow-up (f6): the production `tairix-kernel` crate must
# **never** grow a `test-hooks` (or similarly-named) Cargo feature.
# Test affordances live in sibling integration-test crates under
# `tests/integration/*` — see
# `tests/integration/syscall_dispatch_qemu/Cargo.toml` for the
# canonical example — so that `cargo build --workspace`'s feature
# unification cannot leak QEMU-exit behaviour or any other test-only
# branch into the shipping kernel image. This rule is the
# cargo-deny half of the compile-time `compile_error!` guard the
# test bin carries (no hacks; fail
# closed; test affordances stay in test crates).
[[bans.features]]
crate = "tairix-kernel"
deny = ["test-hooks"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
