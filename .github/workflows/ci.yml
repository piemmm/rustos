name: ci

# Run on every push and PR. The workflow runs the same `cargo xtask ci`
# pipeline contributors run locally (so a green CI run and a green local run
# check the same things; the only difference is the 20× test repeat below,
# which is gated on the runner), then drives the §19.6 fuzz harnesses and
# §19.7 proptest models for a per-job budget.
#
# `cargo xtask ci` runs the whole test matrix 20× here (AGENTS.md §7: a
# flaky test only surfaces across repeated runs, so a single green pass is
# not enough to call a PR clean). The 20× repeat is gated on the runner-set
# `GITHUB_ACTIONS=true` signal, so it costs the CI runners — not a developer
# running `cargo xtask ci` locally, which runs the matrix once. The fuzz and
# proptest gates are *not* repeated
# 20×: they already run for a wall-clock budget, so `cargo xtask ci` runs
# their per-PR `--quick` gate once and this workflow additionally runs the
# full soak registry in parallel for a minimum of 120 s each via
# `tools/ci/soak.sh`, the same thin parallel-soak wrapper the nightly `soak`
# workflow uses (AGENTS.md §15: pipeline logic lives in `cargo xtask`, never
# in tools/ci).

on:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  # Self-hosted runner: persist build outputs in one fixed dir on the runner's
  # own disk instead of round-tripping a >1 GB `target/` tarball through
  # GitHub's hosted cache service. `actions/checkout` only wipes the workspace,
  # so a target dir outside it survives every run. `~/.cargo/{registry,git,bin}`
  # already persist on a self-hosted runner, so no cache action is needed.
  CARGO_TARGET_DIR: /var/lib/actions-runner/rustos-cache/target

jobs:
  xtask-ci:
    name: cargo xtask ci
    runs-on: [self-hosted, linux]
    timeout-minutes: 125
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `rust-toolchain.toml` pins the channel, components, and cross targets;
      # rustup picks them up automatically on first invocation.
      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add clippy rustfmt rust-src llvm-tools-preview
          rustc --version
          cargo --version

      # No `actions/cache` step: on this self-hosted runner the cargo caches
      # (`~/.cargo/registry`, `~/.cargo/git`, `~/.cargo/bin`) and the
      # `CARGO_TARGET_DIR` above already persist locally between runs, so there
      # is nothing to upload to GitHub.
      - name: Install xtask helper tools
        run: |
          command -v cargo-deny >/dev/null || cargo install --locked cargo-deny
          command -v mdbook     >/dev/null || cargo install --locked mdbook

      - name: cargo xtask ci
        run: cargo xtask ci

      # §19.6/§19.7: run every fuzz harness and proptest model in parallel for
      # a minimum of 120 s each. soak.sh enumerates both registries (the
      # single source of truth) and fans them out one process per target, all
      # sharing the 120 s per-job budget set with `--secs`. This is more than
      # the per-PR `--quick` gate inside `cargo xtask ci` and well short of the
      # nightly 24 h `soak` workflow. Fails closed: any harness crash, hang, or
      # invariant/counterexample failure fails the job.
      - name: Run soaks (fuzz + proptest, parallel, >= 120 s each)
        env:
          # Keep soak logs out of the tracked tree (AGENTS.md §3); upload them
          # below so a failing reproducer can be pulled off the run.
          RUSTOS_CI_LOGDIR: ${{ runner.temp }}/rustos-soak-logs
        run: tools/ci/soak.sh both --secs 120

      - name: Upload soak logs
        # Logs are the whole point on failure: §19.6/§19.7 want the crashing
        # input turned into a regression test + corpus entry.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-soak-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/rustos-soak-logs/
          if-no-files-found: warn
          retention-days: 14
