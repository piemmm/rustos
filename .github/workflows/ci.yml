name: ci

# Run on every push and PR. The workflow runs the exact `cargo xtask ci`
# pipeline contributors run locally — a green CI run and a green local run
# check the same things — then drives the fuzz harnesses and
# proptest models as a time-limited, parallel soak.
#
# `cargo xtask ci` runs the whole test matrix exactly **once** (`ci` runs each
# test a single time, on a developer machine and a CI runner
# alike). It likewise runs the fuzz and proptest gates for a single iteration
# (`--once`, a fresh+logged seed per harness). The flake-hunting repetition is
# *not* in `ci`: it lives in the time-limited GitHub soaks. This workflow runs
# the full fuzz+proptest registry in parallel for a minimum of 120 s each via
# `tools/ci/soak.sh` (the same thin parallel-soak wrapper the nightly `soak`
# workflow uses), and the nightly `soak` workflow runs the 24 h budget. Each
# soak run draws a fresh seed, logged per job, so consecutive runs explore new
# inputs and any failure replays from its logged seed (pipeline logic lives in
# `cargo xtask`, never in tools/ci).

# SECURITY (public repo + self-hosted runner): this workflow must never run
# untrusted code on the self-hosted runner. It therefore triggers ONLY on a
# push to `master` of this exact repository — never on `pull_request` or
# `pull_request_target`, so a fork's PR can never execute on the runner — and
# every job is additionally gated (see the job `if:` below) to the owner
# (`piemmm`) in the canonical `piemmm/rustos` repo. A fork (different
# `github.repository`) or any other actor is refused before any step runs.
on:
  push:
    branches: [master]

# Least privilege: the read-only default token is all `cargo xtask ci` needs.
# No job here writes to the repo, releases, packages, or other GitHub state.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  # The audited C toolchain wrapper (tools/cc) pins clang/ld.lld at exactly
  # 22.1.8; no distro package ships that build, so the official llvm.org
  # release is unpacked once onto the runner's persistent disk (see the
  # "Install pinned C toolchain" step) and resolved through these overrides.
  TAIRIX_CC_CLANG: /var/lib/actions-runner/tairix-cache/llvm-22.1.8/bin/clang
  TAIRIX_CC_LLD: /var/lib/actions-runner/tairix-cache/llvm-22.1.8/bin/ld.lld
  # Self-hosted runner: persist build outputs in one fixed dir on the runner's
  # own disk instead of round-tripping a >1 GB `target/` tarball through
  # GitHub's hosted cache service. `actions/checkout` only wipes the workspace,
  # so a target dir outside it survives every run. `~/.cargo/{registry,git,bin}`
  # already persist on a self-hosted runner, so no cache action is needed.
  CARGO_TARGET_DIR: /var/lib/actions-runner/tairix-cache/target

jobs:
  xtask-ci:
    name: cargo xtask ci
    # Fail closed: only the owner pushing to the canonical repo may execute on
    # the self-hosted runner. Forks (a different `github.repository`) and any
    # other actor are refused before checkout, so untrusted code never runs.
    if: github.repository == 'piemmm/rustos' && github.actor == 'piemmm'
    runs-on: [self-hosted, linux]
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `rust-toolchain.toml` pins the channel, components, and cross targets;
      # rustup picks them up automatically on first invocation.
      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add clippy rustfmt rust-src llvm-tools-preview miri
          rustc --version
          cargo --version

      # No `actions/cache` step: on this self-hosted runner the cargo caches
      # (`~/.cargo/registry`, `~/.cargo/git`, `~/.cargo/bin`) and the
      # `CARGO_TARGET_DIR` above already persist locally between runs, so there
      # is nothing to upload to GitHub.
      - name: Install xtask helper tools
        run: |
          command -v cargo-deny >/dev/null || cargo install --locked cargo-deny
          command -v mdbook     >/dev/null || cargo install --locked mdbook

      # The CCOMPAT C-ABI QEMU tests drive tools/cc, which fails closed unless
      # clang/ld.lld report exactly 22.1.8 (REQUIRED_CLANG_VERSION /
      # REQUIRED_LLD_VERSION). No distro package ships that build, so unpack
      # the official llvm.org release tarball once onto the runner's
      # persistent disk; TAIRIX_CC_CLANG / TAIRIX_CC_LLD (workflow env above)
      # point the wrapper at it, and the wrapper's own exact-version check
      # re-verifies every build.
      - name: Install pinned C toolchain (clang/lld 22.1.8)
        run: |
          if ! "$TAIRIX_CC_CLANG" --version 2>/dev/null | grep -q 'clang version 22\.1\.8'; then
            wget -qO /tmp/llvm-22.1.8.tar.xz \
              https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-Linux-X64.tar.xz
            rm -rf /var/lib/actions-runner/tairix-cache/llvm-22.1.8
            mkdir -p /var/lib/actions-runner/tairix-cache/llvm-22.1.8
            tar -xJf /tmp/llvm-22.1.8.tar.xz --strip-components=1 \
              -C /var/lib/actions-runner/tairix-cache/llvm-22.1.8
            rm /tmp/llvm-22.1.8.tar.xz
          fi
          "$TAIRIX_CC_CLANG" --version
          "$TAIRIX_CC_LLD" --version

      # The QEMU integration tests spawn `qemu-system-<arch>` by bare name, so
      # PATH must resolve a QEMU new enough for the riscv64 vertical's pinned
      # `-cpu rv64,svade=true` (QEMU >= 9.1). A distro QEMU older than that
      # fails every riscv64 QEMU test with "Property 'rv64-riscv-cpu.svade'
      # not found". No distro ships the pin and the runner has no root, so —
      # exactly like the clang/lld step above — build the pinned QEMU once from
      # GPG-verified official source into the runner's persistent cache and put
      # it on PATH. The version and its build-time host prerequisites live in
      # tools/ci/install-qemu.sh (one source of truth); the step is idempotent.
      - name: Install pinned QEMU
        run: tools/ci/install-qemu.sh

      # Start every run from a clean slate: the self-hosted runner persists
      # `CARGO_TARGET_DIR` across runs, so wipe prior build artefacts before
      # building so `cargo xtask ci` compiles from scratch and stale outputs
      # can never mask a breakage.
      - name: cargo xtask clean
        run: cargo xtask clean

      - name: cargo xtask ci
        run: cargo xtask ci

      # Run every fuzz harness and proptest model in parallel for
      # a minimum of 120 s each. soak.sh enumerates both registries (the
      # single source of truth) and fans them out one process per target, all
      # sharing the 120 s per-job budget set with `--secs`. This is more than
      # the per-PR `--quick` gate inside `cargo xtask ci` and well short of the
      # nightly 24 h `soak` workflow. Fails closed: any harness crash, hang, or
      # invariant/counterexample failure fails the job.
      - name: Run soaks (fuzz + proptest, parallel, >= 120 s each)
        env:
          # Keep soak logs out of the tracked tree; upload them
          # below so a failing reproducer can be pulled off the run.
          TAIRIX_CI_LOGDIR: ${{ runner.temp }}/tairix-soak-logs
        run: tools/ci/soak.sh both --secs 120

      - name: Upload soak logs
        # Logs are the whole point on failure: a crashing input becomes a
        # regression test + corpus entry.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-soak-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/tairix-soak-logs/
          if-no-files-found: warn
          retention-days: 14
