name: ci

# Run on every push and PR. The workflow runs the same `cargo xtask ci`
# pipeline contributors run locally (so a green CI run and a green local run
# are equivalent by construction), then drives the §19.6 fuzz harnesses and
# §19.7 proptest models for a per-job budget. `cargo xtask ci` already runs
# the per-PR `--quick` gate; this workflow additionally runs the full soak
# registry in parallel for a minimum of 120 s each via `tools/ci/soak.sh`,
# the same thin parallel-soak wrapper the nightly `soak` workflow uses
# (AGENTS.md §15: pipeline logic lives in `cargo xtask`, never in tools/ci).

on:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  xtask-ci:
    name: cargo xtask ci
    runs-on: [self-hosted, linux]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `rust-toolchain.toml` pins the channel, components, and cross targets;
      # rustup picks them up automatically on first invocation.
      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add clippy rustfmt rust-src llvm-tools-preview
          rustc --version
          cargo --version

      - name: Cache cargo registry, git index and target directory
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache xtask helper tools
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-xtask-tools-v1

      - name: Install xtask helper tools
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          cargo install --locked cargo-deny
          cargo install --locked mdbook

      - name: cargo xtask ci
        run: cargo xtask ci

      # §19.6/§19.7: run every fuzz harness and proptest model in parallel for
      # a minimum of 120 s each. soak.sh enumerates both registries (the
      # single source of truth) and fans them out one process per target, all
      # sharing the 120 s per-job budget set with `--secs`. This is more than
      # the per-PR `--quick` gate inside `cargo xtask ci` and well short of the
      # nightly 24 h `soak` workflow. Fails closed: any harness crash, hang, or
      # invariant/counterexample failure fails the job.
      - name: Run soaks (fuzz + proptest, parallel, >= 120 s each)
        env:
          # Keep soak logs out of the tracked tree (AGENTS.md §3); upload them
          # below so a failing reproducer can be pulled off the run.
          RUSTOS_CI_LOGDIR: ${{ runner.temp }}/rustos-soak-logs
        run: tools/ci/soak.sh both --secs 120

      - name: Upload soak logs
        # Logs are the whole point on failure: §19.6/§19.7 want the crashing
        # input turned into a regression test + corpus entry.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-soak-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/rustos-soak-logs/
          if-no-files-found: warn
          retention-days: 14
