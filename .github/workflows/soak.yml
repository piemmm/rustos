name: soak

# Nightly soak window, 01:00–07:00 Europe/London (AGENTS.md §19.6 fuzz, §19.7
# proptest, the §7 repeated-test soak, and the filesystems.md filesystem soak).
# The default `all` runs every fuzz harness, every proptest model, every
# filesystem soak (rustfs/ext4/fat32, each on a ≥1 GiB RAM volume — budget ≥ 3
# GiB of runner RAM for the three in parallel), and the whole test matrix in
# parallel. The run starts at 01:00 London time and is budgeted to finish at
# 07:00 London time, giving a fixed six-hour overnight window rather than the
# previous back-to-back continuous blocks. This is enough exposure to surface a
# flake too rare to catch in the per-PR single-pass test run (where `ci` runs
# each test once) without holding the soak runner all day.
#
# GitHub's cron is UTC-only and has no timezone support, and London observes
# DST: 01:00 London is 01:00 UTC in winter (GMT) and 00:00 UTC in summer (BST).
# We therefore schedule both ticks and let the "London start window" guard step
# below proceed only when the runner's Europe/London local hour is 01, so
# exactly one tick fires the soak per night regardless of DST. The per-job
# budget is then computed as the number of seconds until 07:00 London, so setup
# time is absorbed and the soak still stops at 07:00.
#
# These cannot run on GitHub-hosted runners: a hosted job is hard-capped well
# below a six-hour window. They therefore run on a *self-hosted Linux runner*
# (see tools/ci/github-runner/README.md for how to register one). The job is
# the same `tools/ci/soak.sh` a cron/systemd/launchd builder runs, so a green
# soak here and a green soak on a standalone builder are equivalent by
# construction — the workflow adds only scheduling, the DST window guard, and
# log upload, never pipeline logic (AGENTS.md §15: every check lives in
# `cargo xtask`).
#
# This job targets a *dedicated* `soak` label, not the bare `[self-hosted,
# linux]` that `ci.yml` uses. A self-hosted runner executes one job at a time,
# so if the soak block ran on the same runner as `ci.yml` it would block every
# push gate behind it. Registering a second runner instance on the same host
# with the extra `soak` label (see the runner README) lets the soak and the
# per-push `ci` run concurrently and independently: the soak only ever lands on
# the `soak`-labelled runner, leaving the general `[self-hosted, linux]` runner
# free for `ci`.

# SECURITY (public repo + self-hosted runner): like `ci.yml`, this workflow
# must never run untrusted code on the self-hosted runner. It triggers ONLY on
# `schedule` (which always runs from the base repo's default branch, never a
# fork) and on `workflow_dispatch` — never on `pull_request`/`pull_request_target`.
# Every job is additionally gated (see the job `if:` below) to the owner
# (`piemmm`) in the canonical `piemmm/rustos` repo, so a fork or any other
# actor manually dispatching is refused before any step runs.
on:
  schedule:
    # 01:00 London all year: 01:00 UTC in winter (GMT), 00:00 UTC in summer
    # (BST). Both ticks are scheduled; the "London start window" guard step
    # runs the soak on whichever one lands at 01:00 London and skips the other.
    - cron: "0 0 * * *"
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      kind:
        description: "Which soaks to run"
        type: choice
        default: all
        options: [all, both, fuzz, proptest, fssoak, test]
      secs:
        description: "Per-job budget override in seconds (blank = run until 07:00 London; use a small value for a smoke run)"
        type: string
        default: ""

# Never cancel an in-flight soak just because the second DST cron tick fired;
# let the running soak finish and skip the overlap.
concurrency:
  group: soak
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  # Self-hosted runner: persist build outputs in one fixed dir on the runner's
  # own disk instead of round-tripping a >1 GB `target/` tarball through
  # GitHub's hosted cache service (no `actions/cache` step is used here).
  # `actions/checkout` only wipes the workspace, so a target dir outside it
  # survives every run, and `~/.cargo/{registry,git,bin}` already persist on a
  # self-hosted runner. The soak runs on its *own* runner instance (the `soak`
  # label) concurrently with `ci.yml` on the same host, so it gets a distinct
  # target dir to avoid two concurrent jobs stomping on a shared `target/`.
  CARGO_TARGET_DIR: /var/lib/actions-runner/rustos-cache/target-soak

jobs:
  soak:
    name: soak window (parallel)
    # Fail closed: only the owner in the canonical repo may execute on the
    # self-hosted runner. Refuses forks (different `github.repository`) and any
    # non-owner actor (e.g. a collaborator's manual dispatch) before checkout.
    if: github.repository == 'piemmm/rustos' && github.actor == 'piemmm'
    # Dedicated `soak` label so the window runs on its own runner instance and
    # never queues `ci.yml` (which uses the bare `[self-hosted, linux]`) behind
    # it; the two run concurrently on the same host (see the runner README for
    # registering both runner instances).
    runs-on: [self-hosted, linux, soak]
    # Six-hour window (01:00–07:00 London) + parallel fan-out + setup headroom.
    # soak.sh enforces the real per-job budget (seconds until 07:00 London);
    # this is just a backstop so a wedged job cannot run past the window.
    timeout-minutes: 390
    steps:
      - name: London start window guard
        id: window
        # GitHub cron is UTC-only and London observes DST, so both the 00:00 and
        # 01:00 UTC ticks are scheduled and exactly one of them is 01:00 London
        # on any given night. Proceed only on that one; the other tick is a
        # no-op. A manual dispatch always runs (for smoke runs at any time).
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch: running regardless of the time of day."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour="$(TZ='Europe/London' date +%H)"
          if [ "$hour" = "01" ]; then
            echo "Europe/London local hour is 01 — opening the soak window."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Europe/London local hour is $hour, not 01 — skipping this DST cron tick."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.window.outputs.run == 'true'
        uses: actions/checkout@v4

      # `rust-toolchain.toml` pins the channel, components, and cross targets;
      # rustup picks them up automatically on first invocation.
      - name: Install Rust toolchain (from rust-toolchain.toml)
        if: steps.window.outputs.run == 'true'
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add clippy rustfmt rust-src llvm-tools-preview
          rustc --version
          cargo --version

      - name: Run soak window (parallel)
        if: steps.window.outputs.run == 'true'
        env:
          # Keep soak logs out of the tracked tree (AGENTS.md §3); upload them
          # below so a failing reproducer can be pulled off the run.
          RUSTOS_CI_LOGDIR: ${{ runner.temp }}/rustos-soak-logs
        run: |
          KIND="${{ github.event.inputs.kind || 'all' }}"
          SECS="${{ github.event.inputs.secs }}"
          # An explicit dispatch override always wins (smoke runs). Otherwise
          # budget the soak to stop at 07:00 London: compute the seconds from
          # now until the next 07:00 London, so runner setup time is absorbed
          # and the window still closes at 07:00.
          if [ -z "$SECS" ]; then
            end="$(TZ='Europe/London' date -d 'today 07:00' +%s)"
            now="$(date +%s)"
            SECS=$((end - now))
            if [ "$SECS" -le 0 ]; then
              # Defensive fallback (e.g. a manual dispatch after 07:00 with no
              # override): fall back to a full six-hour window.
              SECS=21600
            fi
          fi
          tools/ci/soak.sh "$KIND" --secs "$SECS"

      - name: Upload soak logs
        # Logs are the whole point on failure: §19.6/§19.7 want the crashing
        # input turned into a regression test + corpus entry.
        if: always() && steps.window.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: soak-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/rustos-soak-logs/
          if-no-files-found: warn
          retention-days: 14
