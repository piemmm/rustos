name: soak

# Nightly 24 h soaks (AGENTS.md §19.6 fuzz, §19.7 proptest).
#
# These cannot run on GitHub-hosted runners: a hosted job is hard-capped well
# below 24 h. They therefore run on a *self-hosted Linux runner* (see
# tools/ci/github-runner/README.md for how to register one). The job is the
# same `tools/ci/soak.sh` a cron/systemd/launchd builder runs, so a green soak
# here and a green soak on a standalone builder are equivalent by construction
# — the workflow adds only scheduling and log upload, never pipeline logic
# (AGENTS.md §15: every check lives in `cargo xtask`).

on:
  schedule:
    # 02:00 UTC, matching the nightly trigger in the cron/systemd/launchd samples.
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      kind:
        description: "Which soaks to run"
        type: choice
        default: both
        options: [both, fuzz, proptest]
      secs:
        description: "Per-job budget override in seconds (blank = 24 h default; use a small value for a smoke run)"
        type: string
        default: ""

# Never cancel an in-flight 24 h soak just because the next nightly tick fired;
# let the running one finish and skip the overlap.
concurrency:
  group: soak
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  soak:
    name: nightly soaks (parallel)
    runs-on: [self-hosted, linux]
    # 24 h budget + parallel fan-out + setup headroom. soak.sh enforces the real
    # per-job budget; this is just a backstop so a wedged job cannot run forever.
    timeout-minutes: 1560
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `rust-toolchain.toml` pins the channel, components, and cross targets;
      # rustup picks them up automatically on first invocation.
      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add clippy rustfmt rust-src llvm-tools-preview
          rustc --version
          cargo --version

      - name: Run nightly soaks (parallel)
        env:
          # Keep soak logs out of the tracked tree (AGENTS.md §3); upload them
          # below so a failing reproducer can be pulled off the run.
          RUSTOS_CI_LOGDIR: ${{ runner.temp }}/rustos-soak-logs
        run: |
          KIND="${{ github.event.inputs.kind || 'both' }}"
          SECS="${{ github.event.inputs.secs }}"
          if [ -n "$SECS" ]; then
            tools/ci/soak.sh "$KIND" --secs "$SECS"
          else
            tools/ci/soak.sh "$KIND"
          fi

      - name: Upload soak logs
        # Logs are the whole point on failure: §19.6/§19.7 want the crashing
        # input turned into a regression test + corpus entry.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/rustos-soak-logs/
          if-no-files-found: warn
          retention-days: 14
