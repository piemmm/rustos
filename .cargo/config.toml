# Per-target build settings for RustOS.
#
# Host crates (xtask, host-side tests, image builders) use the default
# toolchain settings. The bare-metal targets opt-in to `-Z build-std` so the
# kernel can be linked against a freshly compiled core/alloc/compiler_builtins
# without panic unwinding support.
#
# Linker scripts referenced below live under each arch crate's `link/`
# directory; they are added when Stage 3 lands.

[alias]
xtask = "run --manifest-path tools/xtask/Cargo.toml --quiet --"

[build]
# Host builds use the default target.

[target.x86_64-unknown-none]
rustflags = [
    "-C", "code-model=kernel",
    "-C", "relocation-model=static",
    "-C", "force-frame-pointers=yes",
    # `curve25519-dalek` (pulled in transitively through
    # `rustos-crypto` → `ed25519-dalek`) auto-selects the `simd`
    # backend on nightly toolchains that advertise AVX2, but the
    # generated SIMD code depends on host-only LLVM intrinsics that
    # `x86_64-unknown-none` cannot lower (`rustc-LLVM ERROR: Do not
    # know how to split the result of this operator!`). The `serial`
    # backend is what the upstream crate ships for freestanding
    # targets, so pin it explicitly here. `AGENTS.md` §15.10 — every
    # `--cfg` carries a justifying comment.
    "--cfg", "curve25519_dalek_backend=\"serial\"",
]

[target.aarch64-unknown-none]
rustflags = [
    "-C", "force-frame-pointers=yes",
]

[target.riscv64gc-unknown-none-elf]
rustflags = [
    "-C", "force-frame-pointers=yes",
]

[target.wasm32-unknown-unknown]
rustflags = []

# `-Z build-std` is **not** declared globally. Building host tools (xtask,
# unit tests) with `build-std` would force every contributor to install the
# `rust-src` component and recompile core unnecessarily. Instead, the xtask
# build orchestrator passes `-Z build-std=core,compiler_builtins,alloc`
# explicitly when invoking `cargo build` for the bare-metal targets above.
