[package]
name = "rustos-qemu"
description = "QEMU runner library + binary for RustOS integration tests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "rustos-qemu-run"
path = "src/bin/run.rs"

# The library is host-only (`std`). It is invoked by `cargo xtask test --qemu`
# to build, launch, and reap QEMU instances. Keeping it as a workspace member
# means the same code path runs in CI and locally (`AGENTS.md` §14).
