[package]
name = "rustos-mkimage"
description = "Platform image builders for RustOS (AGENTS.md §12)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "rustos-mkimage"
path = "src/main.rs"

# mkimage is a host-side build tool (AGENTS.md §12): it authors the
# flashable platform images in pure Rust. The partition contents are laid
# down by the *real* in-tree filesystem drivers — the same code the booted
# system mounts the volumes with — so the image author and the consumer can
# never drift (AGENTS.md §2.2). It mirrors how the QEMU vertical fixtures
# (`tests/integration/{fat32,rustfs}_image`) author their backing disks.
[dependencies]
rustos-abi = { path = "../../lib/abi", version = "=0.0.0" }
rustos-crypto = { path = "../../lib/crypto", version = "=0.0.0" }
rustos-drv-fs-fat32 = { path = "../../drivers/filesystem/fat32", version = "=0.0.0" }
rustos-drv-fs-rustfs = { path = "../../drivers/filesystem/rustfs", version = "=0.0.0" }
# The per-installation log-attestation key file is authored through the one
# `rustos_log::LogAttestationKey` on-disk format, so the image author and the
# journal principal that later reads it cannot drift (AGENTS.md §2.2).
rustos-log = { path = "../../lib/log", version = "=0.0.0" }
# The `man` app's embedded Help/ tree (`rustos_man::help`), planted onto the
# read-only /System volume's app store: one source of truth in the app crate,
# so the image and the shipped documents cannot drift (AGENTS.md §2.2). The
# default `program` feature is disabled: the host tool wants the data, never
# the freestanding runtime.
rustos-man = { path = "../../userland/apps/man", version = "=0.0.0", default-features = false }
rustos-partition = { path = "../../lib/partition", version = "=0.0.0" }
rustos-users = { path = "../../lib/users", version = "=0.0.0" }
