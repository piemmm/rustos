# Pinned Raspberry Pi 4 boot-firmware inputs (AGENTS.md §19.3).
#
# The Pi firmware blobs are third-party redistributables (Broadcom /
# Raspberry Pi Ltd, see `boot/LICENCE.broadcom` in the source repository)
# and are NOT committed to this tree. `rustos-mkimage` consumes them as
# build inputs from a caller-supplied directory and refuses — fail closed —
# any file whose byte length or SHA-256 does not match this manifest.
#
# Provenance: https://github.com/raspberrypi/firmware, release 1.20240529,
# files under `boot/`. The `source` directive below pins the upstream
# directory: `cargo xtask image` fetches any blob missing from its cache
# as `<source>/<name>` and verifies it against this manifest before use;
# an operator-staged directory (`--firmware` / $RUSTOS_PI_FIRMWARE) is
# only ever verified, never written. Updating the pin means replacing the
# source line and every blob line below from the new release and
# re-running the supply-chain review (AGENTS.md §19.3).
#
# `armstub8.bin` (the optional PSCI secondary-core stub, built from
# https://github.com/raspberrypi/tools `armstubs/`) has no official binary
# distribution. It is not pinned here; the boot stub parks the secondary
# cores itself, so first boot needs no armstub. When the P5 SMP-on-metal
# work pins a stub build, its line is added here and `config.txt` gains
# the `armstub=armstub8.bin` knob.
#
# Format: one `source <https url>` directive, then
# <name> <byte length> <sha256 hex>, one file per line.
source https://github.com/raspberrypi/firmware/raw/1.20240529/boot
