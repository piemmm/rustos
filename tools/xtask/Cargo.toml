[package]
name = "tairix-xtask"
description = "Build orchestration for the TAIRiX workspace."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# xtask is a host-side build tool. Its lints are kept as the workspace defaults
# but it deliberately does not inherit `missing_docs` strictness: command line
# enums and dispatch tables are exhaustively named, not documented.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
# `abi-check` (Stage 2.7) needs to recompute the SHA-256 fingerprint of
# the frozen `abi-v1` syscall table and compare it with the kernel
# mirror. The cheapest way to keep the two truly synchronised is to
# depend on both crates directly and run the comparison as ordinary
# Rust: a future ABI change cannot pass `cargo build` without breaking
# the cross-check.
tairix-abi = { path = "../../lib/abi", version = "=0.0.0" }
# `image-drivers` `#[path]`s the kernel's `build_support.rs`, which takes its
# build-provenance fingerprint with the workspace's shared non-cryptographic
# hash.
tairix-hash = { path = "../../lib/hash", version = "=0.0.0" }
# `font-atlas` rasterises the committed TrueType faces into the generated
# `lib/font` atlas through the shared `lib/fontface` glyph engine — the same
# parser + rasteriser the runtime font uses to resize UI glyphs, so the atlas
# and live text can never diverge.
tairix-fontface = { path = "../../lib/fontface", version = "=0.0.0" }
# `devids` imports, vets, and compiles the public PCI/USB ID databases
# through the one grammar/vetting/codec definition in `lib/devids` (shared
# with the runtime consumers), and drift-checks the
# committed tables in `ci`.
tairix-devids = { path = "../../lib/devids", version = "=0.0.0" }
# `devids` stamps its import provenance with a UTC date through the one
# civil-date calendar (`lib/fsmeta`), never a private copy.
tairix-fsmeta = { path = "../../lib/fsmeta", version = "=0.0.0" }
tairix-kernel-syscall = { path = "../../kernel/syscall", version = "=0.0.0" }
tairix-crypto = { path = "../../lib/crypto", version = "=0.0.0" }
# `test --qemu` cross-builds the CCOMPAT end-to-end C programs, whose build
# scripts locate `clang`/`ld.lld` through the audited `tairix-cc` wrapper. xtask
# resolves that toolchain *once* up front and exports its path so each build
# script uses the authoritative override instead of re-running the full search
# per crate/target (the discovery logic lives only in
# `tairix-cc`; xtask merely primes it). Host-only build glue.
tairix-cc = { path = "../cc", version = "=0.0.0" }
# `help-lint` (plans/APPS.md §8.1) judges every discovered Help/ document
# through the one shared lint in the help engine (`tairix_help::lint_help_trees`,
# behind its host-only `lint` feature), so the gate and the `tools/syshelp`
# aggregator tests can never diverge.
tairix-help = { path = "../../lib/help", version = "=0.0.0", features = [
    "lint",
] }
# The app-bundle composer (`image_apps`) signs each bundle's `AppInfo`
# over the exact contents the volume ships; the bundle's `Help/` documents
# come from the same build-discovered source the image planters plant
# (`tairix_syshelp`), so the signed content hash and the planted tree
# cannot drift.
tairix-syshelp = { path = "../syshelp", version = "=0.0.0" }
# `test --qemu` (Stage 2 deliverable) drives the bare-metal integration
# tests through the audited `tools/qemu` runner. Sharing the runner
# crate keeps the test-execution contract (`isa-debug-exit`, strict
# timeouts, no retries) in exactly one place.
tairix-qemu = { path = "../qemu", version = "=0.0.0" }
# The interactive login negative fixture derives its over-limit username from
# the account database format's own bound, so production validation and the
# QEMU script cannot drift.
tairix-users = { path = "../../lib/users", version = "=0.0.0" }
# The autoload vertical's planted `system.conf` is rendered by the boot-time
# configuration engine itself, so the planted document and the grammar the
# guest parses share one definition rather than a literal kept here.
tairix-sysconfig = { path = "../../lib/sysconfig", version = "=0.0.0" }

# The QEMU netstack verticals' host-side link peer: the same pure
# `lib/net` protocol engine the guest's netstack drives, run by the
# harness over the QEMU dgram netdev, configured from the shared
# `tairix-test-netstack-wire` topology so the two ends cannot drift.
tairix-net = { path = "../../lib/net", version = "=0.0.0" }
tairix-test-netstack-wire = { path = "../../tests/integration/netstack_wire", version = "=0.0.0" }
# The clock-chip fixture instant: the harness pins the emulated RTC to it on
# the QEMU command line and the guest checks the applied reading against the
# same window, so the two ends cannot drift.
tairix-test-rtc-fixture = { path = "../../tests/integration/rtc_fixture", version = "=0.0.0" }
# `test --qemu` plants the Stage 5 end-to-end FAT32 vertical's backing
# image from the same `tairix-test-fat32-image` fixture the kernel-side
# tail reads, so the planted layout and the guest's expectations share
# one source of truth.
tairix-test-fat32-image = { path = "../../tests/integration/fat32_image", version = "=0.0.0" }
# `test --qemu` likewise plants the Stage 5 arxfs vertical's backing
# image from the `tairix-test-arxfs-image` fixture, which the real
# arxfs driver itself authors (format + plant), so the planted layout
# and the guest's expectations share one source of truth.
tairix-test-arxfs-image = { path = "../../tests/integration/arxfs_image", version = "=0.0.0" }
# `test --qemu` plants the `plans/PI.md` P11 Chunk B-2 root-mount->login
# vertical's backing from the `tairix-test-encrypted-root-image` fixture — the
# whole-disk MBR + FAT-boot(`root.unlock`) + encrypted-ARXFS-root
# image authored by the real in-tree drivers, the same bytes the
# `root_mount` host tests split — so the planted layout and the guest's
# unlock share one source of truth.
# The `plans/PI.md` P10 5d-2-ii(b-2-iii) / `plans/NETWORK.md` N4e autoload
# verticals boot the same encrypted-root image, additionally carrying the
# kernel-signed virtio-input keyboard driver, framebuffer display service, and
# virtio-net link-layer driver bundles in `/System/Drivers/`. Those bundles are
# now cross-compiled and signed by the `image_drivers` pipeline (the one
# definition every image consumer shares) and planted through
# this same encrypted-root fixture, so there is no separate fixed-arch fixture
# crate baking them at build time.
tairix-test-encrypted-root-image = { path = "../../tests/integration/encrypted_root_image", version = "=0.0.0" }
# The memory-stability vertical's fixture constants: the `MEMSOAK PASS`
# marker its serial script waits for is pinned against the fixture's own
# `PASS_MARKER` by a unit test, so the script and the program cannot drift.
# `default-features = false`: the fixture's `program` feature (its `Run`
# binary's userland runtime) is for its freestanding cross-compile only.
tairix-test-memsoak = { path = "../../tests/integration/memsoak_program", version = "=0.0.0", default-features = false }
tairix-test-stalltrace = { path = "../../tests/integration/stalltrace_program", version = "=0.0.0", default-features = false }
# The stream-socket vertical's fixture constant: the `TCPECHO PASS` marker its
# serial script waits for is pinned against the fixture's own `PASS_MARKER` by
# a unit test, so the script and the program cannot drift. `default-features =
# false`: the fixture's `program` feature (its `Run` binary's userland runtime)
# is for its freestanding cross-compile only.
tairix-test-tcpecho = { path = "../../tests/integration/tcpecho_program", version = "=0.0.0", default-features = false }
# The telnet vertical's host-side peer speaks the *server* half of RFC 854
# through the client's own public wire vocabulary (`nvt`, `option`, `subneg`,
# `linemode`), so the two ends cannot drift. Library half only — no userland
# runtime — as for the other fixture crates above.
tairix-telnet = { path = "../../userland/apps/telnet", version = "=0.0.0", default-features = false }
# The TCP-listener vertical's fixture constant: the `TCPSERVE PASS` marker its
# serial script waits for is pinned against the fixture's own `PASS_MARKER` by
# a unit test, so the script and the program cannot drift. `default-features =
# false`: the fixture's `program` feature (its `Run` binary's userland runtime)
# is for its freestanding cross-compile only.
tairix-test-tcpserve = { path = "../../tests/integration/tcpserve_program", version = "=0.0.0", default-features = false }
# The fuzz/proptest orchestrators and the in-tree harnesses share one
# per-run seed/budget vocabulary: the orchestrator picks and logs the
# seed, the harness reads it. Both sides use `tairix-fuzzseed` so the
# seed primitives and the env-var names live in exactly one place.
tairix-fuzzseed = { path = "../../tests/fuzzseed", version = "=0.0.0" }
# `image` / `build --target aarch64-rpi` (Stage 8 / plans/PI.md P9) author
# the flashable platform images through the `tools/mkimage` library, so the
# image pipeline is ordinary Rust driven by the same xtask entry point as
# every other build step.
tairix-mkimage = { path = "../mkimage", version = "=0.0.0" }
# `image` cross-compiles and signs the autoloaded `/System/Drivers/` bundles
# the flashable Pi image ships (`plans/PI.md` P10 D4). The signed-bundle
# composer and the ELF->rxe converter live in the shared harness — the single
# definition the kernel `build.rs` and the autoload fixtures also use — so
# `image` reuses them rather than re-rolling the wire layout. Host-only build glue; the `driver-image`
# feature pulls in the Ed25519 signer, and `app-image` the signed
# application-bundle composer + `AppInfo.toml` discovery the `image_apps`
# pipeline composes the self-contained `/System/Commands` +
# `/System/Applications` + `/System/Services`
# bundles with (`plans/APPS.md` deliverable 8).
tairix-itest-harness = { path = "../../tests/integration/harness", version = "=0.0.0", features = [
    "driver-image",
    "app-image",
] }
# The autoloaded `/System/Drivers/` bundles' own canonical bind tables,
# copied verbatim into each signed bundle so the autoload match data never
# drifts from the driver it binds: the mailbox
# service driver (via `tairix-vcmailbox`), the BCM2711 PCIe root-complex bus
# driver, the VL805 USB host bus driver, the xHCI host-controller driver, and
# the USB boot-keyboard class driver — each `BIND_KEYS` lives in the driver
# crate's own `lib` target (the device logic is co-located in the driver).
# These are `drivers/*` crates; xtask is host build glue
# (`Tooling`, outside the product layering), so depending on them is
# permitted.
tairix-vcmailbox = { path = "../../lib/vcmailbox", version = "=0.0.0" }
tairix-drv-bus-pcie-brcm = { path = "../../drivers/bus/pcie_brcm", version = "=0.0.0" }
tairix-drv-bus-usb-vl805 = { path = "../../drivers/bus/usb/vl805", version = "=0.0.0" }
tairix-drv-bus-usb = { path = "../../drivers/bus/usb/xhci", version = "=0.0.0" }
tairix-drv-input-usb-kbd = { path = "../../drivers/input/usb_kbd", version = "=0.0.0" }
tairix-drv-input-usb-mouse = { path = "../../drivers/input/usb_mouse", version = "=0.0.0" }
tairix-drv-input-virtio-input = { path = "../../drivers/input/virtio_input", version = "=0.0.0" }
# The virtio-net link-layer driver's canonical bind table (and its
# single-source virtio device id, used by the autoload-match tests): the
# `image_drivers` pipeline signs `BIND_KEYS` into the bundle it cross-compiles
# from the sibling driver-process crate (`tairix-drv-network-virtio-net-driver`),
# so the on-disk bundle and the driver never drift.
tairix-drv-network-virtio-net = { path = "../../drivers/network/virtio_net", version = "=0.0.0" }
# The GENET link-layer driver's canonical bind table and the BCM2711
# register base its shipped `network.conf` default binds the interface by: the
# `image_drivers` pipeline signs `BIND_KEYS` into the bundle it cross-compiles
# from the same crate, so the on-disk bundle, the planted addressing default,
# and the driver never drift.
tairix-drv-network-genet = { path = "../../drivers/network/genet", version = "=0.0.0" }
# The PL031 clock-chip driver's canonical bind table and `compatible` string,
# signed into the bundle the `image_drivers` pipeline cross-compiles from the
# same crate, so the shipped bundle and the driver cannot drift.
tairix-drv-rtc-pl031 = { path = "../../drivers/rtc/pl031", version = "=0.0.0" }
# The Goldfish clock-chip driver's bind table, for the riscv64 image, on the
# same single-source-of-truth basis.
tairix-drv-rtc-goldfish = { path = "../../drivers/rtc/goldfish", version = "=0.0.0" }
# The CMOS clock-chip driver's bind table, for the x86_64 image.
tairix-drv-rtc-mc146818 = { path = "../../drivers/rtc/mc146818", version = "=0.0.0" }
# The Raspberry Pi PMIC clock-chip driver's bind table, for the flashable Pi
# image.
tairix-drv-rtc-rpi = { path = "../../drivers/rtc/rpi", version = "=0.0.0" }
# The Broadcom Serial Controller bus driver's bind table, for the flashable Pi
# image: it serves the transfer endpoint each I2C clock chip below is reached
# through.
tairix-drv-bus-i2c-bcm2835 = { path = "../../drivers/bus/i2c/bcm2835", version = "=0.0.0" }
# The three I2C clock-chip drivers' bind tables, on the same
# single-source-of-truth basis. Which one binds is the board's HAT; all three
# ship so any of them works with no rebuild.
tairix-drv-rtc-ds3231 = { path = "../../drivers/rtc/ds3231", version = "=0.0.0" }
tairix-drv-rtc-pcf8523 = { path = "../../drivers/rtc/pcf8523", version = "=0.0.0" }
tairix-drv-rtc-pcf85063a = { path = "../../drivers/rtc/pcf85063a", version = "=0.0.0" }
# The one `network.conf` grammar engine: the shipped Raspberry Pi addressing
# default is authored here and validated through the same parser `netstack`
# reads it with, so a malformed default fails the image build.
tairix-netconfig = { path = "../../lib/netconfig", version = "=0.0.0" }
tairix-drv-display-framebuffer = { path = "../../drivers/display/framebuffer", version = "=0.0.0" }
tairix-drv-storage-usb-msd = { path = "../../drivers/storage/usb_msd", version = "=0.0.0" }
tairix-drv-storage-volmgr = { path = "../../drivers/storage/volmgr", version = "=0.0.0" }
tairix-drv-storage-raid-member = { path = "../../drivers/storage/raid_member", version = "=0.0.0" }
tairix-drv-storage-raid = { path = "../../drivers/storage/raid", version = "=0.0.0" }
# The shared desktop theme definition: the display vertical's screendump
# assert compares the dumped scan-out against the theme's own desktop
# colour, so the expected pixels have one definition (never a literal).
tairix-theme = { path = "../../lib/theme", version = "=0.0.0" }
# The desktop-session, taskbar, browser-engine, geometry, and fw_cfg crates:
# the AW3 desktop vertical's pointer script reconstructs the production
# shell's taskbar and program-library popup layout (the same code the guest
# runs) to compute its click coordinates, keys its screendumps on the
# session's witness messages, and measures the browser window and ramfb
# surface against the one shared definition of each — never a hand-copied
# literal (plans/APPWIN.md AW3/AW5, plans/NEW-TASKBAR.md T5).
tairix-desktop-session = { path = "../../userland/gui/session", version = "=0.0.0" }
tairix-taskbar = { path = "../../userland/gui/taskbar", version = "=0.0.0" }
tairix-browse = { path = "../../lib/browse", version = "=0.0.0" }
tairix-terminal = { path = "../../userland/apps/terminal", version = "=0.0.0" }
tairix-geometry = { path = "../../lib/geometry", version = "=0.0.0" }
# The shared window furniture: a served window's screen footprint is its
# client surface grown by the band the window manager reserves around it, so
# the vertical asks the very `WindowFrame` the compositor decorates with
# where that window's edges and client viewport are, rather than restating
# the frame metrics (plans/APPWIN.md AW3).
tairix-controls = { path = "../../lib/controls", version = "=0.0.0" }
# The text-drawing entry point `cargo xtask bench` measures: the desktop's
# labels, list rows, and terminal rows all reach the screen through
# `BitmapFont::draw_text`, so the harness times that very function rather
# than a re-implementation of it. `test-util` supplies the deterministic
# host font it draws with — a genuinely proportional advance per scalar, so
# the figure describes the proportional path a desktop actually runs.
tairix-font = { path = "../../lib/font", version = "=0.0.0", features = [
    "test-util",
] }
tairix-fwcfg = { path = "../../lib/fwcfg", version = "=0.0.0" }
# The program-library catalog engine: the encrypted-root fixture plants the
# machine store at the engine's own canonical path, and the AW3 pointer
# script rebuilds the popup's rows over a `Catalog` reconstructed from the
# same manifests — one engine, no drifting literals (plans/NEW-TASKBAR.md).
tairix-proglib = { path = "../../lib/proglib", version = "=0.0.0" }
# The Switchboard monitor service and the shared icon vocabulary: the
# desktop verticals measure a served window's own envelope in the dumped
# scan-out and rebuild the bar's slots with the same class glyph the session
# seeds one with — the one definition of each.
tairix-switchboard = { path = "../../userland/gui/switchboard", version = "=0.0.0" }
tairix-icon = { path = "../../lib/icon", version = "=0.0.0" }
# The desktop's own PNG decoder. The image build decodes every icon it is
# about to plant through exactly the decoder the desktop will use, so artwork
# that would refuse at runtime — a file that is not a PNG, is not square, or
# is smaller than the largest slot a desktop draws it in — fails the build
# where the author can see it instead of degrading silently on screen.
tairix-image = { path = "../../lib/image", version = "=0.0.0" }
# The one shared resampler. The desktop screendump assertions recompute the
# wallpaper the guest composites by running the very decode, placement, and
# resampling code the session's own render path runs, so the expected pixels
# have a single definition instead of a captured baseline that would drift
# the moment the artwork or the fit changed.
tairix-raster = { path = "../../lib/raster", version = "=0.0.0" }
# The desktop's own SVG decoder. A shipped vector master is validated through
# exactly the decoder the desktop will draw it with, and the icon gate reads
# the authored design box from it: the decoder letter-boxes a rectangular
# drawing into a square slot, which is right for artwork in general but ships
# an icon with bars down two sides, so the build refuses it where the author
# can see it.
tairix-svg = { path = "../../lib/svg", version = "=0.0.0" }
# The desktop pinboard's own definitions: the shipped default master's name,
# the byte bound every shipped master must fit within, the pinboard defaults
# (which picture and which fit the desktop comes up with), and the placement
# arithmetic. The discovered-graphics check judges every shipped wallpaper
# master against that contract — distinct from the icon contract a wallpaper
# is not held to — and the desktop screendump assertions recompute the
# wallpaper the guest composites from those same definitions.
tairix-wallpaper = { path = "../../lib/wallpaper", version = "=0.0.0" }
# The shared pointer input-event vocabulary: the icon-bar script raises the
# real context menu by driving the production bar router with the very events
# the guest will receive, so the menu geometry it clicks is the model's own.
tairix-input = { path = "../../lib/input", version = "=0.0.0" }
# The autoload desktop vertical's shared interaction contract (delivery
# counts), defined once in the test crate's lib target beside the guest
# PASS gate that also consumes it.
tairix-test-autoload-input-qemu-aarch64 = { path = "../../tests/integration/autoload_input_qemu_aarch64", version = "=0.0.0" }
# The icon-bar vertical's shared interaction contract (the application whose
# bar is driven and the two window markers the guest emits), defined once in
# that test crate's lib target beside the guest PASS gate.
tairix-test-appbar-qemu-aarch64 = { path = "../../tests/integration/appbar_qemu_aarch64", version = "=0.0.0" }
# The picker-delegation vertical's shared contract: the application the
# library row launches, read by the pointer script so the row it clicks and
# the process the guest attributes the redemption to are one definition.
tairix-test-filepick-qemu-aarch64 = { path = "../../tests/integration/filepick_qemu_aarch64", version = "=0.0.0" }
# The desktop-menu vertical's shared interaction contract (the application
# whose window menu is opened), defined once beside that guest's PASS gate.
tairix-test-menu-qemu-aarch64 = { path = "../../tests/integration/menu_qemu_aarch64", version = "=0.0.0" }
# The elevated Date & Time vertical's shared interaction contract (the
# application the elevate path starts and the window count the guest latches).
tairix-test-datetime-elevate-qemu-aarch64 = { path = "../../tests/integration/datetime_elevate_qemu_aarch64", version = "=0.0.0" }
# The desktop-under-pressure vertical's shared contract: the count of windows
# the pointer script opens, which is also the occurrence the last screendump
# is gated on, so the script and the guest's PASS gate read one definition.
tairix-test-desktop-pressure-qemu-aarch64 = { path = "../../tests/integration/desktop_pressure_qemu_aarch64", version = "=0.0.0" }
# The desktop-hover vertical's shared contract: the fixture bundle the pointer
# script launches and the length of the sweep it injects between the two
# samples, defined once beside the bounds the guest gate applies.
tairix-test-desktop-hover-qemu-aarch64 = { path = "../../tests/integration/desktop_hover_qemu_aarch64", version = "=0.0.0" }
# The `framestats` fixture's own record vocabulary, so the marker the sweep is
# gated on is the message the fixture emits rather than a copy of it.
# `default-features = false`: the fixture's `program` feature (its `Run`
# binary's userland runtime) is for its freestanding cross-compile only.
tairix-test-framestats = { path = "../../tests/integration/framestats_program", version = "=0.0.0", default-features = false }
# The kernel/ipc audit vocabulary: the AW3 vertical's markers key on the
# `MessageDelivered` / `CallReplied` records the kernel emits for the
# window channel — the shared definitions, never literals.
tairix-kernel-ipc = { path = "../../kernel/ipc", version = "=0.0.0" }
# `format_hex_u64` — the same renderer the kernel/ipc audit fields use, so
# the endpoint marker compares the exact on-wire spelling.
tairix-util = { path = "../../lib/util", version = "=0.0.0" }
# The shared reclaimable-memory model and the structured-log sink trait:
# the AW3 pointer script builds a real `DesktopShell`, which owns the
# seat's rasterised-asset caches, so it must hand that shell the same
# pressure gauge and audit-sink types the live session does — truthfully
# wired for a tool that never draws (plans/SMARTRAM.md
# SMART5).
tairix-reclaim = { path = "../../lib/reclaim", version = "=0.0.0" }
tairix-log = { path = "../../lib/log", version = "=0.0.0" }
# The `JobRunner` contract the bench families measure a divided pass through.
tairix-parallel = { path = "../../lib/parallel", version = "=0.0.0" }
# The compositing window manager: `bench` times `Compositor::composite` over a
# real window stack — the very code the desktop runs each frame — so the
# whole-frame figure describes production compositing rather than a
# re-implementation of it (plans/FIX-DESKTOP-SPEEDUP.md A.2). The same gauge
# and sink the AW3 script wires above build its furniture cache.
tairix-wm = { path = "../../userland/gui/wm", version = "=0.0.0" }
# The bounded, median-of-rounds microbenchmark the boot-time CPU-candidate
# selection already measures over. `bench` injects a host nanosecond clock
# into its counter seam instead of growing a second timing loop.
tairix-cpuops = { path = "../../lib/cpuops", version = "=0.0.0" }
# The scan-out channel order: the encode family times the one definition every
# composited pixel is written to the frame through.
tairix-display = { path = "../../lib/display", version = "=0.0.0" }

[target.'cfg(unix)'.dependencies]
# The pipeline's step timeout must be able to kill a hung step's whole
# process group, because `cargo` runs the work it spawns (rustc, test
# binaries, QEMU) as grandchildren that survive killing the direct child.
# `std` can put the child in its own process group but offers no way to
# signal one, and shelling out to `kill(1)` is not a working substitute:
# measured on a stock Linux host, procps-ng `kill -s TERM -<pgid>` silently
# ignores the negated-pid group form and still exits 0, so the runaway
# processes would live on while the pipeline reported them killed. One
# `killpg` call is the honest way to reach that group. Not a new supply-chain
# entry: `libc` is already pinned, licence-checked and advisory-audited in
# this workspace's lockfile and already sits in this crate's own dependency
# graph. Host-only build glue, never product code.
libc = "0.2"

[dev-dependencies]
# The `image_drivers` autoload-decision tests drive the real production match
# over the bundles the pipeline signs: the drvhost store scanner decodes each
# manifest bind table and the shared devmatch policy resolves it against a
# discovered node. The single-source
# virtio-input device id keys the input node; the framebuffer compatible string
# and the virtio-net device id come from `tairix-abi` / the network driver dep
# above.
tairix-drvhost = { path = "../../userland/system/drvhost", version = "=0.0.0" }
tairix-devmatch = { path = "../../lib/devmatch", version = "=0.0.0" }
tairix-virtio-input = { path = "../../lib/virtio_input", version = "=0.0.0" }
# The `rngsoak` orchestrator's per-pass byte budget has to draw enough
# sequences for the harness's two-level decision rule to conclude anything.
# Pinning it against the harness's own minimum — rather than restating that
# minimum here — is what stops a soak from reporting an inconclusive verdict
# as a failure every night, the same drift guard the tcpserve marker above
# gets.
tairix-test-rng-soak = { path = "../../tests/integration/rng_soak", version = "=0.0.0" }
