[package]
name = "tairix-xtask"
description = "Build orchestration for the TAIRiX workspace."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# xtask is a host-side build tool. Its lints are kept as the workspace defaults
# but it deliberately does not inherit `missing_docs` strictness: command line
# enums and dispatch tables are exhaustively named, not documented.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
# `abi-check` (Stage 2.7) needs to recompute the SHA-256 fingerprint of
# the frozen `abi-v1` syscall table and compare it with the kernel
# mirror. The cheapest way to keep the two truly synchronised is to
# depend on both crates directly and run the comparison as ordinary
# Rust: a future ABI change cannot pass `cargo build` without breaking
# the cross-check.
tairix-abi = { path = "../../lib/abi", version = "=0.0.0" }
# `devids` imports, vets, and compiles the public PCI/USB ID databases
# through the one grammar/vetting/codec definition in `lib/devids` (shared
# with the runtime consumers, AGENTS.md §2.2), and drift-checks the
# committed tables in `ci`.
tairix-devids = { path = "../../lib/devids", version = "=0.0.0" }
# `devids` stamps its import provenance with a UTC date through the one
# civil-date calendar (`lib/fsmeta`), never a private copy.
tairix-fsmeta = { path = "../../lib/fsmeta", version = "=0.0.0" }
tairix-kernel-syscall = { path = "../../kernel/syscall", version = "=0.0.0" }
tairix-crypto = { path = "../../lib/crypto", version = "=0.0.0" }
# `test --qemu` cross-builds the CCOMPAT end-to-end C programs, whose build
# scripts locate `clang`/`ld.lld` through the audited `tairix-cc` wrapper. xtask
# resolves that toolchain *once* up front and exports its path so each build
# script uses the authoritative override instead of re-running the full search
# per crate/target (AGENTS.md §2.2 — the discovery logic lives only in
# `tairix-cc`; xtask merely primes it). Host-only build glue (AGENTS.md §12).
tairix-cc = { path = "../cc", version = "=0.0.0" }
# `help-lint` (plans/APPS.md §8.1) judges every discovered Help/ document
# through the one shared lint in the help engine (`tairix_help::lint_help_trees`,
# behind its host-only `lint` feature), so the gate and the `tools/syshelp`
# aggregator tests can never diverge (AGENTS.md §2.2).
tairix-help = { path = "../../lib/help", version = "=0.0.0", features = [
    "lint",
] }
# The app-bundle composer (`image_apps`) signs each bundle's `AppInfo`
# over the exact contents the volume ships; the bundle's `Help/` documents
# come from the same build-discovered source the image planters plant
# (`tairix_syshelp`), so the signed content hash and the planted tree
# cannot drift.
tairix-syshelp = { path = "../syshelp", version = "=0.0.0" }
# `test --qemu` (Stage 2 deliverable) drives the bare-metal integration
# tests through the audited `tools/qemu` runner. Sharing the runner
# crate keeps the test-execution contract (`isa-debug-exit`, strict
# timeouts, no retries) in exactly one place — see AGENTS.md §2.2.
tairix-qemu = { path = "../qemu", version = "=0.0.0" }
# The interactive login negative fixture derives its over-limit username from
# the account database format's own bound, so production validation and the
# QEMU script cannot drift.
tairix-users = { path = "../../lib/users", version = "=0.0.0" }

# The QEMU netstack verticals' host-side link peer: the same pure
# `lib/net` protocol engine the guest's netstack drives, run by the
# harness over the QEMU dgram netdev, configured from the shared
# `tairix-test-netstack-wire` topology so the two ends cannot drift.
tairix-net = { path = "../../lib/net", version = "=0.0.0" }
tairix-test-netstack-wire = { path = "../../tests/integration/netstack_wire", version = "=0.0.0" }
# `test --qemu` plants the Stage 5 end-to-end FAT32 vertical's backing
# image from the same `tairix-test-fat32-image` fixture the kernel-side
# tail reads, so the planted layout and the guest's expectations share
# one source of truth (`AGENTS.md` §2.2).
tairix-test-fat32-image = { path = "../../tests/integration/fat32_image", version = "=0.0.0" }
# `test --qemu` likewise plants the Stage 5 arxfs vertical's backing
# image from the `tairix-test-arxfs-image` fixture, which the real
# arxfs driver itself authors (format + plant), so the planted layout
# and the guest's expectations share one source of truth (`AGENTS.md`
# §2.2).
tairix-test-arxfs-image = { path = "../../tests/integration/arxfs_image", version = "=0.0.0" }
# `test --qemu` plants the `plans/PI.md` P11 Chunk B-2 root-mount->login
# vertical's backing from the `tairix-test-encrypted-root-image` fixture —
# the whole-disk MBR + FAT-boot(`root.unlock`) + encrypted-ARXFS-root
# image authored by the real in-tree drivers, the same bytes the
# `root_mount` host tests split — so the planted layout and the guest's
# unlock share one source of truth (`AGENTS.md` §2.2).
# The `plans/PI.md` P10 5d-2-ii(b-2-iii) / `plans/NETWORK.md` N4e autoload
# verticals boot the same encrypted-root image, additionally carrying the
# kernel-signed virtio-input keyboard driver, framebuffer display service, and
# virtio-net link-layer driver bundles in `/System/Drivers/`. Those bundles are
# now cross-compiled and signed by the `image_drivers` pipeline (the one
# definition every image consumer shares, `AGENTS.md` §2.2) and planted through
# this same encrypted-root fixture, so there is no separate fixed-arch fixture
# crate baking them at build time.
tairix-test-encrypted-root-image = { path = "../../tests/integration/encrypted_root_image", version = "=0.0.0" }
# The memory-stability vertical's fixture constants: the `MEMSOAK PASS`
# marker its serial script waits for is pinned against the fixture's own
# `PASS_MARKER` by a unit test, so the script and the program cannot drift.
# `default-features = false`: the fixture's `program` feature (its `Run`
# binary's userland runtime) is for its freestanding cross-compile only.
tairix-test-memsoak = { path = "../../tests/integration/memsoak_program", version = "=0.0.0", default-features = false }
# The fuzz/proptest orchestrators and the in-tree harnesses share one
# per-run seed/budget vocabulary: the orchestrator picks and logs the
# seed, the harness reads it. Both sides use `tairix-fuzzseed` so the
# seed primitives and the env-var names live in exactly one place
# (`AGENTS.md` §2.2).
tairix-fuzzseed = { path = "../../tests/fuzzseed", version = "=0.0.0" }
# `image` / `build --target aarch64-rpi` (Stage 8 / plans/PI.md P9) author
# the flashable platform images through the `tools/mkimage` library, so the
# image pipeline is ordinary Rust driven by the same xtask entry point as
# every other build step (AGENTS.md §12).
tairix-mkimage = { path = "../mkimage", version = "=0.0.0" }
# `image` cross-compiles and signs the autoloaded `/System/Drivers/` bundles
# the flashable Pi image ships (`plans/PI.md` P10 D4). The signed-bundle
# composer and the ELF->rxe converter live in the shared harness — the single
# definition the kernel `build.rs` and the autoload fixtures also use
# (`AGENTS.md` §2.2) — so `image` reuses them rather than re-rolling the wire
# layout. Host-only build glue (`AGENTS.md` §1 / §12); the `driver-image`
# feature pulls in the Ed25519 signer, and `app-image` the signed
# application-bundle composer + `AppInfo.toml` discovery the `image_apps`
# pipeline composes the self-contained `/System/Apps` + `/System/Services`
# bundles with (`plans/APPS.md` deliverable 8).
tairix-itest-harness = { path = "../../tests/integration/harness", version = "=0.0.0", features = [
    "driver-image",
    "app-image",
] }
# The autoloaded `/System/Drivers/` bundles' own canonical §18.3 bind tables,
# copied verbatim into each signed bundle so the autoload match data never
# drifts from the driver it binds (`AGENTS.md` §2.2 / §18.3): the mailbox
# service driver (via `tairix-vcmailbox`), the BCM2711 PCIe root-complex bus
# driver, the VL805 USB host bus driver, the xHCI host-controller driver, and
# the USB boot-keyboard class driver — each `BIND_KEYS` lives in the driver
# crate's own `lib` target (the device logic is co-located in the driver,
# `AGENTS.md` §2.22). These are `drivers/*` crates; xtask is host build glue
# (`Tooling`, outside the §17.4 product layering), so depending on them is
# permitted.
tairix-vcmailbox = { path = "../../lib/vcmailbox", version = "=0.0.0" }
tairix-drv-bus-pcie-brcm = { path = "../../drivers/bus/pcie_brcm", version = "=0.0.0" }
tairix-drv-bus-usb-vl805 = { path = "../../drivers/bus/usb/vl805", version = "=0.0.0" }
tairix-drv-bus-usb = { path = "../../drivers/bus/usb/xhci", version = "=0.0.0" }
tairix-drv-input-usb-kbd = { path = "../../drivers/input/usb_kbd", version = "=0.0.0" }
tairix-drv-input-usb-mouse = { path = "../../drivers/input/usb_mouse", version = "=0.0.0" }
tairix-drv-input-virtio-input = { path = "../../drivers/input/virtio_input", version = "=0.0.0" }
# The virtio-net link-layer driver's canonical §18.3 bind table (and its
# single-source virtio device id, used by the autoload-match tests): the
# `image_drivers` pipeline signs `BIND_KEYS` into the bundle it cross-compiles
# from the sibling driver-process crate (`tairix-drv-network-virtio-net-driver`),
# so the on-disk bundle and the driver never drift (`AGENTS.md` §2.2 / §18.3).
tairix-drv-network-virtio-net = { path = "../../drivers/network/virtio_net", version = "=0.0.0" }
tairix-drv-display-framebuffer = { path = "../../drivers/display/framebuffer", version = "=0.0.0" }
tairix-drv-storage-usb-msd = { path = "../../drivers/storage/usb_msd", version = "=0.0.0" }
tairix-drv-storage-volmgr = { path = "../../drivers/storage/volmgr", version = "=0.0.0" }
# The shared desktop theme definition: the display vertical's screendump
# assert compares the dumped scan-out against the theme's own desktop
# colour, so the expected pixels have one definition (never a literal).
tairix-theme = { path = "../../lib/theme", version = "=0.0.0" }
# The desktop-session, taskbar, browser-engine, geometry, and fw_cfg crates:
# the AW3 desktop vertical's pointer script reconstructs the production
# shell's taskbar/start-menu layout (the same code the guest runs) to compute
# its click coordinates, keys its screendumps on the session's witness
# messages, and measures the browser window and ramfb surface against the one
# shared definition of each — never a hand-copied literal (plans/APPWIN.md
# AW3/AW5).
tairix-desktop-session = { path = "../../userland/gui/session", version = "=0.0.0" }
tairix-taskbar = { path = "../../userland/gui/taskbar", version = "=0.0.0" }
tairix-browse = { path = "../../lib/browse", version = "=0.0.0" }
tairix-terminal = { path = "../../userland/apps/terminal", version = "=0.0.0" }
tairix-geometry = { path = "../../lib/geometry", version = "=0.0.0" }
tairix-fwcfg = { path = "../../lib/fwcfg", version = "=0.0.0" }
# The autoload desktop vertical's shared interaction contract (delivery
# counts), defined once in the test crate's lib target beside the guest
# PASS gate that also consumes it.
tairix-test-autoload-input-qemu-aarch64 = { path = "../../tests/integration/autoload_input_qemu_aarch64", version = "=0.0.0" }
# The kernel/ipc audit vocabulary: the AW3 vertical's markers key on the
# `MessageDelivered` / `CallReplied` records the kernel emits for the
# window channel — the shared definitions, never literals.
tairix-kernel-ipc = { path = "../../kernel/ipc", version = "=0.0.0" }
# `format_hex_u64` — the same renderer the kernel/ipc audit fields use, so
# the endpoint marker compares the exact on-wire spelling.
tairix-util = { path = "../../lib/util", version = "=0.0.0" }

[dev-dependencies]
# The `image_drivers` autoload-decision tests drive the real production match
# over the bundles the pipeline signs: the drvhost store scanner decodes each
# manifest bind table and the shared devmatch policy resolves it against a
# discovered node (`AGENTS.md` §2.2 / §18.3 / §18.6). The single-source
# virtio-input device id keys the input node; the framebuffer compatible string
# and the virtio-net device id come from `tairix-abi` / the network driver dep
# above.
tairix-drvhost = { path = "../../userland/system/drvhost", version = "=0.0.0" }
tairix-devmatch = { path = "../../lib/devmatch", version = "=0.0.0" }
tairix-log = { path = "../../lib/log", version = "=0.0.0" }
tairix-virtio-input = { path = "../../lib/virtio_input", version = "=0.0.0" }
