[package]
name = "tairix-syshelp"
description = "Build-discovered /System payload for image authoring (the program bundles' `Help/` and `Resources/` trees and the desktop's graphics assets, so no planter keeps a hand-maintained list, plans/APPS.md §2.1), and the one definition both disk authors build through: the /System volume's sizing and the boot disk's partition layout."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
# The host-only program-crate walk (`bundles`) the bundle composer shares; the
# freestanding fixture that links this crate into a guest never enables it.
walk = []

# `no_std`, so the host image builder and the freestanding QEMU image fixture
# consume it unchanged. The partition-table encoder is the one both disk
# authors lay their MBR through.
[dependencies]
tairix-partition = { path = "../../lib/partition", version = "=0.0.0" }

# Build-only: the desktop-graphics discovery walk validates every asset it
# emits against the desktop's own icon contract — the legal `<asset-id>.png`
# name (`artwork_kind_for_file`) and the untrusted-input byte bound
# (`MAX_ARTWORK_BYTES`) — so a name the desktop could never resolve or an
# over-large file fails the image build closed rather than silently rendering
# as a fallback glyph. The one definition of both is `tairix-icon`, shared
# with the runtime resolver so the build check and the desktop cannot diverge.
# It is `no_std`; here it links host-only into `build.rs`.
[build-dependencies]
tairix-icon = { path = "../../lib/icon", version = "=0.0.0" }
# The OS filesystem layout's own definition of the bundle stores and of the
# manifest kind that selects between them (`ProgramKind`). Each discovered
# payload row carries the store its bundle installs to, derived from that one
# mapping rather than a second copy here, so a planted file always lands
# inside the very bundle directory the composer signed — a file planted into
# another store leaves the installed bundle missing content its digest covers
# and the load gate refuses it. It is `no_std`; here it links host-only into
# `build.rs`.
tairix-abi = { path = "../../lib/abi", version = "=0.0.0" }
# The wallpaper graphics family's own definition of a legal shipped file name
# (`is_wallpaper_file_name`) and the untrusted-input byte bound
# (`MAX_WALLPAPER_BYTES`) — the same definition the runtime catalog listing
# filters against, so the build check and the runtime catalog cannot diverge.
# It is `no_std`; here it links host-only into `build.rs`.
tairix-wallpaper = { path = "../../lib/wallpaper", version = "=0.0.0" }
# The cursor graphics family's own definition of a legal set directory name
# (`is_cursor_set_name`), of the asset name each cursor kind asks for
# (`cursor_asset_kind_for_file`), and the untrusted-input byte bound
# (`MAX_CURSOR_ASSET_BYTES`) — the same definitions the running desktop
# resolves a set through, so the build check and the runtime loader cannot
# diverge. It is `no_std`; here it links host-only into `build.rs`.
tairix-cursor = { path = "../../lib/cursor", version = "=0.0.0" }

[dev-dependencies]
# The same kind -> store mapping `build.rs` plants by, so the test that holds
# every emitted row to its bundle's own store judges it against the one
# definition instead of a second copy that could drift.
tairix-abi = { path = "../../lib/abi", version = "=0.0.0" }
# The one help engine and its one help-tree lint (plans/APPS.md §6, §8.1):
# the aggregator's tests judge every discovered document through the same
# shared lint `cargo xtask help-lint` gates on, so a malformed, incomplete,
# drifted, or policy-violating tree can never reach an image and the two
# judgements can never diverge.
tairix-help = { path = "../../lib/help", version = "=0.0.0", features = [
    "lint",
] }
# The desktop icon contract the graphics-discovery tests judge `GRAPHICS_FILES`
# against — the legal `<asset-id>.png` name and the artwork byte bound — the
# same definition `build.rs` validates against, so the emitted table and the
# desktop resolver cannot drift.
tairix-icon = { path = "../../lib/icon", version = "=0.0.0" }
# The wallpaper contract the graphics-discovery tests judge the wallpaper
# `GRAPHICS_FILES` rows against — the same definition `build.rs` validates
# against, so the emitted table and the runtime catalog cannot drift.
tairix-wallpaper = { path = "../../lib/wallpaper", version = "=0.0.0" }
# The cursor contract the graphics-discovery tests judge the cursor
# `GRAPHICS_FILES` rows against, for the same reason.
tairix-cursor = { path = "../../lib/cursor", version = "=0.0.0" }
# The closed cursor-kind vocabulary a shipped set must cover completely, so
# a set missing a kind is caught here rather than showing a built-in cursor
# beside the shipped ones at runtime.
tairix-theme = { path = "../../lib/theme", version = "=0.0.0" }
