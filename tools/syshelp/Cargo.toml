[package]
name = "tairix-syshelp"
description = "Build-discovered system program-store Help payload for image authoring: scans the program bundles' on-disk `Help/` trees and exposes them as data, so the image builder plants help without a hand-maintained per-bundle list (plans/APPS.md §2.1, AGENTS.md §2.2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[lib]
path = "src/lib.rs"

# `no_std` (data only): the payload is `&'static [u8]` documents embedded at
# build time, so both the host image builder (`tools/mkimage`) and the
# freestanding QEMU image fixture (`tests/integration/encrypted_root_image`,
# which also links into the aarch64 guest tail) can consume it unchanged. No
# dependency on any app crate: the trees are discovered from the source tree
# by `build.rs`, never hand-listed (AGENTS.md §2.2).
[dependencies]

# Build-only: the desktop-graphics discovery walk validates every asset it
# emits against the desktop's own icon contract — the legal `<asset-id>.png`
# name (`artwork_kind_for_file`) and the untrusted-input byte bound
# (`MAX_ARTWORK_BYTES`) — so a name the desktop could never resolve or an
# over-large file fails the image build closed rather than silently rendering
# as a fallback glyph. The one definition of both is `tairix-icon`, shared
# with the runtime resolver so the build check and the desktop cannot diverge.
# It is `no_std`; here it links host-only into `build.rs`.
[build-dependencies]
tairix-icon = { path = "../../lib/icon", version = "=0.0.0" }
# The OS filesystem layout's own definition of the bundle stores and of the
# manifest kind that selects between them (`ProgramKind`). Each discovered
# payload row carries the store its bundle installs to, derived from that one
# mapping rather than a second copy here, so a planted file always lands
# inside the very bundle directory the composer signed — a file planted into
# another store leaves the installed bundle missing content its digest covers
# and the load gate refuses it. It is `no_std`; here it links host-only into
# `build.rs`.
tairix-abi = { path = "../../lib/abi", version = "=0.0.0" }

[dev-dependencies]
# The same kind -> store mapping `build.rs` plants by, so the test that holds
# every emitted row to its bundle's own store judges it against the one
# definition instead of a second copy that could drift.
tairix-abi = { path = "../../lib/abi", version = "=0.0.0" }
# The one help engine and its one help-tree lint (plans/APPS.md §6, §8.1):
# the aggregator's tests judge every discovered document through the same
# shared lint `cargo xtask help-lint` gates on, so a malformed, incomplete,
# drifted, or policy-violating tree can never reach an image and the two
# judgements can never diverge.
tairix-help = { path = "../../lib/help", version = "=0.0.0", features = [
    "lint",
] }
# The desktop icon contract the graphics-discovery tests judge `GRAPHICS_FILES`
# against — the legal `<asset-id>.png` name and the artwork byte bound — the
# same definition `build.rs` validates against, so the emitted table and the
# desktop resolver cannot drift.
tairix-icon = { path = "../../lib/icon", version = "=0.0.0" }
