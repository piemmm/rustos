[package]
name = "tairix-test-kernel-arch-boot-aarch64"
description = "QEMU integration test (plans/PI.md P6c-2): boot the aarch64 tairix-kernel pipeline on the virt board to AuditEvent::BootCompleted and report PASS via ARM semihosting."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# Freestanding "boot the aarch64 kernel pipeline and observe the final
# `AuditEvent::BootCompleted` audit record" integration test — the
# aarch64 analogue of `tests/integration/kernel_arch_boot` (x86_64) and
# `tests/integration/kernel_arch_boot_riscv64`. It reuses the production
# aarch64 boot pipeline through `tairix-kernel`'s library half
# (`boot_aarch64::boot`, `plans/PI.md` P6c-2): it enables the stage-1
# identity MMU + EL1 vectors, discovers the board from the embedded
# `virt` device tree, hands the `BootMemoryMap` to
# `kernel_core::kernel_main`, and only replaces the audit Sink so that
# observing `EventId(4004)` (`AuditEvent::BootCompleted`) flips
# `qemu_exit::exit_success`. Keeping the QEMU-exit shortcut in a
# dedicated bin (not a Cargo feature on the arch crate) prevents feature
# unification from leaking it into any production build (fail closed).

[[bin]]
name = "tairix-test-kernel-arch-boot-aarch64"
path = "src/main.rs"

[target.'cfg(all(target_arch = "aarch64", target_os = "none"))'.dependencies]
tairix-arch-aarch64 = { path = "../../../kernel/arch/aarch64", version = "=0.0.0" }
tairix-itest-finisher = { path = "../finisher", version = "=0.0.0" }
# The production aarch64 boot pipeline lives in `tairix-kernel`'s library
# half; this vertical reuses it verbatim and only swaps the audit sink
# (no duplication).
tairix-kernel = { path = "../../../kernel/tairix-kernel", version = "=0.0.0" }
# The boot heap the `kernel_core::kernel_main` allocations (the leaked
# `KernelState`, the scheduler) draw from.
tairix-kalloc = { path = "../../../lib/kalloc", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
