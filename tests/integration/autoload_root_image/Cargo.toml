[package]
name = "rustos-test-autoload-root-image"
description = "Whole-disk encrypted-root image fixture carrying kernel-signed driver bundles (the virtio-input keyboard driver and the framebuffer display service) in /System/Drivers/, for the plans/PI.md P10 / plans/DISPLAY.md D7d -M virt driver-loading-by-discovery autoload verticals. build.rs cross-compiles each driver PIE, converts it to an rxe relocated for the production spawn bias, and wraps it as the payload of a signed kind=UserSpace DriverManifest signed with the kernel's own driver-signing seed (build_support::KERNEL_DRIVER_SIGNING_SEED), so every bundle verifies against the kernel's embedded trust anchor. build_image() plants the bundles into the encrypted RustFS root the rustos-test-encrypted-root-image fixture builds, so the booted kernel discovers, verifies, and spawns them off the very volume it mounts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[lib]
path = "src/lib.rs"

# `no_std` + `alloc`: the builder links into the host build tool (`tools/xtask`,
# which plants the image) and composes the whole-disk bytes the same real
# in-tree drivers author (`AGENTS.md` §2.2). The embedded driver bundle is
# produced by `build.rs` (a host cross-compile + sign), not at run time.
[dependencies]
# The frozen `abi-v1` `DriverError` surface the builder returns.
rustos-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The whole-disk encrypted-root assembly (`build_image_with_drivers`) — the one
# author of the MBR + FAT boot + encrypted RustFS root layout (`AGENTS.md` §2.2).
rustos-test-encrypted-root-image = { path = "../encrypted_root_image", version = "=0.0.0" }

[dev-dependencies]
# The host tests drive the real production autoload decision over the embedded
# bundle: the drvhost store scanner decodes its manifest bind table, and the
# shared devmatch policy resolves it against a discovered virtio-input node
# (`AGENTS.md` §18.3 / §18.6).
rustos-devmatch = { path = "../../../lib/devmatch", version = "=0.0.0" }
rustos-drvhost = { path = "../../../userland/system/drvhost", version = "=0.0.0" }
rustos-log = { path = "../../../lib/log", version = "=0.0.0" }
# The single-source virtio-input device id the discovered node is keyed by.
rustos-virtio-input = { path = "../../../lib/virtio_input", version = "=0.0.0" }
# The single-source virtio-net device id the discovered network node is keyed by.
rustos-drv-network-virtio-net = { path = "../../../drivers/network/virtio_net", version = "=0.0.0" }

[build-dependencies]
# The build script converts the PIE driver ELF to an `rxe` and assembles +
# signs the bundle through the shared composer (`driver-image`), so the
# manifest wire format and the spawn bias have exactly one definition
# (`AGENTS.md` §2.2). Host-only build glue (`AGENTS.md` §12).
rustos-itest-harness = { path = "../harness", version = "=0.0.0", features = [
    "driver-image",
] }
rustos-kernel-syscall = { path = "../../../kernel/syscall", version = "=0.0.0" }
rustos-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# Each driver's own §18.3 bind table, the single source its signed manifest is
# authored from so the on-disk bundle and the driver cannot drift.
rustos-drv-input-virtio-input = { path = "../../../drivers/input/virtio_input", version = "=0.0.0" }
rustos-drv-display-framebuffer = { path = "../../../drivers/display/framebuffer", version = "=0.0.0" }
rustos-drv-network-virtio-net = { path = "../../../drivers/network/virtio_net", version = "=0.0.0" }
