# Signed-AppInfo manifest source for the `memsoak` memory-stability fixture
# (plans/APPS.md "Immediate work" I2/I3). Composed and planted ONLY on the
# aarch64 memory-stability QEMU vertical's disk image by tools/xtask — the
# crate lives outside the userland discovery walk, so no production image
# ever ships it. The capability list is the bundle's request, intersected
# with the launching user's grants (the seeded root administrator ceiling):
# CAP_CONSOLE_WRITE for the PASS/FAIL report on fd 1/2, CAP_CONSOLE_READ for
# the timed stream_read that replays top's refresh park, CAP_FS_ACCESS and
# CAP_PROC_SPAWN for the spawn/wait cycles of /System/Apps/true.app/Run, and
# CAP_SYSINFO_KERNEL because the KERNEL_MEMORY_STATS query it samples
# declares that capability (enforced by sysinfod against this process's
# kernel-attested origin).
id = "os.tairix.test.memsoak"
name = "memsoak"
version = "0.1.0"
kind = "command"
capabilities = ["CAP_CONSOLE_WRITE", "CAP_CONSOLE_READ", "CAP_FS_ACCESS", "CAP_PROC_SPAWN", "CAP_SYSINFO_KERNEL"]
