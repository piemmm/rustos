[package]
name = "tairix-itest-harness"
description = "Build-time target classification shared by the freestanding QEMU integration binaries: emits the central `freestanding`/`itest_*` cfg flags so the binaries never name the target architecture in their own source (AGENTS.md §2.2, §17.2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# `driver-image` enables the signed `.rxe` driver-bundle composer
# (`src/driver_image.rs`) and its Ed25519 dependency. It is opt-in so only the
# build scripts that actually sign a bundle (the driver-spawn vertical, the
# autoload-root image fixture) pull in the crypto crate, not every harness
# consumer (`AGENTS.md` §2.2 / §2.3).
[features]
driver-image = ["dep:ed25519-dalek"]
# `app-image` enables the signed application-bundle composer and the
# `AppInfo.toml` manifest discovery (`src/app_image.rs`): Ed25519 signing
# plus the `lib/crypto` SHA-256 the canonical bundle content hash uses.
# Opt-in for the same reason as `driver-image`.
app-image = ["dep:ed25519-dalek", "dep:tairix-crypto"]

[dependencies]
# The single source of truth for the `rxe` load-image wire format, reused so
# the ELF->rxe converter never re-encodes the header/segment layout by hand
# (`AGENTS.md` §2.2). `tairix-abi` is `no_std` but builds on the host, which
# is where this build-time helper runs.
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# Ed25519 signing for the `driver-image` signed-bundle composer (host-only
# build glue, `AGENTS.md` §12); pulled in only when that feature is enabled.
ed25519-dalek = { version = "=2.1.1", default-features = false, features = [
    "zeroize",
], optional = true }
# The audited `lib/crypto` SHA-256 the canonical bundle content hash is
# computed with (`app-image` only), so the composer and every store-side
# verifier hash through the same wrapped primitive (`AGENTS.md` §2.12).
tairix-crypto = { path = "../../../lib/crypto", version = "=0.0.0", optional = true }

[dev-dependencies]
# Build a real flattened device tree (the same fixture the `lib/fdt` unit
# tests use) so the DTB-trimming helper is proven against a genuine FDT,
# not a hand-rolled header (`AGENTS.md` §7).
tairix-fdt = { path = "../../../lib/fdt", version = "=0.0.0", features = [
    "test-fixtures",
] }

[lib]
path = "src/lib.rs"
