[package]
name = "tairix-itest-harness"
description = "Build-time target classification shared by the freestanding QEMU integration binaries: emits the central `freestanding`/`itest_*` cfg flags so the binaries never name the target architecture in their own source."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# `driver-image` enables the signed `.rxe` driver-bundle composer
# (`src/driver_image.rs`) and its Ed25519 dependency. It is opt-in so only the
# build scripts that actually sign a bundle (the driver-spawn vertical, the
# autoload-root image fixture) pull in `lib/crypto`, not every harness
# consumer.
[features]
driver-image = ["dep:tairix-crypto"]
# `app-image` enables the signed application-bundle composer and the
# `AppInfo.toml` manifest discovery (`src/app_image.rs`): Ed25519 signing
# plus the SHA-256 the canonical bundle content hash uses, both from
# `lib/crypto`. Opt-in for the same reason as `driver-image`.
app-image = ["dep:tairix-crypto"]

[dependencies]
# The single source of truth for the `rxe` load-image wire format, reused so
# the ELF->rxe converter never re-encodes the header/segment layout by hand.
# `tairix-abi` is `no_std` but builds on the host, which
# is where this build-time helper runs.
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The QEMU runner's own per-arch defaults, so the `virt` tree a build script
# dumps describes the same machine the runner starts (one definition of the
# default guest RAM, not a copy in each).
tairix-qemu = { path = "../../../tools/qemu", version = "=0.0.0" }
# The audited SHA-256 the canonical bundle content hash is computed with and
# the Ed25519 signing the bundle composers use, so the composer and every
# store-side verifier go through the same wrapped primitives. `lib/crypto` is
# the one crate in the workspace that names a cryptographic dependency.
tairix-crypto = { path = "../../../lib/crypto", version = "=0.0.0", optional = true }

[dev-dependencies]
# Build a real flattened device tree (the same fixture the `lib/fdt` unit
# tests use) so the DTB-trimming helper is proven against a genuine FDT,
# not a hand-rolled header.
tairix-fdt = { path = "../../../lib/fdt", version = "=0.0.0", features = [
    "test-fixtures",
] }

[lib]
path = "src/lib.rs"
