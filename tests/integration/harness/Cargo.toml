[package]
name = "rustos-itest-harness"
description = "Build-time target classification shared by the freestanding QEMU integration binaries: emits the central `freestanding`/`itest_*` cfg flags so the binaries never name the target architecture in their own source (AGENTS.md §2.2, §17.2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# The single source of truth for the `rxe` load-image wire format, reused so
# the ELF->rxe converter never re-encodes the header/segment layout by hand
# (`AGENTS.md` §2.2). `rustos-abi` is `no_std` but builds on the host, which
# is where this build-time helper runs.
rustos-abi = { path = "../../../lib/abi", version = "=0.0.0" }

[lib]
path = "src/lib.rs"
