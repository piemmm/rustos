[package]
name = "rustos-test-stack-guard-qemu-aarch64"
description = "plans/PI.md guard-page fault-form (stage G1) QEMU integration test: prove the aarch64 page-table block-split lets a single 4 KiB page inside a coarse identity block be unmapped so an access to it raises a synchronous data abort on the virt board — the live mechanism the kthread kernel-stack guard page is built on."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# Freestanding "split a coarse identity block down to 4 KiB pages, unmap
# one page, and prove the MMU faults the access to it" integration test —
# the `-M virt` proof of the `plans/PI.md` guard-page fault-form
# foundation (`AddressSpace::split_block`). The kernel image and stack are
# never the unmapped page, so the split is safe against the running region
# (it only *adds* table levels reproducing the existing translation). It
# links only the `rustos-arch-aarch64` port and reports the result through
# the ARM semihosting finisher. Keeping the QEMU-exit shortcut in a
# dedicated bin (not a Cargo feature on the arch crate) prevents feature
# unification from leaking it into any production build (`AGENTS.md`
# §5.4.5 — fail closed).

[[bin]]
name = "rustos-test-stack-guard-qemu-aarch64"
path = "src/main.rs"

[target.'cfg(all(target_arch = "aarch64", target_os = "none"))'.dependencies]
rustos-arch-aarch64 = { path = "../../../kernel/arch/aarch64", version = "=0.0.0" }
# The Arch HAL MMU + TLB surface (`AGENTS.md` §17.2): the page is torn
# down through `rustos_arch_api::mmu::AddressSpace::unmap` and the stale
# entry flushed through `rustos_arch_api::tlb::TlbShootdown::flush_page`,
# so the fault-form is proven *through the HAL*.
rustos-arch-api = { path = "../../../kernel/arch/api", version = "=0.0.0" }
rustos-log = { path = "../../../lib/log", version = "=0.0.0" }

[build-dependencies]
rustos-itest-harness = { path = "../harness", version = "=0.0.0" }
