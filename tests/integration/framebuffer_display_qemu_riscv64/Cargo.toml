[package]
name = "tairix-test-framebuffer-display-qemu-riscv64"
description = "Stage 4 first-driver vertical: boot the riscv64 virt-board pipeline, synthesise a real linear framebuffer with QEMU ramfb (programmed over the fw_cfg-MMIO DMA interface), publish the parsed geometry as a FramebufferConfig boot hand-off, then load the signed framebuffer display `.rxe` through tairix_drvhost::Host and drive it through load -> use (Framebuffer::open + present over the capability-gated KernelMmioMapper) -> unload -> reload, verifying the presented pixels land in the ramfb scanout surface, before reporting SiFive Test success. The display-class analogue of the ps2 input vertical."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "tairix-test-framebuffer-display-qemu-riscv64"
path = "src/main.rs"

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["zeroize"] }

# The freestanding bin links only on the riscv64 `virt` target; a host
# `cargo build --workspace` compiles `src/main.rs` to an inert stub
# (`AGENTS.md` §17.2 — the instruction-set choice lives in `build.rs`).
[target.'cfg(all(target_arch = "riscv64", target_os = "none"))'.dependencies]
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
tairix-arch-riscv64 = { path = "../../../kernel/arch/riscv64", version = "=0.0.0" }
tairix-kalloc = { path = "../../../lib/kalloc", version = "=0.0.0" }
tairix-caps = { path = "../../../lib/caps", version = "=0.0.0" }
tairix-crypto = { path = "../../../lib/crypto", version = "=0.0.0" }
tairix-drvhost = { path = "../../../userland/system/drvhost", version = "=0.0.0" }
tairix-display = { path = "../../../lib/display", version = "=0.0.0" }
tairix-kernel-mem = { path = "../../../kernel/mem", version = "=0.0.0", features = ["host-tests"] }
tairix-kernel-sec = { path = "../../../kernel/sec", version = "=0.0.0" }
tairix-kernel-virtio = { path = "../../../kernel/virtio", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }
tairix-fdt = { path = "../../../lib/fdt", version = "=0.0.0" }
tairix-fwcfg = { path = "../../../lib/fwcfg", version = "=0.0.0" }
tairix-test-riscv64-boot = { path = "../riscv64_boot", version = "=0.0.0" }
