[package]
name = "tairix-test-spawn-supervision"
description = "Shared supervision witness for the end-to-end QEMU spawn-session verticals. The freestanding guest kernels (tests/integration/spawn_session_qemu_aarch64 and _x86_64) both drive their audit sink through this one state machine, so each port asserts the same thing and neither can drift."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
tairix-kernel-core = { path = "../../../kernel/core", version = "=0.0.0" }
tairix-kernel-syscall = { path = "../../../kernel/syscall", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }

[dev-dependencies]
tairix-kernel-sec = { path = "../../../kernel/sec", version = "=0.0.0" }
