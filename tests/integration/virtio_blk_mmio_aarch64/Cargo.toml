[package]
name = "rustos-test-virtio-blk-mmio-aarch64"
description = "Stage W11 QEMU integration test: boot the aarch64 virt-board, build the virtio-MMIO bus from the device tree, provision an MmioTransport through the capability-gated KernelMmioMapper, arm the device's GICv2 SPI + EL1 IRQ path, mint a KernelVirtioHost over a static per-device DMA pool, load the signed virtio-blk `.rxe`, then drive a real block round-trip (read sector 0, write+read-back sector 1) before reporting success through ARM semihosting. The aarch64 analogue of the riscv64 virtio-blk-mmio vertical; the device-tail round-trip is the same shared code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "rustos-test-virtio-blk-mmio-aarch64"
path = "src/main.rs"

[build-dependencies]
rustos-itest-harness = { path = "../harness", version = "=0.0.0" }
rustos-abi = { path = "../../../lib/abi", version = "=0.0.0" }
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["zeroize"] }

# The device-agnostic bring-up scaffolding (boot harness, DTB MMIO walk,
# GICv2 + EL1 IRQ wiring, static DMA pool, signed-`.rxe` load) and the
# virtio-blk round-trip tail both live in the shared support crate; this
# bin pulls in only the abi and the virtio-blk driver it resolves the
# loaded image to (`AGENTS.md` §2.2).
[target.'cfg(all(target_arch = "aarch64", target_os = "none"))'.dependencies]
rustos-abi = { path = "../../../lib/abi", version = "=0.0.0" }
rustos-drv-storage-virtio-blk = { path = "../../../drivers/storage/virtio_blk", version = "=0.0.0" }
rustos-test-virtio-qemu-support = { path = "../virtio_qemu_support", version = "=0.0.0" }
