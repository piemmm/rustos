[package]
name = "rustos-test-syscall-dispatch-qemu"
description = "Stage 2.7 follow-up (f6) QEMU integration test: drive Dispatcher::dispatch with (cap_query, CAP_TIME_SET) and (exit, 0) and observe the resulting SyscallInvoked audit record before flipping qemu_exit::exit_success."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# This bin is the Stage 2.7 follow-up (f6) integration test mandated by
# PLAN.md ("Stage 2.7 follow-up — Production syscall wiring"). It runs
# only on the freestanding `x86_64-unknown-none` target under QEMU.
#
# The test reuses the production `rustos-kernel` boot pipeline (via
# `rustos-kernel`'s library half — see `kernel/rustos-kernel/src/lib.rs`)
# and replaces the audit sink with one that, on observing
# `AuditEvent::BootCompleted`, synthesises a Scheduler/CapTable/
# KernelSyscallHandlers/Dispatcher quartet locally on the stack and
# drives `Dispatcher::dispatch` twice:
#
#  1. `(cap_query, CAP_TIME_SET)` — the calling task is granted
#     CAP_TIME_SET, so this must return `Ok(1)`. The cap_query syscall
#     is documented as a "pure observer" in `lib/abi/src/syscalls.rs`
#     (`audit: false`) precisely so capability probes do not drown the
#     audit log; observability for this leg therefore comes from the
#     Dispatcher's return value, which the synthesised entry point
#     inspects.
#
#  2. `(exit, 0)` — declared `audit: true` in the abi-v1 table, so a
#     successful dispatch emits one `AuditEvent::SyscallInvoked`
#     (`EventId(5000)`) record via the synthesised inner audit sink.
#     The inner sink counts those records; the entry point asserts the
#     count reaches one before calling `qemu_exit::exit_success`.
#
# The `test-hooks` feature is on by default for this crate. Release
# builds that enable it are rejected by the `compile_error!` guard in
# `src/main.rs` and by `cargo deny check`'s `[[bans.features]]` rule
# on the production `rustos-kernel` crate, which is forbidden from
# ever growing a `test-hooks` feature (AGENTS.md §1 — no hacks;
# §5.4.5 — fail closed; §15 — test affordances stay in test crates).
[features]
default = ["test-hooks"]
# `test-hooks` gates the synthesised-quartet entry point. The feature
# exists so that a future consumer can disable it (e.g. when running
# `cargo build --no-default-features -p rustos-test-syscall-dispatch-qemu`
# for a layout sanity check) without removing the crate from the
# workspace. The `compile_error!` guard in `src/main.rs` rejects the
# feature in release-mode builds.
test-hooks = []

[[bin]]
name = "rustos-test-syscall-dispatch-qemu"
path = "src/main.rs"

[target.'cfg(all(target_arch = "x86_64", target_os = "none"))'.dependencies]
rustos-abi = { path = "../../../lib/abi", version = "=0.0.0" }
rustos-arch-x86_64 = { path = "../../../kernel/arch/x86_64", version = "=0.0.0", features = ["sched-arch"] }
rustos-caps = { path = "../../../lib/caps", version = "=0.0.0" }
rustos-kernel = { path = "../../../kernel/rustos-kernel", version = "=0.0.0" }
rustos-kernel-core = { path = "../../../kernel/core", version = "=0.0.0" }
rustos-kernel-irq = { path = "../../../kernel/irq", version = "=0.0.0" }
rustos-kernel-sched = { path = "../../../kernel/sched", version = "=0.0.0" }
rustos-kernel-sec = { path = "../../../kernel/sec", version = "=0.0.0" }
rustos-kernel-sync = { path = "../../../kernel/sync", version = "=0.0.0" }
rustos-kernel-syscall = { path = "../../../kernel/syscall", version = "=0.0.0" }
rustos-log = { path = "../../../lib/log", version = "=0.0.0" }

[build-dependencies]
rustos-itest-harness = { path = "../harness", version = "=0.0.0" }
