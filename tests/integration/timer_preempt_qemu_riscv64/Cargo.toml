[package]
name = "tairix-test-timer-preempt-qemu-riscv64"
description = "Stage 3c QEMU integration test: the riscv64 supervisor-timer interrupt drives the scheduler-tick callback on the virt board."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# Freestanding "arm the SBI timer and prove the supervisor-timer
# interrupt repeatedly drives the `preempt` scheduler-tick callback"
# integration test — the riscv64 half of the Stage-3 "timer interrupt
# drives scheduler" per-sub-stage deliverable (`PLAN.md` Stage 3). It
# links only the `tairix-arch-riscv64` port (the timer path needs no
# `kernel/*` subsystem), installs a tick callback that counts
# interrupts, and writes the `SiFive` Test PASS finisher once enough
# ticks have been observed. Keeping the QEMU-exit shortcut in a
# dedicated bin (not a Cargo feature on the arch crate) prevents feature
# unification from leaking it into any production build
# (fail closed).

[[bin]]
name = "tairix-test-timer-preempt-qemu-riscv64"
path = "src/main.rs"

[target.'cfg(all(target_arch = "riscv64", target_os = "none"))'.dependencies]
tairix-arch-riscv64 = { path = "../../../kernel/arch/riscv64", version = "=0.0.0" }
tairix-arch-api = { path = "../../../kernel/arch/api", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }
[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
