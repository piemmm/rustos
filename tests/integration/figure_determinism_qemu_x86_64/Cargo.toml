[package]
name = "tairix-test-figure-determinism-qemu-x86-64"
description = "QEMU integration test: WinterSun's figure engine produces the digest tairix_wintersun_figure::digest::REFERENCE_DIGEST on x86_64. Every figure of the reference grid — its carried rings, projected strips, planting roots and misses, gait phases and quality numbers, and a designer's preview through every change of clip — runs in the guest and is folded into one number, which must equal the constant every other Tier-1 target asserts. Its siblings are figure_determinism_qemu_{aarch64,riscv64} and figure_determinism_wasm32."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# Freestanding kernel ELF QEMU loads with `-kernel`. It links the x86_64
# port for boot and the COM1 console, a heap for the generator's working
# vectors, and the world crate itself. The point of running it here rather
# than on the host is that the arithmetic is compiled by a different
# backend for a freestanding target with no platform libm: a divergence in
# f64 lowering, in an integer narrowing, or in a sort's tie-break shows up
# as a different digest and nowhere else.
#
# On the host target the crate has no test source and contributes nothing
# to `cargo test`; the orchestrator is `cargo xtask test --qemu`.

[[bin]]
name = "tairix-test-figure-determinism-qemu-x86-64"
path = "src/main.rs"

[target.'cfg(all(target_arch = "x86_64", target_os = "none"))'.dependencies]
tairix-arch-x86_64 = { path = "../../../kernel/arch/x86_64", version = "=0.0.0" }
tairix-kalloc = { path = "../../../lib/kalloc", version = "=0.0.0" }
tairix-wintersun-figure = { path = "../../../userland/games/wintersun/figure", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
