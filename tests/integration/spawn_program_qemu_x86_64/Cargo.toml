[package]
name = "tairix-test-spawn-program-qemu-x86_64"
description = "CCOMPAT stage CC3 QEMU integration test: spawn a separately-linked crt0 + abi-sys C-ABI program (tests/integration/cc3_program) into ring 3 on x86_64. The build script compiles the program PIE and converts it to an rxe blob; the test boots the production tairix-kernel pipeline and, on BootCompleted, materialises a user address space with tairix_kernel_core::spawn_and_enter (capability-checked + audited) and iretq's into it, and the dispatch callback asserts the program's exit syscall carries its decimal argument."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# This bin is the `plans/CCOMPAT.md` stage CC3 x86_64 round-trip: a
# crt0-linked program starts in ring 3, reads its argument, and exits with
# it. The fixture program (`tairix-test-cc3-program`) is built position-
# independent by `build.rs` and converted to an `rxe` blob
# (`tairix_itest_harness::elf2rxe`) carrying the kernel's compiled-in syscall
# CFI tag. It boots the production kernel pipeline (so the GDT ring-3
# selectors, the TSS, and `syscall`/`IA32_LSTAR` entry are installed) and, on
# `AuditEvent::BootCompleted`, enables `IA32_EFER.NXE`, builds a fresh address
# space (low 32 MiB identity + higher-half kernel window), switches CR3, and
# calls the production capability-checked, audited spawn caller
# (`tairix_kernel_core::spawn_and_enter`, gated on `CAP_PROC_SPAWN`) to build
# the program's ring-3 image (W^X: code RX, data RW-NX, rodata R-NX) and
# `iretq` into it through the Arch HAL `EnterUser` primitive. The program's
# `exit` `syscall` traps back through the kernel's `IA32_LSTAR` entry stub; the
# callback asserts the exit code equals the spawned decimal argument before
# `qemu_exit::exit_success`. Any mismatch (or a returning spawn) flips
# `qemu_exit::exit_failure`.
#
# The `test-hooks` feature is on by default. Release builds that enable it are
# rejected by the `compile_error!` guard in `src/main.rs` (AGENTS.md §1 — no
# hacks; §5.4.5 — fail closed), mirroring the other CC3 round-trip tests.
[features]
default = ["test-hooks"]
test-hooks = []

[[bin]]
name = "tairix-test-spawn-program-qemu-x86_64"
path = "src/main.rs"

[target.'cfg(all(target_arch = "x86_64", target_os = "none"))'.dependencies]
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
tairix-arch-api = { path = "../../../kernel/arch/api", version = "=0.0.0" }
tairix-arch-x86_64 = { path = "../../../kernel/arch/x86_64", version = "=0.0.0", features = ["sched-arch"] }
tairix-kernel = { path = "../../../kernel/tairix-kernel", version = "=0.0.0" }
tairix-kernel-core = { path = "../../../kernel/core", version = "=0.0.0" }
tairix-kernel-mem = { path = "../../../kernel/mem", version = "=0.0.0" }
tairix-kernel-syscall = { path = "../../../kernel/syscall", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
tairix-kernel-syscall = { path = "../../../kernel/syscall", version = "=0.0.0" }
