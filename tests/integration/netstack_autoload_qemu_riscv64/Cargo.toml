[package]
name = "tairix-test-netstack-autoload-qemu-riscv64"
description = "plans/NETWORK.md N4e-riscv64 QEMU integration test: boot the production riscv64 tairix-kernel pipeline (boot_riscv64::boot) on the virt board against the shared autoload-root disk (whose always-readable /System store carries the kernel-signed virtio-net driver bundle cross-compiled for riscv64) with a virtio-net-device attached on the virtio-mmio transport and the harness-side netstack_peer link peer on the QEMU dgram netdev. Proves the full two-process network path over the riscv64 PLIC device-IRQ path: devmgr autoloads the virtio-net driver into its own user process (it publishes a netchan node), the user-space devmgr service calls netstack BindDriver, netstack provisions the channel and auto-configures the interface's EUI-64 IPv6 link-local (no IPv4), and answers the host peer's link-local echo campaign end to end through both user processes. The guest does not self-exit; the harness ends the run when the host peer confirms the echo round-trip (its success gate), so teardown cannot precede the reply leaving the machine. The three witness records (NETSTACK_BOUND, DRIVER_BOUND, INBOUND_ECHO_SERVED) reach the serial transcript for diagnosis, and the peer's echo verdict subsumes them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "tairix-test-netstack-autoload-qemu-riscv64"
path = "src/main.rs"

# Freestanding "boot the production riscv64 kernel pipeline against the shared
# autoload-root disk carrying the signed virtio-net driver bundle, and prove
# the two-process live-boot network path end to end" integration test. It
# reuses the entire production riscv64 boot pipeline through `tairix-kernel`'s
# library half (`boot_riscv64::boot`) unchanged. The guest does not self-exit;
# the harness drives the run to completion through the host peer's success gate,
# so there is no in-kernel QEMU-exit shortcut to leak into any production build
# (fail closed).
[target.'cfg(all(target_arch = "riscv64", target_os = "none"))'.dependencies]
tairix-arch-riscv64 = { path = "../../../kernel/arch/riscv64", version = "=0.0.0" }
tairix-kernel = { path = "../../../kernel/tairix-kernel", version = "=0.0.0" }
tairix-kernel-core = { path = "../../../kernel/core", version = "=0.0.0" }
tairix-kalloc = { path = "../../../lib/kalloc", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
