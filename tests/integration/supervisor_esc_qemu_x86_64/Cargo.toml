[package]
name = "tairix-test-supervisor-esc-qemu-x86-64"
description = "plans/NEW-SUPERVISOR.md §7 / plans/ARCHSUPPORT.md QEMU integration test: the x86_64 sibling of the aarch64 pre-boot-Supervisor ESC vertical. Boot the production x86_64 tairix-kernel pipeline (boot_x86_64::boot) with a planted whole-disk encrypted-root image attached as a virtio-blk-pci device, press ESC at the pre-mount boot screen to drop into the in-kernel pre-boot Supervisor REPL, run a read-only command, `continue` back to the normal unlock, and unlock the encrypted ARXFS root. It drives the byte-exact boot-screen contract end to end (the frozen `[Press ESC for supervisor]` announcement and the `ARXFS`/`Supervisor`/`*` collapse) and proves a Supervisor session is transparent to boot on x86_64: PASS once the unlock-service install message is observed, which can only follow `continue` resuming the normal unlock after the REPL. It reuses the entire production boot pipeline and only swaps the audit sink (no duplication)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "tairix-test-supervisor-esc-qemu-x86-64"
path = "src/main.rs"

# Freestanding "boot the production x86_64 kernel pipeline with a planted
# encrypted-root virtio-blk-pci disk, drop into the pre-boot Supervisor at the
# ESC boot screen, resume with `continue`, and prove the resumed unlock mounts
# the root" integration test. It reuses the entire production x86_64 boot
# pipeline through `tairix-kernel`'s library half (`boot_x86_64::boot`) — the
# same path the x86_64 root-unlock-admission vertical drives, which already
# installs the real `SupervisorHost` and draws the ESC boot screen — and only
# swaps the audit sink to observe the unlock-service install message
# (no duplication). Keeping the QEMU-exit shortcut in a
# dedicated bin (not a Cargo feature on a production crate) prevents feature
# unification from leaking it into any production build (fail closed).
[target.'cfg(all(target_arch = "x86_64", target_os = "none"))'.dependencies]
tairix-arch-x86_64 = { path = "../../../kernel/arch/x86_64", version = "=0.0.0", features = ["sched-arch"] }
tairix-kernel = { path = "../../../kernel/tairix-kernel", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
