[package]
name = "tairix-test-netstack-ecn-qemu-aarch64"
description = "plans/NETWORK.md N13 ECN QEMU vertical: boot the production aarch64 tairix-kernel pipeline (boot_aarch64::boot) on the virt board with the encrypted-root disk carrying the standard signed store bundles, the signed virtio-net driver bundle, the test-only tcpecho fixture bundle, and a planted system.conf that turns net.tcp.ecn on stack-wide, with a virtio-net device attached and the harness-side ECN-verifying passive TCP echo peer on its dgram netdev. It unlocks the root, authenticates root/root at the console login, and runs `tcpecho` from the scripted shell: the client opens a TCP stream socket, connects to the peer over the shared IPv6 link-local wire, and streams a fixed deterministic byte run that the peer echoes back. Because devmgr delivered tcp_ecn=true to netstack, the connection negotiates RFC 3168 ECN; the host peer verifies on the live wire that the guest's SYN offered ECN, its data carried ECT(0), and it set CWR after the peer echoed ECE for an injected congestion mark. PASS once the fixture's audited exit (a verified transfer) has been observed and the shell's scripted exit follows it; the harness additionally requires the peer's ECN verdict, so neither side can pass alone."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "tairix-test-netstack-ecn-qemu-aarch64"
path = "src/main.rs"

# Freestanding "boot the production aarch64 pipeline with the planted
# encrypted-root disk carrying the virtio-net driver + tcpecho fixture + an
# ECN-on system.conf and prove the ECN path end to end over the live
# two-process network" integration test. It reuses the entire production boot
# pipeline through `tairix-kernel`'s library half — discovery, the unlock
# kthread, PID 1 supervision, netstack, devmgr's driver autoload + config
# delivery, login's spawn-as-user, the shell, and the disk-backed bundle spawn
# path — and only swaps the audit sink (no duplication). Keeping the QEMU-exit
# shortcut in a dedicated bin (not a Cargo feature on a production crate)
# prevents feature unification from leaking it into any production build (fail
# closed).
[target.'cfg(all(target_arch = "aarch64", target_os = "none"))'.dependencies]
tairix-arch-aarch64 = { path = "../../../kernel/arch/aarch64", version = "=0.0.0" }
tairix-kernel = { path = "../../../kernel/tairix-kernel", version = "=0.0.0" }
tairix-kalloc = { path = "../../../lib/kalloc", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }
# The fixture's pure library, for the one `COMMAND` definition the PASS keying
# matches `comm` against. `default-features = false`: the fixture's `program`
# feature (its own `Run` binary's userland runtime) must never link into this
# kernel bin — the runtime's `_start`/panic handler belong to the fixture's
# standalone cross-compile only.
tairix-test-tcpecho = { path = "../tcpecho_program", version = "=0.0.0", default-features = false }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
