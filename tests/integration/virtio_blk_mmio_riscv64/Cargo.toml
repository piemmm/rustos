[package]
name = "tairix-test-virtio-blk-mmio-riscv64"
description = "Stage 4.D Item 4 QEMU integration test: boot the riscv64 virt-board pipeline, build the virtio-MMIO bus from the device tree, provision an MmioTransport through the capability-gated KernelMmioMapper, arm the device's PLIC source + S-mode trap path, mint a KernelVirtioHost over a carved per-device DMA pool, load the signed virtio-blk `.rxe`, then drive a real block round-trip (read sector 0, write+read-back sector 1) before reporting SiFive Test success. The MMIO analogue of the x86_64 virtio-blk-pci vertical; the device-tail round-trip is the same shared code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "tairix-test-virtio-blk-mmio-riscv64"
path = "src/main.rs"

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["zeroize"] }

# The device-agnostic bring-up scaffolding (boot harness, DTB MMIO walk,
# PLIC + trap wiring, DMA carve, signed-`.rxe` load) and the virtio-blk
# round-trip tail both live in the shared support crate; this bin pulls in
# only the abi and the virtio-blk driver it resolves the loaded image to.
[target.'cfg(all(target_arch = "riscv64", target_os = "none"))'.dependencies]
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
tairix-drv-storage-virtio-blk = { path = "../../../drivers/storage/virtio_blk", version = "=0.0.0" }
tairix-test-virtio-qemu-support = { path = "../virtio_qemu_support", version = "=0.0.0" }
