[package]
name = "rustos-test-mem-pin-qemu-aarch64"
description = "STRESSTEST ST2 QEMU integration test: prove the mem_pin / mem_unpin pair end to end on the aarch64 virt board. The build script compiles the pure-Rust four-role fixture program (tests/integration/mem_pin_program) PIE once and converts it to an rxe blob. The kernel installs the production KernelDispatchHook through a DispatchCallbackSlot — the production LiveMemMap producer backing mem_map, a real KernelProcessWait, a ProgramRegistry carrying the three child roles with the pinned budget derived from the one shared spawn_layout policy — then spawns the parent role through the production InitSpawnCtx::spawn_driver_process seam. The parent drives deny (no CAP_MEM_PIN: mem_pin refused PermissionDenied at the dispatcher gate, the ungated mem_unpin still succeeds), pin (a self-lowered pinned-memory-bytes bound: pin is idempotent, an over-budget mem_map is refused OutOfRange while a within-budget one succeeds, and unpinning lifts the bound), and — after pinning itself — child (spawned unpinned despite the pinned parent, so its over-budget map succeeds: the mark is never inherited even though the limit is) through production spawn + wait. PASS once the chassis reaps a parent exit of 0."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# This bin is the ST2 memory-pinning vertical: the proving `-M virt` slice
# of the CAP_MEM_PIN dispatcher gate, the pinned-memory budget, and the
# no-inheritance rule, composed from the production `KernelDispatchHook` +
# `KernelSyscallHandlers` path rather than a bespoke dispatch shim.
#
# The `test-hooks` feature is on by default. Release builds that enable it
# are rejected by the `compile_error!` guard in `src/main.rs` (a debug-only
# test affordance must fail closed out of release builds), mirroring the
# stack-grow vertical.
[features]
default = ["test-hooks"]
test-hooks = []

[[bin]]
name = "rustos-test-mem-pin-qemu-aarch64"
path = "src/main.rs"

[target.'cfg(all(target_arch = "aarch64", target_os = "none"))'.dependencies]
rustos-abi = { path = "../../../lib/abi", version = "=0.0.0" }
rustos-arch-api = { path = "../../../kernel/arch/api", version = "=0.0.0" }
rustos-arch-aarch64 = { path = "../../../kernel/arch/aarch64", version = "=0.0.0" }
rustos-caps = { path = "../../../lib/caps", version = "=0.0.0" }
rustos-fdt = { path = "../../../lib/fdt", version = "=0.0.0" }
rustos-kalloc = { path = "../../../lib/kalloc", version = "=0.0.0" }
rustos-kernel = { path = "../../../kernel/rustos-kernel", version = "=0.0.0" }
rustos-kernel-core = { path = "../../../kernel/core", version = "=0.0.0" }
rustos-kernel-ipc = { path = "../../../kernel/ipc", version = "=0.0.0" }
rustos-kernel-irq = { path = "../../../kernel/irq", version = "=0.0.0" }
rustos-kernel-mem = { path = "../../../kernel/mem", version = "=0.0.0" }
rustos-kernel-sched-api = { path = "../../../kernel/sched/api", version = "=0.0.0" }
rustos-kernel-sched-eevdf = { path = "../../../kernel/sched/eevdf", version = "=0.0.0" }
rustos-kernel-sec = { path = "../../../kernel/sec", version = "=0.0.0" }
rustos-log = { path = "../../../lib/log", version = "=0.0.0" }
rustos-sync = { path = "../../../lib/sync", version = "=0.0.0" }

[build-dependencies]
# The shared harness: the target cfg emitter, the `virt` DTB dump helper,
# and the ELF→rxe converter. Host-only build glue.
rustos-itest-harness = { path = "../harness", version = "=0.0.0" }
# The build script stamps the kernel's compiled-in syscall CFI tag into the
# converted `rxe` so the production loader admits it.
rustos-kernel-syscall = { path = "../../../kernel/syscall", version = "=0.0.0" }
