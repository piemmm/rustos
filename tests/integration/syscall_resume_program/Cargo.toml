[package]
name = "tairix-test-syscall-resume-program"
description = "Pure-Rust EL0 regression fixture: issue one ordinary clock_get syscall, verify its result survives a kernel-requested reschedule, and return a distinct exit status."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "tairix-test-syscall-resume-program"
path = "src/main.rs"

[target.'cfg(target_os = "none")'.dependencies]
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0" }