[package]
name = "rustos-test-wait-qemu-aarch64"
description = "SPAWN stage SP6b QEMU integration test: prove a parent process can wait on, reap, and read the exit code of its own child under the live scheduler on the aarch64 virt board. The build script compiles a pure-Rust EL0 program (tests/integration/wait_program) twice (child + parent roles) PIE and converts each to an rxe blob; the kernel materialises two hardware-isolated EL0 address spaces with rustos_kernel_core::spawn_image, registers the parent/child link with a KernelProcessWait producer, admits each as a resumable user kthread, and drains the cooperative step loop while a dispatch callback routes wait/exit through the producer and reschedule_current — PASS once the parent reaped the child, read back its exit code, and exited 0."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# This bin is the `plans/SPAWN.md` stage SP6b aarch64 `wait`-reap vertical. The
# fixture program (`rustos-test-wait`) is built position-independent by
# `build.rs` in two roles (child + parent) and converted to `rxe` blobs
# (`rustos_itest_harness::elf2rxe`) carrying the kernel's compiled-in syscall CFI
# tag. On boot the test reads the GICv2 base + timer rate from the embedded
# `virt` DTB, brings up the EL1 vectors + GICv2, builds two isolated EL0 address
# spaces via `rustos_kernel_core::spawn_image` (capability-checked + audited),
# registers the parent/child link with the `KernelProcessWait` producer, admits
# each as a resumable user kthread, and drives the cooperative `step` loop; the
# dispatch callback routes the child's `exit` and the parent's `wait`/`exit`
# `svc`s through the producer + `reschedule_current`. PASS once the parent reaped
# the child, read back its exit code, and exited 0; any mismatch (or a
# never-draining loop) writes a distinct failure finisher or times out
# (fail-loud, `AGENTS.md` §7).
#
# The `test-hooks` feature is on by default. Release builds that enable it are
# rejected by the `compile_error!` guard in `src/main.rs` (AGENTS.md §1 — no
# hacks; §5.4.5 — fail closed), mirroring the other spawn verticals.
[features]
default = ["test-hooks"]
test-hooks = []

[[bin]]
name = "rustos-test-wait-qemu-aarch64"
path = "src/main.rs"

[target.'cfg(all(target_arch = "aarch64", target_os = "none"))'.dependencies]
rustos-abi = { path = "../../../lib/abi", version = "=0.0.0" }
rustos-arch-api = { path = "../../../kernel/arch/api", version = "=0.0.0" }
rustos-kalloc = { path = "../../../lib/kalloc", version = "=0.0.0" }
rustos-arch-aarch64 = { path = "../../../kernel/arch/aarch64", version = "=0.0.0" }
rustos-fdt = { path = "../../../lib/fdt", version = "=0.0.0" }
rustos-kernel-core = { path = "../../../kernel/core", version = "=0.0.0" }
rustos-kernel-mem = { path = "../../../kernel/mem", version = "=0.0.0" }
rustos-kernel-sched-eevdf = { path = "../../../kernel/sched/eevdf", version = "=0.0.0" }
rustos-kernel-sec = { path = "../../../kernel/sec", version = "=0.0.0" }
rustos-kernel-syscall = { path = "../../../kernel/syscall", version = "=0.0.0" }
rustos-log = { path = "../../../lib/log", version = "=0.0.0" }
rustos-sync = { path = "../../../lib/sync", version = "=0.0.0" }

[build-dependencies]
rustos-itest-harness = { path = "../harness", version = "=0.0.0" }
rustos-kernel-syscall = { path = "../../../kernel/syscall", version = "=0.0.0" }
