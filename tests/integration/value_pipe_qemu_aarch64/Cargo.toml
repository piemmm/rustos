[package]
name = "tairix-test-value-pipe-qemu-aarch64"
description = "plans/ALIAS.md §6.2 acceptance QEMU integration test: boot the production aarch64 tairix-kernel pipeline (boot_aarch64::boot) on the virt board with the planted whole-disk encrypted-root image, unlock the root, authenticate root/root at the console login, and prove the shell's value-pipe redirection reads a value-backed resource reference end to end — `cat < info:system/machine-id` (ungated) and `cat < info:mem/page-size` / `cat < info:mem/physical` (CAP_SYSINFO_KERNEL-gated, arming under the administrator ceiling ∩ the shell's manifest) each stream the broker's value to a child that holds no CAP_SYSINFO_* of its own — then prove the write direction is still refused: `ls > info:mem/physical` reaches the kernel resource resolver and is rejected with NotSupported, because a value-backed resource is changed by a typed service command. PASS once that audited resource_open rejection has been observed and the shell's scripted exit follows it, so the refusal provably reached the transcript before the run ended."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "tairix-test-value-pipe-qemu-aarch64"
path = "src/main.rs"

# Freestanding "boot the production aarch64 pipeline with the planted
# encrypted-root disk and prove the value-pipe redirection works end to
# end" integration test. It reuses the entire production boot pipeline
# through `tairix-kernel`'s library half — discovery, the unlock kthread,
# PID 1 supervision, login's spawn-as-user, the shell, sysinfod, and the
# capability intersection — and only swaps the audit sink (no duplication).
# Keeping the QEMU-exit shortcut in a dedicated bin (not a Cargo feature on
# a production crate) prevents feature unification from leaking it into any
# production build (fail closed).
[target.'cfg(all(target_arch = "aarch64", target_os = "none"))'.dependencies]
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
tairix-arch-aarch64 = { path = "../../../kernel/arch/aarch64", version = "=0.0.0" }
tairix-kernel = { path = "../../../kernel/tairix-kernel", version = "=0.0.0" }
tairix-kalloc = { path = "../../../lib/kalloc", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }
tairix-util = { path = "../../../lib/util", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
