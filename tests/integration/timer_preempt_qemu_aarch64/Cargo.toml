[package]
name = "rustos-test-timer-preempt-qemu-aarch64"
description = "Stage 3b QEMU integration test: the aarch64 generic-timer interrupt drives the scheduler-tick callback on the virt board."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# Freestanding "arm the EL1 physical generic timer and prove its GICv2
# interrupt repeatedly drives the `preempt` scheduler-tick callback"
# integration test — the aarch64 half of the Stage-3 "timer interrupt
# drives scheduler" per-sub-stage deliverable (`PLAN.md` Stage 3). It
# links only the `rustos-arch-aarch64` port (the timer path needs no
# `kernel/*` subsystem), installs a tick callback that counts interrupts,
# and reports PASS through the ARM semihosting finisher once enough ticks
# have been observed. Keeping the QEMU-exit shortcut in a dedicated bin
# (not a Cargo feature on the arch crate) prevents feature unification
# from leaking it into any production build (`AGENTS.md` §5.4.5 — fail
# closed).

[[bin]]
name = "rustos-test-timer-preempt-qemu-aarch64"
path = "src/main.rs"

[target.'cfg(all(target_arch = "aarch64", target_os = "none"))'.dependencies]
rustos-arch-aarch64 = { path = "../../../kernel/arch/aarch64", version = "=0.0.0" }
rustos-arch-api = { path = "../../../kernel/arch/api", version = "=0.0.0" }
rustos-log = { path = "../../../lib/log", version = "=0.0.0" }

[build-dependencies]
rustos-itest-harness = { path = "../harness", version = "=0.0.0" }
