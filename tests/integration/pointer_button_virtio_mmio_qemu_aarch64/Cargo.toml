[package]
name = "tairix-test-pointer-button-virtio-mmio-qemu-aarch64"
description = "QEMU integration test: boot the aarch64 virt-board, build the virtio-MMIO bus from the device tree, provision an MmioTransport through the capability-gated KernelMmioMapper, arm the device's GICv2 SPI + EL1 IRQ path, mint a KernelVirtioHost over a static per-device DMA pool, load the signed virtio-input `.rxe`, then decode a real injected secondary (right) mouse-button press+release (the QEMU runner sends `mouse_button` over the monitor once the guest signals its event queue is armed) before reporting success through ARM semihosting. Guards the tools/qemu button-mask fix: a right-click must reach the guest as BTN_RIGHT (0x111), never the middle button (0x112)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "tairix-test-pointer-button-virtio-mmio-qemu-aarch64"
path = "src/main.rs"

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["zeroize"] }

# The device-agnostic bring-up scaffolding (boot harness, DTB MMIO walk,
# GICv2 + EL1 IRQ wiring, static DMA pool, signed-`.rxe` load) and the
# virtio-input button-decode tail both live in the shared support crate;
# this bin pulls in only the abi and the virtio-input driver it resolves
# the loaded image to (`AGENTS.md` §2.2).
[target.'cfg(all(target_arch = "aarch64", target_os = "none"))'.dependencies]
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
tairix-drv-input-virtio-input = { path = "../../../drivers/input/virtio_input", version = "=0.0.0" }
tairix-test-virtio-qemu-support = { path = "../virtio_qemu_support", version = "=0.0.0" }
