[package]
name = "tairix-test-handover-qemu-aarch64"
description = "plans/VIEW.md QEMU integration test: boot the graphical desktop on the aarch64 virt board, open a file-manager window from its icon-bar slot, activate a planted picture twice, and hold the run to two complete three-principal document hand-overs — the manager mints, the session relays, and the one already-running viewer redeems"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# The vertical's shared contract (src/lib.rs): the principals the hand-over
# crosses, the two syscall names it is recognised by, and how many complete
# relays the gate wants — read by both the freestanding PASS gate and the host
# runner's pointer script, so the gesture the host injects and the witness the
# guest latches can never drift apart. `no_std` consts only, host-buildable.
[lib]
path = "src/lib.rs"

# Every value the contract states is derived rather than restated: the two
# syscall names and the session's and viewer's process names from the sibling
# delegation vertical that already derives them, and the file manager's from
# the icon-bar contract that already names its bundle.
[dependencies]
tairix-test-autoload-input-qemu-aarch64 = { path = "../autoload_input_qemu_aarch64", version = "=0.0.0" }
tairix-test-filepick-qemu-aarch64 = { path = "../filepick_qemu_aarch64", version = "=0.0.0" }

[[bin]]
name = "tairix-test-handover-qemu-aarch64"
path = "src/main.rs"

# Freestanding "boot the production aarch64 desktop, open a file-manager
# window, and watch a document cross three principals into the running viewer"
# integration test. It runs the entire production boot pipeline through
# `tairix-kernel`'s library half (`boot_aarch64::boot`) — bootstrap-floor
# virtio-MMIO discovery, the unlock kthread, driver autoload, the display
# service, and the desktop session — and only swaps the audit sink for the PASS
# witnesses. Keeping the QEMU-exit shortcut in a dedicated bin (not a Cargo
# feature on a production crate) prevents feature unification from leaking it
# into any production build.
[target.'cfg(all(target_arch = "aarch64", target_os = "none"))'.dependencies]
tairix-arch-aarch64 = { path = "../../../kernel/arch/aarch64", version = "=0.0.0" }
tairix-kernel = { path = "../../../kernel/tairix-kernel", version = "=0.0.0" }
# The syscall audit vocabulary: the `SyscallInvoked` event id whose `sc`,
# `comm` and `task` fields attribute a dispatched syscall to the process — and
# the thread of control — that made it.
tairix-kernel-syscall = { path = "../../../kernel/syscall", version = "=0.0.0" }
tairix-kalloc = { path = "../../../lib/kalloc", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
