[package]
name = "tairix-test-wait"
description = "SPAWN stage SP6b fixture: a minimal, separately-linked pure-Rust EL0 program built in two roles (parent / child) from one source. The child exits with a build-time-fixed code; the parent waits for it, reaps it via the wait syscall, and verifies the reaped code, so the wait_qemu vertical can prove a parent reaps a child's exit code under the live scheduler. Built PIE for a native Tier-1 target and converted to an rxe blob by the consuming test's build script."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "tairix-test-wait"
path = "src/main.rs"

# The program is a pure-Rust TAIRiX program, so it links the
# pure-Rust userland runtime `tairix-rt` — never the C ABI (`crt0` + `abi-sys`),
# which exists solely for non-Rust programs. It names
# `tairix-abi` only for the `WAIT_PID_ANY` constant the parent passes to `wait`.
# Only on the three native Tier-1 targets (`target_os = "none"`); on the host it
# is an inert stub so `cargo build --workspace` / clippy still cover it.
[target.'cfg(target_os = "none")'.dependencies]
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0" }
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
