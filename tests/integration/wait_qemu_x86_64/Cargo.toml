[package]
name = "rustos-test-wait-qemu-x86-64"
description = "plans/PI.md stage X4 QEMU integration test: the x86_64 wait vertical — the cross-port sibling of the aarch64 wait_qemu_aarch64. It proves a parent ring-3 process can block on, reap, and read back the exit code of its own child under the live scheduler on x86_64, exercising the resume-after-cooperative-park return-state path on the x86_64 trap (the parent parks inside the wait handler via reschedule_current and must resume on its own kernel-stack frame to read back the reaped code). The build script compiles the pure-Rust EL0 fixture program (tests/integration/wait_program) PIE in both the child and parent roles and converts each to an rxe blob carrying the kernel's syscall CFI tag. The test boots the production rustos-kernel pipeline (so the GDT ring-3 selectors, the TSS, and syscall/IA32_LSTAR entry are installed) and, on AuditEvent::BootCompleted, builds two hardware-isolated ring-3 address spaces (two PML4s, one shared frame pool) with rustos_kernel_core::spawn_image, installs a rustos_kernel_core::KernelProcessWait producer, records the parent/child link, admits each as a resumable user kthread, and drives the cooperative Scheduler::step loop: the producer parks the parent until the child exits, then the kernel copies the reaped exit code out to the parent's status pointer. PASS once the parent reaped the child, read back the agreed code, and exited 0."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# This bin is the `plans/PI.md` stage X4 vertical: the x86_64 `wait` sibling of
# the aarch64 `wait_qemu_aarch64`. It boots the production `rustos-kernel`
# pipeline (so the GDT ring-3 selectors, the TSS, and `syscall`/`IA32_LSTAR`
# entry are installed) and, on `AuditEvent::BootCompleted`, builds a child and a
# parent ring-3 address space from the pure-Rust `rustos-test-wait` fixture
# (built PIE in both roles + converted to an `rxe` blob by `build.rs`), records
# the parent/child link with a `KernelProcessWait` producer, admits each as a
# resumable user kthread, and drives the cooperative `step` loop; the producer
# parks the parent until the child is reapable, then the kernel copies the
# reaped exit code out to the parent's `status` pointer. PASS once the parent
# reaped the child, read back the agreed code, and exited 0; any shortfall (an
# unexpected syscall, a wrong code, a missing reap, or a deadlock) flips
# `qemu_exit::exit_failure` or times out (fail-loud, `AGENTS.md` §7).
#
# The `test-hooks` feature is on by default. Release builds that enable it are
# rejected by the `compile_error!` guard in `src/main.rs` (AGENTS.md §1 — no
# hacks; §5.4.5 — fail closed), mirroring the other EL0 verticals.
[features]
default = ["test-hooks"]
test-hooks = []

[[bin]]
name = "rustos-test-wait-qemu-x86-64"
path = "src/main.rs"

[target.'cfg(all(target_arch = "x86_64", target_os = "none"))'.dependencies]
rustos-abi = { path = "../../../lib/abi", version = "=0.0.0" }
rustos-arch-api = { path = "../../../kernel/arch/api", version = "=0.0.0" }
rustos-arch-x86_64 = { path = "../../../kernel/arch/x86_64", version = "=0.0.0", features = ["sched-arch"] }
rustos-kernel = { path = "../../../kernel/rustos-kernel", version = "=0.0.0" }
rustos-kernel-core = { path = "../../../kernel/core", version = "=0.0.0" }
rustos-kernel-mem = { path = "../../../kernel/mem", version = "=0.0.0" }
rustos-kernel-sched-cfq = { path = "../../../kernel/sched/cfq", version = "=0.0.0" }
rustos-kernel-sec = { path = "../../../kernel/sec", version = "=0.0.0" }
rustos-kernel-syscall = { path = "../../../kernel/syscall", version = "=0.0.0" }
rustos-log = { path = "../../../lib/log", version = "=0.0.0" }
rustos-sync = { path = "../../../lib/sync", version = "=0.0.0" }

[build-dependencies]
rustos-itest-harness = { path = "../harness", version = "=0.0.0" }
rustos-kernel-syscall = { path = "../../../kernel/syscall", version = "=0.0.0" }
