[package]
name = "tairix-test-stack-overrun-qemu-riscv64"
description = "plans/PI.md guard-page fault-form (riscv64 stage G3c) QEMU integration test: prove the production fault-form on the virt board — a live kthread running on an arena-backed kernel stack whose guard page is unmapped takes a synchronous store page fault when it overruns into that guard page, rather than the deferred next-reschedule canary detection a heap-backed BoxStack falls back to."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# Freestanding "spawn a real kthread on an arena-backed kernel stack with an
# unmapped guard page, have it overrun into the guard, and prove the MMU
# raises a synchronous store page fault" integration test: the `-M virt`
# proof of the `plans/PI.md` stage-G3c production fault-form, the riscv64
# sibling of `tests/integration/stack_overrun_qemu_aarch64`. It links the
# `tairix-kernel-core` kthread runtime, the `tairix-arch-riscv64` port, and
# the default `tairix-kernel-sched-eevdf` policy, builds a guard arena
# (`AddressSpace::prepare_guard_arena`), allocates one kthread stack region in
# it, unmaps the guard page through the Arch HAL, admits the kthread via
# `spawn_kthread_with_stack`, and drives the cooperative `step` loop; the
# kthread's overrun into the unmapped guard page faults synchronously and the
# `fault` handler reports the result through the `SiFive` Test finisher.
# Keeping the QEMU-exit shortcut in a dedicated bin (not a Cargo feature on a
# library crate) prevents feature unification from leaking it into any
# production build (`AGENTS.md` §5.4.5 — fail closed).

[[bin]]
name = "tairix-test-stack-overrun-qemu-riscv64"
path = "src/main.rs"

[target.'cfg(all(target_arch = "riscv64", target_os = "none"))'.dependencies]
tairix-kernel-core = { path = "../../../kernel/core", version = "=0.0.0" }
tairix-arch-riscv64 = { path = "../../../kernel/arch/riscv64", version = "=0.0.0" }
tairix-itest-finisher = { path = "../finisher", version = "=0.0.0" }
# The Arch HAL MMU + TLB surface (`AGENTS.md` §17.2): the guard page is torn
# down through `tairix_arch_api::mmu::AddressSpace::unmap` and the stale entry
# flushed through `tairix_arch_api::tlb::TlbShootdown::flush_page`, so the
# fault-form is proven *through the HAL*.
tairix-arch-api = { path = "../../../kernel/arch/api", version = "=0.0.0" }
tairix-kernel-sched-eevdf = { path = "../../../kernel/sched/eevdf", version = "=0.0.0" }
tairix-kalloc = { path = "../../../lib/kalloc", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
