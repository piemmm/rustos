[package]
name = "tairix-test-netstack-wire"
description = "Shared wire-topology fixture for the end-to-end QEMU netstack verticals. The freestanding guest tail (tests/integration/virtio_qemu_support) and the host-side peer the harness runs (tools/xtask) both configure their protocol engines from these constants, so the two ends of the emulated link agree on addresses, identifiers, and the ping choreography through one source of truth."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# The one definition of the NTP engine's bounds: the fixture's accepted-sample
# window is derived from `ntp::MAX_ROUND_TRIP` rather than restating it, so the
# two can never disagree about which applied instants a validated sample can
# produce. `no_std`, like these constants.
tairix-net = { path = "../../../lib/net" }

[dev-dependencies]
# Host-only: the static-addressing vertical's planted `network.conf` is
# cross-checked against the wire address/location constants through the real
# parser `devmgr` runs, so the two can never drift (one source of truth). A
# dev-dependency only — the shared constants themselves stay `no_std`.
tairix-netconfig = { path = "../../../lib/netconfig" }
# Host-only: the ECN and time verticals' planted `system.conf` documents are
# cross-checked against the settings they mean through the real parser `devmgr`
# runs, so the two can never drift. A dev-dependency only — the shared
# constants themselves stay `no_std`.
tairix-sysconfig = { path = "../../../lib/sysconfig" }
# Host-only: the time vertical's fixture instants are checked against the one
# plausibility window every time source is judged by.
tairix-abi = { path = "../../../lib/abi" }
