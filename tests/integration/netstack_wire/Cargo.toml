[package]
name = "tairix-test-netstack-wire"
description = "Shared wire-topology fixture for the end-to-end QEMU netstack verticals. The freestanding guest tail (tests/integration/virtio_qemu_support) and the host-side peer the harness runs (tools/xtask) both configure their protocol engines from these constants, so the two ends of the emulated link agree on addresses, identifiers, and the ping choreography through one source of truth (AGENTS.md §2.2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dev-dependencies]
# Host-only: the static-addressing vertical's planted `network.conf` is
# cross-checked against the wire address/location constants through the real
# parser `devmgr` runs, so the two can never drift (one source of truth). A
# dev-dependency only — the shared constants themselves stay `no_std`.
tairix-netconfig = { path = "../../../lib/netconfig" }
# Host-only: the ECN vertical's planted `system.conf` is cross-checked against
# the ECN toggle through the real parser `devmgr` runs, so the two can never
# drift. A dev-dependency only — the shared constants themselves stay `no_std`.
tairix-sysconfig = { path = "../../../lib/sysconfig" }
