[package]
name = "tairix-test-spawn-init-qemu-riscv64"
description = "QEMU integration test (plans/PI.md RV-P3): boot the riscv64 tairix-kernel pipeline on the virt board, spawn PID 1 (init) into U-mode through the InitSpawn seam, and report PASS via the SiFive Test finisher once init traps back with an audited syscall."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# Freestanding "boot the riscv64 kernel pipeline, then spawn PID 1 into
# user mode" integration test — the runtime proof of `plans/PI.md` RV-P3.
# It reuses the production riscv64 boot pipeline through `tairix-kernel`'s
# library half (`boot_riscv64::boot`), which installs the `InitSpawn` seam
# into the `BootInfo` hand-off; after `kernel_core::kernel_main` emits
# `AuditEvent::BootCompleted` it builds the embedded `init` (`Run`) U-mode
# image and `sret`s into it. `init` writes its banner through the
# `stream_write` syscall, then issues the audited `spawn` syscall to launch
# its session; that `ecall` traps back through the S-mode vector to the
# production dispatch callback, emitting `AuditEvent::SyscallInvoked`. This
# bin only swaps the audit sink so observing `ProcessSpawned` (4030) then
# `SyscallInvoked` (5000) flips `qemu_exit::exit_success` — proving PID 1
# reached U-mode, wrote its banner, and trapped back. Keeping the QEMU-exit
# shortcut in a dedicated bin (not a Cargo feature on a production crate)
# prevents feature unification from leaking it into any production build
# (`AGENTS.md` §5.4.5 — fail closed).

[[bin]]
name = "tairix-test-spawn-init-qemu-riscv64"
path = "src/main.rs"

[target.'cfg(all(target_arch = "riscv64", target_os = "none"))'.dependencies]
tairix-arch-riscv64 = { path = "../../../kernel/arch/riscv64", version = "=0.0.0" }
# The production riscv64 boot pipeline (with the `InitSpawn` seam) lives in
# `tairix-kernel`'s library half; this vertical reuses it verbatim and only
# swaps the audit sink (`AGENTS.md` §2.2 — no duplication).
tairix-kernel = { path = "../../../kernel/tairix-kernel", version = "=0.0.0" }
# The boot heap the `kernel_core::kernel_main` allocations (the leaked
# `KernelState`, the scheduler) draw from.
tairix-kalloc = { path = "../../../lib/kalloc", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
