[package]
name = "tairix-test-netstack-static-qemu-x86-64"
description = "plans/NETWORK.md N9b-3-2-β-2-ii-b QEMU integration test: boot the production x86_64 tairix-kernel pipeline (boot_x86_64::boot) on the q35/pc machine against the static-net-root disk (whose read-only /System store carries the kernel-signed virtio-net driver bundle cross-compiled for x86_64 and a planted /System/Settings/Network/network.conf that binds the NIC by <iface>.match.node = its virtio-PCI config-window BAR base and assigns it a static IPv6 address) with a virtio-net-pci device attached and the harness-side static-addressing peer on the QEMU dgram netdev. The virtio-PCI sibling of tairix-test-netstack-static-qemu-aarch64: proves the match.node binding + static addressing end to end over the x86_64 virtio-PCI + MSI-X path. devmgr autoloads the virtio-net driver into its own process (it publishes a netchan node), reads the planted network.conf, and binds the NIC to the `wan` alias by its stable bus location; netstack assigns the config's static IPv6 address and answers the host peer's campaign to that static address. The guest does not self-exit; the harness ends the run when the host peer confirms the echo round-trip at the static address (its success gate), so teardown cannot precede the reply leaving the machine. The witness records (NETSTACK_BOUND, INTERFACE_CONFIG_APPLIED, INBOUND_ECHO_SERVED) reach the serial transcript for diagnosis, and the peer's own campaign verdict (a reply at the static address, never the link-local) subsumes them, so a match.node mis-bind cannot pass."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "tairix-test-netstack-static-qemu-x86-64"
path = "src/main.rs"

# Freestanding "boot the production x86_64 kernel pipeline against the
# static-net-root disk carrying the signed virtio-net driver bundle and a
# planted network.conf, and prove the match.node binding + static addressing
# live-boot path end to end over virtio-PCI" integration test. It reuses the
# entire production x86_64 boot pipeline through `tairix-kernel`'s library half
# (`boot_x86_64::boot`) unchanged. The guest does not self-exit; the harness
# drives the run to completion through the host peer's success gate, so there
# is no in-kernel QEMU-exit shortcut to leak into any production build (fail
# closed).
[target.'cfg(all(target_arch = "x86_64", target_os = "none"))'.dependencies]
tairix-arch-x86_64 = { path = "../../../kernel/arch/x86_64", version = "=0.0.0", features = ["sched-arch"] }
tairix-kernel = { path = "../../../kernel/tairix-kernel", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
