[package]
name = "rustos-test-mem-map-qemu-aarch64"
description = "SPAWN stage SP5b-2 QEMU integration test: prove an EL0 process can obtain and release anonymous RW memory at runtime via abi-v1 on the aarch64 virt board. The build script compiles a pure-Rust EL0 program (tests/integration/mem_map_program) PIE and converts it to an rxe blob; the kernel materialises one hardware-isolated EL0 address space with rustos_kernel_core::spawn_image, retains it live, installs a rustos_kernel_core::MemMap producer backed by rustos_kernel_mem::map_anonymous/unmap_anonymous over that space, and routes the program's mem_map/mem_unmap syscalls through it — PASS once the program mapped a region, verified a written pattern, unmapped it, and faulted on use after unmap."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# This bin is the `plans/SPAWN.md` stage SP5b-2 aarch64 mem_map/mem_unmap
# vertical. The fixture program (`rustos-test-mem-map`) is built
# position-independent by `build.rs` and converted to an `rxe` blob
# (`rustos_itest_harness::elf2rxe`) carrying the kernel's compiled-in syscall
# CFI tag. On boot the test reads the GICv2 base + timer rate from the embedded
# `virt` DTB, brings up the EL1 vectors + GICv2, builds one isolated EL0 address
# space via `rustos_kernel_core::spawn_image` (capability-checked + audited),
# retains it live, installs a `MemMap` producer over `map_anonymous` /
# `unmap_anonymous`, and routes the program's `mem_map` / `mem_unmap` syscalls
# through it; a fault handler reports the deliberate use-after-unmap data abort
# as PASS. Any shortfall (the program returning a failure exit code, or no
# fault) writes a distinct failure finisher or times out (fail-loud,
# `AGENTS.md` §7).
#
# The `test-hooks` feature is on by default. Release builds that enable it are
# rejected by the `compile_error!` guard in `src/main.rs` (AGENTS.md §1 — no
# hacks; §5.4.5 — fail closed), mirroring the other EL0 verticals.
[features]
default = ["test-hooks"]
test-hooks = []

[[bin]]
name = "rustos-test-mem-map-qemu-aarch64"
path = "src/main.rs"

[target.'cfg(all(target_arch = "aarch64", target_os = "none"))'.dependencies]
rustos-abi = { path = "../../../lib/abi", version = "=0.0.0" }
rustos-arch-api = { path = "../../../kernel/arch/api", version = "=0.0.0" }
rustos-bumpalloc = { path = "../../../lib/bumpalloc", version = "=0.0.0" }
rustos-arch-aarch64 = { path = "../../../kernel/arch/aarch64", version = "=0.0.0" }
rustos-fdt = { path = "../../../lib/fdt", version = "=0.0.0" }
rustos-kernel-core = { path = "../../../kernel/core", version = "=0.0.0" }
rustos-kernel-mem = { path = "../../../kernel/mem", version = "=0.0.0" }
rustos-kernel-sched-eevdf = { path = "../../../kernel/sched/eevdf", version = "=0.0.0" }
rustos-kernel-syscall = { path = "../../../kernel/syscall", version = "=0.0.0" }
rustos-log = { path = "../../../lib/log", version = "=0.0.0" }

[build-dependencies]
rustos-itest-harness = { path = "../harness", version = "=0.0.0" }
rustos-kernel-syscall = { path = "../../../kernel/syscall", version = "=0.0.0" }
