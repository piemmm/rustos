[package]
name = "tairix-test-fatal-fault-qemu-riscv64"
description = "QEMU integration test: a trap in a minimal riscv64 kernel that installs no fault handler is reported — the port's boot entry armed the trap vector, its fatal path names the cause — and the run ends on that report's record at once, rather than trapping silently until the harness gives up."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# Freestanding kernel ELF QEMU loads with `-kernel` on the riscv64 `virt`
# board through OpenSBI. It links the port alone, for boot, console and panic
# report: the point is a kernel with nothing behind the port.
#
# On the host target the crate has no test source and contributes nothing to
# `cargo test`; the orchestrator is `cargo xtask test --qemu`.

[[bin]]
name = "tairix-test-fatal-fault-qemu-riscv64"
path = "src/main.rs"

[target.'cfg(all(target_arch = "riscv64", target_os = "none"))'.dependencies]
tairix-arch-riscv64 = { path = "../../../kernel/arch/riscv64", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
