[package]
name = "tairix-test-root-unlock-login-qemu-x86-64"
description = "plans/ARCHSUPPORT.md A2 QEMU integration test (x86_64 sibling of the aarch64 root-mount->login vertical): boot the tairix-kernel pipeline, walk PCI to the modern virtio-blk-pci function, provision a PciTransport through the capability-gated KernelMmioMapper, route its MSI-X interrupt, load the signed virtio-blk `.rxe`, then drive the *production* interactive root-unlock policy (tairix_kernel::root_mount::unlock_root_disk_interactively) over the planted whole-disk encrypted-root image — the exact shared `root_unlock_login` tail the aarch64 vertical runs (AGENTS.md §2.2): type the passphrase at the prompt over a scripted console, read root.unlock off the FAT boot partition, derive the volume key, mount the encrypted ARXFS root, install the loaded users database into a LateUsersDb cell, and prove the planted account authenticates through the installed cell while a wrong password is refused — the first live-boot exercise of the x86_64 root-mount->login path over virtio-PCI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "tairix-test-root-unlock-login-qemu-x86-64"
path = "src/main.rs"

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["zeroize"] }

# The device-agnostic virtio-PCI bring-up scaffolding *and* the shared
# root-unlock tail (`root_unlock_login`, which drives the production
# `tairix_kernel::root_mount` unlock policy over the whole-disk
# encrypted-root fixture) both live in the shared support crate, so this bin
# names only that crate plus the virtio-blk driver whose `register` it wires
# into the spawner (`AGENTS.md` §2.2).
[target.'cfg(all(target_arch = "x86_64", target_os = "none"))'.dependencies]
tairix-drv-storage-virtio-blk = { path = "../../../drivers/storage/virtio_blk", version = "=0.0.0" }
tairix-test-virtio-qemu-support = { path = "../virtio_qemu_support", version = "=0.0.0" }
