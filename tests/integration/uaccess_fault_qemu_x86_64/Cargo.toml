[package]
name = "rustos-test-uaccess-fault-qemu-x86_64"
description = "tests/SECURITY.md §5 copy_from_user hardware fault fix-up (x86_64) QEMU integration test: a kernel-mode #PF taken inside the guarded user-copy window is redirected to the copy's fix-up and surfaces as an error, with the CPU continuing to run. Boots the production rustos-kernel pipeline (which installs the dedicated #PF entry and arms the Arch HAL guarded-copy slot) and, on BootCompleted, drives the shared rustos_arch_api::uaccess::conformance checks against an unmapped canonical address."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# Freestanding "take a real kernel-mode #PF inside the guarded user-copy
# window and observe the copy return an error" integration test — the
# x86_64 member of the per-port fault-window verticals (`PLAN.md` Stage 7
# item E, `tests/SECURITY.md` §5). Unlike the riscv64/aarch64 siblings —
# which stand up a minimal self-contained test kernel around their
# trap-vector installers — the x86_64 pairing lives on the production boot
# path (the dedicated `#PF` entry install + the guarded-copy arm), so this
# test boots the production `rustos-kernel` pipeline (exactly like
# `rustos-test-kernel-arch-boot`) and drives the shared conformance checks
# on `AuditEvent::BootCompleted`. The fatal `fault` observer reports
# FAILURE — reaching it means the window redirect did not absorb the
# fault. Keeping the QEMU-exit shortcut in a dedicated bin (not a Cargo
# feature) prevents feature unification from leaking it into any
# production build (fail closed).

[[bin]]
name = "rustos-test-uaccess-fault-qemu-x86_64"
path = "src/main.rs"

[target.'cfg(all(target_arch = "x86_64", target_os = "none"))'.dependencies]
rustos-arch-x86_64 = { path = "../../../kernel/arch/x86_64", version = "=0.0.0", features = ["sched-arch"] }
# The Arch HAL guarded-copy seam under test: the vertical drives the shared
# `rustos_arch_api::uaccess::conformance` checks so the proof is one
# definition across the ports, never re-derived here.
rustos-arch-api = { path = "../../../kernel/arch/api", version = "=0.0.0" }
rustos-kernel = { path = "../../../kernel/rustos-kernel", version = "=0.0.0" }
rustos-log = { path = "../../../lib/log", version = "=0.0.0" }

[build-dependencies]
rustos-itest-harness = { path = "../harness", version = "=0.0.0" }
