[package]
name = "tairix-test-netstack-dhcp6-qemu-riscv64"
description = "plans/DHCP.md D4c QEMU integration test: boot the production riscv64 tairix-kernel pipeline (boot_riscv64::boot) on the virt board against the dhcp6-net-root disk (whose read-only /System store carries the kernel-signed virtio-net driver bundle cross-compiled for riscv64 and a planted /System/Settings/Network/network.conf that binds the NIC by <iface>.match.node = its virtio-mmio transport slot base, selects ipv6.method dhcp, and disables IPv4) with a virtio-net-device attached and the harness-side DHCPv6-server peer on the QEMU dgram netdev. The virtio-MMIO sibling of tairix-test-netstack-dhcp6-qemu-aarch64 on the riscv64 PLIC device-IRQ path: proves RFC 8415 stateful DHCPv6 IPv6 addressing end to end. devmgr autoloads the virtio-net driver into its own process (it publishes a netchan node), reads the planted network.conf, and binds the NIC to the `wan` alias by its stable bus location; netstack drives its DHCPv6 client, which leases the interface its only global address from the host DHCPv6-server peer, and, once the peer's Router Advertisement has installed the on-link route DHCPv6 does not itself convey, answers the peer's echo campaign to that leased address. The guest does not self-exit; the harness ends the run when the host peer confirms the echo round-trip at the leased address (its success gate), so teardown cannot precede the reply leaving the machine. The witness records (NETSTACK_BOUND, DHCP6_LEASE_ACQUIRED, INBOUND_ECHO_SERVED) reach the serial transcript for diagnosis, and the peer's own DHCPv6-server + leased-address echo campaign verdict subsumes them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "tairix-test-netstack-dhcp6-qemu-riscv64"
path = "src/main.rs"

# Freestanding "boot the production riscv64 kernel pipeline against the
# dhcp6-net-root disk carrying the signed virtio-net driver bundle and a planted
# network.conf selecting DHCPv6, and prove RFC 8415 stateful IPv6 addressing end
# to end over virtio-MMIO" integration test. It reuses the entire production
# riscv64 boot pipeline through `tairix-kernel`'s library half
# (`boot_riscv64::boot`) unchanged. The guest does not self-exit; the harness
# drives the run to completion through the host peer's success gate, so there
# is no in-kernel QEMU-exit shortcut to leak into any production build (fail
# closed).
[target.'cfg(all(target_arch = "riscv64", target_os = "none"))'.dependencies]
tairix-arch-riscv64 = { path = "../../../kernel/arch/riscv64", version = "=0.0.0" }
tairix-kernel = { path = "../../../kernel/tairix-kernel", version = "=0.0.0" }
tairix-kernel-core = { path = "../../../kernel/core", version = "=0.0.0" }
tairix-kalloc = { path = "../../../lib/kalloc", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
