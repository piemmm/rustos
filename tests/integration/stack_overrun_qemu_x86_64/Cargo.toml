[package]
name = "rustos-test-stack-overrun-qemu-x86_64"
description = "plans/PI.md guard-page fault-form (stage G3c, x86_64) QEMU integration test: prove the production fault-form on the production rustos-kernel pipeline — a live, scheduled kthread running on an arena-backed kernel stack whose one-page guard is unmapped takes a synchronous, supervisor-mode not-present page fault the instant it overruns into that guard page, rather than the deferred next-reschedule canary detection a heap-backed BoxStack falls back to. The x86_64 sibling of stack_overrun_qemu_aarch64."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# This bin is the `plans/PI.md` x86_64 guard-page fault-form (G3c)
# vertical — the production fault-form proof, the sibling of
# `rustos-test-stack-overrun-qemu-aarch64`. Unlike the self-contained
# aarch64 vertical, x86_64 long-mode bring-up (GDT, TSS, the dedicated
# error-code-aware `#PF` entry, the bump heap) is the production boot
# pipeline's job, so this test boots the real `rustos-kernel` pipeline
# (like the sibling `rustos-test-stack-guard-qemu-x86_64`) and does the
# arena split / unmap / scheduler / overrun work on
# `AuditEvent::BootCompleted`.
#
# The `test-hooks` feature is on by default. Release builds that enable it
# are rejected by the `compile_error!` guard in `src/main.rs`
# (`AGENTS.md` §1 — no hacks; §5.4.5 — fail closed), mirroring the other
# x86_64 production-pipeline verticals.
[features]
default = ["test-hooks"]
test-hooks = []

[[bin]]
name = "rustos-test-stack-overrun-qemu-x86_64"
path = "src/main.rs"

[target.'cfg(all(target_arch = "x86_64", target_os = "none"))'.dependencies]
# The Arch HAL MMU / TLB surface (`AGENTS.md` §17.2): the guard page is
# split + torn down through `rustos_arch_api::mmu::AddressSpace`
# (`prepare_guard_arena` / `unmap`) + `rustos_arch_api::tlb::TlbShootdown`
# (`flush_page`), so the fault-form is proven *through the HAL*.
rustos-arch-api = { path = "../../../kernel/arch/api", version = "=0.0.0" }
rustos-arch-x86_64 = { path = "../../../kernel/arch/x86_64", version = "=0.0.0", features = ["sched-arch"] }
rustos-kernel = { path = "../../../kernel/rustos-kernel", version = "=0.0.0" }
# The kthread runtime (`spawn_kthread_with_stack`) and the default
# `rustos-kernel-sched-eevdf` policy: the kthread is admitted onto the live
# scheduler over `X86_64Arch` and driven by the cooperative `step` loop —
# the production runtime path, not a bare function call.
rustos-kernel-core = { path = "../../../kernel/core", version = "=0.0.0" }
rustos-kernel-sched-eevdf = { path = "../../../kernel/sched/eevdf", version = "=0.0.0" }
rustos-log = { path = "../../../lib/log", version = "=0.0.0" }

[build-dependencies]
rustos-itest-harness = { path = "../harness", version = "=0.0.0" }
