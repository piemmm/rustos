[package]
name = "tairix-test-stack-overrun-qemu-x86_64"
description = "plans/OPEN-DEFECTS.md D82 QEMU integration test (x86_64): prove on the production tairix-kernel pipeline that a live, scheduled kthread running on a window-backed kernel stack takes a synchronous, supervisor-mode not-present page fault the instant it overruns into the stack's unmapped guard slot, rather than the deferred next-reschedule canary detection a heap-backed BoxStack falls back to. The x86_64 sibling of stack_overrun_qemu_aarch64."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# This bin is the `plans/OPEN-DEFECTS.md` D82 x86_64 vertical — the
# window-backed kthread-stack fault-form proof, the sibling of
# `tairix-test-stack-overrun-qemu-aarch64`. Unlike the self-contained
# aarch64 vertical, x86_64 long-mode bring-up (GDT, TSS, the dedicated
# error-code-aware `#PF` entry, the bump heap) is the production boot
# pipeline's job, so this test boots the real `tairix-kernel` pipeline —
# which also installs the remap window and the stack tier — and does the
# draw / scheduler / overrun work on `AuditEvent::BootCompleted`.
#
# The `test-hooks` feature is on by default. Release builds that enable it
# are rejected by the `compile_error!` guard in `src/main.rs`
# (no hacks; fail closed), mirroring the other
# x86_64 production-pipeline verticals.
[features]
default = ["test-hooks"]
test-hooks = []

[[bin]]
name = "tairix-test-stack-overrun-qemu-x86_64"
path = "src/main.rs"

[target.'cfg(all(target_arch = "x86_64", target_os = "none"))'.dependencies]
tairix-arch-x86_64 = { path = "../../../kernel/arch/x86_64", version = "=0.0.0", features = ["sched-arch"] }
tairix-kernel = { path = "../../../kernel/tairix-kernel", version = "=0.0.0" }
# The kthread runtime (`spawn_kthread_with_stack`) and the default
# `tairix-kernel-sched-eevdf` policy: the kthread is admitted onto the live
# scheduler over `X86_64Arch` and driven by the cooperative `step` loop —
# the production runtime path, not a bare function call.
tairix-kernel-core = { path = "../../../kernel/core", version = "=0.0.0" }
tairix-kernel-sched-eevdf = { path = "../../../kernel/sched/eevdf", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
