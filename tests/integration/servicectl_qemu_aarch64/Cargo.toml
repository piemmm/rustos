[package]
name = "tairix-test-servicectl-qemu-aarch64"
description = "plans/NEW-SERVICEMANAGER.md SVC-8 / plans/TIMESYNC.md TS-5 QEMU integration test: boot the production aarch64 tairix-kernel pipeline against the encrypted-root disk, log in as the seeded root account, and run the on-disk servicectl bundle from the shell to stop a running service -- proving the whole live control path: PID 1 binds SERVICE_CONTROL_ENDPOINT restricted-sender, the kernel admits the call only because the account's administrator ceiling carries CAP_SERVICE_CONTROL, PID 1's wait-set reactor wakes on the endpoint beside child reaping, and the engine applies the stop and audits it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "tairix-test-servicectl-qemu-aarch64"
path = "src/main.rs"

# Freestanding "boot the production aarch64 kernel pipeline, log in, and drive
# the real servicectl bundle at the shell" integration test. It reuses the
# entire production aarch64 boot pipeline through `tairix-kernel`'s library
# half (`boot_aarch64::boot`) unchanged and only swaps the diagnostic sink for
# the witness.
[target.'cfg(all(target_arch = "aarch64", target_os = "none"))'.dependencies]
tairix-arch-aarch64 = { path = "../../../kernel/arch/aarch64", version = "=0.0.0" }
tairix-kernel = { path = "../../../kernel/tairix-kernel", version = "=0.0.0" }
tairix-kalloc = { path = "../../../lib/kalloc", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }
# The witness the guest exits on: PID 1's own service-control audit id, so the
# vertical and the engine cannot disagree on what "the stop was applied" is.
tairix-init = { path = "../../../userland/system/init", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
