[package]
name = "tairix-test-physmap-qemu-riscv64"
description = "riscv64 direct-physical-map QEMU integration test: on a guest whose RAM tops the four-gigabyte window the spawn path used to reach frames through, prove the boot path sizes the direct map from the discovered RAM, that the kernel reaches every usable byte through it, and that the map lies above the port's user region."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# The freestanding "boot with more RAM than the old identity window and
# prove the direct map reaches all of it" integration test, the riscv64
# sibling of `physmap_qemu_x86_64`. It reuses the production boot pipeline
# through `tairix-kernel`'s library half and only replaces the audit sink;
# the QEMU-exit shortcut lives in this dedicated bin so feature unification
# under `cargo build --workspace` can never leak it into a real image.

[[bin]]
name = "tairix-test-physmap-qemu-riscv64"
path = "src/main.rs"

[target.'cfg(all(target_arch = "riscv64", target_os = "none"))'.dependencies]
tairix-arch-api = { path = "../../../kernel/arch/api", version = "=0.0.0" }
tairix-arch-riscv64 = { path = "../../../kernel/arch/riscv64", version = "=0.0.0" }
tairix-kernel = { path = "../../../kernel/tairix-kernel", version = "=0.0.0" }
tairix-kalloc = { path = "../../../lib/kalloc", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
