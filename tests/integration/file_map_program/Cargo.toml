[package]
name = "rustos-test-file-map"
description = "M1 demand-paged file-mapping fixture: a minimal, separately-linked pure-Rust EL0 program built once and driven in four argv-selected roles (parent / verify / wild / store). The parent spawns and reaps the three children through the production spawn + wait syscalls; verify demand-faults a file mapping's first/interior/end-of-file-straddle pages, proves the mapping survives fs_close, hands an untouched mapped page to fs_open as the copy-path fault-resolution proof, and unmaps; wild and store must be fault-killed (exit 139). Built PIE for a native Tier-1 target and converted to an rxe blob by the consuming test's build script."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "rustos-test-file-map"
path = "src/main.rs"

# The program is a pure-Rust RustOS program (`AGENTS.md` §1), so it links the
# pure-Rust userland runtime `rustos-rt` — never the C ABI (`crt0` + `abi-sys`),
# which exists solely for non-Rust programs (`AGENTS.md` §16.4). It names
# `rustos-abi` only for `OpenFlags`. Only on the native Tier-1 targets
# (`target_os = "none"`); on the host it is an inert stub so
# `cargo build --workspace` / clippy still cover it.
[target.'cfg(target_os = "none")'.dependencies]
rustos-rt = { path = "../../../lib/rt", version = "=0.0.0" }
rustos-abi = { path = "../../../lib/abi", version = "=0.0.0" }
