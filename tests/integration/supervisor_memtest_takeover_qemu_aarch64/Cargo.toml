[package]
name = "tairix-test-supervisor-memtest-takeover-qemu-aarch64"
description = "plans/NEW-SUPERVISOR.md §9 Stage E QEMU vertical: boot the aarch64 virt pipeline and drive the pre-boot Supervisor's one-way whole-RAM memtest takeover, asserting the guest tests all of RAM continuously and the harness resets it after a completed loop (QEMU -no-reboot exits 0)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# Freestanding "boot the production aarch64 kernel pipeline, then drive the
# confirmed `memtest` machine-takeover seam" integration test. It links
# the production aarch64 boot pipeline (`boot_aarch64::boot`) and only supplies
# its own audit Sink — one that, on observing `EventId(4004)`
# (`AuditEvent::BootCompleted`, the point where the Supervisor system is
# published and the kernel state is fully built), drives
# `supervisor_system().memtest_takeover(...)`. On the wired aarch64 port that
# never returns: it quiesces every other core, masks interrupts, flattens
# paging, and tests all of RAM continuously on a reserved stack. The takeover
# never resets the board itself; once the guest completes one test loop the
# harness issues a QEMU-monitor `system_reset`, so QEMU (`-no-reboot`) exits
# with status 0 and the runner registers `Outcome::Pass`. If the takeover ever
# *returns* (refused/unsupported) the sink writes a fail finisher, so a
# regression that stops the test running fails loud. Keeping the observer
# behaviour in a separate bin
# (not a Cargo feature on a production crate) prevents feature unification from
# leaking the takeover trigger into any production build (fail closed).

[[bin]]
name = "tairix-test-supervisor-memtest-takeover-qemu-aarch64"
path = "src/main.rs"

[target.'cfg(all(target_arch = "aarch64", target_os = "none"))'.dependencies]
tairix-arch-aarch64 = { path = "../../../kernel/arch/aarch64", version = "=0.0.0" }
# The production aarch64 boot pipeline (`boot_aarch64::boot`) the vertical
# reuses, plus the published live `SupervisorSystem` provider the takeover is
# driven through (`memtest_takeover`).
tairix-kernel = { path = "../../../kernel/tairix-kernel", version = "=0.0.0" }
tairix-kernel-core = { path = "../../../kernel/core", version = "=0.0.0" }
# The `Report` sink trait the takeover renders its progress/outcome to.
tairix-supervisor = { path = "../../../lib/supervisor", version = "=0.0.0" }
tairix-kalloc = { path = "../../../lib/kalloc", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
