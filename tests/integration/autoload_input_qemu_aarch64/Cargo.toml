[package]
name = "rustos-test-autoload-input-qemu-aarch64"
description = "plans/PI.md design B / B2 + plans/DISPLAY.md D7d (first stage) QEMU integration test: boot the production aarch64 rustos-kernel pipeline (boot_aarch64::boot) on the virt board as a display world — a ramfb display, a virtio keyboard, and a virtio mouse attached — with a planted three-partition disk whose read-only /System volume carries the kernel-signed virtio-input keyboard driver bundle and the framebuffer display-service bundle in its Drivers/ store. The production boot path binds the virtio-blk root, brings the framebuffer boot console up, publishes the scan-out surface as the boot display node, and the in-kernel unlock kthread's autoload hook scans the signed store BEFORE the passphrase prompt, verifies each bundle against the kernel's embedded driver trust anchor, matches each to its discovered node, and spawns each into its own user-space process. The runner types the fixture passphrase at the virtio keyboard and injects a mouse motion. PASS once four witnesses are observed: AuditEvent::InputDelivered for kind=key and kind=pointer (autoloaded user-space input drivers delivering), AuditEvent::UsersDbLoaded (the typed passphrase unlocked the encrypted root end to end), and the kernel/ipc CallEndpointCreated for the reserved DISPLAY_ENDPOINT (the autoloaded display service bound its rendezvous)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "rustos-test-autoload-input-qemu-aarch64"
path = "src/main.rs"

# Freestanding "boot the production aarch64 kernel pipeline with a planted
# encrypted-root virtio-blk disk carrying a signed virtio-input keyboard driver
# bundle, and prove the in-kernel unlock kthread's post-mount autoload spawns
# that user-space driver, which delivers an injected keystroke to the input-
# focus arbiter" integration test. It reuses the entire production aarch64 boot
# pipeline through `rustos-kernel`'s library half (`boot_aarch64::boot`) — the
# bootstrap-floor virtio-MMIO enumeration (block + input discovery), the
# `InitSpawn` seam, the runtime `ProcessSpawn` producer, the device-IRQ wiring,
# `unlock_service::spawn_if_present`, and the post-mount `AutoloadHook` — and
# only swaps the audit sink to report PASS on the one-shot
# `AuditEvent::InputDelivered` witness (`AGENTS.md` §2.2 — no duplication).
# Keeping the QEMU-exit shortcut in a dedicated bin (not a Cargo feature on a
# production crate) prevents feature unification from leaking it into any
# production build (`AGENTS.md` §5.4.5 — fail closed).
[target.'cfg(all(target_arch = "aarch64", target_os = "none"))'.dependencies]
rustos-arch-aarch64 = { path = "../../../kernel/arch/aarch64", version = "=0.0.0" }
rustos-kernel = { path = "../../../kernel/rustos-kernel", version = "=0.0.0" }
rustos-kernel-core = { path = "../../../kernel/core", version = "=0.0.0" }
# The kernel/ipc audit vocabulary: the `CallEndpointCreated` event id the
# display-service witness keys on — the shared definition, never a magic
# number.
rustos-kernel-ipc = { path = "../../../kernel/ipc", version = "=0.0.0" }
# The reserved `DISPLAY_ENDPOINT` id the display-service witness matches.
rustos-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# `format_hex_u64` — the same renderer the kernel/ipc audit fields use, so
# the witness compares the exact on-wire spelling.
rustos-util = { path = "../../../lib/util", version = "=0.0.0" }
rustos-kalloc = { path = "../../../lib/kalloc", version = "=0.0.0" }
rustos-log = { path = "../../../lib/log", version = "=0.0.0" }

[build-dependencies]
rustos-itest-harness = { path = "../harness", version = "=0.0.0" }
