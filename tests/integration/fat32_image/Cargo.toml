[package]
name = "tairix-test-fat32-image"
description = "Shared, specification-shaped FAT32 disk-image fixture for the end-to-end QEMU FAT32-over-virtio_blk vertical. The host harness (xtask) plants the image returned by `build_image` on the backing disk; the freestanding guest tail mounts the same volume through the real FAT32 driver and round-trips the planted file plus a fresh write, so both sides agree on the layout through one source of truth."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[lib]
path = "src/lib.rs"

# The builder is `no_std` + `alloc` so it links into both the host build
# tool (`tools/xtask`, which plants the image) and the freestanding guest
# test tail (`tests/integration/virtio_qemu_support`, which knows the
# fixed file names and contents to verify). The round-trip unit tests run
# the real FAT32 driver over the built image on the host.
[dev-dependencies]
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
tairix-drv-fs-fat32 = { path = "../../../drivers/filesystem/fat32", version = "=0.0.0" }
