[package]
name = "tairix-test-uaccess-fault-qemu-riscv64"
description = "tests/SECURITY.md §5 copy_from_user hardware fault fix-up (riscv64) QEMU integration test: a load/store page fault taken inside the guarded user-copy window is redirected to the copy's fix-up and surfaces as an error, with the hart continuing to run."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# Freestanding "take a real S-mode page fault inside the guarded user-copy
# window and observe the copy return an error" integration test — the
# riscv64 member of the per-port fault-window verticals (`PLAN.md` Stage 7
# item E, `tests/SECURITY.md` §5). It links only the `tairix-arch-riscv64`
# port: it builds an identity Sv39 `paging::AddressSpace`, installs the
# S-mode trap vector (which arms the Arch HAL guarded-copy slot), activates
# the space, and drives the shared `tairix_arch_api::uaccess::conformance`
# checks against a virtual page beyond the identity map. The fatal `fault`
# handler reports FAILURE — reaching it means the window redirect did not
# absorb the fault. Keeping the QEMU-exit shortcut in a dedicated bin (not
# a Cargo feature on the arch crate) prevents feature unification from
# leaking it into any production build (fail closed).

[[bin]]
name = "tairix-test-uaccess-fault-qemu-riscv64"
path = "src/main.rs"

[target.'cfg(all(target_arch = "riscv64", target_os = "none"))'.dependencies]
tairix-arch-riscv64 = { path = "../../../kernel/arch/riscv64", version = "=0.0.0" }
tairix-itest-finisher = { path = "../finisher", version = "=0.0.0" }
# The Arch HAL guarded-copy seam under test: the vertical drives the shared
# `tairix_arch_api::uaccess::conformance` checks so the proof is one
# definition across the ports, never re-derived here.
tairix-arch-api = { path = "../../../kernel/arch/api", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }
[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
