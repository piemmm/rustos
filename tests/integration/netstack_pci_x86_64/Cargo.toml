[package]
name = "tairix-test-netstack-pci-x86-64"
description = "QEMU netstack vertical (x86_64): boot the tairix-kernel pipeline, walk PCI to the modern virtio-net-pci function, provision a PciTransport through the capability-gated KernelMmioMapper, route its MSI-X interrupt, mint a KernelVirtioHost over a carved per-device DMA pool, load the signed virtio-net `.rxe`, then drive the tairix-netstack engine's ring pump over the device against the harness-side peer stack on the QEMU dgram netdev: answer the peer's ARP/NS resolution and v4+v6 echo campaign, then resolve and ping the peer over both families (plans/NETWORK.md N3c) before signalling QEMU success."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# Stage 4.D Item 4 QEMU integration test (x86_64). The binary reuses the
# shared `tairix-test-virtio-qemu-support` bring-up scaffolding and the
# production boot pipeline; it differs from the virtio-blk vertical only in
# the device id, the signed `.rxe` it loads, and the device-driving tail
# (the tairix-netstack ring pump pinging in/out over v4 and v6 against
# the harness-side peer stack).
#
# The signed `.rxe` manifest and the matching trust-anchor public key are
# generated at build time by `build.rs` so the integration test itself
# stays `no_std` + `no_main` and pulls in no host-only crypto crate.

[[bin]]
name = "tairix-test-netstack-pci-x86-64"
path = "src/main.rs"

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["zeroize"] }

# The device-agnostic bring-up scaffolding and the netstack ping tail
# live in the shared support crate; this bin pulls in only the abi, the
# virtio-net driver, and the driver host it resolves the loaded image to
# (`AGENTS.md` §2.2).
[target.'cfg(all(target_arch = "x86_64", target_os = "none"))'.dependencies]
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
tairix-drvhost = { path = "../../../userland/system/drvhost", version = "=0.0.0" }
tairix-drv-network-virtio-net = { path = "../../../drivers/network/virtio_net", version = "=0.0.0" }
tairix-test-virtio-qemu-support = { path = "../virtio_qemu_support", version = "=0.0.0" }
