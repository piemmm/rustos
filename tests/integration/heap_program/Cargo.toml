[package]
name = "tairix-test-heap"
description = "PI P6e-3b prerequisite fixture: a minimal, separately-linked pure-Rust EL0 program that exercises the `tairix-rt` mem_map-backed global allocator end to end — it Box-allocates, grows a Vec across several pages, and reallocates after freeing, verifying every value, then exits 0. Built PIE for a native Tier-1 target and converted to an rxe blob by the consuming test's build script."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "tairix-test-heap"
path = "src/main.rs"

# The program is a pure-Rust TAIRiX program (`AGENTS.md` §1), so it links the
# pure-Rust userland runtime `tairix-rt` — which provides both `_start` and the
# `#[global_allocator]` this fixture proves — never the C ABI (`crt0` +
# `abi-sys`), which exists solely for non-Rust programs (`AGENTS.md` §16.4).
# Only on the three native Tier-1 targets (`target_os = "none"`); on the host it
# is an inert stub so `cargo build --workspace` / clippy still cover it.
[target.'cfg(target_os = "none")'.dependencies]
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0" }
