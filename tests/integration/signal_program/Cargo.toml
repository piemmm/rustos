[package]
name = "tairix-test-signal"
description = "SPAWN stage SP7b fixture: a minimal, separately-linked pure-Rust EL0 program built in two roles (parent / child) from one source. The child runs forever, giving up the CPU with the yield syscall, so it only ever ends when it is signalled; the parent reads the child's PID from its inherited startup argument, delivers Signal::Terminate through the signal syscall, then waits for and reaps the child and verifies the reaped status is the signal's 128+n termination status, so the signal_qemu vertical can prove a parent terminates its own child under the live scheduler. Built PIE for a native Tier-1 target and converted to an rxe blob by the consuming test's build script."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "tairix-test-signal"
path = "src/main.rs"

# The program is a pure-Rust TAIRiX program (`AGENTS.md` §1), so it links the
# pure-Rust userland runtime `tairix-rt` — never the C ABI (`crt0` + `abi-sys`),
# which exists solely for non-Rust programs (`AGENTS.md` §16.4). It names
# `tairix-abi` for the `Signal` set the parent sends and the termination-status
# convention it verifies against. Only on the three native Tier-1 targets
# (`target_os = "none"`); on the host it is an inert stub so
# `cargo build --workspace` / clippy still cover it.
[target.'cfg(target_os = "none")'.dependencies]
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0" }
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
