[package]
name = "tairix-test-wild-fault-qemu-x86_64"
description = "QEMU integration test for plans/OPEN-DEFECTS.md D42 and D86: a ring-3 exception the kernel cannot resolve kills the faulting task and leaves the CPU running, instead of parking it for one process's mistake. The build script compiles the pure-Rust four-role fixture program (tests/integration/wild_fault_program) PIE once and converts it to an rxe blob. The kernel runs the shared production board bring-up (tairix_kernel::x86_64::boot::bring_up_bsp — per-CPU tables, the per-vector exception stubs, the dedicated #PF entry, NXE, the production dispatch callback, user-fault resolver and user-fault terminator, syscall/TSS entry), then installs the production KernelDispatchHook into the production DISPATCH_SLOT those callbacks resolve through and spawns the parent role through the production InitSpawnCtx::spawn_driver_process seam. The parent drives jump (a call into its own No-Execute data image — a ring-3 instruction-fetch #PF the resolver never sees, D42), ud (the always-invalid opcode — a ring-3 #UD with no hardware error code, D86) and gp (a privileged instruction — a ring-3 #GP with an error code, the other stub shape) through production spawn + wait, asserting each was fault-killed with exit 139. PASS once the chassis reaps a parent exit of 0: reaping a third child proves neither of the first two took the CPU with it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# This bin is the ring-3 wild-fault vertical: the proving slice of the
# x86_64 user-fault terminator, composed from the production
# `KernelDispatchHook` fault path rather than a bespoke dispatch shim. Like
# `tairix-test-stack-grow-qemu-x86_64` it reuses the production bin-crate
# `DISPATCH_SLOT` and the production dispatch / user-fault callbacks the
# shared `bring_up_bsp` installs.
#
# The `test-hooks` feature is on by default. Release builds that enable it
# are rejected by the `compile_error!` guard in `src/main.rs` (no hacks; fail
# closed), mirroring the sibling verticals.
[features]
default = ["test-hooks"]
test-hooks = []

[[bin]]
name = "tairix-test-wild-fault-qemu-x86_64"
path = "src/main.rs"

[target.'cfg(all(target_arch = "x86_64", target_os = "none"))'.dependencies]
tairix-arch-x86_64 = { path = "../../../kernel/arch/x86_64", version = "=0.0.0", features = ["sched-arch"] }
tairix-caps = { path = "../../../lib/caps", version = "=0.0.0" }
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
tairix-kernel = { path = "../../../kernel/tairix-kernel", version = "=0.0.0" }
tairix-kernel-core = { path = "../../../kernel/core", version = "=0.0.0" }
tairix-kernel-ipc = { path = "../../../kernel/ipc", version = "=0.0.0" }
tairix-kernel-irq = { path = "../../../kernel/irq", version = "=0.0.0" }
tairix-kernel-mem = { path = "../../../kernel/mem", version = "=0.0.0" }
tairix-kernel-sched-api = { path = "../../../kernel/sched/api", version = "=0.0.0" }
tairix-kernel-sched-cfq = { path = "../../../kernel/sched/cfq", version = "=0.0.0" }
tairix-kernel-sec = { path = "../../../kernel/sec", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }
tairix-sync = { path = "../../../lib/sync", version = "=0.0.0" }

[build-dependencies]
# The shared harness: the target cfg emitter, the fixture PIE link script,
# and the ELF→rxe converter. Host-only build glue.
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
# The build script stamps the kernel's compiled-in syscall CFI tag into the
# converted `rxe` so the production loader admits it.
tairix-kernel-syscall = { path = "../../../kernel/syscall", version = "=0.0.0" }
