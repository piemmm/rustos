[package]
name = "tairix-test-spawn-el0-resume-qemu-x86-64"
description = "plans/PI.md stage X1 QEMU integration test: prove a single ring-3 task can be admitted as a resumable user kthread on x86_64 and cooperatively park/resume under the live scheduler. The build script compiles the pure-Rust EL0 fixture program (tests/integration/el0_yielder_program) PIE and converts it to an rxe blob; the test boots the production tairix-kernel pipeline (so the GDT ring-3 selectors, the TSS, and syscall/IA32_LSTAR entry are installed), materialises one hardware-isolated user address space with tairix_kernel_core::spawn_image, admits it via spawn_user_kthread whose pre_resume hook reloads CR3 (paging::activate_user_root) and repoints the per-CPU syscall entry stack at the task's own kernel stack (syscall_entry::set_kernel_rsp0), and drives the cooperative Scheduler::step loop. The task yields N times then exits; the dispatch callback maps each yield/exit to reschedule_current, and the test PASSes once the task yielded its full count and exited."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# This bin is the `plans/PI.md` stage X1 vertical: the first x86_64 resumable
# ring-3 user kthread, the cross-port sibling of the aarch64 SP2c timeshare
# (single task — the two-task `gs:8` hazard is X2). The fixture program
# (`tairix-test-el0-yielder`) is built position-independent by `build.rs` and
# converted to an `rxe` blob (`tairix_itest_harness::elf2rxe`) carrying the
# kernel's compiled-in syscall CFI tag. It boots the production `tairix-kernel`
# pipeline (so the GDT ring-3 selectors, the TSS, and `syscall`/`IA32_LSTAR`
# entry are installed) and, on `AuditEvent::BootCompleted`, enables
# `IA32_EFER.NXE`, builds one isolated user address space via
# `tairix_kernel_core::spawn_image` (capability-checked + audited), admits it as
# a resumable user kthread whose `pre_resume` hook reloads CR3
# (`paging::activate_user_root`) and repoints the per-CPU syscall entry stack
# (`syscall_entry::set_kernel_rsp0`), and drives the cooperative `step` loop;
# the dispatch callback maps the task's `yield`/`exit` to `reschedule_current`.
# Any shortfall (an unexpected syscall, a wrong-count drain, or a deadlock)
# flips `qemu_exit::exit_failure` or times out (fail-loud).
#
# The `test-hooks` feature is on by default. Release builds that enable it are
# rejected by the `compile_error!` guard in `src/main.rs` (no
# hacks; fail closed), mirroring the other EL0 verticals.
[features]
default = ["test-hooks"]
test-hooks = []

[[bin]]
name = "tairix-test-spawn-el0-resume-qemu-x86-64"
path = "src/main.rs"

[target.'cfg(all(target_arch = "x86_64", target_os = "none"))'.dependencies]
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
tairix-arch-api = { path = "../../../kernel/arch/api", version = "=0.0.0" }
tairix-arch-x86_64 = { path = "../../../kernel/arch/x86_64", version = "=0.0.0", features = ["sched-arch"] }
tairix-kernel = { path = "../../../kernel/tairix-kernel", version = "=0.0.0" }
tairix-kernel-core = { path = "../../../kernel/core", version = "=0.0.0" }
tairix-kernel-mem = { path = "../../../kernel/mem", version = "=0.0.0" }
tairix-kernel-sched-eevdf = { path = "../../../kernel/sched/eevdf", version = "=0.0.0" }
tairix-kernel-syscall = { path = "../../../kernel/syscall", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
tairix-kernel-syscall = { path = "../../../kernel/syscall", version = "=0.0.0" }
