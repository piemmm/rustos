[package]
name = "tairix-test-ipi-smp-qemu-aarch64"
description = "WIRING Stage W6 QEMU integration test: multi-core SMP bring-up — the boot core starts a secondary core via PSCI CPU_ON and delivers an inter-processor interrupt to it via a GICv2 directed SGI on the virt board."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# Freestanding "bring up a second core and deliver an IPI to it"
# integration test — the aarch64 multi-core SMP deliverable of
# `plans/WIRING.md` Stage W6, the EL1/GICv2 analogue of
# `tairix-test-ipi-smp-qemu-riscv64`. It links only the
# `tairix-arch-aarch64` port: the boot core starts core 1 through
# `smp::start_secondary` (PSCI `CPU_ON`, conduit discovered from the
# device tree), core 1 brings up its GICv2 interface and enables the IPI
# SGI then signals ready, the boot core sends a directed IPI through
# `Aarch64Arch::send_ipi` (a GICv2 SGI), and the test passes once core
# 1's IRQ path has run the IPI callback. Keeping the QEMU-exit shortcut
# in a dedicated bin (not a Cargo feature on the arch crate) prevents
# feature unification from leaking it into any production build
# (fail closed).

[[bin]]
name = "tairix-test-ipi-smp-qemu-aarch64"
path = "src/main.rs"

[target.'cfg(all(target_arch = "aarch64", target_os = "none"))'.dependencies]
tairix-arch-aarch64 = { path = "../../../kernel/arch/aarch64", version = "=0.0.0" }
tairix-itest-finisher = { path = "../finisher", version = "=0.0.0" }
tairix-arch-api = { path = "../../../kernel/arch/api", version = "=0.0.0" }
tairix-fdt = { path = "../../../lib/fdt", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
