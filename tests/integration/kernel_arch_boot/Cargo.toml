[package]
name = "tairix-test-kernel-arch-boot"
description = "Stage 3a (c7-bin) QEMU integration test: boot the tairix-kernel pipeline to AuditEvent::BootCompleted under QEMU."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# This bin is the freestanding "boot the kernel and observe the final
# `AuditEvent::BootCompleted` audit record" integration test mandated
# by Stage 3a (c7-bin). It reuses the production boot pipeline through
# `tairix-kernel`'s library half (see
# `kernel/tairix-kernel/src/lib.rs`) and only replaces the audit Sink
# so that observing `EventId(4004)` (`AuditEvent::BootCompleted`)
# flips `qemu_exit::exit_success` and lets the host-side
# `tools/qemu::Runner` register the test as `Outcome::Pass`.
#
# Keeping the bin separate from the production `tairix-kernel`
# binary (rather than gating the audit sink behind a Cargo feature)
# is deliberate: feature unification under `cargo build --workspace`
# would otherwise leak the QEMU-exit behaviour into the production
# kernel image. It fails closed; the harness never
# decides what the kernel does next.

[[bin]]
name = "tairix-test-kernel-arch-boot"
path = "src/main.rs"

[target.'cfg(all(target_arch = "x86_64", target_os = "none"))'.dependencies]
tairix-arch-x86_64 = { path = "../../../kernel/arch/x86_64", version = "=0.0.0", features = ["sched-arch"] }
tairix-kernel = { path = "../../../kernel/tairix-kernel", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }
# The shared arch-neutral growable-kernel-heap exercise this vertical
# drives once boot completes.
tairix-test-kheap-growth = { path = "../kheap_growth", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
