# Signed-AppInfo manifest source for the `stalltrace` fixture
# (plans/FIX-STALLTRACE.md). Composed and planted ONLY on the aarch64
# stall-trace QEMU vertical's disk image by tools/xtask — the crate lives
# outside the userland discovery walk, so no production image ever ships it.
# The capability list is the bundle's request, intersected with the launching
# user's grants: CAP_CONSOLE_WRITE for its marker lines on fd 1 and nothing
# else. The pipe, the wait-set, and `latency_watch` itself require no
# capability — a thread describing its own responsiveness obligation grants
# nothing and reaches no other thread.
id = "os.tairix.test.stalltrace"
name = "stalltrace"
version = "0.1.0"
kind = "command"
capabilities = ["CAP_CONSOLE_WRITE"]
