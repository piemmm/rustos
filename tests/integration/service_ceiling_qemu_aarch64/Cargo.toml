[package]
name = "rustos-test-service-ceiling-qemu-aarch64"
description = "USERS U4 QEMU integration test: prove on the aarch64 virt board that a service account's compiled capability ceiling binds a lying manifest end to end. The build script compiles the pure-Rust two-role fixture program (tests/integration/service_ceiling_program) PIE once and converts it to an rxe blob. The kernel installs the production KernelDispatchHook through a DispatchCallbackSlot with the real compiled system identity table (rustos_kernel_core::system_identity_table) resolving spawn-as-user switches, and a ProgramRegistry whose one svc row deliberately requests devmgr's ceiling plus every sibling service's defining capability (CAP_SPAWN_AS_USER, CAP_USERS_READ, CAP_SEAT_ADMIN, CAP_SYSINFO_INTROSPECT). The parent role, spawned through the production InitSpawnCtx::spawn_driver_process seam with CAP_PROC_SPAWN + CAP_SPAWN_AS_USER, switches svc into the devmgr account through the production spawn syscall; svc proves the ceiling∩manifest intersection at the audited dispatcher gate: its own SYSINFO_HW-gated hw_tree_read succeeds while spawn_as, users_db_read, seat_switch, and sysinfo_introspect are each refused PermissionDenied. PASS once the chassis reaps a parent exit of 0."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# This bin is the USERS U4 service-ceiling vertical: the proving `-M virt`
# slice of the per-service account ceiling (a service cannot exercise a
# sibling's capability), composed from the production `KernelDispatchHook` +
# `KernelSyscallHandlers` path rather than a bespoke dispatch shim.
#
# The `test-hooks` feature is on by default. Release builds that enable it
# are rejected by the `compile_error!` guard in `src/main.rs` (a debug-only
# test affordance must fail closed out of release builds), mirroring the
# mem-pin vertical.
[features]
default = ["test-hooks"]
test-hooks = []

[[bin]]
name = "rustos-test-service-ceiling-qemu-aarch64"
path = "src/main.rs"

[target.'cfg(all(target_arch = "aarch64", target_os = "none"))'.dependencies]
rustos-abi = { path = "../../../lib/abi", version = "=0.0.0" }
rustos-arch-api = { path = "../../../kernel/arch/api", version = "=0.0.0" }
rustos-arch-aarch64 = { path = "../../../kernel/arch/aarch64", version = "=0.0.0" }
rustos-caps = { path = "../../../lib/caps", version = "=0.0.0" }
rustos-fdt = { path = "../../../lib/fdt", version = "=0.0.0" }
rustos-kalloc = { path = "../../../lib/kalloc", version = "=0.0.0" }
rustos-kernel = { path = "../../../kernel/rustos-kernel", version = "=0.0.0" }
rustos-kernel-core = { path = "../../../kernel/core", version = "=0.0.0" }
rustos-kernel-ipc = { path = "../../../kernel/ipc", version = "=0.0.0" }
rustos-kernel-irq = { path = "../../../kernel/irq", version = "=0.0.0" }
rustos-kernel-mem = { path = "../../../kernel/mem", version = "=0.0.0" }
rustos-kernel-sched-api = { path = "../../../kernel/sched/api", version = "=0.0.0" }
rustos-kernel-sched-cfq = { path = "../../../kernel/sched/cfq", version = "=0.0.0" }
rustos-kernel-sec = { path = "../../../kernel/sec", version = "=0.0.0" }
rustos-log = { path = "../../../lib/log", version = "=0.0.0" }
rustos-sync = { path = "../../../lib/sync", version = "=0.0.0" }
rustos-users = { path = "../../../lib/users", version = "=0.0.0" }

[build-dependencies]
# The shared harness: the target cfg emitter, the `virt` DTB dump helper,
# and the ELF→rxe converter. Host-only build glue.
rustos-itest-harness = { path = "../harness", version = "=0.0.0" }
# The build script stamps the kernel's compiled-in syscall CFI tag into the
# converted `rxe` so the production loader admits it.
rustos-kernel-syscall = { path = "../../../kernel/syscall", version = "=0.0.0" }
