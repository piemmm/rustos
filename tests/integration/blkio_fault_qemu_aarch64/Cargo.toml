[package]
name = "tairix-test-blkio-fault-qemu-aarch64"
description = "FIX-IO IO2 QEMU integration test: prove on the aarch64 virt board that a wedged storage device fails closed at its own per-request deadline without disturbing a healthy one. The build script compiles the pure-Rust EL0 fixture program (tests/integration/blkio_fault_program) PIE once and converts it to an rxe blob. The kernel installs the production KernelDispatchHook through a DispatchCallbackSlot and spawns the fixture through the production InitSpawnCtx::spawn_driver_process seam, so the ticketed call endpoint, the per-request deadline, the CallReply wait-set source, and the reap/cancel paths are the shipped kernel objects; its drive loop performs the timed-wake sweep a production timer tick would. The fixture stands up two block-service endpoints \u2014 one served through the shared blkio::serve_request_recovering engine over a fault-injecting device, one deliberately never serviced \u2014 and proves, over the production RemoteBlock consumer, that a transient blip is ridden out inside the shared per-class reissue budget, a blip outlasting it fails closed as the typed transient class, a bad sector keeps its own medium-error class, and an outstanding wedged request neither stalls the healthy device nor completes early, waking its parked reaper on the elapsed deadline and reaping TimedOut. PASS once the chassis reaps a fixture exit of 0."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# This bin is the FIX-IO IO2 block-transport fault vertical: the proving
# `-M virt` slice of the bounded submit/reap block seam (one wedged device
# never locks up an unrelated healthy one), composed from the production
# `KernelDispatchHook` + `KernelSyscallHandlers` path rather than a bespoke
# dispatch shim.
#
# The `test-hooks` feature is on by default. Release builds that enable it
# are rejected by the `compile_error!` guard in `src/main.rs` (a debug-only
# test affordance must fail closed out of release builds), mirroring the
# mem-pin vertical.
[features]
default = ["test-hooks"]
test-hooks = []

[[bin]]
name = "tairix-test-blkio-fault-qemu-aarch64"
path = "src/main.rs"

[target.'cfg(all(target_arch = "aarch64", target_os = "none"))'.dependencies]
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
tairix-arch-api = { path = "../../../kernel/arch/api", version = "=0.0.0" }
tairix-arch-aarch64 = { path = "../../../kernel/arch/aarch64", version = "=0.0.0" }
tairix-caps = { path = "../../../lib/caps", version = "=0.0.0" }
tairix-fdt = { path = "../../../lib/fdt", version = "=0.0.0" }
tairix-kalloc = { path = "../../../lib/kalloc", version = "=0.0.0" }
tairix-kernel = { path = "../../../kernel/tairix-kernel", version = "=0.0.0" }
tairix-kernel-core = { path = "../../../kernel/core", version = "=0.0.0" }
tairix-kernel-ipc = { path = "../../../kernel/ipc", version = "=0.0.0" }
tairix-kernel-irq = { path = "../../../kernel/irq", version = "=0.0.0" }
tairix-kernel-mem = { path = "../../../kernel/mem", version = "=0.0.0" }
tairix-kernel-sched-api = { path = "../../../kernel/sched/api", version = "=0.0.0" }
tairix-kernel-sched-cfq = { path = "../../../kernel/sched/cfq", version = "=0.0.0" }
tairix-kernel-sec = { path = "../../../kernel/sec", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }
tairix-sync = { path = "../../../lib/sync", version = "=0.0.0" }

[build-dependencies]
# The shared harness: the target cfg emitter, the `virt` DTB dump helper,
# and the ELF→rxe converter. Host-only build glue.
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
# The build script stamps the kernel's compiled-in syscall CFI tag into the
# converted `rxe` so the production loader admits it.
tairix-kernel-syscall = { path = "../../../kernel/syscall", version = "=0.0.0" }
