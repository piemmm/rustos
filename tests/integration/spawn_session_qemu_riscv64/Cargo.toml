[package]
name = "tairix-test-spawn-session-qemu-riscv64"
description = "plans/PI.md stage RV-X3 QEMU integration test (riscv64 sibling of spawn_session_qemu_aarch64 / _x86_64): prove the riscv64 runtime `spawn` concurrent producer on the virt board. The build script compiles the pure-Rust spawn-session fixture (tests/integration/spawn_session_program) twice — once as the PARENT and once as the CHILD (session) — PIE, and converts each to an rxe blob. On boot the test reads the generic-timer rate from the firmware device tree, builds the PARENT a hardware-isolated Sv39 U-mode address space via tairix_kernel_core::spawn_image, admits it as a resumable user kthread, and drives the cooperative Scheduler::step loop. The parent issues a real CAP_PROC_SPAWN-gated `spawn` ecall; the dispatch callback routes it to a riscv64 ProcessSpawn producer that builds the CHILD a fresh, hardware-isolated Sv39 space through the identity window WITHOUT switching the running parent's satp and admits it Ready concurrently. PASS once the producer built the child and both the parent and the child ran to exit; a failed spawn, an unexpected syscall, a wrong drain count, or a stall flips qemu_exit::exit_failure or times out (fail-loud, AGENTS.md §7)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# The `test-hooks` feature is on by default. Release builds that enable it are
# rejected by the `compile_error!` guard in `src/main.rs` (AGENTS.md §1 — no
# hacks; §5.4.5 — fail closed), mirroring the other EL0 verticals.
[features]
default = ["test-hooks"]
test-hooks = []

[[bin]]
name = "tairix-test-spawn-session-qemu-riscv64"
path = "src/main.rs"

[target.'cfg(all(target_arch = "riscv64", target_os = "none"))'.dependencies]
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
tairix-arch-api = { path = "../../../kernel/arch/api", version = "=0.0.0" }
tairix-arch-riscv64 = { path = "../../../kernel/arch/riscv64", version = "=0.0.0" }
tairix-itest-finisher = { path = "../finisher", version = "=0.0.0" }
tairix-kalloc = { path = "../../../lib/kalloc", version = "=0.0.0" }
tairix-kernel-core = { path = "../../../kernel/core", version = "=0.0.0" }
tairix-kernel-mem = { path = "../../../kernel/mem", version = "=0.0.0" }
tairix-kernel-sched-eevdf = { path = "../../../kernel/sched/eevdf", version = "=0.0.0" }
tairix-kernel-syscall = { path = "../../../kernel/syscall", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
tairix-kernel-syscall = { path = "../../../kernel/syscall", version = "=0.0.0" }
