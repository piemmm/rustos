[package]
name = "tairix-test-fp-isolation-qemu-riscv64"
description = "riscv64 QEMU integration test for plans/OPEN-DEFECTS.md D37: prove two U-mode tasks never share the physical floating-point register file. Firmware hands S-mode sstatus.FS = Dirty, so floating point runs freely, and the port formerly saved and restored none of f0-f31/fcsr - so each task read whatever the last one left there, which is disclosure as much as corruption. The build script compiles the pure-Rust fixture (tests/integration/fp_probe_program) PIE and converts it to an rxe blob; the kernel stands up two hardware-isolated Sv39 U-mode address spaces with tairix_kernel_core::spawn_image, gives each a distinct seed argument, and timeshares them over the park-safe trap path. Each task fills the whole register file, traps, and compares every register on the way back; the test PASSes only if both completed every round and exited zero."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# This bin is the `plans/PI.md` stage RV-X2 vertical: the first proof that TWO
# riscv64 U-mode tasks timeshare one hart as resumable user kthreads, the
# cross-port sibling of the x86_64 X2 vertical and the aarch64 SP2c timeshare.
# The fixture program (`tairix-test-el0-yielder`) is built position-independent
# by `build.rs` and converted to an `rxe` blob (`tairix_itest_harness::elf2rxe`)
# carrying the kernel's compiled-in syscall CFI tag. On boot the test reads the
# generic-timer rate from the firmware device tree, installs the trap vector + a
# dispatch callback, builds two hardware-isolated U-mode address spaces (two
# `PageTablePool`s + a shared frame pool) via
# `tairix_kernel_core::spawn_image` (capability-checked + audited), and admits
# each as a resumable user kthread whose `pre_resume` hook reactivates that
# task's own `satp` root (`paging::activate_user_root`). The cooperative
# `Scheduler::step` loop drives them; the dispatch callback maps each task's
# `yield`/`exit` `ecall`s to `reschedule_current`, so the two ping-pong with the
# dispatcher across the RV1 park-safe trap path, each on its own kernel stack.
# Any shortfall (an unexpected syscall, a wrong-count drain, or a deadlock)
# flips `qemu_exit::exit_failure` or times out (fail-loud).
#
# The `test-hooks` feature is on by default. Release builds that enable it are
# rejected by the `compile_error!` guard in `src/main.rs` (no
# hacks; fail closed), mirroring the other EL0 verticals.
[features]
default = ["test-hooks"]
test-hooks = []

[[bin]]
name = "tairix-test-fp-isolation-qemu-riscv64"
path = "src/main.rs"

[target.'cfg(all(target_arch = "riscv64", target_os = "none"))'.dependencies]
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
tairix-arch-api = { path = "../../../kernel/arch/api", version = "=0.0.0" }
tairix-arch-riscv64 = { path = "../../../kernel/arch/riscv64", version = "=0.0.0" }
tairix-itest-finisher = { path = "../finisher", version = "=0.0.0" }
tairix-kalloc = { path = "../../../lib/kalloc", version = "=0.0.0" }
tairix-kernel-core = { path = "../../../kernel/core", version = "=0.0.0" }
tairix-kernel-mem = { path = "../../../kernel/mem", version = "=0.0.0" }
tairix-kernel-sched-eevdf = { path = "../../../kernel/sched/eevdf", version = "=0.0.0" }
tairix-kernel-syscall = { path = "../../../kernel/syscall", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
tairix-kernel-syscall = { path = "../../../kernel/syscall", version = "=0.0.0" }
