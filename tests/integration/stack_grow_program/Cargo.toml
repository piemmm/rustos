[package]
name = "tairix-test-stack-grow"
description = "SP11c demand-grown stack fixture: a minimal, separately-linked pure-Rust EL0 program built once and driven in four argv-selected roles (parent / grow / limit / guard). grow recurses until at least the argv-pinned byte count of stack is live — far past the eagerly committed top — verifying every frame's bytes survive the fault-driven growth, and exits 0; limit lowers its own StackBytes soft bound through rlimit_set and recurses past it — the growth path must refuse the bound and the kernel must fault-kill it (exit 139); guard probes the unmapped guard page below the argv-pinned reserved span — fault-killed (exit 139). The parent spawns and reaps the three children through the production spawn + wait syscalls. Built PIE for a native Tier-1 target and converted to an rxe blob by the consuming test's build script."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "tairix-test-stack-grow"
path = "src/main.rs"

# The program is a pure-Rust TAIRiX program, so it links the
# pure-Rust userland runtime `tairix-rt` — never the C ABI (`crt0` + `abi-sys`),
# which exists solely for non-Rust programs. It names
# `tairix-abi` only for the rlimit wire types. Only on the native Tier-1
# targets (`target_os = "none"`); on the host it is an inert stub so
# `cargo build --workspace` / clippy still cover it.
[target.'cfg(target_os = "none")'.dependencies]
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0" }
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
