[package]
name = "rustos-test-spawn-program-qemu-aarch64"
description = "CCOMPAT stage CC3 QEMU integration test: spawn a separately-linked crt0 + abi-sys C-ABI program (tests/integration/cc3_program) on the aarch64 virt board. The build script compiles the program PIE and converts it to an rxe blob; the kernel materialises an EL0 address space with rustos_kernel_core::spawn_and_enter (capability-checked + audited) and eret's into it, and the dispatch callback asserts the program's exit syscall carries its decimal argument."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# This bin is the `plans/CCOMPAT.md` stage CC3 aarch64 round-trip: a
# crt0-linked program starts, reads its argument, and exits with it. The
# fixture program (`rustos-test-cc3-program`) is built position-independent by
# `build.rs` and converted to an `rxe` blob (`rustos_itest_harness::elf2rxe`)
# carrying the kernel's compiled-in syscall CFI tag. On boot the test stands up
# a stage-1 address space (identity-mapping the kernel + MMIO, EL1), activates
# it, installs the EL1 vector table + a dispatch callback, then calls the
# production capability-checked, audited spawn caller
# (`rustos_kernel_core::spawn_and_enter`, gated on `CAP_PROC_SPAWN`) to build
# the program's EL0 image and `eret` into it. The program's `exit` syscall
# traps back through the kernel EL1 vector; the callback asserts the exit
# code equals the spawned decimal argument before the ARM semihosting PASS
# finisher. Any mismatch (or a returning spawn) writes a distinct failure
# finisher.
#
# The `test-hooks` feature is on by default. Release builds that enable it are
# rejected by the `compile_error!` guard in `src/main.rs` (AGENTS.md §1 — no
# hacks; §5.4.5 — fail closed), mirroring the CC2 round-trip tests.
[features]
default = ["test-hooks"]
test-hooks = []

[[bin]]
name = "rustos-test-spawn-program-qemu-aarch64"
path = "src/main.rs"

[target.'cfg(all(target_arch = "aarch64", target_os = "none"))'.dependencies]
rustos-abi = { path = "../../../lib/abi", version = "=0.0.0" }
rustos-arch-api = { path = "../../../kernel/arch/api", version = "=0.0.0" }
rustos-kalloc = { path = "../../../lib/kalloc", version = "=0.0.0" }
rustos-arch-aarch64 = { path = "../../../kernel/arch/aarch64", version = "=0.0.0" }
rustos-kernel-core = { path = "../../../kernel/core", version = "=0.0.0" }
rustos-kernel-mem = { path = "../../../kernel/mem", version = "=0.0.0" }
rustos-kernel-syscall = { path = "../../../kernel/syscall", version = "=0.0.0" }
rustos-log = { path = "../../../lib/log", version = "=0.0.0" }

[build-dependencies]
rustos-itest-harness = { path = "../harness", version = "=0.0.0" }
rustos-kernel-syscall = { path = "../../../kernel/syscall", version = "=0.0.0" }
