[package]
name = "tairix-test-tcpserve"
description = "plans/NETWORK.md N6b-2-β-2 TCP-listener fixture: the `tcpserve` command app the aarch64 listener QEMU vertical plants on its disk and runs from the scripted root shell. It opens a `SocketType::Stream` socket over `tairix_rt::net`, binds the well-known (privileged) GUEST_TCP_PORT (exercising CAP_NET_BIND_PRIVILEGED), listens, accepts the host client peer's connection over the shared IPv6 link-local wire, echoes every received byte back in order, verifies the received run matches the shared deterministic stream (surviving the peer's injected packet loss via RFC 9293 retransmission), and prints TCPSERVE PASS then exits 0 once the peer has received+verified the whole echo and closed; any shortfall prints the reason and parks forever so the run fails loudly by timeout. Never planted on a production image."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# The `Run` binary's freestanding userland runtime (`tairix-rt`) is an
# optional, on-by-default build feature, mirroring the store command apps and
# the `tcpecho` fixture. `cargo build -p tairix-test-tcpserve` builds the
# fixture program with it; host tooling builds only the pure verify/report
# *library*, so the host test build never pulls the userland runtime's
# `_start` / `#[global_allocator]` / panic handler.
[features]
default = ["program"]
program = ["dep:tairix-rt"]

# The package is both the `tairix-test-tcpserve` verify/report library (the
# command word, report marker, and re-exported chunk verification below) and
# the `Run` entry-point binary of the `tcpserve` fixture. The binary is a
# freestanding pure-Rust program on the native Tier-1 targets and an inert
# host stub elsewhere (see `src/run.rs`).
[[bin]]
name = "tairix-test-tcpserve-run"
path = "src/run.rs"

[dependencies]
# The frozen socket ABI (`SocketType`, `SocketAddr`, `SocketStreamEvent`,
# `StreamCloseReason`) plus `Errno`/`Origin`; the fixture invents no parallel
# error set and never links a kernel or driver crate.
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The one shared wire topology both ends of the vertical agree on: the guest
# server's interface identifier and TCP port, the transfer length, and the
# deterministic stream-byte verification the host client's echo is checked
# against. Shared so the server and the host client cannot drift.
tairix-test-netstack-wire = { path = "../netstack_wire", version = "=0.0.0" }

# For the freestanding `Run` binary only: the userland runtime `tairix-rt`
# (`_start`, canary, panic handler, `mem_map` allocator, and the `net` stream
# server wrappers over `ipc_call`). Pulled in only for the bare-metal targets
# the program is actually built for; on the host it is not linked.
[target.'cfg(target_os = "none")'.dependencies]
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0", optional = true }
