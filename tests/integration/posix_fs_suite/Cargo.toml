[package]
name = "rustos-test-posix-fs-suite"
description = "pjdfstest-equivalent POSIX filesystem conformance suite (PLAN.md Stage 5). Drives the real rustfs driver through the real kernel/core VFS policy layer on the host and asserts POSIX namespace, I/O, §5.3 permission/capability-gate, §16 layout, and errno semantics. The QEMU mount-over-virtio_blk path is covered separately by the rustfs/fat32 verticals; this crate is the semantics suite, exercising the very code that runs in the kernel."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[lib]
path = "src/lib.rs"

# The harness binds the real rustfs driver to the real VFS policy layer.
# Both halves are the exact code paths the kernel uses; the suite adds no
# parallel re-implementation of any FS semantics (AGENTS.md §2.2).
[dependencies]
rustos-abi = { path = "../../../lib/abi", version = "=0.0.0" }
rustos-caps = { path = "../../../lib/caps", version = "=0.0.0" }
rustos-kernel-sec = { path = "../../../kernel/sec", version = "=0.0.0" }
rustos-kernel-core = { path = "../../../kernel/core", version = "=0.0.0" }
rustos-drv-fs-rustfs = { path = "../../../drivers/filesystem/rustfs", version = "=0.0.0" }
