[package]
name = "tairix-test-netstack-dhcp-qemu-aarch64"
description = "plans/DHCP.md D3 QEMU integration test: boot the production aarch64 tairix-kernel pipeline (boot_aarch64::boot) on the virt board against the dhcp-net-root disk (whose read-only /System store carries the kernel-signed virtio-net driver bundle and a planted /System/Settings/Network/network.conf that binds the NIC by <iface>.match.node, selects ipv4.method dhcp, and disables IPv6) with a virtio-net-device attached and the harness-side DHCP-server peer on the QEMU dgram netdev. Proves RFC 2131 dynamic IPv4 addressing end to end: devmgr autoloads the virtio-net driver into its own process (it publishes a netchan node), reads the planted network.conf, and binds the NIC to the `wan` alias; netstack drives its DHCP client, which leases the interface its only address from the host DHCP-server peer, and then answers the peer's echo campaign to that leased address. PASS once the log sink has seen devmgr NETSTACK_BOUND, netstack DHCP_LEASE_ACQUIRED, and netstack INBOUND_ECHO_SERVED — the last gating exit so the guest stays alive until a frame addressed to its leased address has been answered; the peer's own verdict (it offered, acked, and got the echo reply at the leased address) is required too, so neither side can pass alone and a broken lease cannot pass on an address the guest formed itself (it forms none)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "tairix-test-netstack-dhcp-qemu-aarch64"
path = "src/main.rs"

# Freestanding "boot the production aarch64 kernel pipeline against the
# dhcp-net-root disk carrying the signed virtio-net driver bundle and a planted
# network.conf selecting DHCPv4, and prove RFC 2131 dynamic addressing end to
# end" integration test. It reuses the entire production aarch64 boot pipeline
# through `tairix-kernel`'s library half (`boot_aarch64::boot`) and only swaps
# the log sink to report PASS on the three shared witnesses (no duplication).
# Keeping the QEMU-exit shortcut in a dedicated bin (not a Cargo feature on a
# production crate) prevents feature unification from leaking it into any
# production build (fail closed).
[target.'cfg(all(target_arch = "aarch64", target_os = "none"))'.dependencies]
tairix-arch-aarch64 = { path = "../../../kernel/arch/aarch64", version = "=0.0.0" }
tairix-kernel = { path = "../../../kernel/tairix-kernel", version = "=0.0.0" }
tairix-kernel-core = { path = "../../../kernel/core", version = "=0.0.0" }
tairix-kalloc = { path = "../../../lib/kalloc", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }
# The devmgr and netstack audit vocabularies: the `NETSTACK_BOUND`,
# `DHCP_LEASE_ACQUIRED`, and `INBOUND_ECHO_SERVED` event ids the witnesses key
# on — the shared definitions, never magic numbers. netstack is pulled
# `default-features = false` so its `program` feature (the `tairix-rt`
# freestanding runtime) never enters this bin's graph.
tairix-devmgr = { path = "../../../userland/system/devmgr", version = "=0.0.0" }
tairix-netstack = { path = "../../../userland/net/netstack", version = "=0.0.0", default-features = false }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
