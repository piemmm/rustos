[package]
name = "tairix-test-kernel-arch-boot-riscv64"
description = "Stage 4.D Item 4 QEMU integration test: boot the riscv64 virt-board pipeline to AuditEvent::BootCompleted under QEMU."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# Freestanding "boot the riscv64 kernel pipeline and observe the final
# `AuditEvent::BootCompleted` audit record" integration test (the
# riscv64 analogue of `tests/integration/kernel_arch_boot`). It links
# the `tairix-arch-riscv64` boot pipeline and only supplies its own
# audit Sink — one that, on observing `EventId(4004)`
# (`AuditEvent::BootCompleted`), writes the `SiFive` Test PASS finisher
# so the host-side `tools/qemu::Runner` registers `Outcome::Pass`.
# Keeping the audit-observer behaviour in a separate bin (not a Cargo
# feature on the arch crate) prevents feature unification from leaking
# the QEMU-exit shortcut into any production build
# (fail closed).

[[bin]]
name = "tairix-test-kernel-arch-boot-riscv64"
path = "src/main.rs"

[target.'cfg(all(target_arch = "riscv64", target_os = "none"))'.dependencies]
tairix-arch-riscv64 = { path = "../../../kernel/arch/riscv64", version = "=0.0.0" }
# The boot pipeline (`boot()`) lives in the downstream boot consumer now
# that the arch port is a pure Arch HAL implementation; the arch crate supplies
# only the serial sink, panic bridge,
# and QEMU finisher.
tairix-test-riscv64-boot = { path = "../riscv64_boot", version = "=0.0.0" }
tairix-kalloc = { path = "../../../lib/kalloc", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
