[package]
name = "tairix-test-file-map-qemu-riscv64"
description = "M1 QEMU integration test (docs/src/architecture/memory.md §7o): prove the production demand-paged file-mapping path end to end on the riscv64 virt board — the riscv64 twin of file_map_qemu_aarch64. The build script compiles the pure-Rust four-role fixture program (tests/integration/file_map_program) PIE once, pins the shared fixture geometry (tairix_itest_harness::filemap_fixture) into it, and converts it to an rxe blob. The kernel installs the production KernelDispatchHook through a DispatchCallbackSlot — LiveMemMap wired for mem_map and file_map, a read-only filesystem double serving the fixture file, a real KernelProcessWait, a ProgramRegistry carrying the three child roles, and the production user-fault resolver bound to the same slot — then spawns the parent role through the production InitSpawnCtx::spawn_driver_process seam. The parent drives verify (demand-fault first/interior/EOF-straddle pages, mapping survives fs_close, untouched mapped page as an fs_open buffer — the copy-path proof, unmap, exit 0), wild (read after unmap: fault-killed, exit 139), and store (write to a read-only mapped page: fault-killed, exit 139) through production spawn + wait. PASS once the chassis reaps a parent exit of 0."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# This bin is the riscv64 M1 file-mapping vertical: the proving `-M virt`
# slice of the production `file_map`/`file_unmap` syscalls and the
# fault-driven demand-paged backing, composed from the production
# `KernelDispatchHook` + `KernelSyscallHandlers` fault path rather than a
# bespoke dispatch shim.
#
# The `test-hooks` feature is on by default. Release builds that enable it
# are rejected by the `compile_error!` guard in `src/main.rs` (AGENTS.md §1 —
# no hacks; §5.4.5 — fail closed), mirroring the aarch64 twin.
[features]
default = ["test-hooks"]
test-hooks = []

[[bin]]
name = "tairix-test-file-map-qemu-riscv64"
path = "src/main.rs"

[target.'cfg(all(target_arch = "riscv64", target_os = "none"))'.dependencies]
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
tairix-arch-api = { path = "../../../kernel/arch/api", version = "=0.0.0" }
tairix-arch-riscv64 = { path = "../../../kernel/arch/riscv64", version = "=0.0.0" }
tairix-caps = { path = "../../../lib/caps", version = "=0.0.0" }
tairix-itest-finisher = { path = "../finisher", version = "=0.0.0" }
tairix-kalloc = { path = "../../../lib/kalloc", version = "=0.0.0" }
tairix-kernel = { path = "../../../kernel/tairix-kernel", version = "=0.0.0" }
tairix-kernel-core = { path = "../../../kernel/core", version = "=0.0.0" }
tairix-kernel-ipc = { path = "../../../kernel/ipc", version = "=0.0.0" }
tairix-kernel-irq = { path = "../../../kernel/irq", version = "=0.0.0" }
tairix-kernel-mem = { path = "../../../kernel/mem", version = "=0.0.0" }
tairix-kernel-sched-api = { path = "../../../kernel/sched/api", version = "=0.0.0" }
tairix-kernel-sched-cfq = { path = "../../../kernel/sched/cfq", version = "=0.0.0" }
tairix-kernel-sec = { path = "../../../kernel/sec", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }
tairix-sync = { path = "../../../lib/sync", version = "=0.0.0" }

[build-dependencies]
# The shared harness: the target cfg emitter, the ELF→rxe converter, and
# the single definition of the file-mapping fixture geometry
# (`filemap_fixture`, `AGENTS.md` §2.2). Host-only build glue
# (`AGENTS.md` §12).
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
# The build script stamps the kernel's compiled-in syscall CFI tag into the
# converted `rxe` so the production loader admits it (`AGENTS.md` §9).
tairix-kernel-syscall = { path = "../../../kernel/syscall", version = "=0.0.0" }
