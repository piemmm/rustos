[package]
name = "tairix-test-framestats"
description = "plans/FIX-DESKTOP-SPEEDUP.md A.4 desktop frame-accounting fixture: the `framestats` command app the aarch64 desktop-hover QEMU vertical plants on its disk and launches from the program library. It reads the desktop's published DesktopFrameTotals through the System Information API (sysinfod) and re-emits the counters the hover gate reads as one structured system-log record, so the freestanding guest can bracket a scripted hover between two samples. Never planted on a production image."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# The `Run` binary's freestanding userland runtime (`tairix-rt`) is an
# optional, on-by-default build feature, mirroring the store command apps and
# the `memsoak` fixture: host tooling builds only the pure sample *library*, so
# the host test build never pulls the runtime's `_start` /
# `#[global_allocator]` / panic handler.
[features]
default = ["program"]
program = ["dep:tairix-rt"]

# The package is both the `tairix-test-framestats` sample library (the record
# vocabulary and the difference arithmetic below, shared with the vertical's
# guest sink) and the `Run` entry-point binary of the `framestats` fixture.
[[bin]]
name = "tairix-test-framestats-run"
path = "src/run.rs"

[dependencies]
# The frozen `Errno` plus the `sysinfo-v1` `DesktopFrameTotals` the fixture
# samples; it invents no parallel error set and never links a kernel or driver
# crate.
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The structured-log vocabulary the sample record is authored in — the same
# `Event`/`FieldValue` model the guest's audit sink decodes it from.
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }
# The shared System Information API client: the desktop frame-report paging
# walk `sysinfo frames` uses. The fixture consumes it rather than re-rolling a
# request encoder.
tairix-procinfo = { path = "../../../lib/procinfo", version = "=0.0.0" }

# For the freestanding `Run` binary only: the userland runtime `tairix-rt`
# (`_start`, canary, panic handler, `mem_map` allocator, the `log_emit`-backed
# `LogSink`) and the production `sysinfo` transport seam in `lib/procinfo`
# (`IpcTransport`). Both are pulled in only for the bare-metal targets the
# program is actually built for; on the host neither is linked.
[target.'cfg(target_os = "none")'.dependencies]
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0", optional = true }
tairix-procinfo = { path = "../../../lib/procinfo", version = "=0.0.0", features = [
    "program",
] }
