[package]
name = "tairix-test-pipeline-qemu-aarch64"
description = "plans/SPAWN.md SP10b pipeline/redirection QEMU vertical: boot the production aarch64 tairix-kernel pipeline (boot_aarch64::boot) on the virt board with the planted whole-disk encrypted-root image, unlock the root, authenticate root/root at the console login, and drive the spawned shell through real pipelines and redirections — `yes | head -n 2` (kernel-pipe back-pressure: the broken pipe ends the producer and the shell reaps both members), `seq 1 1000 | wc -c` (the consumer's byte-exact 3893 proves the pipe carried every byte), and a `> file` / `< file` round trip whose `cat` output proves the written content. PASS once the round trip's `cat` exits (its audited exit arms the sink) and the shell's scripted exit, typed only after the content marker appeared, follows it — so the verified output provably reached the transcript before the run ended."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "tairix-test-pipeline-qemu-aarch64"
path = "src/main.rs"

# Freestanding "boot the production aarch64 pipeline with the planted
# encrypted-root disk and prove shell pipelines and redirections end to
# end" integration test. It reuses the entire production boot pipeline
# through `tairix-kernel`'s library half — discovery, the unlock kthread,
# PID 1 supervision, login's spawn-as-user, the shell's spawn-attach
# launch path, kernel pipes, and the disk-backed bundle spawn path — and
# only swaps the audit sink (no duplication). Keeping the QEMU-exit
# shortcut in a dedicated bin (not a Cargo feature on a production crate)
# prevents feature unification from leaking it into any production build
# (fail closed).
[target.'cfg(all(target_arch = "aarch64", target_os = "none"))'.dependencies]
tairix-arch-aarch64 = { path = "../../../kernel/arch/aarch64", version = "=0.0.0" }
tairix-kernel = { path = "../../../kernel/tairix-kernel", version = "=0.0.0" }
tairix-kalloc = { path = "../../../lib/kalloc", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
