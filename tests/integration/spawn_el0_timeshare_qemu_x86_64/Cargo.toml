[package]
name = "tairix-test-spawn-el0-timeshare-qemu-x86-64"
description = "plans/PI.md stage X2 QEMU integration test: prove two hardware-isolated ring-3 tasks timeshare one CPU under the live scheduler on x86_64, exercising the durable per-task user-%rsp save (the entry stub pushes the user rsp onto this task's kernel frame, not the shared per-CPU gs:8 slot) and the cooperative-park swapgs balance (ContextSwitch::enter/leave_cooperative_park) across a mid-handler park. The build script compiles the pure-Rust EL0 fixture program (tests/integration/el0_yielder_program) PIE and converts it to an rxe blob; the test boots the production tairix-kernel pipeline (so the GDT ring-3 selectors, the TSS, and syscall/IA32_LSTAR entry are installed), materialises two hardware-isolated user address spaces (two PML4s, one shared frame pool) with tairix_kernel_core::spawn_image, admits each as a resumable user kthread whose pre_resume hook reloads CR3 (paging::activate_user_root) and repoints the per-CPU syscall entry stack at the task's own kernel stack (syscall_entry::set_kernel_rsp0), and drives the cooperative Scheduler::step loop. Each task yields N times then exits; the dispatch callback maps each yield/exit to reschedule_current, and the test PASSes once both tasks yielded their full count and exited."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# This bin is the `plans/PI.md` stage X2 vertical: the x86_64 two-task EL0
# timeshare, the cross-port sibling of the aarch64 SP2c `spawn_el0_timeshare`.
# It is the exerciser for the two X2 structural fixes: (1) the durable user-%rsp
# save moved onto the per-task kernel-stack frame in `syscall_entry_stub` (a
# concurrent task's syscall entry no longer clobbers a parked task's saved user
# stack pointer through the shared per-CPU `gs:8` slot), and (2) the
# `ContextSwitch::enter/leave_cooperative_park` swapgs balance around the
# cooperative mid-handler park in `kernel/core`'s kthread runtime (a parked
# task's entry `swapgs` is balanced before the dispatcher enters a *different*
# task, so the next ring-3 entry never observes an unbalanced GS-swap and
# #DFs). The fixture program (`tairix-test-el0-yielder`) is built
# position-independent by `build.rs` and converted to an `rxe` blob
# (`tairix_itest_harness::elf2rxe`) carrying the kernel's compiled-in syscall
# CFI tag. It boots the production `tairix-kernel` pipeline (so the GDT ring-3
# selectors, the TSS, and `syscall`/`IA32_LSTAR` entry are installed) and, on
# `AuditEvent::BootCompleted`, enables `IA32_EFER.NXE`, builds two isolated user
# address spaces via `tairix_kernel_core::spawn_image` (capability-checked +
# audited), admits each as a resumable user kthread, and drives the cooperative
# `step` loop; the dispatch callback maps each task's `yield`/`exit` to
# `reschedule_current`. Any shortfall (an unexpected syscall, a wrong-count
# drain, or a deadlock) flips `qemu_exit::exit_failure` or times out
# (fail-loud).
#
# The `test-hooks` feature is on by default. Release builds that enable it are
# rejected by the `compile_error!` guard in `src/main.rs` (no
# hacks; fail closed), mirroring the other EL0 verticals.
[features]
default = ["test-hooks"]
test-hooks = []

[[bin]]
name = "tairix-test-spawn-el0-timeshare-qemu-x86-64"
path = "src/main.rs"

[target.'cfg(all(target_arch = "x86_64", target_os = "none"))'.dependencies]
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
tairix-arch-api = { path = "../../../kernel/arch/api", version = "=0.0.0" }
tairix-arch-x86_64 = { path = "../../../kernel/arch/x86_64", version = "=0.0.0", features = ["sched-arch"] }
tairix-kernel = { path = "../../../kernel/tairix-kernel", version = "=0.0.0" }
tairix-kernel-core = { path = "../../../kernel/core", version = "=0.0.0" }
tairix-kernel-mem = { path = "../../../kernel/mem", version = "=0.0.0" }
tairix-kernel-sched-eevdf = { path = "../../../kernel/sched/eevdf", version = "=0.0.0" }
tairix-kernel-syscall = { path = "../../../kernel/syscall", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
tairix-kernel-syscall = { path = "../../../kernel/syscall", version = "=0.0.0" }
