[package]
name = "tairix-test-kthread-switch-qemu-aarch64"
description = "SPAWN Stage SP1 QEMU integration test: two kernel-thread tasks ping-pong through the real Arch HAL ContextSwitch::switch under the live kernel/sched scheduler on the aarch64 virt board. Boots virt, builds a real Scheduler over Aarch64Arch, spawns two kthreads via kernel_core::spawn_kthread whose bodies cooperatively yield back and forth, drives the cooperative step loop until both have run N times and exited, and PASSes — making ContextSwitch::switch a production scheduling path."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# Freestanding "two kthreads ping-pong via the real context switch under
# the live scheduler" integration test — the aarch64 deliverable of
# `plans/SPAWN.md` Stage SP1. It links the `tairix-kernel-core` kthread
# runtime, the `tairix-arch-aarch64` port, and the default
# `tairix-kernel-sched-eevdf` policy, then drives the cooperative `step`
# loop over two kthreads whose bodies `yield_now` back and forth, so the
# `ContextSwitch::switch` primitive runs on a production scheduling
# path for the first time. Keeping the QEMU-exit shortcut in a dedicated
# bin (not a Cargo feature on a library crate) prevents feature
# unification from leaking it into any production build (fail closed).

[[bin]]
name = "tairix-test-kthread-switch-qemu-aarch64"
path = "src/main.rs"

[target.'cfg(all(target_arch = "aarch64", target_os = "none"))'.dependencies]
tairix-kernel-core = { path = "../../../kernel/core", version = "=0.0.0" }
tairix-arch-aarch64 = { path = "../../../kernel/arch/aarch64", version = "=0.0.0" }
tairix-itest-finisher = { path = "../finisher", version = "=0.0.0" }
tairix-arch-api = { path = "../../../kernel/arch/api", version = "=0.0.0" }
tairix-kernel-sched-eevdf = { path = "../../../kernel/sched/eevdf", version = "=0.0.0" }
tairix-kalloc = { path = "../../../lib/kalloc", version = "=0.0.0" }
tairix-fdt = { path = "../../../lib/fdt", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
