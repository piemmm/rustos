[package]
name = "tairix-test-netstack-dhcp-qemu-x86-64"
description = "plans/DHCP.md D3 QEMU integration test: boot the production x86_64 tairix-kernel pipeline (boot_x86_64::boot) on the q35/pc machine against the dhcp-net-root disk (whose read-only /System store carries the kernel-signed virtio-net driver bundle cross-compiled for x86_64 and a planted /System/Settings/Network/network.conf that binds the NIC by <iface>.match.node = its virtio-PCI config-window BAR base, selects ipv4.method dhcp, and disables IPv6) with a virtio-net-pci device attached and the harness-side DHCP-server peer on the QEMU dgram netdev. The virtio-PCI sibling of tairix-test-netstack-dhcp-qemu-aarch64 on the x86_64 MSI-X device-IRQ path: proves RFC 2131 dynamic IPv4 addressing end to end. devmgr autoloads the virtio-net driver into its own process (it publishes a netchan node), reads the planted network.conf, and binds the NIC to the `wan` alias by its stable bus location; netstack drives its DHCP client, which leases the interface its only address from the host DHCP-server peer, and then answers the peer's echo campaign to that leased address. The guest does not self-exit; the harness ends the run when the host peer confirms the echo round-trip at the leased address (its success gate), so teardown cannot precede the reply leaving the machine. The witness records (NETSTACK_BOUND, DHCP_LEASE_ACQUIRED, INBOUND_ECHO_SERVED) reach the serial transcript for diagnosis, and the peer's own DHCP-server + leased-address echo campaign verdict subsumes them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "tairix-test-netstack-dhcp-qemu-x86-64"
path = "src/main.rs"

# Freestanding "boot the production x86_64 kernel pipeline against the
# dhcp-net-root disk carrying the signed virtio-net driver bundle and a planted
# network.conf selecting DHCPv4, and prove RFC 2131 dynamic addressing end to
# end over virtio-PCI" integration test. It reuses the entire production x86_64
# boot pipeline through `tairix-kernel`'s library half (`boot_x86_64::boot`)
# unchanged. The guest does not self-exit; the harness drives the run to
# completion through the host peer's success gate, so there is no in-kernel
# QEMU-exit shortcut to leak into any production build (fail closed).
[target.'cfg(all(target_arch = "x86_64", target_os = "none"))'.dependencies]
tairix-arch-x86_64 = { path = "../../../kernel/arch/x86_64", version = "=0.0.0", features = ["sched-arch"] }
tairix-kernel = { path = "../../../kernel/tairix-kernel", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
