[package]
name = "tairix-test-scheduler-stress-qemu"
description = "Stage 3a (b) QEMU integration test: scheduler stress on ≥ 4 real (emulated) cores."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# This crate is the *QEMU-on-real-cores* sibling of
# `tests/integration/scheduler_stress`. The host-side crate already
# satisfies the unit/workspace contract by simulating
# 4 cores through `TestArch`; this crate satisfies the Stage-2
# deliverable that mandates the same workload run under QEMU on
# `-smp 4` with the actual x86_64 AP-bring-up code from
# `kernel/arch/x86_64::smp` exercised end-to-end.
#
# The two crates are kept separate (rather than merged into one) because
# a freestanding `[[bin]]` linking `tairix-arch-x86_64` cannot coexist
# with a `[lib] + tests/` integration test in the same package: the
# former requires `#![no_std]`/`#![no_main]` and only builds for
# `x86_64-unknown-none`, while the latter must compile for the host
# triple under `cargo test --workspace`. Duplicating the workload itself is
# forbidden; the actual task body and assertions
# live in shared constants on `tairix-test-scheduler-stress`, which this
# crate depends on.

[[bin]]
name = "tairix-test-scheduler-stress-qemu"
path = "src/main.rs"

[target.'cfg(all(target_arch = "x86_64", target_os = "none"))'.dependencies]
tairix-arch-api = { path = "../../../kernel/arch/api", version = "=0.0.0" }
tairix-arch-x86_64 = { path = "../../../kernel/arch/x86_64", version = "=0.0.0", features = ["sched-arch"] }
tairix-kernel-sched-mlfq = { path = "../../../kernel/sched/mlfq", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
