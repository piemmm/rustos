[package]
name = "rustos-test-abi-sys-syscall-qemu-riscv64"
description = "CCOMPAT stage CC2 QEMU integration test: drop to U-mode and issue the lib/abi-sys ros_sys_cap_query stub so the real riscv64 `ecall` trap is exercised end-to-end and the kernel-observed (number, args) marshalling is asserted before the SiFive Test PASS finisher."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# This bin is the `plans/CCOMPAT.md` stage CC2 per-native-target QEMU
# round-trip test for the C-callable syscall stub runtime (`lib/abi-sys`)
# on the riscv64 `virt` board. Unlike x86_64 — whose `syscall` traps
# identically from ring 0 — a riscv64 `ecall` only reaches the kernel's
# U-mode syscall path when raised from U-mode, so this test stands up a
# minimal U-mode context: it identity-maps the kernel (S-mode) with the
# Stage-3 Sv39 primitives, aliases the `ros_sys_cap_query` stub page at a
# user virtual address with the U bit set plus a user stack, installs the
# syscall dispatch callback, and `sret`s to U-mode. The stub's real
# `ecall` (`lib/abi-sys/src/trap.rs`) then traps into the kernel S-mode
# trap vector (`kernel/arch/riscv64/src/trap.rs` → `syscall_entry`), and
# the installed dispatch callback asserts the marshalled `(number, args)`
# match what `ros_sys_cap_query` should have placed in `a7`/`a0` before
# writing the `SiFive` Test PASS finisher; any mismatch trips a distinct
# failure finisher.
#
# The `test-hooks` feature is on by default for this crate. Release builds
# that enable it are rejected by the `compile_error!` guard in
# `src/main.rs` (AGENTS.md §1 — no hacks; §5.4.5 — fail closed; §15 —
# test affordances stay in test crates), mirroring
# `rustos-test-abi-sys-syscall-qemu`.
[features]
default = ["test-hooks"]
test-hooks = []

[[bin]]
name = "rustos-test-abi-sys-syscall-qemu-riscv64"
path = "src/main.rs"

[target.'cfg(all(target_arch = "riscv64", target_os = "none"))'.dependencies]
rustos-abi = { path = "../../../lib/abi", version = "=0.0.0" }
rustos-abi-sys = { path = "../../../lib/abi-sys", version = "=0.0.0" }
rustos-arch-api = { path = "../../../kernel/arch/api", version = "=0.0.0" }
rustos-arch-riscv64 = { path = "../../../kernel/arch/riscv64", version = "=0.0.0" }
rustos-log = { path = "../../../lib/log", version = "=0.0.0" }

[build-dependencies]
rustos-itest-harness = { path = "../harness", version = "=0.0.0" }
