[package]
name = "tairix-test-audio-virtio-qemu-aarch64"
description = "plans/SOUND.md SND4 QEMU integration test: boot the production aarch64 tairix-kernel pipeline against the shared audio-root disk (whose read-only /System store carries the kernel-signed virtio sound driver bundle and the test-only audiotone fixture) with a virtio sound device behind QEMU's wav audio backend. Proves the full three-process audio path: devmgr autoloads the sound driver into its own user process, hands its audiochan-v1 endpoint to audiod, and the scripted root shell's audiotone client plays a deterministic signal that the harness then asserts the emulated card received sample for sample."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "tairix-test-audio-virtio-qemu-aarch64"
path = "src/main.rs"

# Freestanding "boot the production aarch64 kernel pipeline against the shared
# autoload-root disk carrying the signed virtio-net driver bundle, and prove
# the two-process live-boot network path end to end" integration test. It
# reuses the entire production aarch64 boot pipeline through `tairix-kernel`'s
# library half (`boot_aarch64::boot`) unchanged. The guest does not self-exit;
# the harness drives the run to completion through the host peer's success gate,
# so there is no in-kernel QEMU-exit shortcut to leak into any production build
# (fail closed).
[target.'cfg(all(target_arch = "aarch64", target_os = "none"))'.dependencies]
tairix-arch-aarch64 = { path = "../../../kernel/arch/aarch64", version = "=0.0.0" }
tairix-kernel = { path = "../../../kernel/tairix-kernel", version = "=0.0.0" }
tairix-kernel-core = { path = "../../../kernel/core", version = "=0.0.0" }
tairix-kalloc = { path = "../../../lib/kalloc", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }
tairix-test-audio-wire = { path = "../audio_wire", version = "=0.0.0", default-features = false }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
