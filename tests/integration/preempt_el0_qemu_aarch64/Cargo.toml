[package]
name = "tairix-test-preempt-el0-qemu-aarch64"
description = "P-1 QEMU integration test: prove the production generic-timer IRQ involuntarily preempts a runaway EL0 task on the aarch64 virt board (plans/PI.md D2b-2b-A P-1). The build script compiles a pure-Rust EL0 spinner (tests/integration/el0_spinner_program) PIE — a busy loop that issues no syscall — and converts it to an rxe blob; the kernel arms the production preemption path (the EL0-preemptible SPSR, the per-CPU PreemptStorage, the reschedule_current(Yield) preempt callback, and the periodic generic timer) and spawns the spinner as a single resumable user kthread, then drives the step loop. Because the loop never traps, any reschedule before exit is forced — PASS once the task is preempted at least once AND still completes and exits."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# This bin is the `plans/PI.md` D2b-2b-A P-1 aarch64 involuntary-preemption
# vertical. The fixture program (`tairix-test-el0-spinner`) is built
# position-independent by `build.rs` and converted to an `rxe` blob
# (`tairix_itest_harness::elf2rxe`) carrying the kernel's compiled-in syscall
# CFI tag. On boot the test reads the GICv2 base + timer rate from the embedded
# `virt` DTB, brings up the EL1 vectors + GICv2, builds an isolated EL0 address
# space via `tairix_kernel_core::spawn_image` (capability-checked + audited),
# admits it as a resumable user kthread via `spawn_user_kthread`, arms the
# production timer-IRQ preemption path, and drives the `step` loop. The spinner
# issues no syscall, so the only way it leaves EL0 before its final `exit` is an
# involuntary preemption. PASS once the preempt callback fired at least once
# AND the task still completed and exited; a runaway that never preempts (the
# `step` never returns) or a botched resume (the task never exits) times out
# (fail-loud).
#
# The `test-hooks` feature is on by default. Release builds that enable it are
# rejected by the `compile_error!` guard in `src/main.rs` (no
# hacks; fail closed), mirroring the spawn-program round-trip tests.
[features]
default = ["test-hooks"]
test-hooks = []

[[bin]]
name = "tairix-test-preempt-el0-qemu-aarch64"
path = "src/main.rs"

[target.'cfg(all(target_arch = "aarch64", target_os = "none"))'.dependencies]
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
tairix-arch-api = { path = "../../../kernel/arch/api", version = "=0.0.0" }
tairix-kalloc = { path = "../../../lib/kalloc", version = "=0.0.0" }
tairix-arch-aarch64 = { path = "../../../kernel/arch/aarch64", version = "=0.0.0" }
tairix-itest-finisher = { path = "../finisher", version = "=0.0.0" }
tairix-fdt = { path = "../../../lib/fdt", version = "=0.0.0" }
tairix-kernel-core = { path = "../../../kernel/core", version = "=0.0.0" }
tairix-kernel-mem = { path = "../../../kernel/mem", version = "=0.0.0" }
tairix-kernel-sched-eevdf = { path = "../../../kernel/sched/eevdf", version = "=0.0.0" }
tairix-kernel-syscall = { path = "../../../kernel/syscall", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
tairix-kernel-syscall = { path = "../../../kernel/syscall", version = "=0.0.0" }
