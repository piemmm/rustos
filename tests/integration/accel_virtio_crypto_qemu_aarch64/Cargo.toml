[package]
name = "tairix-test-accel-virtio-crypto-qemu-aarch64"
description = "QEMU integration test for the accelerator driver class: boot the aarch64 virt-board, build the virtio-MMIO bus from the device tree, provision an MmioTransport through the capability-gated KernelMmioMapper, mint a KernelVirtioHost over a static per-device DMA pool, load the signed virtio-crypto `.rxe`, then run a real AES-CBC job on QEMU's virtio-crypto device and require the NIST SP 800-38A F.2 known-answer cipher text byte for byte before decrypting it back. The accelerator-class sibling of the aarch64 virtio-input vertical."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "tairix-test-accel-virtio-crypto-qemu-aarch64"
path = "src/main.rs"

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["zeroize"] }

# The device-agnostic bring-up scaffolding (boot harness, DTB MMIO walk,
# GICv2 + EL1 IRQ wiring, static DMA pool, signed-`.rxe` load) and the
# AES-CBC known-answer tail both live in the shared support crate; this bin
# pulls in only the abi and the accelerator driver it resolves the loaded
# image to.
[target.'cfg(all(target_arch = "aarch64", target_os = "none"))'.dependencies]
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
tairix-drv-accelerator-virtio-crypto = { path = "../../../drivers/accelerator/virtio_crypto", version = "=0.0.0" }
tairix-test-virtio-qemu-support = { path = "../virtio_qemu_support", version = "=0.0.0" }
