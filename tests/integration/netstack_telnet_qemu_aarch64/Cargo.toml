[package]
name = "tairix-test-netstack-telnet-qemu-aarch64"
description = "plans/TELNET.md live telnet QEMU vertical: boot the production aarch64 tairix-kernel pipeline (boot_aarch64::boot) on the virt board with the shared net-tool encrypted-root disk carrying the standard signed store bundles (including the real telnet command bundle) plus the signed virtio-net driver bundle, with a virtio-net device attached and the harness-side telnet-server peer on its dgram netdev. It unlocks the root, authenticates root/root at the console login, and runs `telnet fe80::2` from the scripted shell: the client connects, negotiates SUPPRESS GO AHEAD, TERMINAL TYPE, NAWS and RFC 1184 LINEMODE (MODE mask and SLC table) with the peer, is greeted, relays a typed probe line that the peer echoes back upper-cased, and leaves through the escape character and the `telnet>` interpreter's quit. PASS once the telnet tool's audited exit has been observed and the shell's scripted exit — typed only after the peer's echoed answer appeared — follows it; the harness additionally requires the peer's own verdict, which names the first negotiation step the client failed to complete, so neither side can pass alone."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "tairix-test-netstack-telnet-qemu-aarch64"
path = "src/main.rs"

# Freestanding "boot the production aarch64 pipeline with the planted
# encrypted-root disk carrying the virtio-net driver + the standard app store
# (with the real `telnet` bundle) and prove the RFC 854 client end to end over
# the live two-process network" integration test. It reuses the entire
# production boot pipeline through `tairix-kernel`'s library half — discovery,
# the unlock kthread, PID 1 supervision, netstack, devmgr's driver autoload,
# login's spawn-as-user, the shell, and the disk-backed bundle spawn path —
# and only swaps the audit sink (no duplication). Keeping the QEMU-exit
# shortcut in a dedicated bin (not a Cargo feature on a production crate)
# prevents feature unification from leaking it into any production build
# (fail closed).
[target.'cfg(all(target_arch = "aarch64", target_os = "none"))'.dependencies]
tairix-arch-aarch64 = { path = "../../../kernel/arch/aarch64", version = "=0.0.0" }
tairix-kernel = { path = "../../../kernel/tairix-kernel", version = "=0.0.0" }
tairix-kalloc = { path = "../../../lib/kalloc", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
