[package]
name = "tairix-test-autoload-input-qemu-x86-64"
description = "QEMU integration test (plans/ARCHSUPPORT.md A4): boot the production x86_64 tairix-kernel pipeline (boot_x86_64::boot) with a planted whole-disk encrypted-root image whose always-readable /System volume carries the kernel-signed virtio-input keyboard driver bundle in its Drivers/ store, plus an attached virtio-keyboard-pci device on the PCI bus, and prove the driver-loading-by-discovery autoload path end to end over virtio-PCI: the bootstrap-floor virtio-PCI enumeration discovers the virtio-input node, the in-kernel unlock kthread mounts /System and serves its signed driver store, the user-space devmgr matches the signed virtio_kbd bundle to the discovered node and asks the kernel to load it, the kernel re-runs the full signed gate and spawns it into its own user-space process with exactly the node's four role-tagged config windows + DMA + routed MSI-X line, and that autoloaded driver brings its device up, arms its granted interrupt line (the audited irq_bind syscall), and injects the runner-typed key into the kernel input-focus arbiter. PASS via QEMU isa-debug-exit once AuditEvent::InputDelivered with kind=key is observed — an autoloaded user-space input driver delivered on x86_64."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# Freestanding "boot the production x86_64 kernel pipeline with a planted
# encrypted-root virtio-blk-pci disk carrying a signed virtio-input keyboard
# driver bundle on its always-readable /System volume, and prove devmgr
# autoloads that user-space driver over the virtio-PCI contract, which
# delivers an injected keystroke to the input-focus arbiter" integration test.
# It reuses the entire production x86_64 boot pipeline through `tairix-kernel`'s
# library half (`boot_x86_64::boot`) — the bootstrap-floor virtio-PCI
# enumeration (block + input discovery), the `InitSpawn` seam, the runtime
# `ProcessSpawn` producer, the MSI-X device-IRQ wiring,
# `unlock_service::spawn_if_present`, and the shared driver-store serve tail —
# and only swaps the audit sink to report PASS on the one-shot
# `AuditEvent::InputDelivered` witness (no duplication).
# Keeping the QEMU-exit shortcut in a dedicated bin (not a Cargo feature on a
# production crate) prevents feature unification from leaking it into any
# production build (fail closed).

[[bin]]
name = "tairix-test-autoload-input-qemu-x86-64"
path = "src/main.rs"

[target.'cfg(all(target_arch = "x86_64", target_os = "none"))'.dependencies]
tairix-arch-x86_64 = { path = "../../../kernel/arch/x86_64", version = "=0.0.0", features = ["sched-arch"] }
# The production x86_64 boot pipeline (with the unlock/autoload seam) lives in
# `tairix-kernel`'s library half; this vertical reuses it verbatim and only
# swaps the audit sink (no duplication).
tairix-kernel = { path = "../../../kernel/tairix-kernel", version = "=0.0.0" }
# The kernel/core audit vocabulary: the `InputDelivered` event id the witness
# keys on — the shared definition, never a magic number.
tairix-kernel-core = { path = "../../../kernel/core", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
