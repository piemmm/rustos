[package]
name = "tairix-test-cross-cpu-tlb-shootdown-qemu-riscv64"
description = "WIRING Stage W6 QEMU integration test: cross-CPU TLB shootdown on the riscv64 virt board — the boot hart starts a secondary hart, then drives RiscvArch::shootdown_page (local sfence.vma + the SBI RFENCE remote_sfence_vma firmware call) and asserts the remote fence reaches the live secondary hart."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# Freestanding cross-CPU TLB-shootdown integration test — the riscv64
# proof of the `tairix_arch_api::CrossCpuTlbShootdown` HAL slice
# (`plans/WIRING.md` Stage W6). It links only the `tairix-arch-riscv64`
# port: the boot hart starts a second hart through `smp::start_secondary`
# (SBI HSM `hart_start`), waits for it to come up, then drives
# `RiscvArch::shootdown_page` — a local `sfence.vma` plus the SBI RFENCE
# `remote_sfence_vma` firmware call that reaches the live secondary hart —
# and confirms the firmware honours the remote fence. Keeping the
# QEMU-exit shortcut in a dedicated bin (not a Cargo feature on the arch
# crate) prevents feature unification from leaking it into any production
# build (`AGENTS.md` §5.4.5 — fail closed).

[[bin]]
name = "tairix-test-cross-cpu-tlb-shootdown-qemu-riscv64"
path = "src/main.rs"

[target.'cfg(all(target_arch = "riscv64", target_os = "none"))'.dependencies]
tairix-arch-riscv64 = { path = "../../../kernel/arch/riscv64", version = "=0.0.0" }
tairix-arch-api = { path = "../../../kernel/arch/api", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
