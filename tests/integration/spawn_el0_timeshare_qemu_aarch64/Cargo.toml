[package]
name = "tairix-test-spawn-el0-timeshare-qemu-aarch64"
description = "SPAWN stage SP2c QEMU integration test: prove two EL0 user tasks timeshare one CPU under the live scheduler on the aarch64 virt board. The build script compiles a pure-Rust EL0 program (tests/integration/el0_yielder_program) PIE and converts it to an rxe blob; the kernel materialises two hardware-isolated EL0 address spaces with tairix_kernel_core::spawn_image, admits each as a resumable user kthread (spawn_user_kthread), and drains the cooperative step loop while a dispatch callback turns each task's yield/exit into a reschedule_current context switch — PASS once both tasks yielded their full count and exited."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# This bin is the `plans/SPAWN.md` stage SP2c aarch64 EL0↔EL0 timeshare
# vertical. The fixture program (`tairix-test-el0-yielder`) is built
# position-independent by `build.rs` and converted to an `rxe` blob
# (`tairix_itest_harness::elf2rxe`) carrying the kernel's compiled-in syscall
# CFI tag. On boot the test reads the GICv2 base + timer rate from the embedded
# `virt` DTB, brings up the EL1 vectors + GICv2, builds two isolated EL0 address
# spaces via `tairix_kernel_core::spawn_image` (capability-checked + audited),
# admits each as a resumable user kthread via `spawn_user_kthread`, and drives
# the cooperative `step` loop; the dispatch callback maps each task's `yield`/
# `exit` `svc` to `reschedule_current`. PASS once both tasks yielded their full
# count and exited; any shortfall (or a never-draining loop) writes a distinct
# failure finisher or times out (fail-loud, `AGENTS.md` §7).
#
# The `test-hooks` feature is on by default. Release builds that enable it are
# rejected by the `compile_error!` guard in `src/main.rs` (AGENTS.md §1 — no
# hacks; §5.4.5 — fail closed), mirroring the spawn-program round-trip tests.
[features]
default = ["test-hooks"]
test-hooks = []

[[bin]]
name = "tairix-test-spawn-el0-timeshare-qemu-aarch64"
path = "src/main.rs"

[target.'cfg(all(target_arch = "aarch64", target_os = "none"))'.dependencies]
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
tairix-arch-api = { path = "../../../kernel/arch/api", version = "=0.0.0" }
tairix-kalloc = { path = "../../../lib/kalloc", version = "=0.0.0" }
tairix-arch-aarch64 = { path = "../../../kernel/arch/aarch64", version = "=0.0.0" }
tairix-fdt = { path = "../../../lib/fdt", version = "=0.0.0" }
tairix-kernel-core = { path = "../../../kernel/core", version = "=0.0.0" }
tairix-kernel-mem = { path = "../../../kernel/mem", version = "=0.0.0" }
tairix-kernel-sched-eevdf = { path = "../../../kernel/sched/eevdf", version = "=0.0.0" }
tairix-kernel-syscall = { path = "../../../kernel/syscall", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
tairix-kernel-syscall = { path = "../../../kernel/syscall", version = "=0.0.0" }
