[package]
name = "tairix-test-stack-arena-qemu-aarch64"
description = "plans/PI.md guard-page fault-form (stage G2) QEMU integration test: prove the boot-time kthread-stack guard arena is laid out so a guard page in it can be unmapped — faulting on access — without ever shattering the 2 MiB block the running CPU executes on, on the virt board."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# Freestanding "prepare a 2 MiB-aligned guard arena at 4 KiB granularity,
# unmap one guard page in it, and prove the MMU faults the access while the
# running stack — which lives in a *different* 2 MiB block — keeps working"
# integration test: the `-M virt` proof of the `plans/PI.md` stage-G2
# guarded kthread-stack arena (`AddressSpace::prepare_guard_arena`). The
# arena is its own 2 MiB-aligned block, so re-expressing it never touches
# the block the CPU runs on. It links only the `tairix-arch-aarch64` port
# and reports the result through the ARM semihosting finisher. Keeping the
# QEMU-exit shortcut in a dedicated bin (not a Cargo feature on the arch
# crate) prevents feature unification from leaking it into any production
# build (fail closed).

[[bin]]
name = "tairix-test-stack-arena-qemu-aarch64"
path = "src/main.rs"

[target.'cfg(all(target_arch = "aarch64", target_os = "none"))'.dependencies]
tairix-arch-aarch64 = { path = "../../../kernel/arch/aarch64", version = "=0.0.0" }
tairix-itest-finisher = { path = "../finisher", version = "=0.0.0" }
# The Arch HAL MMU + TLB surface: the guard page is
# torn down through `tairix_arch_api::mmu::AddressSpace::unmap` and the
# stale entry flushed through `tairix_arch_api::tlb::TlbShootdown::flush_page`,
# so the fault-form is proven *through the HAL*.
tairix-arch-api = { path = "../../../kernel/arch/api", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
