[package]
name = "tairix-test-kthread-switch-qemu-x86-64"
description = "SPAWN Stage SP1 QEMU integration test: two kernel-thread tasks ping-pong through the real Arch HAL ContextSwitch::switch under the live kernel/sched scheduler on x86_64. Boots the multiboot kernel, builds a real Scheduler over the production X86_64Arch on the boot CPU, spawns two kthreads via kernel_core::spawn_kthread whose bodies cooperatively yield back and forth, drives the cooperative step loop until both have run N times and exited, and PASSes — making ContextSwitch::switch a production scheduling path on x86_64."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# Freestanding "two kthreads ping-pong via the real context switch under
# the live scheduler" integration test — the x86_64 deliverable of
# `plans/SPAWN.md` Stage SP1, the sibling of
# `tests/integration/kthread_switch_qemu_{aarch64,riscv64}`. It links the
# `tairix-kernel-core` kthread runtime, the `tairix-arch-x86_64` port (the
# `sched-arch` feature exposes the production `X86_64Arch` SchedulerArch
# impl), and the default `tairix-kernel-sched-eevdf` policy (matching
# `kernel-core`'s default scheduler feature — selecting a different policy
# would trip the "exactly one policy" guard under feature
# unification), then drives the cooperative `step` loop over two kthreads
# whose bodies `yield_now` back and forth, so the
# `ContextSwitch::switch` primitive runs on a production scheduling path.
# Keeping the QEMU-exit shortcut in a dedicated bin (not a Cargo feature
# on a library crate) prevents feature unification from leaking it into
# any production build (fail closed).

[[bin]]
name = "tairix-test-kthread-switch-qemu-x86-64"
path = "src/main.rs"

[target.'cfg(all(target_arch = "x86_64", target_os = "none"))'.dependencies]
tairix-kernel-core = { path = "../../../kernel/core", version = "=0.0.0" }
tairix-arch-x86_64 = { path = "../../../kernel/arch/x86_64", version = "=0.0.0", features = ["sched-arch"] }
tairix-arch-api = { path = "../../../kernel/arch/api", version = "=0.0.0" }
tairix-kernel-sched-eevdf = { path = "../../../kernel/sched/eevdf", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
