[package]
name = "tairix-test-fiq-selfsample-qemu-aarch64"
description = "WATCHDOG.md B3 QEMU integration test (plans/WATCHDOG.md / plans/OPEN-DEFECTS.md D13): prove the debug-only non-maskable FIQ watchdog self-sample can observe a core wedged in a `DAIF.I`-masked kernel section — the masked-section blind spot the maskable IRQ cadence physically cannot see. On the QEMU `virt` board (single-Security-state GIC, `secure=off`) the empirical FIQ-deliverability probe returns `Supported`, so the watchdog routes its cadence PPI to GIC Group 0 as an FIQ. The test then deliberately masks `DAIF.I` and busy-spins in a known kernel function that issues no yield and no syscall; because FIQ is masked by the *separate* `DAIF.F` bit, the Group-0 cadence still fires and the self-sample callback captures a LIVE snapshot of the interrupted PC (`sampled=live`, not the stale `pre_silence` a buddy would see). PASS once the probe reported `Supported`, an FIQ self-sample fired while `DAIF.I` was masked, and the sampled PC (and backtrace top) land inside the masked-spin function — the proof the D13 masked-section sampler works."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# WATCHDOG.md B3 deliverable: the aarch64 non-maskable-FIQ masked-section
# self-sample vertical. It boots the `virt` board, brings up the EL1 vectors +
# GICv2, runs the production `probe_fiq_deliverability` capability probe, and —
# on the single-Security-state QEMU `virt` GIC where Group 0 / FIQ reaches
# non-secure EL1 — installs the production watchdog cadence callback, arms a
# short Group-0 (FIQ) cadence, deliberately masks `DAIF.I`, and busy-spins in a
# `#[inline(never)]` marker function. The FIQ fires *through* the `DAIF.I` mask
# (it is gated only by the separate `DAIF.F` bit the port clears in a
# diagnostics build), and the self-sample callback captures the live interrupted
# PC + `capture_sample_backtrace`. PASS once the probe reported `Supported`, the
# FIQ fired while `DAIF.I` was masked (the record confirms it), and the sampled
# PC and backtrace top land inside the masked-spin function — `sampled=live`.
# Any shortfall writes a distinct semihosting failure code or the harness times
# out (fail-loud, AGENTS.md §7).
#
# The `test-hooks` feature is on by default. Release builds that enable it are
# rejected by the `compile_error!` guard in `src/main.rs` (AGENTS.md §1 — no
# hacks; §5.4 — fail closed), mirroring the other aarch64 verticals.
[features]
default = ["test-hooks"]
test-hooks = []

[[bin]]
name = "tairix-test-fiq-selfsample-qemu-aarch64"
path = "src/main.rs"

[target.'cfg(all(target_arch = "aarch64", target_os = "none"))'.dependencies]
# The FIQ self-sample mechanism is the port's, gated behind
# `watchdog-diagnostics` (the debug image only); the test enables it to exercise
# the same code the debug kernel runs.
tairix-arch-aarch64 = { path = "../../../kernel/arch/aarch64", version = "=0.0.0", features = [
    "watchdog-diagnostics",
] }
tairix-arch-api = { path = "../../../kernel/arch/api", version = "=0.0.0" }
tairix-fdt = { path = "../../../lib/fdt", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
