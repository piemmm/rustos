[package]
name = "tairix-test-mem-map-qemu-riscv64"
description = "SPAWN stage SP5b-2 QEMU integration test (riscv64 sibling of tairix-test-mem-map-qemu-aarch64): prove a U-mode process can obtain and release anonymous RW memory at runtime via abi-v1 on the riscv64 virt board. The build script compiles the pure-Rust EL0 program (tests/integration/mem_map_program) PIE and converts it to an rxe blob; the kernel materialises one hardware-isolated Sv39 U-mode address space with tairix_kernel_core::spawn_image, retains it live, installs a tairix_kernel_core::MemMap producer backed by tairix_kernel_mem::map_anonymous/unmap_anonymous over that space, and routes the program's mem_map/mem_unmap syscalls through it — PASS once the program mapped a region, verified a written pattern, unmapped it, and faulted on use after unmap."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# This bin is the `plans/SPAWN.md` stage SP5b-2 riscv64 mem_map/mem_unmap
# vertical, the sibling of `tairix-test-mem-map-qemu-aarch64`. The fixture
# program (`tairix-test-mem-map`) is built position-independent by `build.rs`
# and converted to an `rxe` blob (`tairix_itest_harness::elf2rxe`) carrying the
# kernel's compiled-in syscall CFI tag. On boot the test stands up an Sv39
# address space (identity-mapping the kernel + MMIO), activates it, installs the
# trap vector + a dispatch callback + a fault handler, builds one isolated
# U-mode address space via `tairix_kernel_core::spawn_image` (capability-checked
# + audited), retains it live, installs a `MemMap` producer over `map_anonymous`
# / `unmap_anonymous`, and `sret`s into the program; the dispatch callback
# routes the program's `mem_map` / `mem_unmap` `ecall`s through the producer.
# The fault handler reports the deliberate use-after-unmap page fault as PASS.
# Any shortfall (the program returning a failure exit code, or no fault) writes
# a distinct `SiFive` Test failure finisher or times out (fail-loud).
#
# The `test-hooks` feature is on by default. Release builds that enable it are
# rejected by the `compile_error!` guard in `src/main.rs` (no
# hacks; fail closed), mirroring the other EL0 verticals.
[features]
default = ["test-hooks"]
test-hooks = []

[[bin]]
name = "tairix-test-mem-map-qemu-riscv64"
path = "src/main.rs"

[target.'cfg(all(target_arch = "riscv64", target_os = "none"))'.dependencies]
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
tairix-arch-api = { path = "../../../kernel/arch/api", version = "=0.0.0" }
tairix-itest-finisher = { path = "../finisher", version = "=0.0.0" }
tairix-kalloc = { path = "../../../lib/kalloc", version = "=0.0.0" }
tairix-arch-riscv64 = { path = "../../../kernel/arch/riscv64", version = "=0.0.0" }
tairix-kernel-core = { path = "../../../kernel/core", version = "=0.0.0" }
tairix-kernel-mem = { path = "../../../kernel/mem", version = "=0.0.0" }
tairix-kernel-syscall = { path = "../../../kernel/syscall", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
tairix-kernel-syscall = { path = "../../../kernel/syscall", version = "=0.0.0" }
