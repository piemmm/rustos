[package]
name = "rustos-test-memsoak-qemu-aarch64"
description = "plans/APPS.md Immediate-work I2/I3 memory-stability QEMU vertical: boot the production aarch64 rustos-kernel pipeline (boot_aarch64::boot) on the virt board with the encrypted-root disk carrying the standard signed store bundles plus the test-only memsoak fixture bundle, unlock the root, authenticate root/root at the console login, and run `memsoak` from the scripted shell. The fixture drives warmup plus 32 spawn/wait + top-refresh-shaped cycles on the live system and compares KernelMemoryStats.free_bytes before and after; PASS once the fixture's audited exit (a stable soak — a drifted one parks forever) has been observed and the shell's scripted exit, typed only after the MEMSOAK PASS marker appeared, follows it — so the numeric verdict provably reached the transcript before the run ended."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "rustos-test-memsoak-qemu-aarch64"
path = "src/main.rs"

# Freestanding "boot the production aarch64 pipeline with the planted
# encrypted-root disk and prove the per-cycle memory footprint is exactly
# reclaimed on the live system" integration test. It reuses the entire
# production boot pipeline through `rustos-kernel`'s library half —
# discovery, the unlock kthread, PID 1 supervision, login's spawn-as-user,
# the shell, the disk-backed bundle spawn path, sysinfod, and the process
# teardown — and only swaps the audit sink (no duplication). Keeping the
# QEMU-exit shortcut in a dedicated bin (not a Cargo feature on a
# production crate) prevents feature unification from leaking it into any
# production build (fail closed).
[target.'cfg(all(target_arch = "aarch64", target_os = "none"))'.dependencies]
rustos-arch-aarch64 = { path = "../../../kernel/arch/aarch64", version = "=0.0.0" }
rustos-kernel = { path = "../../../kernel/rustos-kernel", version = "=0.0.0" }
rustos-kalloc = { path = "../../../lib/kalloc", version = "=0.0.0" }
rustos-log = { path = "../../../lib/log", version = "=0.0.0" }
# The fixture's pure verdict library, for the one `COMMAND` definition the
# PASS keying matches `comm` against. `default-features = false`: the
# fixture's `program` feature (its own `Run` binary's userland runtime)
# must never link into this kernel bin — the runtime's `_start`/panic
# handler belong to the fixture's standalone cross-compile only.
rustos-test-memsoak = { path = "../memsoak_program", version = "=0.0.0", default-features = false }

[build-dependencies]
rustos-itest-harness = { path = "../harness", version = "=0.0.0" }
