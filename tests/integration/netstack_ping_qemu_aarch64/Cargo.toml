[package]
name = "tairix-test-netstack-ping-qemu-aarch64"
description = "plans/NETWORK.md N8b-2b-β ICMP-echo (ping) QEMU vertical: boot the production aarch64 tairix-kernel pipeline (boot_aarch64::boot) on the virt board with the encrypted-root disk carrying the standard signed store bundles (including the real ping command bundle) plus the signed virtio-net driver bundle, with a virtio-net device attached and the harness-side passive ICMP echo responder on its dgram netdev. It unlocks the root, authenticates root/root at the console login, and runs `ping -c 3 fe80::2` from the scripted shell: the ping tool opens an ICMP-echo socket, resolves the host peer over ND, and sends three ICMPv6 echo requests over the shared IPv6 link-local wire, which the peer answers. PASS once the ping tool's audited exit has been observed and the shell's scripted exit — typed only after the tool printed an `icmp_seq=` reply line — follows it; the harness additionally requires the responder to report at least one served echo request, so neither side can pass alone."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "tairix-test-netstack-ping-qemu-aarch64"
path = "src/main.rs"

# Freestanding "boot the production aarch64 pipeline with the planted
# encrypted-root disk carrying the virtio-net driver + the standard app store
# (with the real `ping` bundle) and prove the ICMP-echo path end to end over
# the live two-process network" integration test. It reuses the entire
# production boot pipeline through `tairix-kernel`'s library half — discovery,
# the unlock kthread, PID 1 supervision, netstack, devmgr's driver autoload,
# login's spawn-as-user, the shell, and the disk-backed bundle spawn path —
# and only swaps the audit sink (no duplication). Keeping the QEMU-exit
# shortcut in a dedicated bin (not a Cargo feature on a production crate)
# prevents feature unification from leaking it into any production build
# (fail closed).
[target.'cfg(all(target_arch = "aarch64", target_os = "none"))'.dependencies]
tairix-arch-aarch64 = { path = "../../../kernel/arch/aarch64", version = "=0.0.0" }
tairix-kernel = { path = "../../../kernel/tairix-kernel", version = "=0.0.0" }
tairix-kalloc = { path = "../../../lib/kalloc", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
