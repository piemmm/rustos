[package]
name = "rustos-test-root-unlock-login-qemu-aarch64"
description = "plans/PI.md P11 Chunk B-2 QEMU integration test: boot the aarch64 virt-board, build the virtio-MMIO bus from the device tree, provision an MmioTransport through the capability-gated KernelMmioMapper, load the signed virtio-blk `.rxe`, then drive the production interactive root-unlock policy (rustos_kernel::root_mount::unlock_root_disk_interactively) over the planted whole-disk encrypted-root image: type the passphrase at the prompt over a scripted console, read root.unlock off the FAT boot partition, derive the volume key, mount the encrypted ARXFS root, install the loaded users database into a LateUsersDb cell, and prove the planted account authenticates through the installed cell while a wrong password is refused — the root-mount->login path end to end on a live (emulated) board."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "rustos-test-root-unlock-login-qemu-aarch64"
path = "src/main.rs"

[build-dependencies]
rustos-itest-harness = { path = "../harness", version = "=0.0.0" }
rustos-abi = { path = "../../../lib/abi", version = "=0.0.0" }
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["zeroize"] }

# The device-agnostic bring-up scaffolding (boot harness, DTB MMIO walk,
# GICv2 + EL1 IRQ wiring, static DMA pool, signed-`.rxe` load) lives in the
# shared support crate; this bin's own device tail drives the production
# interactive unlock policy, so it additionally names the kernel binary
# (for `root_mount`), `kernel/core` (the console seam + the set-once
# credential cell), `lib/users` (to authenticate the served database), and
# the shared whole-disk encrypted-root fixture (the passphrase + planted
# account both this tail and the host planter name). `rustos-kernel`
# (`Layer::Tooling`) is the one layer permitted to name `root_mount`
# (`AGENTS.md` §17.4); a test bin naming it is build/test glue, not a
# production layering violation.
[target.'cfg(all(target_arch = "aarch64", target_os = "none"))'.dependencies]
rustos-abi = { path = "../../../lib/abi", version = "=0.0.0" }
rustos-drv-storage-virtio-blk = { path = "../../../drivers/storage/virtio_blk", version = "=0.0.0" }
rustos-test-virtio-qemu-support = { path = "../virtio_qemu_support", version = "=0.0.0" }
rustos-kernel = { path = "../../../kernel/rustos-kernel", version = "=0.0.0" }
rustos-kernel-core = { path = "../../../kernel/core", version = "=0.0.0" }
rustos-users = { path = "../../../lib/users", version = "=0.0.0" }
rustos-test-encrypted-root-image = { path = "../encrypted_root_image", version = "=0.0.0" }
