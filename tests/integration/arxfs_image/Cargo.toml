[package]
name = "tairix-test-arxfs-image"
description = "Shared arxfs disk-image fixture for the end-to-end QEMU arxfs-over-virtio_blk vertical. The image is laid down by the real arxfs driver itself (format + plant), so the on-disk layout has exactly one source of truth. The host harness (xtask) plants the bytes returned by `build_image` on the backing disk; the freestanding guest tail mounts the same volume through the real arxfs driver and round-trips the planted file plus a fresh write."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[lib]
path = "src/lib.rs"

# The builder is `no_std` + `alloc` so it links into both the host build
# tool (`tools/xtask`, which plants the image) and the freestanding guest
# test tail (`tests/integration/virtio_qemu_support`, which knows the
# fixed file names and contents to verify). Unlike the hand-built FAT32
# fixture, the bytes come from the real arxfs driver formatting and
# planting an in-memory volume, so the fixture and the driver cannot drift. The
# round-trip unit tests re-mount the built image
# through the driver on the host.
[dependencies]
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
tairix-drv-fs-arxfs = { path = "../../../drivers/filesystem/arxfs", version = "=0.0.0" }
tairix-users = { path = "../../../lib/users", version = "=0.0.0" }
# The one definition of the time service's state-directory name, so the fixture
# authors it exactly where the service looks for it.
tairix-timesync = { path = "../../../lib/timesync", version = "=0.0.0" }

# The users-root round-trip test drives the kernel's boot-time
# users-database load (`tairix_kernel_core::users`) against the built
# image through the real driver, host-side.
[dev-dependencies]
tairix-kernel-core = { path = "../../../kernel/core", version = "=0.0.0" }
tairix-kernel-sec = { path = "../../../kernel/sec", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }
