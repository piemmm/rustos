[package]
name = "tairix-test-timed-qemu-aarch64"
description = "plans/TIMESYNC.md TS-2 QEMU integration test: boot the production aarch64 tairix-kernel pipeline (boot_aarch64::boot) on the virt board against the time-net-root disk (whose read-only /System store carries the kernel-signed virtio-net driver bundle and a planted network.conf binding the NIC by <iface>.match.node with a static IPv6 address, and whose encrypted root carries a planted system.conf naming the host peer as the one time server) with a virtio-net-device attached and the harness-side NTP-server peer on the QEMU dgram netdev. Proves the wall clock is established from the network end to end and that the anti-spoof gate holds while it happens: the peer answers each request twice, spoof first, so only a guest whose nonce gate drops the spoofed reply without ending the outstanding transaction lands on the fixture instant the serial witness requires."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "tairix-test-timed-qemu-aarch64"
path = "src/main.rs"

# Freestanding "boot the production aarch64 kernel pipeline against the
# time-net-root disk and prove the clock is set from a validated network sample"
# integration test. It reuses the entire production aarch64 boot pipeline
# through `tairix-kernel`'s library half (`boot_aarch64::boot`) unchanged. The
# guest does not self-exit on the clock being set; the harness drives the run to
# completion through the serial script, so there is no in-kernel QEMU-exit
# shortcut to leak into any production build (fail closed).
[target.'cfg(all(target_arch = "aarch64", target_os = "none"))'.dependencies]
tairix-arch-aarch64 = { path = "../../../kernel/arch/aarch64", version = "=0.0.0" }
tairix-kernel = { path = "../../../kernel/tairix-kernel", version = "=0.0.0" }
tairix-kernel-core = { path = "../../../kernel/core", version = "=0.0.0" }
tairix-kalloc = { path = "../../../lib/kalloc", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }
# The witness the guest exits on: the service's own `CLOCK_SET` event id, and
# the instant the harness-side peer reports, so neither can drift from it.
tairix-timesync = { path = "../../../lib/timesync", version = "=0.0.0" }
tairix-test-netstack-wire = { path = "../netstack_wire", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
