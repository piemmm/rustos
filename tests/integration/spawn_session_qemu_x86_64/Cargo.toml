[package]
name = "rustos-test-spawn-session-qemu-x86-64"
description = "plans/PI.md X3b QEMU integration test: boot the x86_64 rustos-kernel pipeline, spawn PID 1 init into ring 3, have init launch the embedded Shell session program through the spawn syscall, and prove both processes run concurrently under the live scheduler — the cross-port sibling of spawn-session-qemu-aarch64."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# This bin reuses the entire production x86_64 boot pipeline through
# `rustos-kernel`'s library half (`kernel/rustos-kernel/src/lib.rs`),
# including the `with_init` PID 1 spawn seam, the runtime `with_spawn`
# producer + embedded-program registry (`plans/PI.md` X3b), and the COM1
# console backing, and only replaces the audit Sink: observing two
# `ProcessSpawned` (EventId 4030 — PID 1 and the session) plus two audited
# `SyscallInvoked` (EventId 5000 — init's spawn and the session's exit) flips
# `qemu_exit::exit_success`, so the host-side `tools/qemu::Runner` registers
# the test as `Outcome::Pass`. This is the X3b concurrent-spawn proof; the
# full wait->reap->relaunch supervision cycle (3/4, like the aarch64 sibling)
# is not asserted yet because the relaunch spawn wild-executes (the X4
# follow-on defect — plans/PI.md §X).
# Keeping the bin separate from the production binary (rather than a Cargo
# feature) prevents feature unification from leaking the QEMU-exit behaviour
# into a production image (`AGENTS.md` §5.4.5 — fail closed).

[[bin]]
name = "rustos-test-spawn-session-qemu-x86-64"
path = "src/main.rs"

[target.'cfg(all(target_arch = "x86_64", target_os = "none"))'.dependencies]
rustos-arch-x86_64 = { path = "../../../kernel/arch/x86_64", version = "=0.0.0", features = ["sched-arch"] }
rustos-kernel = { path = "../../../kernel/rustos-kernel", version = "=0.0.0" }
rustos-log = { path = "../../../lib/log", version = "=0.0.0" }

[build-dependencies]
rustos-itest-harness = { path = "../harness", version = "=0.0.0" }
