[package]
name = "tairix-test-spawn-session-qemu-x86-64"
description = "plans/PI.md X3b + X4-follow-on QEMU integration test: boot the x86_64 tairix-kernel pipeline, spawn PID 1 init into ring 3, have init launch the embedded Shell session through the spawn syscall, and prove init runs the full wait->reap->relaunch supervision cycle under the live scheduler — the cross-port sibling of spawn-session-qemu-aarch64."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# This bin reuses the entire production x86_64 boot pipeline through
# `tairix-kernel`'s library half (`kernel/tairix-kernel/src/lib.rs`),
# including the `with_init` PID 1 spawn seam, the runtime `with_spawn`
# producer + embedded-program registry (`plans/PI.md` X3b), and the COM1
# console backing, and only replaces the audit Sink: observing three
# `ProcessSpawned` (EventId 4030 — PID 1, the session, and the relaunched
# session) plus four audited `SyscallInvoked` (EventId 5000 — init's spawn,
# the session's exit, init's wait, and init's relaunch spawn) flips
# `qemu_exit::exit_success`, so the host-side `tools/qemu::Runner` registers
# the test as `Outcome::Pass`. This proves the full wait->reap->relaunch
# supervision cycle on x86_64 (the X4 follow-on): it was raised from the
# earlier 2/2 X3b-only proof once the frame-allocator defect was fixed (the
# boot path now reserves the kernel image out of usable RAM, so the relaunch
# producer no longer corrupts the kernel — boot.rs build_memory_map,
# plans/PI.md §X).
# Keeping the bin separate from the production binary (rather than a Cargo
# feature) prevents feature unification from leaking the QEMU-exit behaviour
# into a production image (fail closed).

[[bin]]
name = "tairix-test-spawn-session-qemu-x86-64"
path = "src/main.rs"

[target.'cfg(all(target_arch = "x86_64", target_os = "none"))'.dependencies]
tairix-arch-x86_64 = { path = "../../../kernel/arch/x86_64", version = "=0.0.0", features = ["sched-arch"] }
tairix-kernel = { path = "../../../kernel/tairix-kernel", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
