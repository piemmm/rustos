[package]
name = "tairix-test-kernel-arch-boot-wasm32"
description = "Stage 3d browser-headless integration test: boot the wasm32 Arch HAL in a real browser, drive the requestAnimationFrame cooperative scheduler, and prove WASM-memory isolation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# The wasm32 analogue of the bare-metal `kernel_arch_boot_*` QEMU
# verticals. Built for `wasm32-unknown-unknown` it is a `cdylib`: the
# host loader (`kernel/arch/wasm32/web/tairix.js`) instantiates it,
# calls its boot export, and drives the cooperative scheduler through
# `requestAnimationFrame`. The browser harness (`web/harness.mjs`,
# launched by `cargo xtask test --wasm`) scrapes the console markers it
# prints and reports PASS/FAIL.
#
# On a host build it compiles to an inert empty `cdylib` (the
# `itest_wasm32` cfg is off), exactly as the bare-metal verticals are
# inert host stubs, so `cargo build --workspace` stays green.
[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

# The wasm32 port and the Arch HAL are linked only when building for the
# browser target; a host build has no dependencies and an empty body
# (`AGENTS.md` §2.2 — the `itest_wasm32` cfg, not a raw target predicate,
# selects the kernel body in source).
[target.'cfg(target_arch = "wasm32")'.dependencies]
tairix-arch-wasm32 = { path = "../../../kernel/arch/wasm32", version = "=0.0.0" }
tairix-arch-api = { path = "../../../kernel/arch/api", version = "=0.0.0" }
tairix-kernel-sched-mlfq = { path = "../../../kernel/sched/mlfq", version = "=0.0.0" }
tairix-kalloc = { path = "../../../lib/kalloc", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
