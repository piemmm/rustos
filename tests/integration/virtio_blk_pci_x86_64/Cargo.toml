[package]
name = "rustos-test-virtio-blk-pci-x86-64"
description = "Stage 4.D Item 4 QEMU integration test: boot the rustos-kernel pipeline, walk PCI to the modern virtio-blk-pci function, provision a PciTransport through the capability-gated KernelMmioMapper, route its MSI-X interrupt, mint a KernelVirtioHost over a carved per-device DMA pool, load the signed virtio-blk `.rxe`, then drive a real block round-trip (read sector 0, write+read-back sector 1) before signalling QEMU success."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# Stage 4.D Item 4 QEMU integration test (x86_64). The binary reuses the
# production boot pipeline from `rustos-kernel`'s library half and
# replaces only the audit sink so that, on observing
# `AuditEvent::BootCompleted` (`EventId(4004)`), it drives a real
# virtio-blk-pci device end-to-end and flips QEMU's `isa-debug-exit`
# device to success once every step has cleared.
#
# The signed `.rxe` manifest and the matching trust-anchor public key are
# generated at build time by `build.rs` so the integration test itself
# stays `no_std` + `no_main` and pulls in no host-only crypto crate.

[[bin]]
name = "rustos-test-virtio-blk-pci-x86-64"
path = "src/main.rs"

[build-dependencies]
rustos-abi = { path = "../../../lib/abi", version = "=0.0.0" }
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["zeroize"] }

[target.'cfg(all(target_arch = "x86_64", target_os = "none"))'.dependencies]
rustos-abi = { path = "../../../lib/abi", version = "=0.0.0" }
rustos-arch-x86_64 = { path = "../../../kernel/arch/x86_64", version = "=0.0.0", features = ["sched-arch"] }
rustos-caps = { path = "../../../lib/caps", version = "=0.0.0" }
rustos-crypto = { path = "../../../lib/crypto", version = "=0.0.0" }
rustos-drvhost = { path = "../../../userland/system/drvhost", version = "=0.0.0" }
rustos-kernel = { path = "../../../kernel/rustos-kernel", version = "=0.0.0" }
rustos-kernel-irq = { path = "../../../kernel/irq", version = "=0.0.0" }
rustos-kernel-mem = { path = "../../../kernel/mem", version = "=0.0.0", features = ["host-tests"] }
rustos-kernel-sec = { path = "../../../kernel/sec", version = "=0.0.0" }
rustos-log = { path = "../../../lib/log", version = "=0.0.0" }
rustos-drv-bus-pci = { path = "../../../drivers/bus/pci", version = "=0.0.0" }
rustos-drv-bus-virtio = { path = "../../../drivers/bus/virtio", version = "=0.0.0", features = ["kernel-host"] }
rustos-drv-storage-virtio-blk = { path = "../../../drivers/storage/virtio_blk", version = "=0.0.0" }
