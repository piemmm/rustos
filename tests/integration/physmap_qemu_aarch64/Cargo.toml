[package]
name = "tairix-test-physmap-qemu-aarch64"
description = "aarch64 direct-physical-map QEMU integration test: prove the kernel reaches every usable byte of RAM through a direct map that lies in the TTBR1_EL1 regime, and that a process root carries no mapping of RAM outside the kernel's own extents."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# The freestanding "boot with RAM above the kernel's own gigapage and prove
# the direct map reaches all of it from outside the user regime" integration
# test, the aarch64 sibling of `physmap_qemu_{riscv64,x86_64}`. It reuses the
# production boot pipeline through `tairix-kernel`'s library half and only
# replaces the sinks; the QEMU-exit shortcut lives in this dedicated bin so
# feature unification under `cargo build --workspace` can never leak it into a
# real image.

[[bin]]
name = "tairix-test-physmap-qemu-aarch64"
path = "src/main.rs"

[target.'cfg(all(target_arch = "aarch64", target_os = "none"))'.dependencies]
tairix-arch-api = { path = "../../../kernel/arch/api", version = "=0.0.0" }
tairix-arch-aarch64 = { path = "../../../kernel/arch/aarch64", version = "=0.0.0" }
tairix-kernel = { path = "../../../kernel/tairix-kernel", version = "=0.0.0" }
tairix-kernel-core = { path = "../../../kernel/core", version = "=0.0.0" }
tairix-kalloc = { path = "../../../lib/kalloc", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
