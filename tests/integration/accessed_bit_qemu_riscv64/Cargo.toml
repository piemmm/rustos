[package]
name = "tairix-test-accessed-bit-qemu-riscv64"
description = "QEMU integration test: the riscv64 software-managed Accessed bit (the cold-page referenced bit) is read and cleared through the Arch HAL, and an access to a cleared-A leaf raises a page fault the trap path resolves by setting A and retrying — driving the cold-page clock scan on emulated Svade (software A/D) hardware."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# This crate produces a freestanding kernel ELF that QEMU boots on the
# riscv64 `virt` board through OpenSBI (`tools/qemu`). It links the riscv64
# port (`tairix-arch-riscv64`) for boot + Sv39 paging + trap vectors +
# SiFive-Test finisher primitives, stands up an identity Sv39 address
# space, installs the trap vector + an unexpected-fault handler, maps a
# single 4 KiB supervisor page, and asserts that
# `tairix_arch_api::mmu::AddressSpace::test_and_clear_accessed` reports the
# software-managed Accessed bit honestly — set after a real access, clear
# after a clock-scan clear, and re-set on the next access via the
# A/D-setting page-fault path — so the compressed-memory tier's cold-page
# scanner (`plans/SWAPSWAPSWAP.md`, `kernel/mem::coldscan`) can tell a cold
# page from a hot one on real hardware. The riscv64 QEMU runner pins the
# CPU to `svade=true,svadu=false`, so the software A/D-setting fault path is
# genuinely exercised (not shadowed by a hardware A/D walk update).
#
# Because the binary is freestanding it is built **only** for
# `riscv64gc-unknown-none-elf`. On the host target the crate has no test
# source and contributes nothing to `cargo test`; the orchestrator that
# runs the QEMU binary is `cargo xtask test --qemu`.

[[bin]]
name = "tairix-test-accessed-bit-qemu-riscv64"
path = "src/main.rs"

[target.'cfg(all(target_arch = "riscv64", target_os = "none"))'.dependencies]
tairix-arch-riscv64 = { path = "../../../kernel/arch/riscv64", version = "=0.0.0" }
tairix-itest-finisher = { path = "../finisher", version = "=0.0.0" }
# The Arch HAL MMU surface (`AGENTS.md` §17.2): the test drives the
# referenced bit through `tairix_arch_api::mmu::AddressSpace`
# (`map_page` / `activate` / `access_tracking` / `test_and_clear_accessed`)
# so the property is proven *through the HAL*, not the port's inherent
# methods (`plans/WIRING.md` W5b).
tairix-arch-api = { path = "../../../kernel/arch/api", version = "=0.0.0" }
# `#[global_allocator]` backing (the riscv64 port names `alloc`).
tairix-kalloc = { path = "../../../lib/kalloc", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
