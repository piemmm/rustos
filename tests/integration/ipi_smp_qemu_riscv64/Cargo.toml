[package]
name = "tairix-test-ipi-smp-qemu-riscv64"
description = "Stage 3c QEMU integration test: multi-hart SMP bring-up — the boot hart starts a secondary hart via SBI HSM and delivers an inter-processor interrupt to it via the SBI IPI extension on the virt board."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# Freestanding "bring up a second hart and deliver an IPI to it"
# integration test — the riscv64 multi-hart SMP deliverable of Stage 3
# (`PLAN.md` Stage 3). It links only the `tairix-arch-riscv64` port: the
# boot hart starts hart 1 through `smp::start_secondary` (SBI HSM
# `hart_start`), hart 1 enables supervisor software interrupts and
# signals ready, the boot hart sends a directed IPI through
# `RiscvArch::send_ipi` (SBI IPI extension), and the test passes once
# hart 1's `sip.SSIP` trap path has run the IPI callback. Keeping the
# QEMU-exit shortcut in a dedicated bin (not a Cargo feature on the arch
# crate) prevents feature unification from leaking it into any production
# build (fail closed).

[[bin]]
name = "tairix-test-ipi-smp-qemu-riscv64"
path = "src/main.rs"

[target.'cfg(all(target_arch = "riscv64", target_os = "none"))'.dependencies]
tairix-arch-riscv64 = { path = "../../../kernel/arch/riscv64", version = "=0.0.0" }
tairix-itest-finisher = { path = "../finisher", version = "=0.0.0" }
tairix-arch-api = { path = "../../../kernel/arch/api", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
