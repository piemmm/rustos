[package]
name = "rustos-test-rustfs-image"
description = "Shared rustfs disk-image fixture for the end-to-end QEMU rustfs-over-virtio_blk vertical. The image is laid down by the real rustfs driver itself (format + plant), so the on-disk layout has exactly one source of truth (AGENTS.md §2.2). The host harness (xtask) plants the bytes returned by `build_image` on the backing disk; the freestanding guest tail mounts the same volume through the real rustfs driver and round-trips the planted file plus a fresh write."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[lib]
path = "src/lib.rs"

# The builder is `no_std` + `alloc` so it links into both the host build
# tool (`tools/xtask`, which plants the image) and the freestanding guest
# test tail (`tests/integration/virtio_qemu_support`, which knows the
# fixed file names and contents to verify). Unlike the hand-built FAT32
# fixture, the bytes come from the real rustfs driver formatting and
# planting an in-memory volume, so the fixture and the driver cannot drift
# (`AGENTS.md` §2.2). The round-trip unit tests re-mount the built image
# through the driver on the host.
[dependencies]
rustos-abi = { path = "../../../lib/abi", version = "=0.0.0" }
rustos-drv-fs-rustfs = { path = "../../../drivers/filesystem/rustfs", version = "=0.0.0" }
