[package]
name = "tairix-test-riscv64-boot"
description = "Test-side boot wrapper for the riscv64 QEMU verticals: it re-exports the production riscv64 boot pipeline (tairix_kernel::riscv64::boot — RiscvBinArch, BootError, try_boot) and adds the set-once device-bring-up observers (memory map + DTB) and the IrqController bridge over the arch port's PLIC register driver. The single riscv64 boot orchestration lives in tairix-kernel; this crate only publishes for the virtio/framebuffer observers and delegates. Tooling: it relaxes the layering, keeping those edges out of the arch port."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[lib]
path = "src/lib.rs"

# Freestanding (`virt`-board) only: the boot wrapper delegates to the
# production riscv64 boot pipeline in `tairix-kernel` (so there is one
# riscv64 boot orchestration) and publishes the
# firmware map + DTB for the device-bring-up observers. Gated to the
# bare-metal target because `boot_riscv64` links the arch port's
# freestanding-only `halt_current_hart` / SBI console.
[target.'cfg(all(target_arch = "riscv64", target_os = "none"))'.dependencies]
# The single riscv64 boot pipeline (`boot_riscv64`) this crate re-exports
# and delegates to.
tairix-kernel = { path = "../../../kernel/tairix-kernel", version = "=0.0.0" }
# `publish` clones + serves the firmware `BootMemoryMap` through a
# set-once slot for the device-bring-up observers.
tairix-kernel-mem = { path = "../../../kernel/mem", version = "=0.0.0" }
# The `FreeListAllocator` type the consuming vertical's own
# `#[global_allocator]` is handed through to the production pipeline.
tairix-kalloc = { path = "../../../lib/kalloc", version = "=0.0.0" }
tairix-sync = { path = "../../../lib/sync", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }

[build-dependencies]
tairix-itest-harness = { path = "../harness", version = "=0.0.0" }
