[package]
name = "rustos-kernel-mem"
description = "RustOS kernel memory subsystem: frame allocator, per-process virtual memory, slab allocator with guard pages, zero-on-free sensitive regions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# `host-tests` exposes the in-memory `HostPageTable` test double to
# downstream crates' unit and integration tests. The feature must not
# be enabled in production kernel builds — it adds the test double's
# `BTreeMap` storage to the address-space machinery and serves no
# purpose outside cargo-test. Per `AGENTS.md` §2.3 the feature flag
# exists rather than a duplicate definition in every consumer crate.
host-tests = []

[dependencies]
# Stage 2.1 — the only kernel/* crate `kernel/mem` is permitted to depend on.
rustos-sync = { path = "../../lib/sync", version = "=0.0.0" }

# Sensitive-region zero-on-free is delegated to the audited `zeroize` crate
# per AGENTS.md §1 ("no hand-rolled crypto", §6 "audited crypto"). The
# `derive` feature is intentionally omitted: we use the `Zeroize` trait
# directly on byte buffers, no macro magic.
zeroize = { version = "1.8.1", default-features = false }

# `loom` is pulled in only when the consumer opts in with
# `RUSTFLAGS="--cfg loom" cargo test ...`. Mirrors the convention
# established in `kernel/sync/Cargo.toml`.
[target.'cfg(loom)'.dependencies]
loom = "0.7"

[dev-dependencies]
proptest = { version = "=1.5.0", default-features = false, features = ["std"] }
