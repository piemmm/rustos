[package]
name = "tairix-arch-aarch64"
description = "TAIRiX architecture port: aarch64 (Arch HAL implementation + QEMU virt-board boot / generic-timer / GIC primitives)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Lockup-watchdog debug diagnostics: gates this port's pre-silence
# call-stack capture (`capture_sample_backtrace` and its fault-proof
# `AT S1E1R` mapping probe). Off by default so a shippable kernel never
# compiles the stack walk in; `tools/xtask` enables it (through the
# `tairix-kernel` feature of the same name) for the non-shippable `debug`
# image only. The always-on sample (`pc`/`pstate`) and the D12 GICv2
# completion fix are independent of this and never gated. See
# `plans/WATCHDOG.md`.
watchdog-diagnostics = []

[lib]
path = "src/lib.rs"

# Like `kernel/arch/x86_64` and `kernel/arch/riscv64`, this crate is a
# pure Arch HAL implementation: it names only
# the Arch HAL (`kernel/arch/api`) and `lib/*`, never a concrete kernel
# subsystem. `Aarch64Arch` implements `tairix_arch_api::SchedulerArch`;
# the downstream boot consumer wraps it in its own `KernelArch` type.
#
# The boot / console / panic / exception / timer / GIC modules are gated
# to `cfg(all(target_arch = "aarch64", target_os = "none"))`; the pure
# bit/encoding/layout helpers (paging, context `prepare`, syscall arg
# marshalling, the generic-timer interval math, the semihosting finisher
# encoding, the `Aarch64Arch` struct) build on the host so their unit
# tests run under `cargo test`.
[dependencies]
tairix-arch-api = { path = "../api", version = "=0.0.0" }
tairix-rng = { path = "../../../lib/rng", version = "=0.0.0" }
# `tairix-abi` provides the frozen `SYSCALL_MAX_ARGS = 6` constant the
# `svc` entry path marshals user arguments into — the same dependency
# the x86_64 and riscv64 ports take. It is a `lib/*` crate, so the layering
# permits this edge.
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The flattened-device-tree parser is architecture-neutral and shared; this
# port builds its `fdt`/`platform` discovery on it.
tairix-fdt = { path = "../../../lib/fdt", version = "=0.0.0" }
# The shared, architecture-neutral framebuffer text-console engine: the full
# ANSI/VT/xterm-256color
# terminal (`Geometry`/`TextConsole`/`DirtyBand`, palette, glyph blit,
# scroll) lives here so every arch port renders through one definition;
# this port supplies only the board-specific surface discovery below. It is
# allocator-free, so the freestanding QEMU test bins link it with no global
# allocator.
tairix-fbcon = { path = "../../../lib/fbcon", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }
# The shared console-output engine: whole-line framing, ordering, severity
# shedding, accounted loss reporting and the one bounded drain live there, so
# every port shares one definition and this port supplies only its device
# registers. Allocator-free, so the freestanding QEMU test bins link it with no
# global allocator.
tairix-conout = { path = "../../../lib/conout", version = "=0.0.0" }
# The one interrupt-safe lock discipline, which this port's `DAIF` masking
# primitive plugs into. Needs only `core`, so the freestanding boot binaries
# here still link no global allocator.
tairix-sync = { path = "../../../lib/sync", version = "=0.0.0" }
# The shared VideoCore firmware mailbox protocol:
# the framebuffer boot console's display probe + surface allocation,
# also spoken by drivers/display/rpi_hvs.
tairix-vcmailbox = { path = "../../../lib/vcmailbox", version = "=0.0.0" }
# The shared QEMU fw_cfg DMA client: the framebuffer
# boot console's `virt`-board ramfb fallback programs the scan-out
# through it, the same protocol definition the display verticals use.
tairix-fwcfg = { path = "../../../lib/fwcfg", version = "=0.0.0" }

[dev-dependencies]
# Enable the shared DTB builder for this port's `fdt`/`platform` host
# tests (off in production builds — `[dev-dependencies]` only).
tairix-fdt = { path = "../../../lib/fdt", version = "=0.0.0", features = ["test-fixtures"] }
# The protocol-faithful mock firmware for the video boot-console host
# tests (QEMU does not model the VideoCore).
tairix-vcmailbox = { path = "../../../lib/vcmailbox", version = "=0.0.0", features = [
    "mock-firmware",
] }
