[package]
name = "rustos-arch-aarch64"
description = "RustOS architecture port: aarch64 (Arch HAL implementation + QEMU virt-board boot / generic-timer / GIC primitives)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

# Like `kernel/arch/x86_64` and `kernel/arch/riscv64`, this crate is a
# pure Arch HAL implementation (`AGENTS.md` §17.2 / §17.4): it names only
# the Arch HAL (`kernel/arch/api`) and `lib/*`, never a concrete kernel
# subsystem. `Aarch64Arch` implements `rustos_arch_api::SchedulerArch`;
# the downstream boot consumer wraps it in its own `KernelArch` type.
#
# The boot / console / panic / exception / timer / GIC modules are gated
# to `cfg(all(target_arch = "aarch64", target_os = "none"))`; the pure
# bit/encoding/layout helpers (paging, context `prepare`, syscall arg
# marshalling, the generic-timer interval math, the semihosting finisher
# encoding, the `Aarch64Arch` struct) build on the host so their unit
# tests run under `cargo test`.
[dependencies]
rustos-arch-api = { path = "../api", version = "=0.0.0" }
# `rustos-abi` provides the frozen `SYSCALL_MAX_ARGS = 6` constant the
# `svc` entry path marshals user arguments into — the same dependency
# the x86_64 and riscv64 ports take. It is a `lib/*` crate, so this edge
# is permitted by `AGENTS.md` §17.4.
rustos-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The flattened-device-tree parser is architecture-neutral and shared
# (`AGENTS.md` §2.2); this port builds its `fdt`/`platform` discovery on it.
rustos-fdt = { path = "../../../lib/fdt", version = "=0.0.0" }
# The shared 5×7 monospace glyph atlas the framebuffer boot console
# renders with — one font definition across the desktop and the boot
# console (`AGENTS.md` §2.2). Atlas-only (`default-features = false`):
# the boot console blits into device-coherent memory itself, and the
# minimal QEMU test bins link no global allocator.
rustos-font = { path = "../../../lib/font", version = "=0.0.0", default-features = false }
rustos-log = { path = "../../../lib/log", version = "=0.0.0" }
# The shared VideoCore firmware mailbox protocol (`AGENTS.md` §2.2):
# the framebuffer boot console's display probe + surface allocation,
# also spoken by drivers/display/rpi_hvs.
rustos-vcmailbox = { path = "../../../lib/vcmailbox", version = "=0.0.0" }

[dev-dependencies]
# Enable the shared DTB builder for this port's `fdt`/`platform` host
# tests (off in production builds — `[dev-dependencies]` only).
rustos-fdt = { path = "../../../lib/fdt", version = "=0.0.0", features = ["test-fixtures"] }
# The protocol-faithful mock firmware for the video boot-console host
# tests (QEMU does not model the VideoCore, `AGENTS.md` §2.1).
rustos-vcmailbox = { path = "../../../lib/vcmailbox", version = "=0.0.0", features = [
    "mock-firmware",
] }
