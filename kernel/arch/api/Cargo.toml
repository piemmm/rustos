[package]
name = "tairix-arch-api"
description = "TAIRiX Arch HAL: the closed trait surface every architecture port implements and the rest of the kernel consumes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

# The Arch HAL is the boundary between the architecture-neutral
# kernel and the per-target ports. It is deliberately `no_std` and names
# no kernel-subsystem dependency: the layering permits `kernel/arch/api`
# to name `lib/*` only, so the ports that implement it (and the kernel
# crates that consume it) never acquire a transitive edge to a concrete
# kernel crate through the HAL.
#
# - `tairix-abi` is a `lib/*` crate (no_std, dependency-free, no
#   allocator). It is named here so the `PlatformDiscovery` slice
#   can speak in the single hardware-tree ABI (`tairix_abi::hwtree`) rather
#   than re-defining the node types. The layering permits the edge
#   `kernel/arch/api -> lib/abi`, and it pulls no kernel dependency or
#   `#[global_allocator]` in.
#
# - `tairix-rng` is a `lib/*` crate (no_std, audited-crypto-backed). It is
#   named here so the `entropy` slice can speak in
#   the single `EntropySource`/`HardwareRng` seam every entropy consumer
#   shares rather than re-defining the trait. The layering permits the edge
#   `kernel/arch/api -> lib/rng`.
#
# - `tairix-memguard` is a `lib/*` crate (no_std, `forbid(unsafe_code)`).
#   It is named here so the boot-stack guard is judged by the same sentinel
#   and canary window every other guarded region in the kernel uses, rather
#   than a second poison definition that could drift from the slab's and the
#   kthread stack's. The layering permits the edge
#   `kernel/arch/api -> lib/memguard`.
#
# - `tairix-sync` is a `lib/*` crate (no_std). It is named here so the
#   guarded-copy slot holds its published routine in the shared `FnCell`
#   every port's callback seam uses, rather than re-deriving the
#   provenance-discarding `usize` round trip the cell exists to remove.
#   The layering permits the edge `kernel/arch/api -> lib/sync`.
[features]
# `host-tests` exposes `KernelWindow::from_root` to downstream crates'
# tests: a window whose pages a port established can only be described by
# minting a pointer from an address, which no interpreter can follow, so a
# host test roots its window in memory it owns instead. The feature must
# not be enabled in production kernel builds — a port always reserves its
# window, never borrows one.
host-tests = []

[dependencies]
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
tairix-memguard = { path = "../../../lib/memguard", version = "=0.0.0" }
tairix-rng = { path = "../../../lib/rng", version = "=0.0.0" }
tairix-sync = { path = "../../../lib/sync", version = "=0.0.0" }
# The device-tree reader and its bus-aware `reg` decoder: the generic
# FDT->hardware-tree walk every FDT-based port shares lives here
# (`fdtwalk`), so the ports contribute only their interrupt specifier and
# their board augmentation rather than a copy of the walk each.
tairix-fdt = { path = "../../../lib/fdt", version = "=0.0.0" }

# The stack-unwinder fuzz harness (`tests/fuzz_backtrace.rs`) drives
# `backtrace::walk` over adversarial frame chains. It uses
# the shared per-run seed/budget seam so `cargo xtask fuzz` can extend the
# loop to a wall-clock budget; dev-only, never shipped.
[dev-dependencies]
tairix-fuzzseed = { path = "../../../tests/fuzzseed", version = "=0.0.0" }
# The `fdtwalk` tests build their trees with the shared device-tree fixture
# builder rather than a hand-rolled blob writer.
tairix-fdt = { path = "../../../lib/fdt", version = "=0.0.0", features = [
    "test-fixtures",
] }
