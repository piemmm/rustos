[package]
name = "tairix-arch-api"
description = "TAIRiX Arch HAL: the closed trait surface every architecture port implements and the rest of the kernel consumes (AGENTS.md §17.2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

# The Arch HAL is the §17.4 boundary between the architecture-neutral
# kernel and the per-target ports. It is deliberately `no_std` and names
# no kernel-subsystem dependency: §17.4 permits `kernel/arch/api` to
# name `lib/*` only, so the ports that implement it (and the kernel
# crates that consume it) never acquire a transitive edge to a concrete
# kernel crate through the HAL.
#
# - `tairix-abi` is a `lib/*` crate (no_std, dependency-free, no
#   allocator). It is named here so the `PlatformDiscovery` slice
#   (`AGENTS.md` §17.2 / §18.1) can speak in the single hardware-tree
#   ABI (`tairix_abi::hwtree`) rather than re-defining the node types
#   (§2.2). The edge `kernel/arch/api -> lib/abi` is permitted by §17.4
#   and pulls no kernel dependency or `#[global_allocator]` in.
#
# - `tairix-rng` is a `lib/*` crate (no_std, audited-crypto-backed). It is
#   named here so the `entropy` slice (`AGENTS.md` §17.2 / §22) can speak in
#   the single `EntropySource`/`HardwareRng` seam every entropy consumer
#   shares (§2.2) rather than re-defining the trait. The edge
#   `kernel/arch/api -> lib/rng` is permitted by §17.4.
[dependencies]
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
tairix-rng = { path = "../../../lib/rng", version = "=0.0.0" }

# The stack-unwinder fuzz harness (`tests/fuzz_backtrace.rs`, AGENTS.md
# §19.6) drives `backtrace::walk` over adversarial frame chains. It uses
# the shared per-run seed/budget seam so `cargo xtask fuzz` can extend the
# loop to a wall-clock budget; dev-only, never shipped.
[dev-dependencies]
tairix-fuzzseed = { path = "../../../tests/fuzzseed", version = "=0.0.0" }
