[package]
name = "rustos-arch-x86_64"
description = "RustOS architecture port: x86_64 (Stage 3a — partial, scoped to Stage-2 QEMU integration tests)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

# Production dependencies.
#
# - `rustos-abi` provides the frozen `SYSCALL_MAX_ARGS = 6` constant
#   consumed by `syscall_entry.rs`. Re-declaring it locally would
#   violate AGENTS.md §2.2 (no duplication) and §9 (one ABI source of
#   truth).
# - `rustos-arch-api` is the Arch HAL (`AGENTS.md` §17.2). It provides
#   the `SchedulerArch` / `CpuId` trait surface that `kernel_arch.rs`
#   implements for [`X86_64Arch`]. §17.4 lets an architecture port
#   name `kernel/arch/api` and `lib/*` only; naming the HAL here —
#   rather than the concrete `kernel/sched` crate — is exactly what
#   keeps this port off a concrete kernel subsystem. The HAL crate is
#   `no_std` and dependency-free, so depending on it pulls **no**
#   `#[global_allocator]` requirement into the arch crate.
#
# The `kernel/core::KernelArch` super-trait (`SchedulerArch + halt()`)
# is **not** implemented inside the arch crate — pulling
# `rustos-kernel-core` would transitively drag in `kernel/mem`,
# `kernel/sec`, `kernel/ipc`, all of which use `extern crate alloc`
# and would force the existing freestanding test bins to ship a
# `#[global_allocator]` they do not currently need. Instead, the arch
# crate exports a free `halt() -> !` function on this side of the
# boundary and the downstream `rustos-kernel` bin crate brings the
# allocator, implements `KernelArch` for `X86_64Arch`, and wires both
# halves together. AGENTS.md §3 / §6 / §17.4 — drivers, kernel/mem,
# kernel/sec, kernel/ipc remain forbidden as arch-crate deps.
[features]
# `sched-arch` opts the crate into compiling the `kernel_arch` module
# (the [`X86_64Arch`] `SchedulerArch` impl) and pulls the Arch HAL
# `rustos-arch-api` into the dependency graph. It stays optional so a
# freestanding consumer that does not need the arch handle (e.g.
# `tests/integration/memory_isolation`, which exercises page-table
# isolation, not scheduling) compiles neither the module nor the dep.
# AGENTS.md §2.3 (no bloat) — pay only for what you use.
default = []
sched-arch = ["dep:rustos-arch-api"]

[dependencies]
rustos-abi = { path = "../../../lib/abi", version = "=0.0.0" }
rustos-arch-api = { path = "../api", version = "=0.0.0", optional = true }

# `kernel/mem` is a **dev-dependency** so the host-side unit tests can
# round-trip our `bootmemory::RegionKind` mirror against the canonical
# `rustos_kernel_mem::RegionKind` and refuse to compile if the two
# enums ever drift (AGENTS.md §2.2 — no duplication).
#
# The crate self-references with `sched-arch` so `cargo test` always
# exercises the (c7-arch) `kernel_arch` module — mirrors the
# `test-arch` self-link convention used by `kernel/sched` and
# `kernel/core`.
[dev-dependencies]
rustos-kernel-mem = { path = "../../mem", version = "=0.0.0" }
rustos-arch-x86_64 = { path = ".", version = "=0.0.0", features = ["sched-arch"] }

# This crate is the **partial** Stage 3a baseline. It exists so the two
# Stage-2 deliverable integration tests in `tests/integration/*` have an
# x86_64 boot path: multiboot1 entry, 32→64 trampoline, identity-mapped
# bootstrap paging, a minimal IDT (#PF, #GP, #DF, double fault), a 16550
# serial console, and the QEMU `isa-debug-exit` helper.
#
# The full Stage 3a deliverables (UEFI, ACPI, APIC, SMP/AP bring-up,
# context switch, syscall entry) are explicitly out of scope here and
# tracked in `PLAN.md`'s Stage 3a sub-checklist. The crate compiles only
# for `x86_64-unknown-none`; using it from a host-target build is a
# compile error by design (see `src/lib.rs`).
