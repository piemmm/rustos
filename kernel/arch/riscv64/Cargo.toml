[package]
name = "tairix-arch-riscv64"
description = "TAIRiX architecture port: riscv64 (Arch HAL implementation + virt-board external-IRQ / boot primitives)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
# TEST-ONLY: opt-in surface for test harnesses that link this crate as a
# non-`cfg(test)` target binary (the in-progress crt0 QEMU round-trip
# vertical). It gates temporary test-support scaffolding such as
# `AddressSpace::map_gigapage` so that code is never compiled into a
# production kernel image. Off by default; production builds must not set it.
test-harness = []

# Like `kernel/arch/x86_64`, this crate is a pure Arch HAL
# implementation (`AGENTS.md` §17.2 / §17.4): it names only the Arch
# HAL (`kernel/arch/api`) and `lib/*`, never a concrete kernel
# subsystem. `RiscvArch` implements `tairix_arch_api::SchedulerArch`;
# the `kernel/core::KernelArch` wrapper, the `BootInfo` assembly, the
# set-once boot-state slots, and the `IrqController` bridge over
# `plic::PlicController` all live in the downstream boot consumer
# (`tests/integration/riscv64_boot`), so this crate acquires no edge to
# `kernel/{core,mem,sec,irq}` or `kernel/sched/api`.
#
# The boot/SBI/serial/entry/panic modules are gated to
# `cfg(all(target_arch = "riscv64", target_os = "none"))`; the FDT
# parser, the `RiscvArch` struct, and the PLIC register driver build on
# the host so their unit tests run under `cargo test`.
[dependencies]
tairix-arch-api = { path = "../api", version = "=0.0.0" }
tairix-rng = { path = "../../../lib/rng", version = "=0.0.0" }
# `tairix-abi` provides the frozen `SYSCALL_MAX_ARGS = 6` constant the
# ecall entry path marshals user arguments into — the same dependency
# `kernel/arch/x86_64` takes for its `syscall`/`sysret` stub. It is a
# `lib/*` crate, so this edge is permitted by `AGENTS.md` §17.4.
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The flattened-device-tree parser is architecture-neutral and shared
# (`AGENTS.md` §2.2); this port builds its `platform` discovery on it.
tairix-fdt = { path = "../../../lib/fdt", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }
# The shared console-output engine: whole-line framing, ordering, severity
# shedding and accounted loss reporting live there, so every port shares one
# definition and this port supplies only its firmware console call.
# Allocator-free, so the freestanding test bins link it with no global
# allocator.
tairix-conout = { path = "../../../lib/conout", version = "=0.0.0" }
# The one interrupt-safe lock discipline, which this port's `sstatus.SIE`
# masking primitive plugs into. Needs only `core`, so the freestanding
# binaries here still link no global allocator.
tairix-sync = { path = "../../../lib/sync", version = "=0.0.0" }

[dev-dependencies]
# Enable the shared DTB builder for this port's `fdt`/`platform` host
# tests (off in production builds — `[dev-dependencies]` only).
tairix-fdt = { path = "../../../lib/fdt", version = "=0.0.0", features = ["test-fixtures"] }
