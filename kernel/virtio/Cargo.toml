[package]
name = "tairix-kernel-virtio"
description = "TAIRiX architecture-neutral kernel-side virtio wiring (Stage 4.D Item 4): the per-driver KernelVirtioHost factory and the ring-0 virtio-PCI / virtio-MMIO transport-provisioning walks, shared by every architecture's boot pipeline."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# Architecture-neutral kernel virtio facilities extracted out of the
# x86_64-only `tairix-kernel` binary crate so that every architecture's
# boot pipeline — x86_64 (PCI) and riscv64 / aarch64 (`virt`-board MMIO)
# — provisions a transport and mints a per-driver DMA host through the
# *same* code (no duplication, shared code).
# This crate names no `kernel/arch/*` port, so it builds for every
# Tier-1 freestanding target.
[dependencies]
tairix-abi = { path = "../../lib/abi", version = "=0.0.0" }
tairix-caps = { path = "../../lib/caps", version = "=0.0.0" }
# The bus-agnostic virtio protocol (Transport, SplitQueue, DmaSlab,
# VirtioHost), the `PciTransportWindows` transport-construction seam the
# provisioning walks assemble, and the `VirtioHostFactory` host seam that
# `KernelVirtioFactory` implements. The walks are generic over a
# caller-supplied transport builder, so this crate names only `lib/*`
# types and never the `drivers/bus/virtio` concrete transports
# (`kernel/* → lib/*`, never a driver). Both the
# userland `drvhost` and this kernel crate depend on this seam instead
# of on each other, so there is no `kernel/virtio -> userland/drvhost`
# edge either. The kernel-side host (`kernel_host` / `kernel_mmio`)
# implements its seams against `kernel/{mem,sec,irq}`; it used to live in
# `drivers/bus/virtio`, but a driver crate may not depend on `kernel/*`, so the
# kernel-linking host moved here.
tairix-virtio = { path = "../../lib/virtio", version = "=0.0.0" }
tairix-kernel-irq = { path = "../irq", version = "=0.0.0" }
tairix-kernel-mem = { path = "../mem", version = "=0.0.0" }
tairix-kernel-sec = { path = "../sec", version = "=0.0.0" }
tairix-log = { path = "../../lib/log", version = "=0.0.0" }
# Synchronisation primitives: the `SpinLock` that makes `KernelVirtioHost`
# `Sync` so a `&'static` host can back a disk shared (behind the
# block-sharing layer's own lock) by more than one task (uncontended on the hot
# path).
tairix-sync = { path = "../../lib/sync", version = "=0.0.0" }

[dev-dependencies]
# The factory unit tests drive a real `DmaPool` through `kernel/mem`'s
# in-memory `HostPageTable` / `SimPhysMap` test doubles, gated behind the
# `host-tests` feature so production builds never link them
# (mirrors `tairix-kernel`).
tairix-kernel-mem = { path = "../mem", version = "=0.0.0", features = ["host-tests"] }
