[package]
name = "rustos-kernel-sec"
description = "RustOS kernel security state: identity tables, per-task capability tables, manifest verification, audit log writer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Stage 2.4 dependency rules (issue brief): kernel/sec may depend only on
# kernel/sync, kernel/mem, and the shared lib/* crates `abi`, `caps`,
# `crypto`, `log`, and `util`. `kernel/mem` is pulled in at Stage 4.D
# (DMA capability gate, AGENTS.md §4) to wrap the per-process DMA pool
# in a `CapabilityId::MEM_DMA` check that emits a structured audit
# record on every grant or denial.
rustos-abi = { path = "../../lib/abi", version = "=0.0.0" }
rustos-caps = { path = "../../lib/caps", version = "=0.0.0" }
rustos-crypto = { path = "../../lib/crypto", version = "=0.0.0" }
rustos-kernel-mem = { path = "../mem", version = "=0.0.0" }
rustos-log = { path = "../../lib/log", version = "=0.0.0" }
rustos-util = { path = "../../lib/util", version = "=0.0.0" }

[dev-dependencies]
# Tests need to sign manifests and tokens with real Ed25519 keys. The
# signing path lives outside the kernel — production callers only verify.
# Matching the pinned version already audited by `lib/caps`/`lib/crypto`.
ed25519-dalek = { version = "=2.1.1", default-features = false }
proptest = { version = "=1.5.0", default-features = false, features = ["std"] }
# The capability-gated DMA tests in `dma::tests` exercise the
# `kernel/mem` allocator end-to-end through its `HostPageTable` test
# double, which is gated behind the `host-tests` feature so production
# builds do not link it (`AGENTS.md` §2.3).
rustos-kernel-mem = { path = "../mem", version = "=0.0.0", features = ["host-tests"] }
