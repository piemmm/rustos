[package]
name = "rustos-kernel-ipc"
description = "RustOS kernel IPC: capability-checked message ports, shared memory, and asynchronous notifications."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Stage 2.5 dependency rules (issue brief): kernel/ipc may depend only on
# kernel/{sync, mem, sched, sec} and lib/{abi, caps, log} (plus `lib/util`
# for the formatters extracted out of `kernel/sec` in this same stage,
# `AGENTS.md` §2.2). Nothing more is needed.
rustos-kernel-sync = { path = "../sync", version = "=0.0.0" }
rustos-kernel-mem = { path = "../mem", version = "=0.0.0" }
rustos-kernel-sec = { path = "../sec", version = "=0.0.0" }
rustos-abi = { path = "../../lib/abi", version = "=0.0.0" }
rustos-caps = { path = "../../lib/caps", version = "=0.0.0" }
rustos-log = { path = "../../lib/log", version = "=0.0.0" }
rustos-util = { path = "../../lib/util", version = "=0.0.0" }

# Loom is only pulled in when the caller opts in with
# `RUSTFLAGS="--cfg loom" cargo test ...`. Mirrors `kernel/sync` and
# `kernel/sched`.
[target.'cfg(loom)'.dependencies]
loom = "0.7"
