[package]
name = "rustos-kernel"
description = "RustOS microkernel binary (Stage 3a (c7-bin)): wires the x86_64 architecture port to the architecture-neutral kernel/core entry point."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# The crate is a hybrid `[lib]` + `[[bin]]`:
#
# * The library half (`src/lib.rs`) carries the architecture-neutral
#   boot pipeline: bump allocator type, the [`BinArch`] wrapper that
#   implements `rustos_kernel_core::KernelArch` over
#   `rustos_arch_x86_64::kernel_arch::X86_64Arch`, the fail-closed
#   syscall-dispatch callback, the Multiboot2 → ACPI/MADT →
#   `BootMemoryMap` plumbing, and the `boot` entry point that builds a
#   `kernel_core::BootInfo` and hands it to `kernel_core::kernel_main`.
#   This half is `no_std` and is consumed by both the production bin
#   below and the QEMU integration test
#   (`tests/integration/kernel_arch_boot`).
#
# * The binary half (`src/main.rs`) is the freestanding production
#   kernel for `x86_64-unknown-none`. It owns the `#[global_allocator]`
#   static, the `#[panic_handler]`, the production COM1-backed log/audit
#   sinks, and the `extern "C" fn kernel_main(multiboot_info: u64)`
#   symbol the arch crate's boot stub calls. The integration test
#   crate brings its own copies of all four so that the audit sink can
#   observe `AuditEvent::BootCompleted` and exit QEMU successfully
#   without leaking that behaviour into the production binary
#   (`AGENTS.md` §5.4.5 — fail closed, no harness-driven shortcuts in
#   production).
#
# Pulling the boot pipeline into the library half is the only way to
# satisfy `AGENTS.md` §2.2 (no duplication) without exposing the audit
# sink through a Cargo feature, which would risk feature-unification
# leaking the QEMU-exit behaviour into the production bin during a
# `cargo build --workspace`.
[lib]
path = "src/lib.rs"

[[bin]]
name = "rustos-kernel"
path = "src/main.rs"

[dependencies]
rustos-abi = { path = "../../lib/abi", version = "=0.0.0" }
# The boot-heap bump allocator lives in `lib/bumpalloc` so the
# production bin, the QEMU integration test bins, and the architecture
# ports' boot harnesses all register the identical implementation
# (`AGENTS.md` §2.2 — no duplication, §6 — shared code lives in `lib/`).
# The `bumpalloc` module re-exports it under the historical path.
rustos-bumpalloc = { path = "../../lib/bumpalloc", version = "=0.0.0" }
rustos-caps = { path = "../../lib/caps", version = "=0.0.0" }
# The `virtio_boot` wiring config names `Ed25519PublicKey` for the
# driver-host trust-anchor list (`drvhost::HostConfig::trusted_signers`).
rustos-crypto = { path = "../../lib/crypto", version = "=0.0.0" }
# The deterministic node ↔ bind-table match policy (`AGENTS.md` §18.3),
# shared with the user-space `devmgr` (`AGENTS.md` §2.2 / §17.4): the
# in-kernel `driver_catalog` resolves a discovered hardware node against
# the chain drivers' bind tables through the one definition.
rustos-devmatch = { path = "../../lib/devmatch", version = "=0.0.0" }
rustos-log = { path = "../../lib/log", version = "=0.0.0" }
rustos-kernel-core = { path = "../core", version = "=0.0.0" }
rustos-kernel-irq = { path = "../irq", version = "=0.0.0" }
rustos-kernel-mem = { path = "../mem", version = "=0.0.0" }
rustos-kernel-sec = { path = "../sec", version = "=0.0.0" }
rustos-kernel-sched-api = { path = "../sched/api", version = "=0.0.0" }
rustos-sync = { path = "../../lib/sync", version = "=0.0.0" }
rustos-kernel-syscall = { path = "../syscall", version = "=0.0.0" }
# The architecture-neutral virtio factory + provisioning walks (shared
# with the riscv64 / aarch64 `virt`-board MMIO verticals) live here so
# no architecture port duplicates them (`AGENTS.md` §2.2).
rustos-kernel-virtio = { path = "../virtio", version = "=0.0.0" }
# The Arch HAL surface (`AGENTS.md` §17.2): the kernel binary names
# `rustos_arch_api::IrqController` so the production `IoApicController`
# implements the same interrupt-controller HAL trait every port does
# (`plans/WIRING.md` Stage W3).
rustos-arch-api = { path = "../arch/api", version = "=0.0.0" }
# Allocation-free, panic-free integer formatting for the boot audit
# lines: the aarch64 `/memory` discovery summary (`plans/PI.md` P6c-1)
# and the x86_64 guard-arena install decision (`boot`, `plans/PI.md`
# G3b-2). The project-wide first-party formatter; re-implementing it
# locally would duplicate `lib/util` (`AGENTS.md` §2.2). Consumed by
# both ports' boot paths, so it is a common dependency.
rustos-util = { path = "../../lib/util", version = "=0.0.0" }

# The VL805/xHCI USB-keyboard composition (`src/usb_keyboard.rs`,
# `plans/PI.md` P10) wires four loadable driver crates into one in-kernel
# chain: BCM2711 PCIe root-complex bring-up, the BCM2711 windowed PCI
# config mechanism, the xHCI controller engine, and the HID
# boot-keyboard → console-byte producer. `rustos-kernel` is the
# image-assembly seam (`Layer::Tooling`), the only crate permitted to
# name driver crates across strata (`AGENTS.md` §17.4 / §8); the engine
# is architecture-neutral (it consumes only the `lib/abi` driver seams),
# so it compiles — and its host tests run — on the CI host.
rustos-drv-bus-pcie-brcm = { path = "../../drivers/bus/pcie_brcm", version = "=0.0.0" }
rustos-drv-bus-pci = { path = "../../drivers/bus/pci", version = "=0.0.0" }
rustos-drv-bus-usb = { path = "../../drivers/bus/usb", version = "=0.0.0" }
# The bus-agnostic xHCI protocol engine (`lib/usb`): `usb_keyboard.rs`
# names `rustos_usb::{Xhci, device::UsbDevice}` directly, alongside the
# `drivers/bus/usb` wiring that composes the PCI bring-up over it
# (`AGENTS.md` §2.2 / §17.4 — the protocol is a `lib/*` crate).
rustos-usb = { path = "../../lib/usb", version = "=0.0.0" }
rustos-drv-input-usb-hid = { path = "../../drivers/input/usb_hid", version = "=0.0.0" }
rustos-vcmailbox = { path = "../../lib/vcmailbox", version = "=0.0.0" }

# --- Per-architecture boot dependencies ----------------------------
#
# The production kernel binary selects exactly one architecture port at
# build time — the single `AGENTS.md` §17.1/§17.2 selection point. The
# arch port (and the x86_64-only boot-support crates the x86_64 boot
# pipeline links) are therefore target-conditional dependencies, keyed
# off the target instruction set in the build glue (`AGENTS.md` §17.2
# allow-list: `[target.'cfg(target_arch = …)']` in a manifest is build
# glue, not a `cfg(target_arch)` in the crate body). The crate body
# gates each port's modules on the build-script-emitted `kernel_isa`
# name (`build.rs`).

# x86_64: the architecture port plus the driver-host / virtio-bus crates
# the x86_64 boot pipeline (`boot`, `virtio_boot`, `ioapic_controller`)
# links. `drvhost` itself stays free of `kernel/*` deps; the kernel-side
# DMA/MMIO hosts live in `kernel/virtio` (`AGENTS.md` §17.4).
[target.'cfg(target_arch = "x86_64")'.dependencies]
rustos-arch-x86_64 = { path = "../arch/x86_64", version = "=0.0.0", features = ["sched-arch"] }
rustos-drvhost = { path = "../../userland/system/drvhost", version = "=0.0.0" }
rustos-drv-bus-virtio = { path = "../../drivers/bus/virtio", version = "=0.0.0" }
# The user-space device manager's autoload policy (`AGENTS.md` §18.3): the
# kernel binary's `driver_spawn_loader` implements its `DriverLoader` seam to
# spawn a discovered user-space driver, bridging `devmgr` policy to the
# kernel spawn mechanism. `devmgr` stays on `lib/*` only (§17.4); the kernel
# binary (`Layer::Tooling`) is the permitted integration point.
rustos-devmgr = { path = "../../userland/system/devmgr", version = "=0.0.0" }

# aarch64: the Raspberry Pi 4 production kernel links the aarch64 port
# (`plans/PI.md` P1). The aarch64 boot path is intentionally minimal at
# this stage — console + arch selection + fail-closed park — with the
# discovery-fed `kernel_core` hand-off staged for P2–P4.
[target.'cfg(target_arch = "aarch64")'.dependencies]
rustos-arch-aarch64 = { path = "../arch/aarch64", version = "=0.0.0" }
# The user-space device manager's autoload policy (`AGENTS.md` §18.3): the
# aarch64 `driver_spawn_loader` implements its `DriverLoader` seam to spawn a
# discovered user-space driver with the matched node's device-resource
# grants (`plans/PI.md` P10 5d-2-ii). `devmgr` stays on `lib/*` only (§17.4);
# the kernel binary (`Layer::Tooling`) is the permitted integration point.
rustos-devmgr = { path = "../../userland/system/devmgr", version = "=0.0.0" }
# The shared FDT reader (`AGENTS.md` §2.2): `boot_aarch64` parses the
# firmware device tree the loader hands the kernel to discover the board
# console base (`plans/PI.md` P2).
rustos-fdt = { path = "../../lib/fdt", version = "=0.0.0" }
# The signed-manifest driver-load gate (`AGENTS.md` §8 / §9; `plans/PI.md`
# P10 5c-ii): the aarch64 keyboard service admits each statically-linked
# chain driver through `drvhost::Host::load` (Ed25519 signature +
# `CAP_DRV_LOAD` / `CAP_DRV_KERNEL`) before the bring-up runs, exactly as
# the x86_64 `virtio_boot` path does. `drvhost` stays free of `kernel/*`
# deps (`AGENTS.md` §17.4); the in-kernel resource hosts live elsewhere.
rustos-drvhost = { path = "../../userland/system/drvhost", version = "=0.0.0" }

# riscv64: the QEMU `virt` / SiFive production kernel links the riscv64
# port (`plans/PI.md` RV-P1). `boot_riscv64` reaches
# `kernel_core::kernel_main` → `AuditEvent::BootCompleted` over the
# device-tree-discovered RAM window + timer rate; the Sv39 MMU and the
# PID 1 user-mode drop are staged follow-ups. The port owns its own FDT
# reader (`rustos_arch_riscv64::fdt`), so no `lib/fdt` dep is added here.
[target.'cfg(target_arch = "riscv64")'.dependencies]
rustos-arch-riscv64 = { path = "../arch/riscv64", version = "=0.0.0" }

[build-dependencies]
# The aarch64 build script embeds the `init` `Run` rxe so the boot path can
# spawn PID 1 into EL0 (`plans/PI.md` P6c-3). It compiles the pure-Rust
# `rustos-init-run` program PIE and converts the linked ELF to an `rxe` blob
# (carrying the kernel's compiled-in syscall CFI tag) exactly as the cc3 /
# spawn fixtures do, reusing the shared converter rather than re-rolling it
# (`AGENTS.md` §2.2). Host-only build glue — the production kernel image stays
# Rust-only (`AGENTS.md` §1). `rustos-kernel` is the image-assembly seam
# (`Layer::Tooling`), so naming the harness here is not a §17.4 layering
# violation.
rustos-itest-harness = { path = "../../tests/integration/harness", version = "=0.0.0" }
rustos-kernel-syscall = { path = "../syscall", version = "=0.0.0" }
# The build script also bakes the signed driver-manifest images the
# in-kernel `driver_loader` admits through `drvhost::Host::load`
# (`plans/PI.md` P10 5c-ii). It encodes each chain driver's `DriverManifest`
# from the one ABI definition (`rustos-abi`), stamps the kernel's compiled-in
# `SYSCALL_TABLE_HASH` (`rustos-kernel-syscall`), copies the driver crate's
# own canonical `BIND_KEYS` into the signed bind table (so the match data
# never drifts, `AGENTS.md` §2.2 / §18.3), and signs with the build's
# deterministic Ed25519 driver-signing key — the trust anchor the kernel
# embeds. Host-only build glue (`AGENTS.md` §1, §12); the production image
# stays Rust-only.
rustos-abi = { path = "../../lib/abi", version = "=0.0.0" }
rustos-drv-bus-pcie-brcm = { path = "../../drivers/bus/pcie_brcm", version = "=0.0.0" }
rustos-drv-bus-usb = { path = "../../drivers/bus/usb", version = "=0.0.0" }
rustos-drv-input-usb-hid = { path = "../../drivers/input/usb_hid", version = "=0.0.0" }
# Deterministic Ed25519 signing of the baked driver manifests. The same
# audited, version-pinned crate `lib/crypto` wraps and the `drvhost`
# fixtures use (`AGENTS.md` §2.12 / §19.3); only build glue and test code
# name it, never a production runtime path.
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["zeroize"] }

[dev-dependencies]
# The `virtio_factory` unit tests drive a real `DmaPool` through
# `kernel/mem`'s in-memory `HostPageTable` test double, gated behind
# the `host-tests` feature so production builds never link it
# (`AGENTS.md` §2.3).
rustos-kernel-mem = { path = "../mem", version = "=0.0.0", features = ["host-tests"] }
# The `virtio_boot` wiring test signs a synthetic `.rxe` manifest with a
# known keypair so the live `drvhost::Host` accepts it. Pinned to the
# same version `lib/crypto` audits and `drvhost`'s fixtures use; only
# test code names `ed25519-dalek`, never production paths
# (`AGENTS.md` §2.3, mirrors `userland/system/drvhost`).
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["zeroize"] }
