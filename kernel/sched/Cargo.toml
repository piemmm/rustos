[package]
name = "rustos-kernel-sched"
description = "RustOS kernel SMP scheduler: per-CPU run queues, work-stealing, MLFQ priority + fairness, IPI-driven preemption."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# `test-arch` exposes the host-only `TestArch` mock used by the integration
# tests. It is intentionally not in the default feature set so production
# (`no_std`) builds never link the mock (`AGENTS.md` §1 — no hacks).
test-arch = []

[dependencies]
# The scheduler-facing Arch HAL surface (`CpuId`, `SchedulerArch`) lives
# in `kernel/arch/api` (`AGENTS.md` §17.2). The scheduler is a
# `kernel/sched/<impl>` per §17.4 and so may name `kernel/arch/api`,
# `kernel/sched/api`, and `lib/*` — naming the HAL here is exactly the
# dependency §17.4 sanctions, and it is what lets the architecture ports
# implement `SchedulerArch` without depending on `kernel/sched`.
rustos-arch-api = { path = "../arch/api", version = "=0.0.0" }

# Stage 2.3 — kernel/sched is permitted to depend on kernel/sync and
# kernel/mem only (PLAN.md Stage 2.3, AGENTS.md §3, §4). No transitive
# dependency on kernel/ipc, kernel/sec, or kernel/syscall is permitted at
# this stage. We pull in kernel/sync for atomics, spinlocks and the loom
# compatibility convention. We deliberately do **not** pull in kernel/mem
# at this stage — the scheduler does not yet allocate from a typed kernel
# heap, only from the global `alloc::alloc::Global`, which is wired up by
# the kernel entry crate in Stage 2.7 and stubbed by the host test binary
# in host builds. Pulling kernel/mem in "just in case" would violate
# AGENTS.md §2.3 (no bloat) and §2.4 (no interface creep).
rustos-kernel-sync = { path = "../sync", version = "=0.0.0" }

# `loom` is pulled in only when the consumer explicitly opts in with
# `RUSTFLAGS="--cfg loom" cargo test ...`. Mirrors the convention
# established in `kernel/sync/Cargo.toml`.
[target.'cfg(loom)'.dependencies]
loom = "0.7"

# Integration tests and doctests get the `test-arch` feature for free; the
# library itself never links it under `cargo build` or `cargo doc` without
# the feature being explicitly requested. This self-reference is the
# standard Cargo pattern for "dev-only" cargo features.
[dev-dependencies]
rustos-kernel-sched = { path = ".", version = "=0.0.0", features = ["test-arch"] }
