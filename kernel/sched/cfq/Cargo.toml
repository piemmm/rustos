[package]
name = "rustos-kernel-sched-cfq"
description = "RustOS CFQ scheduler policy: a non-tickless, Linux-CFS-like Completely-Fair-Queuing dispatch with per-CPU weighted-vruntime run queues, work-stealing, and IPI-driven preemption. Implements rustos-kernel-sched-api::SchedulerPolicy. The only scheduler permitted to keep a fixed-frequency periodic tick armed for a running task (the tickless carve-out)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# `test-arch` re-exports the host-only `TestArch` mock from the scheduler
# API. It is intentionally not in the default feature set so production
# (`no_std`) builds never link the mock (`AGENTS.md` §1 — no hacks).
test-arch = ["rustos-kernel-sched-api/test-arch"]

[dependencies]
# The scheduler contract (`SchedulerPolicy`, the lifecycle vocabulary, the
# re-exported Arch HAL surface). This is a `kernel/sched/<impl>` crate per
# §17.4 and so may name `kernel/sched/api`, `kernel/arch/api`, and `lib/*`
# only.
rustos-kernel-sched-api = { path = "../api", version = "=0.0.0" }

# The scheduler-facing Arch HAL surface (`CpuId`, `SchedulerArch`) — named
# directly so the dispatch types can bound on `SchedulerArch` without
# routing every reference through the API re-export.
rustos-arch-api = { path = "../../arch/api", version = "=0.0.0" }

# Synchronisation primitives (task registry `RwLock`, per-CPU run-queue
# and overflow `SpinLock`s). These live in `lib/sync` (`AGENTS.md` §6 /
# §17.4), reachable by a `SchedImpl` crate.
rustos-sync = { path = "../../../lib/sync", version = "=0.0.0" }

# The single project-wide source of randomness (`AGENTS.md` §1 / §2.2 —
# no second PRNG). Work-stealing victim selection is a non-cryptographic
# "scheduler decision", so it draws from `lib/rng`'s fast xoshiro256++
# `FastRng` rather than a hand-rolled generator.
rustos-rng = { path = "../../../lib/rng", version = "=0.0.0" }

# Integration tests and doctests get the `test-arch` feature for free, and
# run the shared conformance suite from the API crate. The library itself
# never links them under `cargo build` or `cargo doc` without the feature
# being explicitly requested.
[dev-dependencies]
rustos-kernel-sched-cfq = { path = ".", version = "=0.0.0", features = ["test-arch"] }
rustos-kernel-sched-api = { path = "../api", version = "=0.0.0", features = ["conformance"] }
