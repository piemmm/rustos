[package]
name = "tairix-kernel-sched-api"
description = "TAIRiX scheduler contract: the SchedulerPolicy trait, the lifecycle vocabulary every policy shares, and the conformance suite every concrete scheduler must pass."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# `test-arch` exposes the host-only `TestArch` mock used by the
# conformance suite and by every scheduler implementation's tests. It is
# not in the default set so production (`no_std`) builds never link the
# mock (no hacks).
test-arch = []
# `conformance` exposes the shared `SchedulerPolicy` conformance suite. It
# pulls in `std` for the multi-core stress
# driver, so it is opt-in and consumed only from test targets.
conformance = ["test-arch"]

# The `kernel/sched/api/tests/conformance.rs` acceptance test runs the
# shared suite against the in-tree concrete policy. The self dev-dep with
# `conformance` turns the suite (and `TestArch`) on for the API crate's
# own integration tests; the `mlfq` dev-dep supplies a concrete
# `SchedulerPolicy` to drive. Dev-dependency cycles are permitted by
# Cargo and are excluded from the build graph (`deps-check`).
[dev-dependencies]
tairix-kernel-sched-api = { path = ".", version = "=0.0.0", features = ["conformance"] }
tairix-kernel-sched-mlfq = { path = "../mlfq", version = "=0.0.0" }

[dependencies]
# The scheduler-facing Arch HAL surface (`CpuId`, `SchedulerArch`) is the
# single canonical definition in the Arch HAL crate `kernel/arch/api`. The
# scheduler API re-exports it so the contract,
# the implementations, and `kernel/core` all name one type. `kernel/sched/api`
# is a `SchedApi` crate and so may name
# `kernel/arch/api` and `lib/*` only.
tairix-arch-api = { path = "../../arch/api", version = "=0.0.0" }
# The pid range a drawn task id must stay inside is an ABI value, not the
# scheduler's own choice: peers derive tag-packed endpoint ids from a pid.
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The process-wide task-id generator draws from the project's one shared
# non-cryptographic generator and holds it behind the shared spinlock.
tairix-rng = { path = "../../../lib/rng", version = "=0.0.0" }
tairix-sync = { path = "../../../lib/sync", version = "=0.0.0" }
