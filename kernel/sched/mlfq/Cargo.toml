[package]
name = "rustos-kernel-sched-mlfq"
description = "RustOS MLFQ scheduler policy: per-CPU run queues, work-stealing, MLFQ priority + fairness, IPI-driven preemption. Implements rustos-kernel-sched-api::SchedulerPolicy."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# `test-arch` re-exports the host-only `TestArch` mock from the scheduler
# API. It is intentionally not in the default feature set so production
# (`no_std`) builds never link the mock (`AGENTS.md` §1 — no hacks).
test-arch = ["rustos-kernel-sched-api/test-arch"]

[dependencies]
# The scheduler contract (`SchedulerPolicy`, the lifecycle vocabulary, the
# re-exported Arch HAL surface). This is a `kernel/sched/<impl>` crate per
# §17.4 and so may name `kernel/sched/api`, `kernel/arch/api`, and `lib/*`
# only.
rustos-kernel-sched-api = { path = "../api", version = "=0.0.0" }

# The scheduler-facing Arch HAL surface (`CpuId`, `SchedulerArch`) — named
# directly so the dispatch types can bound on `SchedulerArch` without
# routing every reference through the API re-export.
rustos-arch-api = { path = "../../arch/api", version = "=0.0.0" }

# Synchronisation primitives (run-queue registry `RwLock`, overflow
# `SpinLock`, the loom compatibility convention). These live in `lib/sync`
# (`AGENTS.md` §6 / §17.4), reachable by a `SchedImpl` crate.
rustos-sync = { path = "../../../lib/sync", version = "=0.0.0" }

# `loom` is pulled in only when the consumer explicitly opts in with
# `RUSTFLAGS="--cfg loom" cargo test ...`. Mirrors the convention
# established in `lib/sync/Cargo.toml`.
[target.'cfg(loom)'.dependencies]
loom = "0.7"

# Integration tests and doctests get the `test-arch` feature for free, and
# run the shared conformance suite from the API crate. The library itself
# never links them under `cargo build` or `cargo doc` without the feature
# being explicitly requested.
[dev-dependencies]
rustos-kernel-sched-mlfq = { path = ".", version = "=0.0.0", features = ["test-arch"] }
rustos-kernel-sched-api = { path = "../api", version = "=0.0.0", features = ["conformance"] }
