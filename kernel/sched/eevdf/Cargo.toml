[package]
name = "tairix-kernel-sched-eevdf"
description = "TAIRiX EEVDF scheduler policy: fully tickless Earliest-Eligible-Virtual-Deadline-First dispatch with per-CPU virtual-time run queues, work-stealing, and IPI-driven preemption. Implements tairix-kernel-sched-api::SchedulerPolicy."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# `test-arch` re-exports the host-only `TestArch` mock from the scheduler
# API. It is intentionally not in the default feature set so production
# (`no_std`) builds never link the mock (no hacks).
test-arch = ["tairix-kernel-sched-api/test-arch"]

[dependencies]
# The scheduler contract (`SchedulerPolicy`, the lifecycle vocabulary, the
# re-exported Arch HAL surface). This is a `kernel/sched/<impl>` crate per
# and so may name `kernel/sched/api`, `kernel/arch/api`, and `lib/*`
# only.
tairix-kernel-sched-api = { path = "../api", version = "=0.0.0" }

# The scheduler-facing Arch HAL surface (`CpuId`, `SchedulerArch`) — named
# directly so the dispatch types can bound on `SchedulerArch` without
# routing every reference through the API re-export.
tairix-arch-api = { path = "../../arch/api", version = "=0.0.0" }

# Synchronisation primitives (task registry `RwLock`, per-CPU run-queue
# and overflow `SpinLock`s). These live in `lib/sync`, reachable by a
# `SchedImpl` crate.
tairix-sync = { path = "../../../lib/sync", version = "=0.0.0" }

# Integration tests and doctests get the `test-arch` feature for free, and
# run the shared conformance suite from the API crate. The library itself
# never links them under `cargo build` or `cargo doc` without the feature
# being explicitly requested.
[dev-dependencies]
tairix-kernel-sched-eevdf = { path = ".", version = "=0.0.0", features = ["test-arch"] }
tairix-kernel-sched-api = { path = "../api", version = "=0.0.0", features = ["conformance"] }
