# re-assembled in this test module.
tairix-test-encrypted-root-image = { path = "../../tests/integration/encrypted_root_image", version = "=0.0.0" }
# The same test parses the served `users-v1` text and authenticates the
# planted account, proving the served database is usable (`plans/PI.md` P11).
tairix-users = { path = "../../lib/users", version = "=0.0.0" }
# The `virtio_boot` wiring test signs a synthetic `.rxe` manifest with a
# known keypair so the live `drvhost::Host` accepts it. Pinned to the
# same version `lib/crypto` audits and `drvhost`'s fixtures use; only
# test code names `ed25519-dalek`, never production paths
# (`AGENTS.md` §2.3, mirrors `userland/system/drvhost`).
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["zeroize"] }
