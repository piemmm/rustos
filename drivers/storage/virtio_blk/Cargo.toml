[package]
name = "tairix-drv-storage-virtio-blk"
description = "TAIRiX virtio-blk block driver."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The bus-agnostic virtio split-virtqueue protocol (Transport trait,
# SplitQueue, DMA slabs, the MockHost/MockTransport doubles) lives in
# `lib/virtio`. The driver consumes it from `lib/*` and never depends on
# the `drivers/bus/virtio` transport crate (a driver
# may depend on `lib/*` but never on another driver).
tairix-virtio = { path = "../../../lib/virtio", version = "=0.0.0" }

[lints]
workspace = true
