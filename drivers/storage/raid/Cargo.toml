[package]
name = "tairix-drv-storage-raid"
description = "TAIRiX RAID composition driver (plans/FIX-IO.md IO6): the autoloaded policy driver that turns discovered array members into served arrays. Matched to a tairix,raid-member node it is a member agent, delegating that device's block transport and data window to the reserved array-composer rendezvous and holding the membership open until the device or the array goes away. The composition arithmetic itself is the shared lib/raid crate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# A hybrid library + binary crate, the shape the sibling storage policy drivers
# use: the library half carries the bind table the signed bundle publishes and
# the pure, host-tested decision logic, while `src/main.rs` is the freestanding
# program the kernel spawns for a matched node (installed as the bundle's `Run`
# entry point). The driver holds no MMIO, DMA, or IRQ authority: it only
# forwards the transport it was granted.

[dependencies]
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The shared escalating retry cadence (`tairix_raid::RetryCadence`), so an
# agent re-offering its device and an array re-probing a faulted member pace
# themselves by one definition. The composition engines in the same crate are
# what the composer half assembles once it is matched to the virtual bus.
tairix-raid = { path = "../../../lib/raid", version = "=0.0.0" }

[target.'cfg(target_os = "none")'.dependencies]
tairix-caps = { path = "../../../lib/caps", version = "=0.0.0" }
tairix-drvrt = { path = "../../../lib/drvrt", version = "=0.0.0" }
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0" }
tairix-util = { path = "../../../lib/util", version = "=0.0.0" }
