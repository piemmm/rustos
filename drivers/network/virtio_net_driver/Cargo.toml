[package]
name = "tairix-drv-network-virtio-net-driver"
description = "TAIRiX autoloaded user-space virtio-net driver process: brings the virtio-net device up over its granted register window, DMA, and interrupt line, and serves the `netchan-v1` device-channel contract to the network stack over a claimed reserved endpoint (plans/NETWORK.md N4d)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# The crate is **only** a binary: the `Run` entry point of the virtio-net
# driver bundle, installed under `/System/Drivers/` and autoloaded into user
# space by `devmgr` when a virtio-net device is discovered.
# It links the userland runtime `tairix-rt`, so it is a separate crate from any
# kernel-linked driver shell (the kernel must not pull in the userland `_start`
# / panic handler / allocator), and depends only on `lib/*` crates so the
# layering holds (no `drivers/*`→`drivers/*` edge). It is a freestanding
# pure-Rust program on the native Tier-1 targets and an inert host stub
# elsewhere (`src/main.rs` / `build.rs`), mirroring `drivers/input/virtio_kbd`
# and `drivers/storage/usb_msd`.

# Everything the freestanding program links is pulled in only for the bare-metal
# targets the binary is actually built for; on the host the binary is an inert
# stub with no dependencies.
[target.'cfg(target_os = "none")'.dependencies]
# The `abi-v1` surface: the role-tagged virtio-PCI / single-aperture MMIO
# grant helpers the transport is shape-keyed from, the `Net` device trait,
# and the capability ids the host is built over.
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The capability-set type the rt-backed `DriverHost` is built over.
tairix-caps = { path = "../../../lib/caps", version = "=0.0.0" }
# The bus-agnostic virtio-MMIO transport this driver builds over its granted
# register window — a `lib/*` crate, so the layering holds (the driver
# never names `drivers/bus/virtio`; the `lib/usb` ↔ `drivers/bus/usb`
# precedent).
tairix-virtio = { path = "../../../lib/virtio", version = "=0.0.0" }
# The bus-agnostic virtio-net device engine (bring-up + frame-ring `Net`
# service) — the same engine the host tests and QEMU verticals exercise.
tairix-virtio-net = { path = "../../../lib/virtio_net", version = "=0.0.0" }
# The device-agnostic driver side of the `netchan-v1` device channel: the
# pure `NetChannelServer` handler plus the serve loop (claim the reserved
# endpoint, publish the `netchan` node, park on {call endpoint, device IRQ})
# every NIC driver process shares — one definition.
tairix-netchan = { path = "../../../lib/netchan", version = "=0.0.0" }
# The user-space driver runtime: turns the kernel-issued device-resource grants
# into the `MmioMapper` + `VirtioHost` the bring-up consumes (`mmio_map` /
# `dma_alloc` / `resource_grants` over the syscall surface).
tairix-drvrt = { path = "../../../lib/drvrt", version = "=0.0.0" }
# The pure-Rust userland runtime: `_start`, the stack
# canary, the panic handler, the allocator, and the `irq_bind` / `entry!`
# surface this binary uses directly.
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0" }
