[package]
name = "rustos-drv-network-virtio-net"
description = "RustOS virtio-net link-layer driver."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
rustos-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The bus-agnostic virtio-net device engine (bring-up + frame-ring `Net`
# service) lives in `lib/virtio_net` so a user-space driver *process* can
# link it directly (`AGENTS.md` §17.4 — a process crate depends on `lib/*`,
# never on a `drivers/*` crate). This crate re-exports the engine and adds
# the driver-host `register` shell over it.
rustos-virtio-net = { path = "../../../lib/virtio_net", version = "=0.0.0" }

[lints]
workspace = true
