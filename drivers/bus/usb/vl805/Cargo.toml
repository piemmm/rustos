[package]
name = "tairix-drv-bus-usb-vl805"
description = "TAIRiX autoloaded user-space Raspberry Pi 4 (BCM2711) VL805 USB bus driver: binds the discovered VL805 PCI node, reloads the controller firmware over the VideoCore mailbox IPC, and publishes the controller as a bindable xHCI node forwarding the BAR + DMA grants (plans/PI.md P10 D5c)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# This driver crate has two targets. The host-testable device logic — the
# VL805 firmware-reload policy, the `BIND_KEYS` match table, and the
# `wiring` (`build_xhci_node` + `reload_firmware_and_publish`) — lives in the
# `lib` target (`src/lib.rs`), co-located *in the driver* because a VL805 USB
# driver sits above the bootstrap floor and so has no charter-legal
# non-driver consumer for a `lib/*` device-support crate.
# The `Run` entry-point binary (`src/main.rs`) is the bundle installed under
# `/System/Drivers/` and autoloaded into user space by `devmgr` when the VL805
# PCI node is discovered. It links the userland runtime
# `tairix-rt`, so those bin-only deps are pulled in **only** for the bare-metal
# targets the binary is built for; on the host the binary is an inert stub and
# only the `lib` target (and its host tests) compiles.

# The device-logic dependencies the `lib` target needs on every target (host
# tests + the freestanding build alike).
[dependencies]
# The frozen `abi-v1` surface: the `DriverHost` / `MailboxChannel` seams the
# firmware policy runs over, the `HwNode` / `HwResource` / `HwMatchKey`
# vocabulary the controller node is published with, and the `CapabilityId` /
# `DriverError` types it fails closed with — one ABI definition.
tairix-abi = { path = "../../../../lib/abi", version = "=0.0.0" }
# The BCM2711 VideoCore property-channel client (device
# carve-out): the VL805 firmware-reload (`NOTIFY_XHCI_RESET`) and
# firmware-revision property-message layout live there once; this crate
# encodes/decodes those messages and runs them over the board-neutral
# `lib/abi` `MailboxChannel` seam, never re-deriving the layout.
tairix-vcmailbox = { path = "../../../../lib/vcmailbox", version = "=0.0.0" }
# The bus-agnostic xHCI controller crate: the single definition of the
# controller's `compatible` identity (`XHCI_COMPATIBLE`) the published node
# carries, shared with the controller driver that binds the node.
tairix-usb = { path = "../../../../lib/usb", version = "=0.0.0" }

[dev-dependencies]
# Protocol-faithful mock firmware (`mock-firmware` feature) backing the
# host-test `MailboxChannel`, so the firmware policy is proven against the
# real property semantics rather than a hand-faked response.
# QEMU models no VideoCore, so the live doorbell is the on-metal acceptance
# item (`plans/PI.md` Increment C).
tairix-vcmailbox = { path = "../../../../lib/vcmailbox", version = "=0.0.0", features = [
    "mock-firmware",
] }

# Everything the freestanding program links beyond the device logic is pulled
# in only for the bare-metal targets the binary is actually built for; on the
# host the binary is an inert stub.
[target.'cfg(target_os = "none")'.dependencies]
# The capability-set type the rt-backed `DriverHost` is built over.
tairix-caps = { path = "../../../../lib/caps", version = "=0.0.0" }
# The user-space driver runtime: turns the kernel-issued device-resource grants
# into the `DriverHost` (`resource_grants` / `ipc_call` for the mailbox /
# `hw_emit_node` over the syscall surface).
tairix-drvrt = { path = "../../../../lib/drvrt", version = "=0.0.0" }
# The pure-Rust userland runtime: `_start`, the stack
# canary, the panic handler, the syscall wrappers, and `yield_now`.
tairix-rt = { path = "../../../../lib/rt", version = "=0.0.0" }
