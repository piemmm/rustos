[package]
name = "rustos-drv-bus-pcie-brcm"
description = "RustOS autoloaded user-space BCM2711 (Raspberry Pi 4) PCIe root-complex bus driver: binds the discovered brcm,bcm2711-pcie node, trains the link, enumerates the VL805 USB host controller behind the bridge, assigns/enables its register BAR, and publishes it into the live hardware tree as a bindable xHCI node (AGENTS.md §4 / §18; plans/PI.md P10 D5b.2b)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# The crate is **only** a binary: the `Run` entry point of the BCM2711 PCIe
# bus-driver bundle, installed under `/System/Drivers/` and autoloaded into user
# space by `devmgr` when the `brcm,bcm2711-pcie` node is discovered (`AGENTS.md`
# §18). It links the userland runtime `rustos-rt`, so it is a separate crate
# from the kernel-linked `lib/pcie_brcm` engine (the kernel must not pull in the
# userland `_start` / panic handler), and depends only on `lib/*` crates so the
# §17.4 layering holds (no `drivers/*`→`drivers/*` edge). The discover-and-publish
# composition is host-tested in `lib/pcie_brcm` (`emit_vl805_node`), so this
# binary is a thin freestanding wiring on the native Tier-1 targets and an inert
# host stub elsewhere (`src/main.rs` / `build.rs`), mirroring
# `drivers/bus/mailbox/vcmailbox` (`AGENTS.md` §2.2).

# Everything the freestanding program links is pulled in only for the bare-metal
# targets the binary is actually built for; on the host the binary is an inert
# stub with no dependencies.
[target.'cfg(target_os = "none")'.dependencies]
# The frozen `abi-v1` surface (`CapabilityId`, `DriverError`).
rustos-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The capability-set type the rt-backed `DriverHost` is built over (§5.2).
rustos-caps = { path = "../../../lib/caps", version = "=0.0.0" }
# The BCM2711 PCIe device-support crate: `pcie_bringup_from_resources` (parse
# the granted RC resources), `emit_vl805_node` (the host-tested train-link →
# enumerate → assign BAR → publish composition), and `BIND_KEYS` — a `lib/*`
# crate, so the §17.4 layering holds (the §2.20 device-support carve-out).
rustos-pcie-brcm = { path = "../../../lib/pcie_brcm", version = "=0.0.0" }
# The user-space driver runtime: turns the kernel-issued device-resource grants
# into the `DriverHost` (`mmio_map` / `resource_grants` / `hw_emit_node` over
# the syscall surface, §5.4).
rustos-drvrt = { path = "../../../lib/drvrt", version = "=0.0.0" }
# The pure-Rust userland runtime (`AGENTS.md` §1 / §16.4): `_start`, the stack
# canary §19.2, the panic handler, the syscall wrappers, the `ClockDelay`, and
# `yield_now`.
rustos-rt = { path = "../../../lib/rt", version = "=0.0.0" }
