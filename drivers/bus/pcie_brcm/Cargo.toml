[package]
name = "tairix-drv-bus-pcie-brcm"
description = "TAIRiX autoloaded user-space BCM2711 (Raspberry Pi 4) PCIe root-complex bus driver: binds the discovered brcm,bcm2711-pcie node, trains the link, enumerates the VL805 USB host controller behind the bridge, assigns/enables its register BAR, and publishes it into the live hardware tree as a bindable xHCI node (plans/PI.md P10 D5b.2b)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# This driver crate has two targets. The host-testable device logic — the
# BCM2711 PCIe root-complex bring-up engine (`BrcmPcieRc`), the
# `BIND_KEYS` match table, and the `wiring` (`pcie_bringup_from_resources` +
# `emit_vl805_node`) — lives in the `lib` target (`src/lib.rs`), co-located *in
# the driver* because a BCM2711 PCIe bus driver sits above the bootstrap
# floor (the kernel floor is the storage path only) and so has no charter-legal
# non-driver consumer for a `lib/*` device-support crate.
# The `Run` entry-point binary (`src/main.rs`) is the bundle installed under
# `/System/Drivers/` and autoloaded into user space by `devmgr` when the
# `brcm,bcm2711-pcie` node is discovered. It links the
# userland runtime `tairix-rt`, so those bin-only deps are pulled in **only**
# for the bare-metal targets the binary is built for; on the host the binary is
# an inert stub and only the `lib` target (and its host tests) compiles.

# The device-logic dependencies the `lib` target needs on every target (host
# tests + the freestanding build alike).
[dependencies]
# The frozen `abi-v1` surface: the `DriverHost` / `RegisterWindow` / `MmioMapper`
# seams the bring-up runs over, the `HwNode` / `HwResource` / `HwMatchKey`
# vocabulary the controller node is published with, and the `CapabilityId` /
# `DriverError` types it fails closed with — one ABI definition.
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The PCI/PCIe configuration-access mechanism + shared bus-driver locate/BAR
# primitives (`mechanism_brcm`, `find_function_by_class`, `assign_and_map_bar`,
# `bus_to_cpu_phys`, `USB_CONTROLLER_CLASS`) the `emit_vl805_node` composition
# drives once the link trains. `lib/* → lib/*`, no cycle.
tairix-pci = { path = "../../../lib/pci", version = "=0.0.0" }
# The xHCI-protocol facts the published node's grants are sized by:
# `XHCI_BAR_INDEX` (the controller's register BAR), one definition shared
# with the xHCI driver.
tairix-usb = { path = "../../../lib/usb", version = "=0.0.0" }

# Everything the freestanding program links beyond the device logic is pulled
# in only for the bare-metal targets the binary is actually built for; on the
# host the binary is an inert stub.
[target.'cfg(target_os = "none")'.dependencies]
# The capability-set type the rt-backed `DriverHost` is built over.
tairix-caps = { path = "../../../lib/caps", version = "=0.0.0" }
# The user-space driver runtime: turns the kernel-issued device-resource grants
# into the `DriverHost` (`mmio_map` / `resource_grants` / `hw_emit_node` over
# the syscall surface).
tairix-drvrt = { path = "../../../lib/drvrt", version = "=0.0.0" }
# The pure-Rust userland runtime: `_start`, the stack
# canary, the panic handler, the syscall wrappers, the `ClockDelay`, and
# `yield_now`.
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0" }
