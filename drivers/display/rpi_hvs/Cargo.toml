[package]
name = "rustos-drv-display-rpi-hvs"
description = "RustOS Raspberry Pi VideoCore HVS hardware-layer display driver."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
rustos-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The shared VideoCore firmware mailbox protocol (§2.2): framebuffer
# discovery and bus↔physical translation, also spoken by the aarch64
# port's framebuffer boot console.
rustos-vcmailbox = { path = "../../../lib/vcmailbox", version = "=0.0.0" }

[dev-dependencies]
# Host tests additionally pull in the protocol-faithful mock firmware
# (QEMU does not model the VideoCore, §2.1).
rustos-vcmailbox = { path = "../../../lib/vcmailbox", version = "=0.0.0", features = [
    "mock-firmware",
] }

[lints]
workspace = true
