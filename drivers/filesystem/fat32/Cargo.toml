[package]
name = "tairix-drv-fs-fat32"
description = "TAIRiX FAT32 filesystem driver (read-only)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The shared filesystem-signature definitions (the FAT32 identity
# derivation), so this driver and the volume manager's probe can never
# disagree about what identifies a volume.
tairix-fsprobe = { path = "../../../lib/fsprobe", version = "=0.0.0" }

[lints]
workspace = true
