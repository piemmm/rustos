[package]
name = "tairix-drv-cpufreq-rpi"
description = "TAIRiX Raspberry Pi CPU frequency driver: the VideoCore firmware's ARM core clock, taking the kernel's frequency mechanism role and applying the governor's targets over the firmware property mailbox."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# Two targets, one crate, both on cargo's default paths and names like every
# sibling driver — the bundle builder cross-compiles `--bin <package>`, so a
# renamed binary would not be installable. The device logic (`src/lib.rs`) is
# this clock's own property tags and range discovery, so it lives with the
# driver rather than in `lib/*`, and is host-testable against the mock
# firmware. The `Run` binary (`src/main.rs`) is what `devmgr` autoloads into
# user space; it links the userland runtime, so it is freestanding-only and an
# inert host stub elsewhere (`build.rs`).

[dependencies]
# The `abi-v1` surface: the frequency-range type the mechanism declares, the
# board-neutral mailbox channel seam, and the capability ids.
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The VideoCore property-channel client: the ARM-clock rate tags and their
# fail-closed response validation. One definition of that protocol.
tairix-vcmailbox = { path = "../../../lib/vcmailbox", version = "=0.0.0" }

[dev-dependencies]
# The protocol-faithful mock firmware the host tests run the rate exchanges
# against; QEMU models no VideoCore.
tairix-vcmailbox = { path = "../../../lib/vcmailbox", version = "=0.0.0", features = [
    "mock-firmware",
] }

# The `Run` binary's freestanding-only dependencies; on the host it is an inert
# stub, so nothing here reaches the host build.
[target.'cfg(target_os = "none")'.dependencies]
# The capability-set type the rt-backed `DriverHost` is built over.
tairix-caps = { path = "../../../lib/caps", version = "=0.0.0" }
# The user-space driver runtime: its `MailboxChannel` impl marshals a property
# exchange to the mailbox service over the kernel's call surface.
tairix-drvrt = { path = "../../../lib/drvrt", version = "=0.0.0" }
# The pure-Rust userland runtime: `_start`, the stack canary, the panic
# handler, and the `cpufreq_bind` / `cpufreq_wait` wrappers.
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0" }
