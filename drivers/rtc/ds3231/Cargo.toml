[package]
name = "tairix-drv-rtc-ds3231"
description = "TAIRiX Maxim DS3231 / DS1307 real-time-clock driver: the I2C calendar register block at bus address 0x68, served to the clock authority over the RTC service endpoint."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# Two targets, one crate, both on cargo's default paths and names like every
# sibling driver — the bundle builder cross-compiles `--bin <package>`, so a
# renamed binary would not be installable. The chip logic (`src/lib.rs`) is
# this part's own register map, so it lives with the driver rather than in
# `lib/*`, and is host-testable against the shared mock part. The `Run` binary
# (`src/main.rs`) is what `devmgr` autoloads into user space; it links the
# userland runtime, so it is freestanding-only and an inert host stub
# elsewhere (`build.rs`).

[dependencies]
# The `abi-v1` surface: the `Rtc` class trait, the shared BCD and 12-hour
# codecs, the RTC service wire contract, and the capability ids.
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The I2C register-transaction protocol: the write-then-read composition this
# chip's register block is read and written through, defined once.
tairix-i2c = { path = "../../../lib/i2c", version = "=0.0.0" }

[dev-dependencies]
# The shared register-file part double every chip driver's host tests drive,
# so no driver carries a private copy of the scaffold.
tairix-i2c = { path = "../../../lib/i2c", version = "=0.0.0", features = [
    "mock-bus",
] }

# The `Run` binary's freestanding-only dependencies; on the host it is an inert
# stub, so nothing here reaches the host build.
[target.'cfg(target_os = "none")'.dependencies]
# The capability-set type the rt-backed `DriverHost` is built over.
tairix-caps = { path = "../../../lib/caps", version = "=0.0.0" }
# The user-space driver runtime: the endpoint grant this chip's transfer port
# resolves to, and the client half of the I2C transfer wire.
tairix-drvrt = { path = "../../../lib/drvrt", version = "=0.0.0" }
# The pure-Rust userland runtime: `_start`, the stack canary, the panic
# handler, and the `call_create` / `call_recv` / `call_reply` wrappers.
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0" }
