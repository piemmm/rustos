[package]
name = "tairix-drv-rtc-pl031"
description = "TAIRiX ARM PrimeCell PL031 real-time-clock driver: the `arm,pl031` counter the aarch64 `virt` board exposes, served to the clock authority over the RTC service endpoint."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# Two targets, one crate. The device logic (`src/lib.rs`) is the chip's own
# register decode, so it lives with the driver rather than in `lib/*`, and is
# host-testable against a mock register window. The `Run` binary
# (`src/main.rs`) is what `devmgr` autoloads into user space; it links the
# userland runtime, so it is freestanding-only and an inert host stub
# elsewhere (`build.rs`).
[lib]
path = "src/lib.rs"

[[bin]]
name = "tairix-drv-rtc-pl031-run"
path = "src/main.rs"

[dependencies]
# The `abi-v1` surface: the `Rtc` class trait, the RTC service wire contract,
# the register-window seam, and the capability ids.
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }

# The `Run` binary's freestanding-only dependencies; on the host it is an inert
# stub, so nothing here reaches the host build.
[target.'cfg(target_os = "none")'.dependencies]
# The capability-set type the rt-backed `DriverHost` is built over.
tairix-caps = { path = "../../../lib/caps", version = "=0.0.0" }
# The user-space driver runtime: turns the kernel-issued device-resource
# grants into the `MmioMapper` the bring-up maps its window through.
tairix-drvrt = { path = "../../../lib/drvrt", version = "=0.0.0" }
# The pure-Rust userland runtime: `_start`, the stack canary, the panic
# handler, and the `call_create` / `call_recv` / `call_reply` wrappers.
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0" }
