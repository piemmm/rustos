[package]
name = "rustos-drv-input-usb-hid"
description = "RustOS USB-HID boot-protocol input driver (keyboard + mouse)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
rustos-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The decoded keyboard `Key` vocabulary the console producer resolves HID
# usages into, and the shared terminal key map that turns each key press into
# the console (tty) bytes injected through `console_input` (§2.2, plans/PI.md
# P11). Both are `lib/*` crates the driver may depend on (§17.4).
rustos-input = { path = "../../../lib/input", version = "=0.0.0" }
rustos-keymap = { path = "../../../lib/keymap", version = "=0.0.0" }

[lints]
workspace = true
