[package]
name = "rustos-drv-input-usb-hid"
description = "RustOS USB-HID boot-protocol input driver (keyboard + mouse): the §8 register entry and §18.3 bind table. The reusable decode/console/orchestration logic lives in lib/hid (§17.4 / §2.2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The §8 `DriverHost`/`DriverHandle`/`register` surface, the `CapabilityId` /
# `DriverError` vocabulary, and the §18.3 `DriverBindKey` / `HwMatchKey` bind
# table — the one ABI definition (§2.2). The decode/console/orchestration
# logic the driver exposes is in `lib/hid` (§17.4), kept out of this crate so
# the kernel scaffold and the user-space driver process share it without a
# `drivers/*`→`drivers/*` edge.
rustos-abi = { path = "../../../lib/abi", version = "=0.0.0" }

[lints]
workspace = true
