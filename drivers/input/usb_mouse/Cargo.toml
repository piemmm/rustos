[package]
name = "tairix-drv-input-usb-mouse"
description = "TAIRiX autoloaded user-space USB HID boot-mouse *class* driver: binds an emitted HID-interface node, submits interrupt-IN URBs to its host-controller driver over the bus-agnostic URB transport, decodes each boot report via `tairix-hid`, and injects pointer records into the kernel input-focus arbiter (plans/USB.md §1.2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# The crate is a `lib` (the `BIND_KEYS` bind table the host image builder
# reads) and the freestanding `Run` binary of the mouse class driver bundle,
# installed under `/System/Drivers/` and autoloaded into user space by
# `devmgr` when a HID boot-mouse interface node is discovered. It links the
# userland runtime `tairix-rt` and depends only on `lib/*` crates so the
# layered dependency direction holds (no `drivers/*`→`drivers/*` edge — it
# reaches its host-controller driver only through the public URB transport
# ABI). It is a freestanding pure-Rust program on the native Tier-1 targets
# and an inert host stub elsewhere (`src/main.rs` / `build.rs`), mirroring
# `drivers/input/usb_kbd`.
[dependencies]
tairix-abi = { path = "../../../lib/abi", version = "=0.0.0" }

# Everything the freestanding program links beyond the `lib` is pulled in only
# for the bare-metal targets the binary is actually built for; on the host the
# binary is an inert stub.
[target.'cfg(target_os = "none")'.dependencies]
# The capability-set type the rt-backed `DriverHost` is built over.
tairix-caps = { path = "../../../lib/caps", version = "=0.0.0" }
# The arch-neutral HID boot-report decode this class driver composes:
# `BootMouse`, `ReportSource`, `REPORT_BUF_LEN` — a `lib/*` crate, so there
# is no `drivers/*`→`drivers/*` edge.
tairix-hid = { path = "../../../lib/hid", version = "=0.0.0" }
# The bus-agnostic URB transport client (`UrbCall`, `UrbClient`): the seam this
# class driver submits interrupt-IN URBs to its host-controller driver over,
# without naming the controller or the bus.
tairix-usb = { path = "../../../lib/usb", version = "=0.0.0" }
# The user-space driver runtime: turns the kernel-issued device-resource grants
# into the `DriverHost` the setup consumes (`resource_grants` / `shm_map` over
# the syscall surface).
tairix-drvrt = { path = "../../../lib/drvrt", version = "=0.0.0" }
# The pure-Rust userland runtime: `_start`, the stack canary, the panic
# handler, and the syscall wrappers the class driver issues (`ipc_call` for
# the URB transport, `shm_map` via the host, `pointer_inject`), plus the
# `LogSink` that marshals its one-shot beacon to the kernel log over
# `log_emit`.
tairix-rt = { path = "../../../lib/rt", version = "=0.0.0" }
# The structured diagnostic event vocabulary (`Event`/`Field`/`Level`) the
# driver emits its one-shot "bound, pumping reports" beacon through, routed to
# the kernel log by `tairix_rt::LogSink`.
tairix-log = { path = "../../../lib/log", version = "=0.0.0" }
# Fixed-buffer formatting helpers for numeric diagnostic fields, avoiding
# allocation in the freestanding driver.
tairix-util = { path = "../../../lib/util", version = "=0.0.0" }
