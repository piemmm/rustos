[package]
name = "rustos-drv-input-usb-kbd"
description = "RustOS autoloaded user-space USB boot-keyboard driver process: composes the arch-neutral `rustos-hid` decode + xHCI-boot orchestration over the rt-backed `DriverHost`, brings up its granted controller, and pumps decoded key edges into the kernel input-focus arbiter (`AGENTS.md` §4 / §18, plans/PI.md P10 chunk 5d-2-ii)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# The crate is **only** a binary: the `Run` entry point of the keyboard driver
# bundle, installed under `/System/Drivers/` and autoloaded into user space by
# `devmgr` when a HID boot keyboard is discovered (`AGENTS.md` §18). It links
# the userland runtime `rustos-rt`, so it is a separate crate from the
# kernel-linked `rustos-drv-input-usb-hid` driver (the kernel must not pull in
# the userland `_start` / panic handler), and depends only on `lib/*` crates so
# the §17.4 layering holds (no `drivers/*`→`drivers/*` edge). It is a
# freestanding pure-Rust program on the native Tier-1 targets and an inert host
# stub elsewhere (`src/main.rs` / `build.rs`), mirroring `userland/session/login`
# (`AGENTS.md` §2.2).

# Everything the freestanding program links is pulled in only for the
# bare-metal targets the binary is actually built for; on the host the binary
# is an inert stub with no dependencies.
[target.'cfg(target_os = "none")'.dependencies]
# The frozen `abi-v1` surface (`KeyInput`, `CapabilityId`, `DriverError`).
rustos-abi = { path = "../../../lib/abi", version = "=0.0.0" }
# The capability-set type the rt-backed `DriverHost` is built over (§5.2).
rustos-caps = { path = "../../../lib/caps", version = "=0.0.0" }
# The arch-neutral HID decode + xHCI-boot orchestration this process composes:
# `bring_up_boot_keyboard`, `derive_keyboard_resources`, `pump_once`,
# `KeyboardConsole`, `ConsoleSink` — a `lib/*` crate, so the §17.4 layering
# holds (no `drivers/*`→`drivers/*` edge).
rustos-hid = { path = "../../../lib/hid", version = "=0.0.0" }
# The user-space driver runtime: turns the kernel-issued device-resource grants
# into the `DriverHost` the bring-up consumes (`mmio_map` / `dma_alloc` /
# `resource_grants` over the syscall surface, §5.4).
rustos-drvrt = { path = "../../../lib/drvrt", version = "=0.0.0" }
# The pure-Rust userland runtime (`AGENTS.md` §1 / §16.4): `_start`, the stack
# canary, the panic handler, the syscall wrappers (`key_inject`, `yield`,
# `clock_get`), the clock-backed `ClockDelay`, and the `LogSink` that marshals
# structured diagnostics to the kernel log over `log_emit` (`AGENTS.md` §19.4).
rustos-rt = { path = "../../../lib/rt", version = "=0.0.0" }
# The structured diagnostic event vocabulary (`Event`/`Field`/`Level`) the
# driver emits its one-shot bring-up diagnostic through, routed to the kernel
# log by `rustos_rt::LogSink` (`AGENTS.md` §15.7 / §19.4 / §2.2).
rustos-log = { path = "../../../lib/log", version = "=0.0.0" }
# Allocation-free integer→hex formatting for the diagnostic's numeric fields
# (`format_hex_u64`), shared with the rest of the tree (`AGENTS.md` §2.2).
rustos-util = { path = "../../../lib/util", version = "=0.0.0" }
